name: Publish packages

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      # The `prepare` script in each package builds it (tsc), so no separate build step.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Require NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Create an npm automation token and add it as the NPM_TOKEN repository secret before this workflow can publish."
            exit 1
          fi

      # Published in dependency order: the orchestrator depends on the contract at an exact
      # version, so a push that changes both must land the contract in the registry first.
      # A version lives in the package's own manifest (docs/CONVENTIONS.md "Publishing"); the
      # workflow publishes exactly that version and skips a package whose version the registry
      # already has, so a change to one package does not mint a release of the other.
      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish_package() {
            local dir="$1"
            local name="$2"

            echo "::group::$name"

            local manifest
            manifest=$(node -p "require('./packages/$dir/package.json').version")

            local exists
            exists=$(npm view "$name@$manifest" version 2>/dev/null || true)
            if [ "$exists" = "$manifest" ]; then
              echo "$name: skipped ($manifest is already published)" >> "$RUNNER_TEMP/skipped-packages.txt"
              echo "::endgroup::"
              return 0
            fi

            npm publish --workspace "$name" --access public
            echo "$name@$manifest" >> "$RUNNER_TEMP/published-packages.txt"
            echo "::endgroup::"
          }

          : > "$RUNNER_TEMP/published-packages.txt"
          : > "$RUNNER_TEMP/skipped-packages.txt"
          publish_package contract @bdiadiun/scoring-contract
          publish_package channel @bdiadiun/scoring-channel
          publish_package orchestrator @bdiadiun/scoring-orchestrator
          publish_package viewer-bridge @bdiadiun/ohif-extension-scoring-bridge
          publish_package viewer-adapter @bdiadiun/ohif-extension-scoring-adapter

      - name: Job summary
        run: |
          if [ -s "$RUNNER_TEMP/published-packages.txt" ]; then
            echo "Published:" >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "- \`$line\`" >> "$GITHUB_STEP_SUMMARY"
            done < "$RUNNER_TEMP/published-packages.txt"
          else
            echo "Published: none." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -s "$RUNNER_TEMP/skipped-packages.txt" ]; then
            echo "Skipped:" >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done < "$RUNNER_TEMP/skipped-packages.txt"
          else
            echo "Skipped: none." >> "$GITHUB_STEP_SUMMARY"
          fi
