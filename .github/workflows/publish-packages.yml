name: Publish packages

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      # The `prepare` script in each package builds it (tsc), so no separate build step.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Require NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Create an npm automation token and add it as the NPM_TOKEN repository secret before this workflow can publish."
            exit 1
          fi

      # Published in dependency order: the bridge and adapter depend on the channel and the
      # contract at exact versions, so a push that changes several packages must land the
      # earlier ones in the registry first.
      # A version lives in the package's own manifest (docs/CONVENTIONS.md "Publishing"); the
      # workflow publishes exactly that version and skips a package whose version the registry
      # already has, so a change to one package does not mint a release of the other. A version
      # is never reused for different content, so a skip is only safe when the registry tarball
      # is byte-for-byte what we would publish now; the check compares `npm view dist.shasum`,
      # the sha1 the registry recorded for that version, against the shasum `npm pack` prints for
      # the tarball we would produce, because both are plain sha1 hex strings a shell can compare
      # without decoding an SRI string.
      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish_package() {
            local dir="$1"
            local name="$2"

            echo "::group::$name"

            local manifest
            manifest=$(node -p "require('./packages/$dir/package.json').version")

            local exists
            exists=$(npm view "$name@$manifest" version 2>/dev/null || true)
            if [ "$exists" = "$manifest" ]; then
              local pack_dir registry_shasum local_shasum
              pack_dir="$RUNNER_TEMP/pack-$dir"
              mkdir -p "$pack_dir"
              registry_shasum=$(npm view "$name@$manifest" dist.shasum 2>/dev/null || true)
              local_shasum=$(npm pack --workspace "$name" --json --pack-destination "$pack_dir" \
                | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].shasum") || local_shasum=""
              rm -rf "$pack_dir"

              if [ -z "$registry_shasum" ] || [ -z "$local_shasum" ]; then
                echo "::error::$name@$manifest: could not compare the published tarball against the current source; refusing to guess."
                echo "::endgroup::"
                return 1
              fi

              if [ "$registry_shasum" != "$local_shasum" ]; then
                echo "::error::$name@$manifest is already published but its content does not match the current source. A published version cannot be corrected in place; raise the version in packages/$dir/package.json."
                echo "::endgroup::"
                return 1
              fi

              echo "$name: skipped ($manifest is already published, content confirmed to match)" >> "$RUNNER_TEMP/skipped-packages.txt"
              echo "::endgroup::"
              return 0
            fi

            npm publish --workspace "$name" --access public
            echo "$name@$manifest" >> "$RUNNER_TEMP/published-packages.txt"
            echo "::endgroup::"
          }

          : > "$RUNNER_TEMP/published-packages.txt"
          : > "$RUNNER_TEMP/skipped-packages.txt"
          publish_package contract @bdiadiun/scoring-contract
          publish_package channel @bdiadiun/scoring-channel
          publish_package scoring-viewer @bdiadiun/ohif-extension-scoring-viewer
          publish_package ohif-extension-loader @bdiadiun/ohif-extension-loader

      - name: Job summary
        run: |
          if [ -s "$RUNNER_TEMP/published-packages.txt" ]; then
            echo "Published:" >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "- \`$line\`" >> "$GITHUB_STEP_SUMMARY"
            done < "$RUNNER_TEMP/published-packages.txt"
          else
            echo "Published: none." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -s "$RUNNER_TEMP/skipped-packages.txt" ]; then
            echo "Skipped:" >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done < "$RUNNER_TEMP/skipped-packages.txt"
          else
            echo "Skipped: none." >> "$GITHUB_STEP_SUMMARY"
          fi
