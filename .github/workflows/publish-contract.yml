name: Publish contract package

on:
  push:
    branches: [main]
    paths:
      - 'packages/contract/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      # The `prepare` script in packages/contract builds it (tsc), so no separate build step.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Require NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Create an npm automation token and add it as the NPM_TOKEN repository secret before this workflow can publish."
            exit 1
          fi

      - name: Resolve next version
        id: version
        run: |
          published=$(npm view @bdiadiun/scoring-contract version 2>/dev/null || true)
          manifest=$(node -p "require('./packages/contract/package.json').version")
          if [ -z "$published" ]; then
            # Never published before: release the manifest version as is.
            next="$manifest"
          else
            # Already published: bump the patch component past the latest release.
            next=$(node -p "const [m,n,p]=process.argv[1].split('.').map(Number); \`\${m}.\${n}.\${p+1}\`" "$published")
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Set package version
        run: |
          manifest=$(node -p "require('./packages/contract/package.json').version")
          if [ "$manifest" = "${{ steps.version.outputs.next }}" ]; then
            echo "Manifest already at ${{ steps.version.outputs.next }} (first release); leaving it unchanged."
          else
            npm version ${{ steps.version.outputs.next }} --no-git-tag-version --workspace @bdiadiun/scoring-contract
          fi

      - name: Publish
        run: npm publish --workspace @bdiadiun/scoring-contract --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Job summary
        run: echo "Published \`@bdiadiun/scoring-contract@${{ steps.version.outputs.next }}\`" >> "$GITHUB_STEP_SUMMARY"
