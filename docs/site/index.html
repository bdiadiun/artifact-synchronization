ackage. The version\n  is derived in the workflow and not committed back, because direct commits to `main` are\n  forbidden.\n- The fork depends on the package at an exact version. The copy, the sync script, the hash file\n  and `npm run check:contract` are gone.\n\n## Why this way\n\nOne published package answers both halves of Q-7: the format has a single owner and an explicit\nversion, and the fork stops carrying a second copy of anything. Public npm keeps the reviewer's\nclone free of tokens, which was the real objection in A-12; GitHub Packages was considered and\nrejected because it demands authentication even to read a public package, so the fork could not\nhave dropped the copy at all.\n\n## Consequences\n\n- Changing the contract becomes two steps: publish, then raise the dependency in the fork. That is\n  the cost of an explicit version, and it is the same cost any shared library carries.\n- Publishing needs an `NPM_TOKEN` secret in the repository. Until it exists, the publish step of\n  the workflow fails and nothing else is affected.\n- `packages/contract/dist` is generated and ignored by git.\n"},{"path":"docs/decisions/A-16-adapter-and-viewer-delivery.md","title":"A-16 · adapter and viewer delivery","group":"Decisions","md":"# A-16 — the bridge is an adapter with a handler registry; the viewer is deployed, not published\n\nStatus: approved 2026-09-20. Canon: C-3.2, Q-7, X-5. Related: [A-1](A-1-mono-repo-with-submodule.md),\n[A-15](A-15-publish-contract-package.md). Evidence: [ohif-packaging.md](../notes/ohif-packaging.md).\n\n## Context\n\nTwo questions came up together. Our own code lives inside the fork's tree, which makes it hard to\nsee what we wrote; and it would be better if the fork stopped changing at all, so that new\nbehaviour did not mean a pull request against somebody else's repository every time.\n\nMoving the whole extension into a package of our own was tried and does not work: no OHIF package\non npm ships type declarations, and the global namespace the extension uses only resolves inside\nthe OHIF monorepo. Publishing declarations emitted from the fork does work, but one of the eight\ntype names we need silently degrades to `any` and `skipLibCheck` hides that, so the strictness\nwould be theatre exactly where we do not control the code.\n\n## Decision\n\n- **The extension is an adapter.** A registry maps a command type to its handler. Adding a\n  capability means registering a handler, not editing a dispatcher.\n- **Completeness is kept at the type level.** The registration map is written against the contract's\n  own union of command types, so a command added to the contract without a handler fails the type\n  check. This replaces the exhaustiveness the previous `switch` provided through its `never` branch.\n- **The registry holds no OHIF import**, so it is pure logic and can be tested without the viewer.\n- **The fork's diff stays frozen** at the registration entry in `platform/app/pluginConfig.json`,\n  the dependency line in `platform/app/package.json` and the extension's workflow.\n- **The viewer is delivered by deployment, not by an npm package.** The host reads the viewer's\n  address from configuration, so a deployed viewer replaces the local one without a code change.\n\n## Why this way\n\nThe fork can stay frozen because OHIF computes almost everything at call time. Commands registered\nthrough `commandsManager` and values supplied through `setCustomizations` are read from live\nmanagers, so the adapter can grow without OHIF learning about it. What must be declared once, at\nregistration, is small: the extension id, the lifecycle hooks and the presence of the module\ngetters. One case does reopen the fork, and it is worth knowing before promising otherwise: a\npanel, a viewport or a toolbar button is named statically by the mode, so adding one costs an edit\nthere.\n\nPackaging the built viewer as a dependency was considered and rejected on evidence. It is an\napplication bundle, not a library: its manifest points `main` at a file the build never produces,\nits asset paths are baked absolute at build time, and the output is 199 MB. The only consumable\nform is that static output served at the root of a port and configured at deploy time, which is\nprecisely deployment. Publishing it would also mean shipping a third party's application under our\nown name for no gain.\n\nA second path exists for adding an extension without rebuilding: `window.config.extensions` is read\nafter the bundle loads, and an unknown entry is fetched by dynamic import. It is recorded here\nbecause it is real, and rejected because such a module carries its own copies of React and\n`@ohif/core` and must arrive before initialisation finishes.\n\n## Consequences\n\n- New viewer-side behaviour is a handler plus, when the host must ask for it, a message in the\n  contract. Neither touches the fork.\n- The registry is the one place to look for what the viewer can be asked to do.\n- Moving the OHIF-free half of the extension into a package of its own stays open as a later step;\n  nothing here blocks it.\n"},{"path":"docs/decisions/A-17-orchestrator-package.md","title":"A-17 · orchestrator package","group":"Decisions","md":"# A-17 — the viewer client is its own package, `@bdiadiun/scoring-orchestrator`\n\nStatus: approved 2026-09-20. Canon: C-4.1.1, Q-1, Q-2, Q-3, Q-4, D-1. Related:\n[A-15](A-15-publish-contract-package.md), [A-16](A-16-adapter-and-viewer-delivery.md).\n\n## Context\n\nThe code that talks to a viewer lived inside the React form, under `host-app/src/bridge/`. That\nplacement said something untrue about the design: it made the channel look like a detail of this\nparticular form, when in fact the form is one possible consumer of it.\n\nThe shape the channel should have became clear once the viewer was treated as a deployed\napplication rather than as part of this repository (A-16). There can be several viewers, at\ndifferent versions and at different addresses, while the piece that speaks to them stays one.\n\n## Decision\n\n- The client half of the channel is the package `@bdiadiun/scoring-orchestrator`, published to the\n  public npm registry alongside the contract, built to `dist` by its own `prepare` script.\n- It owns the handshake and the queue that holds commands until `VIEWER_READY`, the origin check on\n  every inbound message, the explicit target origin on every outbound one, the listener set, the\n  disarm on teardown, and the command builders.\n- It depends on `@bdiadiun/scoring-contract` and on nothing else. No React, no strings meant for a\n  person, nothing from `host-app`.\n- The React binding stays in the form as `hooks/useBridge.ts`. A framework binding belongs to the\n  application that chose the framework.\n- A viewer is addressed by configuration, so a second or a fifth viewer is a configuration change\n  rather than a code change.\n\n## Why this way\n\nThree packages now divide along the lines of what changes together. The contract changes when the\nformat changes. The orchestrator changes when the conversation changes. The form changes when what\na person sees changes. Before this, the second and the third were the same file tree, so a change\nto either looked like a change to both.\n\nIt also makes the safety rules of this assignment testable in one place. The origin check, the\nrefusal to post with a wildcard target, the queueing before the handshake and the echo guard are\nproperties of the channel, not of the form, and they are now enforced by a package with its own\ntests that any host gets for free.\n\nThe alternative was to leave the channel in the form and accept that a second host would copy it.\nThat is the same mistake the contract made before A-15, and it had already produced two divergent\ncopies of the same guards.\n\n## Consequences\n\n- The two packages form a TypeScript project-reference chain: building the orchestrator builds the\n  contract first, so the order belongs to the compiler rather than to whichever workspace the\n  package manager happens to run first. A fresh clone therefore installs, which it did not when\n  each package merely built itself.\n- A change to the channel is published and then consumed, exactly like a contract change.\n- The form's dependency list now names both packages, which is the honest picture of what it is\n  built from.\n- `host-app/src/bridge/` and `host-app/src/form/commands.ts` no longer exist.\n"},{"path":"docs/decisions/A-18-viewer-checked-out-not-vendored.md","title":"A-18 · viewer checked out not vendored","group":"Decisions","md":"# A-18 — the viewer is checked out on demand, not carried as a submodule\n\nStatus: approved 2026-09-20. Canon: C-3.2, D-1, D-5. Supersedes the submodule part of\n[A-1](A-1-mono-repo-with-submodule.md). Related: [A-16](A-16-adapter-and-viewer-delivery.md),\n[A-17](A-17-orchestrator-package.md).\n\n## Context\n\nA-1 put the OHIF fork in this repository as a git submodule so that one pull request could change\nboth sides of the contract and so that a reviewer could clone once and run everything. Both\nreasons have since expired.\n\nThe contract is a published package (A-15) and so is the channel (A-17), so a change to either is\nreleased rather than co-committed. The extension is an adapter whose capabilities are registered\nrather than hard-wired (A-16), so the fork's own diff is frozen at its registration entry, a\ndependency line and its workflow. What remained was a 199 MB checkout of somebody else's\napplication sitting inside our tree, where it made it hard to tell whose code was whose and filled\nevery search with foreign results.\n\n## Decision\n\n- `viewer/` is no longer a submodule. It is a local checkout, ignored by git.\n- `npm run viewer:setup` clones the fork at an exact commit recorded in a small committed file, and\n  installs it with its own package manager. `npm run viewer:dev` starts it.\n- The pinned commit is part of this repository, so a reviewer runs the viewer we tested against\n  rather than whatever the fork's branch points at later.\n- The fork stays where it is, `https://github.com/bdiadiun/Viewers` on branch `scoring`. It is the\n  answer to the canon's requirement for a fork of OHIF extended with our own extension, and its\n  pull requests are part of the deliverable.\n- Linting the fork's sources from this repository now depends on that checkout being present, and\n  says so when it is not. The fork's own workflow builds the extension on every change there, so\n  nothing is left unchecked.\n\n## Why this way\n\nKeeping the checkout pinned matters more than keeping it vendored. A submodule and a pinned clone\ngive the same reproducibility; only one of them also puts a hundred thousand foreign files in the\nway of everyday work.\n\nThe cost is one extra command before the first run, and it is written at the top of the README.\nThat is the honest trade: the reviewer types one line, and in exchange every file in this\nrepository is ours.\n\nTwo alternatives were rejected. Hiding the folder in editor settings solves the noise for whoever\nshares those settings and nobody else, and leaves the checkout in the repository. Vendoring the\nbuilt viewer instead was measured and rejected in A-16: it is an application bundle, not something\na project depends on.\n\n## Consequences\n\n- A fresh clone runs the form immediately and needs one command before it can run the viewer.\n- The pinned commit has to be raised deliberately when the fork moves, which is a feature: the\n  viewer version becomes an explicit decision rather than a silent one.\n- Graph checks treat paths under `viewer/` as satisfied when the checkout is absent, and say so in\n  their output instead of passing quietly.\n"},{"path":"docs/decisions/A-19-study-from-the-page-url.md","title":"A-19 · study from the page url","group":"Decisions","md":"# A-19 — the form reads its study from its own URL\n\nStatus: approved 2026-09-21. Canon: C-4.1.3, S-5.6. Related:\n[A-14](A-14-state-restore.md), [A-16](A-16-adapter-and-viewer-delivery.md).\n\n**This is an addition of our own, not a requirement.** The assignment asks for the viewer to open a\nspecific study by a direct link, which a constant already satisfied. Nothing here is traced to a\n`C-` or `S-` requirement, and the distinction is kept deliberately so the mandatory part stays\nlegible.\n\n## Context\n\nThe study identifier was a constant in the form's configuration. It was already threaded through\nfour places: the viewer's URL, the key rows are stored under, the write of that store, and the\nrestore request. So the code was written as if the study could vary while it never could, and the\nper-study storage key protected against a collision that could not happen.\n\n## Decision\n\n- The form reads a `study` parameter from its own page URL and uses it when it is valid; the\n  previous constant stays as the fallback.\n- A value is accepted only if it looks like a DICOM study instance identifier: digits and dots, no\n  empty component, no leading or trailing dot, at most sixty-four characters. Anything else is\n  refused, the fallback is used, and the refusal is logged once for whoever is looking.\n- The identifier is put through `encodeURIComponent` when the viewer's URL is built.\n- One value is resolved per page load and used by all four consumers.\n\n## Why this way\n\nThe value ends up inside the `src` of an iframe, which makes it the one piece of attacker-reachable\ninput the form puts into a URL. Validation and encoding are two different defences and both are\nkept: validation refuses what is not an identifier, and encoding makes sure that even an accepted\nvalue cannot add a second query parameter or change the path. This is the same reasoning as the\norigin check on incoming messages, applied to the one place where the form generates a URL from\noutside input.\n\nThe fallback means a plain visit to the form still works exactly as before, so nothing about the\ndemonstration changes unless somebody asks for another study.\n\n## Consequences\n\n- Two tabs on different studies now keep separate rows, which is what the per-study storage key\n  always claimed to do (A-14).\n- Pointing a deployment at another study is a link, not a build.\n- The mandatory behaviour is unchanged: with no parameter, the form opens the study it always did.\n"},{"path":"docs/decisions/A-20-three-layers.md","title":"A-20 · three layers","group":"Decisions","md":"# A-20 — three layers: an unchanging fork, an adapter, and extensions\n\nStatus: approved 2026-09-21. Canon: C-3.2, Q-7, X-5. Related:\n[A-16](A-16-adapter-and-viewer-delivery.md), [A-17](A-17-orchestrator-package.md),\n[A-18](A-18-viewer-checked-out-not-vendored.md). Evidence:\n[ohif-packaging.md](../notes/ohif-packaging.md),\n[ohif-extension-composition.md](../notes/ohif-extension-composition.md).\n\n## Context\n\nOur viewer-side code lived inside the fork, so every change to it was a pull request against a\ncheckout of somebody else's application. Making the extension an adapter with a handler registry\n(A-16) stopped the fork's diff from growing, but the code was still in there, and adding a second\ncapability would still have meant opening the fork.\n\nReading the extension manager settled what is actually possible at `v3.12.17`. An extension's\n`preRegistration` receives the extension manager itself, `registerExtension` is public, the outer\nloop iterates the array it was given rather than the manager's own list, and a duplicate id is\nskipped with a warning. So an extension can register other extensions, and OHIF already does this\nlate itself when a mode is entered.\n\n## Decision\n\nThree layers, each changing for its own reason.\n\n- **The fork** carries one entry in `platform/app/pluginConfig.json`, the matching dependency, and\n  nothing else of ours. It changes when OHIF changes, not when we do.\n- **The adapter** is a published package, registered once by that entry. In `preRegistration` it\n  registers our extensions through the extension manager, so the children are in place before the\n  application finishes starting, in a deterministic order.\n- **The extensions** are published packages the adapter depends on. The first of them is\n  `@bdiadiun/ohif-extension-scoring-bridge`. Adding or changing one is a change to the adapter and\n  its dependencies. No fork involved.\n\nTwo rules come with it:\n\n- **Command names are prefixed per package.** OHIF does not namespace commands: the commands\n  manager writes straight into a shared context, so a name that collides with another extension's\n  silently replaces its behaviour. Module names are namespaced by extension id; command names are\n  not.\n- **We describe the OHIF surface we call, and only that.** Fifteen members across five services and the\n  commands manager, counted from the code rather than from memory: the measurement, tool group,\n  cornerstone viewport, viewport grid and display set services. We do not vendor or generate OHIF's own declarations, which were measured\n  and rejected in A-16.\n\n## Why this way\n\nIt separates what changes together. OHIF's version is somebody else's schedule; our capabilities\nare ours; the wiring between them is a third thing that changes rarely. Before this, all three were\nthe same pull request.\n\nThe cost is stated rather than hidden. The fork still pins a version, so a release of the adapter\nis a one-line bump there; that is a number, not code, and we prefer it to the alternative. The\nalternative exists and was considered: `window.config.extensions` is read after the bundle loads\nand an unknown entry is fetched by dynamic import, so the adapter could be supplied entirely by\ndeployment configuration. It was rejected because such a module carries its own copies of React and\n`@ohif/core`, must arrive before initialisation finishes, and moves every failure from build time\nto somebody's browser.\n\nBecause our interfaces replace the compiler's knowledge of OHIF, a drift between them and the real\nAPI cannot be caught by a type check. It is caught by building the viewer and running the browser\nscenario, and both belong to the verification of any slice that touches this code.\n\n## Consequences\n\n- Commands, customizations, hanging protocols and toolbar evaluators all work when registered this\n  late; that covers everything we do today.\n- A panel, a viewport or a toolbar button is named statically by a mode. Modes are packages too and\n  are listed beside extensions, so the escape is to publish our own mode; the fork lists it once.\n  A data source needs an explicit call and is out of scope here.\n- Our viewer-side code becomes subject to this repository's strict type check and its tests for the\n  first time.\n"},{"path":"docs/decisions/A-21-channel-and-exchange.md","title":"A-21 · channel and exchange","group":"Decisions","md":"# A-21 — one channel package, with `send`, `on` and `exchange`\n\n> Superseded by [A-29](A-29-channel-is-transport.md) and [A-30](A-30-no-request-answer.md): the channel has `send`, `onEach` and, on the host end, the queue; there is no `on` and no `exchange`.\n\nStatus: approved 2026-09-21. Canon: Q-1, Q-2, Q-3, Q-4, Q-7. Related:\n[A-15](A-15-publish-contract-package.md), [A-17](A-17-orchestrator-package.md),\n[A-20](A-20-three-layers.md).\n\n## Context\n\nBoth sides of the conversation do the same three things before anything else happens: compare\n`event.origin` against the one origin they accept, run the incoming value through the contract's\nguard, and post with an explicit target origin, never a wildcard. That is written twice today, once\nin the orchestrator and once in the viewer extension, and the two copies can drift without anything\nnoticing. It is also the rule whose failure costs the most.\n\nThe messages are symmetric, five in each direction, and the mechanics are identical; only the\nvocabulary and the direction differ. What is genuinely asymmetric stays where it belongs: the queue\nthat holds commands until `VIEWER_READY` is the host's, and the throttled stream of updates during\na drag is the viewer's.\n\nTwo message pairs are already requests with answers, `REMOVE_MEASUREMENT` answered by\n`MEASUREMENT_REMOVED` and `RESTORE_MEASUREMENTS` answered by `MEASUREMENTS_RESTORED`, correlated by\n`causedBy`. Each pair is wired by hand, and nothing notices when an answer never comes: a removal\nrequest for a measurement the viewer no longer held once left its id in memory for the life of the\npage, and the fix was to make the viewer always answer rather than to make silence detectable.\n\n## Decision\n\n- One package, `@bdiadiun/scoring-channel`, holds the mechanics and is used by both sides. It is\n  parameterised at each end by the origin it accepts, the guard that admits an incoming message and\n  the way it reaches the other window.\n- Its surface is generic, not a method per message: `send(type, payload)`, `on(type, handler)` and\n  `exchange(type, payload)`. The payload type follows from the message type, so nothing is hand\n  written per message and neither side can forget to update the other.\n- The channel fills in what is always the same: `version` and the request id. Neither appears at a\n  call site again.\n- `exchange` returns the answer, resolved by correlation, and rejects when none arrives within a\n  timeout. Silence becomes an error instead of an unbounded wait.\n- The contract gains the table that says which event answers which command. Without it `exchange`\n  cannot know the type of what it is waiting for.\n- One-way messages stay one-way. A stream of updates during a drag has no answer, and inventing one\n  would be worse than useless.\n\n## Why this way\n\nThe origin check, the guard and the explicit target are the assignment's security requirements.\nImplemented once, they are tested once and every consumer gets them; implemented twice, they are a\npair of copies that agree only as long as someone keeps checking.\n\nThe generic surface was chosen over a method per message deliberately. Twenty hand-written wrappers\nthat only build a message are ceremony, and each is a place to forget a field; the typed pair of\n`send` and `on` cannot be out of step with the contract, because it is derived from it.\n\nThe facade is not a separate package. A package is a version, a release and a pin in several\nplaces; for a protocol of ten messages, four published artefacts would be more machinery than the\nproblem deserves. The boundary between the mechanics and the facade is drawn inside the package\ninstead, so splitting later is cheap if it is ever worth it.\n\n## Consequences\n\n- A new message type is a change to the contract and a handler on one side. Neither side needs a\n  new method.\n- An answer that never comes is reported where it happens, with the request that went unanswered.\n- The facade must stay thin. When a method starts doing more than composing a message and awaiting\n  its answer, it has stopped being the channel and belongs to the orchestrator or the extension.\n"},{"path":"docs/decisions/A-22-one-channel-api.md","title":"A-22 · one channel api","group":"Decisions","md":"# A-22 — one channel API for both ends; the orchestrator package goes away\n\n> Superseded in part by [A-31](A-31-one-channel.md): one `createChannel` serves both ends instead of `createHostChannel` / `createViewerChannel`; the queue-until-ready is the `readyOn` option.\n\nStatus: approved 2026-09-22. Canon: Q-1, Q-2, Q-3, Q-4, Q-5, Q-7, X-5. Supersedes\n[A-17](A-17-orchestrator-package.md) and the handler-registry part of\n[A-16](A-16-adapter-and-viewer-delivery.md). Builds on\n[A-21](A-21-channel-and-exchange.md), [A-9](A-9-handshake-and-queue.md) and A-10.\n\n## Context\n\nA read of every non-test line (4 556 of them) found one idea implemented two and three times. The\nchannel offered a per-type `on`, yet the host registered one handler for every type, folded each\nevent into a `lastEvent` field of a state store, pushed that through React state, and switched on\nthe type again inside an effect; the viewer did not use `createChannel` at all and kept a second\nper-type dispatcher, its registry, while writing `version: 1` by hand in six places. The host's own\npart of the conversation, a queue and a ready flag, about eighty lines of substance, had become a\npublished package of seven files and five factories. An event crossed six hands before it changed\na row, and because it travelled as React state, two events arriving before one render could lose\nthe first.\n\n## Decision\n\n- **Three layers, one question each.** The contract is the wire format. The channel is the whole\n  communication API. The two applications, the form and the viewer extension, raise a channel and\n  use its methods; neither touches `postMessage`, `version`, a request id or a target origin.\n- **The channel owns what it was being handed.** The channel end takes the peer (its origin and how\n  to find its window), the guard for what comes in, and optionally the incoming message that opens\n  the way out. It builds its own post, its own outgoing queue and its own observable state\n  (`ready`, `queued`). The host end names `VIEWER_READY` as that message and adds the one thing\n  that is the host's alone: cancelling the armed row on unmount while the channel is still live.\n  The viewer end is open from the start.\n- **One dispatch path.** A set of handlers is registered once with `onEach` and checked against\n  the contract with `satisfies`, on both ends. An event goes channel → handler → reducer; it never\n  travels as React state, and `lastEvent` does not exist. React reads only `ready` and `queued`,\n  through `useSyncExternalStore`.\n- **`@bdiadiun/scoring-orchestrator` is no longer released.** Its published versions stay in the\n  registry, as every published version does; nothing depends on them.\n- **The form keeps its reducer.** Rows, their statuses and the totals are the form's own state and\n  mean nothing to the viewer end, which imports the same channel package; a reducer inside the\n  channel would ship form logic to the viewer and tie the transport to one consumer, the coupling\n  A-17 was written to remove. The reducer stays the single place a row changes, which is why the\n  event handlers no longer repeat its guards.\n\n## Why this way\n\nThe alternative considered first was to keep the orchestrator and thin it. It would still have been\na package whose only job was to call another package, and the form would still have needed a\nbinding to it. Keeping `lastEvent` with a queue of events behind it would have cured the lost-event\nrisk and kept the layer that caused it.\n\nA-17's reason stands and is kept: the form is one possible consumer of the channel, so nothing of\nthe form lives in it. What A-17 added beyond that, a second package, was the cost without the\nbenefit once A-21 had put the transport in a package both ends share.\n\n## Consequences\n\n- A-24 later replaced the shared generic core with two concrete ends; the decision above about\n  what the channel owns is unchanged.\n\n- The status line shows readiness and the queue length; the type of the last event is gone from\n  it. It was a development aid and the same information is in the console under each end's prefix.\n- A capability is still added without editing a dispatcher: a new command is a new key in the\n  viewer's handler map, and the `satisfies` clause fails the build until it is there.\n- Test seams that existed only as options (an injected window, timeout and request id) are gone;\n  tests drive the real `window` with `MessageEvent`s and fake timers.\n"},{"path":"docs/decisions/A-23-minimal-bridge.md","title":"A-23 · minimal bridge","group":"Decisions","md":"# A-23 — a minimal bridge\n\n> Partly superseded by [A-29](A-29-channel-is-transport.md): the armed row, the once-only\n> announcement and `reply` went back to the extension; the channel is transport only.: the extension keeps what is about OHIF, the channel keeps the protocol\n\nStatus: approved 2026-09-22. Canon: C-4.3, C-4.3.6, Q-1, Q-3, Q-4, Q-5, X-5. Builds on\n[A-22](A-22-one-channel-api.md), [A-8](A-8-id-correlation.md), A-10, [A-9](A-9-handshake-and-queue.md).\nSupersedes the \"restore the tool that was active before arming\" part of A-8.\n\n## Context\n\nThe viewer extension had grown to ~1 500 non-test lines in 24 files for a job that reads as: hook\nOHIF's measurement events and post them, receive a command and call OHIF. Read against that job,\nthree kinds of weight stood out. About a third was ceremony (a props file and a deps interface\nper module, a factory for one variable). About a third was our own cleverness that the form or\nOHIF already covered: a snapshot of the previous tool, a 150 ms timer correcting `cachedStats`\nthat the live-update stream corrects anyway, a `uid → rowId` map gating updates the form filters\nitself, two de-duplication sets, a geometry re-check the contract guard had done. And the handshake\nwas split down the middle: the host half in the channel, the viewer half in the extension.\n\n## Decision\n\n- **The extension holds only what is about OHIF**: activating a tool and returning to the\n  default one, reading a measurement's `cachedStats` into `metrics` and `geometry`, rebuilding an\n  annotation on restore, the version overlay. Six modules, no props files, no deps interfaces; a\n  type used by one file is declared there without `export`.\n- **The channel's viewer end holds the protocol**: `announceReady(payload)` sends `VIEWER_READY`\n  once and retries until a parent window exists; `getArmed()` mirrors the host's memory of the\n  armed row from the incoming `ACTIVATE_TOOL` / `DEACTIVATE_TOOL` and clears it once the matching\n  `MEASUREMENT_ADDED` went out; `reply(command, payload)` sends the event the contract's answer\n  table pairs with a command, `causedBy` filled in, and a wrong answer shape is a compile error.\n  The channel logs each message it sends or admits, once.\n- **After a measurement, a cancel or a page hide, the viewer returns to the fixed default tool**\n  (`WindowLevel`, OHIF's default primary tool in this mode). The canon asks that the tool\n  deactivates; remembering what was active before was the one reason the extension had to keep\n  tool state.\n- **`MEASUREMENT_UPDATED` is sent for every annotation**, throttled per uid. The form ignores a\n  uid it does not hold, so the extension keeps no map of which uids belong to rows.\n- **Nothing is de-duplicated in the extension**: OHIF emits one `MEASUREMENT_ADDED` per uid, and a\n  repeated `MEASUREMENT_UPDATED` with the same value is harmless to the reducer.\n- **The ADDED correction timer is gone**: a value that settles one render late arrives through\n  the update stream, which exists since S-5.1.\n- **`ArmedRow { rowId, requestId }` is the viewer channel's type** (since A-27; it was declared in\n  the contract until only the channel used it), the one correlation the viewer end keeps.\n\n## Why this way\n\nEvery item removed was checked against the message the host receives; none changes. What moved\ninto the channel passes one test: it is understandable without OHIF. What stays in the extension\nfails that test. Throttling stayed in the extension on purpose: keying it by `measurementUid`\nwould teach the channel a field of one message.\n\n## Consequences\n\n- The wire is unchanged; the browser scenario is the acceptance test.\n- A stale `DEACTIVATE_TOOL` arriving while nothing is armed now re-activates the default tool\n  instead of being ignored; both leave the viewer on the default tool.\n- A failed `setToolActive` (no tool group) leaves the row armed in the channel, so a drawing made\n  from the toolbar right then would be attributed to it. Commands are held until `VIEWER_READY`,\n  which waits for the first tool group, so the case needs the viewer to lose its viewport between\n  the two; it is logged.\n"},{"path":"docs/decisions/A-24-plain-code.md","title":"A-24 · plain code","group":"Decisions","md":"# A-24 — plain code: readability outranks reuse at the seam between the two ends\n\nStatus: approved 2026-09-22. Canon: Q-7, D-2. Related: [A-21](A-21-channel-and-exchange.md),\n[A-22](A-22-one-channel-api.md), [A-23](A-23-minimal-bridge.md).\n\n## Context\n\nThe channel had one generic core, `createChannel<TIncoming, TOutgoing>`, so that the transport was\nwritten once for both ends. The price was a set of types that existed only to make that core type\ncheck — `MessageOfType`, `PayloadOf`, `StoredHandler`, `AnswerMessage`, `Deliver`, `ChannelGate` —\na curried factory returning a generic function, and casts through `unknown`. Read by its author,\nthe package was \"a skyscraper\": correct, and impossible to keep in one head. The same reading found\ncomments that restated the code and three-line citations of OHIF above every call.\n\n## Decision\n\n- **Each end is written on its own, with concrete types.** `createHostChannel` and\n  `createViewerChannel` read top to bottom; what they share is three plain functions — posting to\n  a peer, listening from a peer, waiting for answers. The thirty lines the two ends have in common\n  are duplicated on purpose.\n- **No type exists only to make a signature type-check.** One generic on `send`, `onEach`,\n  `exchange` and `reply` gives the caller typed payloads and is the whole allowance; no type\n  parameter is threaded through a shared core; no `as unknown as`. A cast that remains carries\n  its one-line reason.\n- **A guard is a function, not a table.** Each message has a named guard and the union guard is a\n  `switch` whose `default` fails the build when a type is added.\n- **A comment says only what the code cannot**: the reason, a decision id, or one sentence ending\n  in the OHIF `file:line` that justifies a call that would otherwise look wrong. Under 10% of the\n  non-blank lines of a package. What is longer lives in `docs/notes/`.\n\n## Why this way\n\nThe code base exists to be defended by one person from memory. A repeated thirty lines cost a\nminute to read; a generic core cost an afternoon. DRY (A-13's \"declared once\") still holds for\ndata — the contract, the vocabulary, the guards — and stops at the point where sharing needs a\ntype to explain itself.\n"},{"path":"docs/decisions/A-25-version-in-the-channel.md","title":"A-25 · version in the channel","group":"Decisions","md":"# A-25 — the contract version belongs to the channel\n\nStatus: approved 2026-09-22. Canon: Q-7. Related: [A-21](A-21-channel-and-exchange.md),\n[A-24](A-24-plain-code.md).\n\n## Context\n\nEvery message carries `version: 1` (Q-7, CLAUDE.md §5). The field was declared in each of the ten\nmessage interfaces of the contract and checked by the contract's guards, while the value was\nwritten by the channel. Three parties knew about it; only one used it.\n\n## Decision\n\n- **The version is the channel's.** The channel adds it to every message it posts and refuses,\n  before the contract guard runs, any message whose version is not its own. The constant lives in\n  the channel package and is raised only on a breaking change.\n- **The contract describes message bodies only**: `type` and the fields the applications read.\n  Its guards validate the body and ignore an extra `version` property.\n- **Neither application knows the version exists.**\n\n## Why this way\n\nThe contract is what the two sides agree to say; the version is how the transport tells a\nstranger from a peer. Putting it in the contract made ten interfaces repeat a field no caller\never set and made the guards check what the channel had already decided. The wire is unchanged.\n"},{"path":"docs/decisions/A-26-zod-contract.md","title":"A-26 · zod contract","group":"Decisions","md":"# A-26 — the contract is declared once, as zod schemas\n\nStatus: approved 2026-09-22. Canon: Q-7, X-5. Related: [A-24](A-24-plain-code.md),\n[A-25](A-25-version-in-the-channel.md).\n\n## Context\n\nEvery message was written twice: an interface in a `.props.ts` file and a hand-written guard beside\nit, kept in step by hand, plus a file of primitive guards to build the second from. The guards were\ncorrect and unreadable; the author could not learn them.\n\n## Decision\n\n- **One schema per message**, a `z.object` with the fields and their constraints; `HostCommand` and\n  `ViewerEvent` are `z.discriminatedUnion('type', …)`; the TypeScript types are `z.infer` of the\n  schemas; `isHostCommand` / `isViewerEvent` are `safeParse(...).success`.\n- **The vocabulary is `z.enum`** (tool names, units, restore-failure reasons); the metric and\n  geometry shapes are schemas the message schemas reuse, and the contract exports them so a\n  consumer can build its own schema on top of them.\n- **`zod` is the contract package's only dependency** and the first library added to this project;\n  the viewer receives it through the contract. The host application lists it as well, because its\n  stored-state schema (A-14) is built from the contract's schemas.\n- Nothing on the wire changes. A schema ignores keys it does not declare, which is how the channel's\n  `version` field (A-25) passes through a guard the contract never mentions it in.\n\n## Why this way\n\nA schema is read once and says both what a message is and how it is checked. The alternative\nwithout a dependency, a small `shape()` helper of our own, would have kept the interfaces separate\nfrom the checks and added an abstraction to remember. Thirteen kilobytes in each bundle is the\nprice; the contract shrinks from ~390 lines to ~130.\n"},{"path":"docs/decisions/A-27-folder-layout.md","title":"A-27 · folder layout","group":"Decisions","md":"# A-27 — a folder names a side or a role, and no file is smaller than a screen\n\nStatus: approved 2026-09-22. Canon: D-2, A-13. Related: [A-24](A-24-plain-code.md),\n[A-23](A-23-minimal-bridge.md).\n\n## Context\n\nEach package had one flat `src/` with a dozen files at the same level, several of them five lines\nlong; the file list did not say what belonged to what, and the author found it impossible to hold.\n\n## Decision\n\n- **A folder is a side or a role**: the channel has `host/`, `viewer/`, `shared/`; the viewer\n  extension has `commands/` (host → OHIF), `events/` (OHIF → host), `ohif/` (the OHIF surface, the\n  throttle, the overlay); the host application follows the conventional React layout, so a reader from any React\n  project finds things where they expect them: `components/`, `pages/`, `hooks/` (`useChannel`,\n  `useScoringForm`), `models/` (`row.ts`, added by A-36), `state/` (`reducer.ts`, `selectors.ts`, `actions.ts`), `services/`\n  (`storage.ts` — what talks to the outside; the channel's end lives in its package since A-34, the rows'\n  persistence is the hook `useStoredRows` since A-37), `utils/` (`format.ts`,\n  `totals.ts`). (Amended twice on 2026-09-22: a first version invented `form/` and dissolved\n  `hooks/` and `utils/`; the author prefers the standard names and places.)\n- **No file under twenty lines**, except a package `index.ts`, `main.tsx`, a component's\n  `.props.ts` and a file the standard layout names (`hooks/useChannel.ts`, `state/selectors.ts`,\n  `services/channel.ts`, a page): a constant, a type or a one-function module joins its owner.\n  (Wording aligned with CONVENTIONS §5 on 2026-09-23, [A-33](A-33-review-of-the-boundaries-refactor.md).)\n- **`index.ts` is a package's public entry only**; no barrel inside a folder.\n- **`.props.ts` exists only beside a React component.**\n- Tests keep living in a `__tests__/` folder beside the code they test and move with it.\n\n## Why this way\n\nThe tree should answer \"what is this\" before a file is opened. Splitting by role is the same idea\nas A-23 (protocol vs OHIF) applied to folders.\n"},{"path":"docs/decisions/A-28-boundaries-as-schemas.md","title":"A-28 · boundaries as schemas","group":"Decisions","md":"# A-28 — a foreign object is checked by a schema, and an API without a caller does not exist\n\nStatus: approved 2026-09-22. Canon: Q-7, A-13, D-2. Related: [A-24](A-24-plain-code.md),\n[A-26](A-26-zod-contract.md), [A-20](A-20-three-layers.md).\n\n## Context\n\nAfter A-26 the wire contract was one set of schemas, but the same idea was still written by hand at\nthe two other boundaries: OHIF's measurement object entered the extension through seven small\n`typeof` helpers, and the form's `Row` was declared as an interface and then again as a schema for\n`sessionStorage`. The audit that found those also found API written for callers that never came:\n`channel.on()`, the viewer channel's `getState` / `subscribe`, a disposer set exported for one file,\na `hostOrigin` option threaded through two packages that the fork never passes, and eight\n\"service unavailable\" branches for OHIF services that exist before any extension runs.\n\n## Decision\n\n- **Every foreign object is checked by one schema where it enters**: the wire by the contract's\n  schemas, OHIF's measurement by `OhifMeasurement` in the extension, stored rows by `Row` in the\n  form. No hand-written `typeof` / `Array.isArray` chains beside a schema.\n- **A shape is declared once and derived from**: `StoredRow` is `Row.omit(...)`; `MetricKey` is a\n  `z.enum` and `Metrics` a `partialRecord` over it, so the form reads a metric without a cast;\n  `toMetrics` reads the tool → metric key map instead of repeating it in a `switch`.\n- **An API exists only for a caller that exists**: `on`, the viewer end's state, the disposer set\n  and the `hostOrigin` option are removed. The OHIF services the bridge uses are typed as required\n  (see `docs/notes/ohif-service-availability.md`); one check at start-up replaces the eight\n  branches.\n- **The wire changes in one point**: a metric key outside the vocabulary is now refused (it was\n  accepted and shown by name). Adding a metric is one line in `vocabulary.ts`, as a unit already is.\n\n## Why this way\n\nThe reading rule stays the same at every boundary — \"find the schema\" — instead of one rule for\nthe wire and another for the rest. Removing API nobody calls is what keeps the channel small enough\nto remember; a method kept \"for later\" is read every time and used never.\n"},{"path":"docs/decisions/A-29-channel-is-transport.md","title":"A-29 · channel is transport","group":"Decisions","md":"# A-29 — the channel is transport, the bridge owns its state\n\nStatus: approved 2026-09-22. Canon: Q-1, Q-2, Q-4, Q-5, S-5.2, S-5.6. Supersedes the part of\n[A-23](A-23-minimal-bridge.md) that moved the armed row, the once-only announcement and the\n`reply` helper into the channel. Related: [A-24](A-24-plain-code.md),\n[A-28](A-28-boundaries-as-schemas.md).\n\n## Context\n\nA-23 made the extension minimal by moving everything that \"is protocol\" into the channel. The\nchannel then knew what `ACTIVATE_TOOL.rowId` means, cleared its own state when it posted\n`MEASUREMENT_ADDED`, remembered whether `VIEWER_READY` had gone out and mapped commands to their\nanswers. Each piece was small; together they made a 180-line viewer channel that the author could\nnot read in one pass, and a bridge that still had to ask the channel for its own state.\n\n## Decision\n\n- **The channel does transport only**: origin check, version, schema guard, typed `send`, one\n  handler map per end (`onEach`), the host's queue-until-ready and `exchange`, `dispose`. The\n  viewer end is `send`, `onEach`, `dispose`. Nothing in the channel reads a field of a message\n  other than `type`, `requestId` and `causedBy`.\n- **The bridge keeps the armed row** (`let armed` in `commands/handlers.ts`): set on `ACTIVATE_TOOL`,\n  taken by the `MEASUREMENT_ADDED` path, cleared on `DEACTIVATE_TOOL` of that row.\n- **\"Announce once\" is the subscriber's job**: `extension.ts` unsubscribes from `VIEWPORT_ADDED`\n  after the first event and sends `VIEWER_READY`.\n- **An answer is a plain `send` with `causedBy`**; the host settles an exchange on `causedBy`\n  alone. No `reply` helper, no pending-removal map.\n- **One handler map per end.** Each application registers its handlers once; the channel holds\n  that map, not a registry of them.\n- Three behaviour changes, each approved as an improvement or as harmless:\n  1. A removal asked by the form now produces two events, OHIF's own `MEASUREMENT_REMOVED` and the\n     answer with `causedBy`; the form ignores the first (the row is already gone) and the\n     exchange consumes the second. The pending-removal map that suppressed the first is gone.\n  2. Activating a row while another is drawing sends only `ACTIVATE_TOOL`; the viewer's armed\n     row is replaced, the reducer already re-arms. No `DEACTIVATE_TOOL` for the previous row.\n  3. Every `VIEWER_READY`, not only the first, restores the rows stored for the study that carry\n     a uid and a geometry, then re-arms the drawing row. The form's message handler does it with\n     the rows on screen when `VIEWER_READY` arrives (amended 2026-09-23 by\n     [A-33](A-33-review-of-the-boundaries-refactor.md); the first version reacted to an\n     `announcements` count with an effect that re-read storage), so a page reload and a viewer\n     reload restore through one path; the `readyCount` and the separate \"restored at mount\" list\n     are gone.\n\n## Why this way\n\nThe reading rule \"the channel is how a message travels; the bridge is what a message means\" is\none sentence; A-23's rule needed a paragraph and a table of exceptions. The lines saved are the\nsmaller gain; the larger one is that each file now answers one question.\n"},{"path":"docs/decisions/A-30-no-request-answer.md","title":"A-30 · no request answer","group":"Decisions","md":"# A-30 — one correlation: `rowId` ↔ `measurementUid`; no request/answer layer\n\nStatus: approved 2026-09-22. Canon: C-4.3.5, Q-3, Q-4, S-5.2, S-5.6. Supersedes\n[A-10](A-10-echo-guard.md) as the echo-loop mechanism and [A-21](A-21-channel-and-exchange.md)\nentirely; narrows [A-8](A-8-id-correlation.md) to its first sentence. Related:\n[A-29](A-29-channel-is-transport.md).\n\n## Context\n\nThe assignment asks for one deliberate correlation: who issues the row id, who issues the\nmeasurement id, and how the two are matched. On top of that the code carried a second one: every\ncommand had a `requestId`, events answered with `causedBy`, the host end kept a table of pending\nrequests with a five-second timeout, the contract kept a table of which event answers which\ncommand, and the form logged an \"unanswered request\". Nothing on screen depended on any of it; the\nrow was removed from the form before the request left, and a restore reply is the only\n`MEASUREMENTS_RESTORED` a session ever sees.\n\n## Decision\n\n- **Commands carry no `requestId`; events carry no `causedBy`.** `ACTIVATE_TOOL { rowId, toolName }`,\n  `DEACTIVATE_TOOL { rowId }`, `REMOVE_MEASUREMENT { measurementUid }`,\n  `FOCUS_MEASUREMENT { measurementUid }`, `RESTORE_MEASUREMENTS { studyInstanceUid, measurements }`;\n  `MEASUREMENT_ADDED { rowId | null, measurementUid, toolName, metrics, geometry? }`,\n  `MEASUREMENT_UPDATED`, `MEASUREMENT_REMOVED { measurementUid }`,\n  `MEASUREMENTS_RESTORED { restored, failed }`.\n- **The host issues `rowId` before drawing; the viewer issues `measurementUid` when the annotation\n  exists; `MEASUREMENT_ADDED` carries both** and the form stores the pair. Every later event names\n  the `measurementUid` and the form finds the row by it.\n- **No echo loop, by one rule on each side**: the form reacts to an event only by changing its\n  state, never by sending a command; the extension reacts to a command only by acting on OHIF,\n  never by sending an event itself (events come from OHIF's own `measurementService`). The one\n  reflection — `REMOVE_MEASUREMENT` → OHIF → `MEASUREMENT_REMOVED` — reaches a form whose row is\n  already gone; the reducer ignores an unknown uid.\n- **`exchange`, `pendingAnswers`, the answer table and the timeout are removed.** A removal is\n  fire-and-forget; `MEASUREMENTS_RESTORED` is handled like any other event.\n\n## Why this way\n\nThe assignment's correlation question has a one-sentence answer again, and the \"where could a\nloop start\" question is answered by pointing at two handlers instead of at a mechanism. What is\nlost is a console warning when the viewer never confirms a removal, which nothing on screen\ndepended on.\n"},{"path":"docs/decisions/A-31-one-channel.md","title":"A-31 · one channel","group":"Decisions","md":"# A-31 — one channel for both ends; the browser's task queue is the queue\n\nStatus: approved 2026-09-22. Canon: Q-1, Q-2, Q-5, Q-7. Supersedes [A-22](A-22-one-channel-api.md)\nwhere it describes two factories. Related: [A-29](A-29-channel-is-transport.md),\n[A-30](A-30-no-request-answer.md).\n\n## Context\n\nAfter A-29 and A-30 the two ends of the channel differed in two things only: the host waits for\n`VIEWER_READY` before it sends, and the host cancelled the armed row when it was disposed. Two\nfactories with two interfaces meant two places to read and two places to check. The author also\nasked whether a queue of incoming messages with routing was needed for bursts of events.\n\n## Decision\n\n- **One implementation, one interface.** The end of the channel is described by\n  `{ peerOrigin, accept, readyOn?, peerWindow? }` and offers `{ send, on, getState }` on both sides\n  (since [A-34](A-34-two-applications-one-channel-hook.md): the end is created when the package's\n  module loads and reached through `useChannel(options)`; this record first had a\n  `createChannel` factory returning `{ send, onMessage, getState, subscribe, dispose }`). `accept` is the\n  contract guard for what this end receives (`isViewerEvent` in the form, `isHostCommand` in the\n  extension); the type of what it sends is \"everything else in the contract\". `readyOn` names the\n  message that opens the way out: until it arrives, `send` queues; every arrival of it flushes the\n  queue in order before the application's handler sees the message, so the handler can answer a\n  peer that announced itself again (a viewer reload) with plain sends. The state is `{ ready,\nqueued }` (amended 2026-09-23 by [A-33](A-33-review-of-the-boundaries-refactor.md): the\n  `announcements` counter went with the effect that reacted to it). Without `readyOn` the end is\n  ready at once. The viewer names its peer window (`window.parent`, only when it is embedded); the\n  host names none and learns it from the source of the first message it accepts, its\n  `VIEWER_READY` — so the form never needs a reference to the iframe.\n- **No incoming queue of our own.** `postMessage` delivers into the receiving window's task queue,\n  one `message` event at a time, in order per source; that is the queue. Our end adds only the\n  origin check, the version check, the schema guard and one handler. Bursts (a handle being\n  dragged) are throttled where they are produced, in the extension; the only outgoing queue is the\n  one `readyOn` opens.\n- **No `DEACTIVATE_TOOL` on unmount, no dispose on `pagehide`.** The host application has one\n  channel per page, alive as long as the page; the hook unsubscribes what it subscribed (Q-5) and\n  the channel has nothing outside the page to release. The viewer is this page's iframe and dies\n  with the page, so there is no tool left to cancel; the channel does not know what a row is. The\n  extension's subscriptions and its armed row live in one React effect and die with its mount\n  ([A-32](A-32-react-bridge.md); the `pagehide` listener this record first allowed went with it).\n\n## Why this way\n\nOne file answers \"how does a message travel\" for both applications, and the platform's ordering\nguarantee is a stronger argument at the defence than a queue of our own. The `Exclude` on `send`\nis the only type expression in the package.\n"},{"path":"docs/decisions/A-32-react-bridge.md","title":"A-32 · react bridge","group":"Decisions","md":"# A-32 — the bridge is a React layer, mounted by OHIF as a context module\n\nStatus: approved 2026-09-22, amended 2026-09-23 by [A-33](A-33-review-of-the-boundaries-refactor.md)\nand [A-34](A-34-two-applications-one-channel-hook.md) (the hook's shape, the channel binding).\nCanon: C-3.4, C-4.1, Q-1, Q-5, S-5.6. Related: [A-20](A-20-three-layers.md),\n[A-23](A-23-minimal-bridge.md), [A-29](A-29-channel-is-transport.md), [A-31](A-31-one-channel.md).\n\n## Context\n\nThe extension lived in `preRegistration`: plain functions, a hand-kept list of disposers and a\n`pagehide` listener standing in for a component lifecycle. The host application, meanwhile, was a\nReact tree of hooks whose effects subscribe and unsubscribe by themselves. Two shapes for one job.\n\n## Decision\n\n- **The extension registers a context module.** OHIF composes every registered extension's\n  `getContextModule()` provider around the mode it renders\n  (`viewer/platform/app/src/routes/Mode/Mode.tsx`, `createCombinedContextProvider`), which is how\n  its own measurement tracking gets an application-long React component. Ours is `ScoringBridge`:\n  a provider defined inside `getContextModule` that runs `useScoringBridge(hostOrigin, ohif)` and\n  offers the channel it returns through the module's context, where `ohif` is\n  `createOhif(services, commandsManager)` built from the getter's parameters (A-34).\n- **C-3.4 is met through the module getter, not `preRegistration`.** The canon's sentence\n  (\"obtains `servicesManager` and `commandsManager` in the `preRegistration` hook\") names the\n  place OHIF hands an extension its services; `getContextModule` receives the same parameters\n  (`ExtensionManager.ts:463-469`) and, unlike `preRegistration`, gives the extension a mount point\n  whose unmount is a cleanup. The bridge still lives inside our extension, subscribes to\n  `measurementService` and calls `commandsManager.runCommand(...)`; the adapter that registers it\n  keeps using `preRegistration` (A-20). Recorded in the canon as A-33.\n- **`useScoringBridge` is the whole lifecycle of the OHIF-side application.** Its per-mount data\n  is `{ channel, armedRowId, pendingRestore, announced }` (`bridge.ts`), and every reaction is a\n  plain function over `(ohif, bridge, …)`: `handleCommand` for the channel, `handleOhif` for\n  OHIF. The hook takes the channel from `useChannel`, registers the two handlers in two effects\n  whose cleanups detach them, and returns the channel for the provider to offer through the\n  context (A-34, 2026-09-23; the first version created a channel per mount in a `useState`\n  initializer and disposed it in a separate effect, the second created and disposed it in one\n  effect — both replaced by the module-level end of A-34). No `preRegistration`, no `dispose`, no\n  disposer list, no `pagehide`. A `RESTORE_MEASUREMENTS` that arrives before the viewport holds\n  data waits in `pendingRestore` for the next `VIEWPORT_DATA_CHANGED`.\n- **A viewer opened on its own has no peer.** `createBridge` passes `window.parent` as the\n  channel's peer window only when the viewer is embedded (`window.parent !== window`); a\n  standalone viewer queues its events instead of posting them to itself with a target origin the\n  browser refuses (amended 2026-09-23).\n- **The channel package owns the one React binding, `useChannel`** (A-34, 2026-09-23). Subscribing\n  to messages is an effect written where it happens (`channel.on` in the effect, its returned\n  function as the cleanup), on both sides; `useChannel` itself subscribes the component to\n  `{ ready, queued }`, which the form's panel reads with `channel.getState()`. `react` is a peer\n  dependency of the channel and of the OHIF-side application. (This bullet said \"one hook,\n  `useChannelState`\" on 2026-09-22 and \"React-free\" for a few hours on 2026-09-23.)\n- **The announcement does not depend on effect order.** A provider's effects run after its\n  children's, so a viewport may already exist when the application subscribes: `ohif.on` delivers\n  `VIEWER_READY` at once when a tool group exists and on every `VIEWPORT_ADDED`, and `handleOhif`\n  sends it once per mount (`bridge.announced`). A mode remount (another study) mounts new\n  per-mount data and announces again through the same channel.\n- **One React at development time needs no extra links.** The fork's webpack resolves modules\n  from a fixed list of absolute directories (`viewer/.webpack/webpack.base.js`, `resolve.modules`),\n  so a symlinked package's `react` already resolves to the viewer's copy; `npm run viewer:link`\n  links our four packages and nothing else (amended 2026-09-23; the first version also linked\n  `react` and `react-dom` into `packages/*/node_modules`, where the host application's resolver\n  found them before its own React 19 and ran two Reacts).\n\n## Why this way\n\nOne rule for both applications — an effect subscribes, its cleanup unsubscribes — and the reviewer\nfinds every \"cleanup\" item of the assignment in the same idiom on both sides. The alternative, a\ndetached React root created in `preRegistration` just for effect cleanup, would have been React\nwithout a mount point; the context module is OHIF's own way of giving an extension one.\n"},{"path":"docs/decisions/A-33-review-of-the-boundaries-refactor.md","title":"A-33 · review of the boundaries refactor","group":"Decisions","md":"# A-33 — what the review of the boundaries refactor changed\n\nStatus: approved 2026-09-23; items 1, 4 and 5 superseded the same day by\n[A-34](A-34-two-applications-one-channel-hook.md). Canon: C-3.4, C-4.3.5, Q-1, Q-2, Q-5, S-5.6.\nAmends [A-27](A-27-folder-layout.md), [A-29](A-29-channel-is-transport.md),\n[A-31](A-31-one-channel.md), [A-32](A-32-react-bridge.md). Related: [A-14](A-14-state-restore.md).\n\n## Context\n\nA review of the working tree of slice 61 (the boundaries refactor, A-26..A-32) found five\nbehaviour defects, two rule texts that disagreed with each other and with the code, and one canon\nsentence the code no longer met to the letter. Each fix below is the smallest change that keeps\nthe shape of A-27..A-32; where a fix reverses a bullet of an earlier record, that record carries\nan \"amended 2026-09-23\" note pointing here.\n\n## Decision\n\n1. **`VIEWER_READY` is handled where it arrives.** The form's one message handler, re-registered\n   whenever the rows change, offers the rows on screen to a viewer that has just announced itself\n   and then dispatches the event; the channel's `announcements` counter is gone and `ChannelState`\n   is `{ ready, queued }`. The counter version read `sessionStorage` instead of the rows in memory\n   (an empty or stale restore whenever storage failed or lagged) and, being a level rather than an\n   edge, replayed the restore on every remount of the hook. Amends A-29 (3) and A-31. (The\n   handler's shape is now A-34's: `channel.on`, and the restore goes through `dispatch`.)\n2. **`MEASUREMENT_UPDATED` keeps the geometry it carries.** A dragged handle sends new points; the\n   reducer stores them with the new metrics, so the next restore rebuilds the shape the user left,\n   not the one first drawn (S-5.6, A-14).\n3. **A restore mark is cleared when it stops being true**: when the viewer reports the row\n   restored, when the viewer removes the measurement, and when a new measurement arrives for the\n   row.\n4. **A viewer opened outside the iframe has no peer window** (see A-32, amended). The\n   \"one effect creates and disposes the bridge\" part of this item lasted a day: A-34 replaced it\n   with the module-level channel end and `useChannel`.\n5. **`viewer:link` links our packages and nothing else** (see A-32, amended). The \"channel\n   package without React\" part of this item was reversed by A-34: the package now owns the one\n   React binding, `useChannel`, for both applications.\n6. **C-3.4 is met through `getContextModule`** (see A-32); the canon keeps the assignment's\n   wording and this entry records the reading.\n7. **The contract loses `invalid-geometry`** from `RestoreFailureReason`: no viewer version ever\n   produced it (the geometry is validated by the host's stored-row schema before it is sent), so\n   the enum now lists only what the bridge reports — `already-present`, `unknown-study`,\n   `viewer-error`. A newer host refuses a `MEASUREMENTS_RESTORED` carrying the old value; none is\n   ever sent. Contract 0.0.14.\n8. **The stored envelope names its key `studyInstanceUid`**, as the hook does; `uuid` misnamed a\n   DICOM Study Instance UID and broke the rows a previous build had stored.\n9. **The lint globs cover `packages/*/src/**/*.tsx`**, so the bridge's component and hook are\n   checked by the same rules as the application's; the Vitest include collects `*.test.tsx` from\n   the packages too.\n10. **A-27's size rule reads the same in both places**: no file under twenty lines, except a\n    package `index.ts`, `main.tsx`, a component's `.props.ts` and a file the standard layout\n    names (`hooks/useChannel.ts`, `state/selectors.ts`, `services/channel.ts`, a page). The\n    selectors import only the `Row` type from the reducer, so the two files no longer form a\n    cycle; the drawing-row lookup lives at its one caller.\n\n## Why this way\n\nEach defect was a place where the shape (A-27..A-32) had been kept but its promise had not: the\nrestore promised \"the rows on screen\", the geometry promised \"what the viewer holds\", the effect\npromised \"its cleanup unsubscribes what it subscribed\". Fixing the promise inside the shape costs\na few lines; replacing the shape would have reopened the refactor.\n"},{"path":"docs/decisions/A-34-two-applications-one-channel-hook.md","title":"A-34 · two applications one channel hook","group":"Decisions","md":"# A-34 — two applications, one `useChannel`, one way to subscribe, one action type\n\nStatus: approved 2026-09-23. Canon: C-3.4, C-4.3.4, C-4.3.5, Q-1, Q-2, Q-5, S-5.1, S-5.6. Supersedes\n[A-31](A-31-one-channel.md) where it lists the channel's interface, [A-32](A-32-react-bridge.md)\nwhere it describes the hook and its effects, and items 1, 4 and 5 of\n[A-33](A-33-review-of-the-boundaries-refactor.md). Related: [A-29](A-29-channel-is-transport.md),\n[A-30](A-30-no-request-answer.md).\n\n## Context\n\nAfter A-33 the two ends still connected to the channel differently: the form imported a module\nsingleton and subscribed with `onMessage`, the extension created a channel inside an effect and\n`dispose`d it in the cleanup; the extension subscribed to OHIF through three functions of three\nshapes; the form armed a row with a reducer action and then sent a command with almost the same\nfields. The author asked for one mechanism on both sides, no `dispose`, and no second format\nbetween OHIF and the wire. The package under `packages/viewer-bridge` is not a bridge: it is the\nOHIF-side application, the form's peer, and could be shipped as a separate application.\n\n## Decision\n\n1. **The channel package holds one end of the channel per window, created when its module\n   loads.** `useChannel(options)` — the same `{ peerOrigin, accept, readyOn?, peerWindow? }` the\n   former `createChannel` took — names the peer on the first mount, checks every later mount\n   against it by value (a mismatch is logged as an error and ignored), leases the window\n   `message` listener for the mount (attached with the first lease, removed with the last) and\n   subscribes the calling component to `{ ready, queued }`. The public interface is\n   `{ send, on, getState }`: `on(handler)` sets the one handler of this end and returns its\n   detachment. No `createChannel`, `onMessage`, `dispose` or `subscribe` outside the package; `react`\n   is a peer dependency of the channel and of the OHIF-side application.\n2. **Both applications connect the same way.** The application hook — `useScoringForm(study)`\n   in the form, `useScoringBridge(hostOrigin, ohif)` in the OHIF-side application — calls\n   `useChannel`, registers `channel.on(handler)` in an effect whose cleanup detaches it, and\n   returns the channel: the form's panel reads `channel.getState()` for its status line, the\n   OHIF-side provider offers the channel through the context module's context.\n3. **An action of the form is a command of the contract.** `FormAction` is the two local actions\n   (`ADD_ROW`, `REMOVE_ROW`), every `HostCommand` and every `ViewerEvent`; the `dispatch` the hook\n   returns sends every command through the channel and reduces everything. `ACTIVATE_TOOL` arms\n   the row and `DEACTIVATE_TOOL` disarms it; the commands that change no row (`REMOVE_MEASUREMENT`,\n   `FOCUS_MEASUREMENT`, `RESTORE_MEASUREMENTS`) and `VIEWER_READY` are explicit no-op cases.\n   `VIEWER_READY` is answered inside the handler with the rows on screen: `restoreViewer(dispatch,\nstudy, rows)` dispatches `RESTORE_MEASUREMENTS` and re-arms the drawing row.\n4. **The OHIF-side application subscribes to OHIF the way it subscribes to the channel.**\n   `createOhif(services, commandsManager)` (`ohif/facade.ts`) gives it `ohif.on(handler)`: one\n   subscription over the five OHIF events, one unsubscribe. The facade is the boundary: the OHIF\n   measurement object is parsed there once (`ohif/metrics.ts`), updates are throttled per uid\n   there (100 ms, a removal drops the pending one), and what the handler receives is already in\n   the contract's shape — `MEASUREMENT_ADDED` (with `rowId: null`), `MEASUREMENT_UPDATED`,\n   `MEASUREMENT_REMOVED`, `VIEWER_READY` (on `VIEWPORT_ADDED`, and at once when a tool group\n   already exists) — plus one internal `VIEWPORT_DATA_CHANGED`. `handleOhif` is one `switch`,\n   the mirror of `handleCommand`, and adds only the application's state: the armed row on\n   `MEASUREMENT_ADDED` (then the default tool), `VIEWER_READY` once per mount, the restore that\n   waited for viewport data. The per-mount data is `{ channel, armedRowId, pendingRestore,\nannounced }`.\n5. **Nothing is disposed.** The window listener is a lease released by the effect; OHIF\n   subscriptions and the throttle's timers are released by `ohif.on`'s unsubscribe; the channel's\n   queue and state live as long as the window.\n\n## Why this way\n\nThe reader learns one sentence — `useChannel`, then `useEffect(() => x.on(handler))` — and finds\nit on both sides and for both sources; every handler is the application's own `switch` over a\ncontract type; the boundary with OHIF is one file. The alternatives kept for the record: a map\nof handlers resolved by the channel (rejected: the channel would read the message), a per-mount\nchannel with `dispose` (rejected: an unmount is not the end of the page), a third event format\nbetween OHIF and the wire (rejected: two formats to learn for one stream).\n"},{"path":"docs/decisions/A-35-abstract-storage.md","title":"A-35 · abstract storage","group":"Decisions","md":"# A-35 — the storage service knows nothing about studies or rows\n\nStatus: approved 2026-09-23. Canon: S-5.6 (A-14), Q-7. Related: [A-14](A-14-state-restore.md),\n[A-27](A-27-folder-layout.md), [A-28](A-28-boundaries-as-schemas.md).\n\n## Context\n\n`services/storage.ts` held both halves of persistence: the defensive access to `sessionStorage`\nand the form's own knowledge — the key `scoring-form:rows:<study>`, the stored-row schema, the\nmapping to and from `Row[]`. A service that knows what a row is is half of the form, and the author\nasked for the service to be abstract.\n\n## Decision\n\n- **`services/storage.ts` is `sessionStorage` and nothing else**: `readStorage(key, schema)` returns\n  the stored value once it passed the caller's zod schema, or `null` (nothing stored, a value the\n  schema refuses, or a store that throws — private mode, a full quota, cleared site data — each\n  logged as a warning); `writeStorage(key, value)` stores the value or warns. The type parameter is\n  inferred from the schema; no caller writes it.\n- **What the form stores is the form's own**: `hooks/useStoredRows.ts` (a service module until A-37 the\n  same day) — the rows' I/O over the generic service — holds the envelope `{ studyInstanceUid, rows }` (rows in the model's JSON\n  form, A-36), the key, and the two functions the hook uses — `loadRows(studyInstanceUid)` (the rows under that\n  study, each starting with a clean restore attempt; `[]` otherwise) and\n  `saveRows(studyInstanceUid, rows)`.\n- Names: `loadRows` / `saveRows` say what the form does; `readStorage` / `writeStorage` say what the\n  service does. The `__tests__` of the envelope move with it (`hooks/__tests__/useStoredRows.test.ts` since A-37).\n\n## Why this way\n\nThe boundary rule (A-28) says a foreign value passes through one schema where it enters; the\ngeneric service applies whatever schema it is handed and the rows' service owns its own. Rejected:\nkeeping one module and renaming it (the generic service would still import `Row`); a generic\nstorage class with methods per key (a factory for two functions); a `useStoredRows` hook owning\nthe reducer (the author: the reducer is not to be mixed into persistence, and a persistence hook\nwithout the state has nothing to return — §0.1); and `state/` as its home (it is I/O, not state).\n"},{"path":"docs/decisions/A-36-row-model-folder.md","title":"A-36 · row model folder","group":"Decisions","md":"# A-36 — the row model has its own folder\n\nStatus: approved 2026-09-23. Canon: Q-7, D-2. Related: [A-27](A-27-folder-layout.md),\n[A-35](A-35-abstract-storage.md).\n\n## Context\n\n`Row` and `RowStatus` lived in `state/reducer.ts`, so every component and helper imported the\ntype of a row \"from the reducer\", and the stored form of a row (`StoredRows`) lived in the\npersistence module. The author asked for what a row _is_ to be separate from how it changes and\nhow it is stored.\n\n## Decision\n\n- **`models/row.ts` is the row, with its API as one named object.** `RowStatus`, the `Row` type\n  and `RowModel = { jsonSchema, create, toJSON, fromJSON, toRestoreRequest }`: the row's JSON form\n  (`create(toolName)` issues the row id, A-37) (every field but `restoreFailureReason`, A-14), a new pending row, the\n  conversions to and from the JSON form, and the row as a `RestoreMeasurementRequest` (or `null`\n  when it has no uid or geometry). Plain functions declared above and listed by name — the\n  readability of static methods without a class (the strict lint set refuses a class with only\n  static members, and §2 keeps arrow functions everywhere). Nothing in it depends on the reducer\n  or on storage.\n- **`state/reducer.ts` is how a row changes**: `FormAction` and the transitions; `ADD_ROW` is\n  `RowModel.create`. **`hooks/useStoredRows.ts` is how rows are stored** (A-35, A-37): the envelope\n  `{ studyInstanceUid, rows: RowModel.jsonSchema[] }`, the key, `loadRows` (`RowModel.fromJSON`)\n  and `saveRows` (`RowModel.toJSON`), over the storage service (A-35). `restoreViewer` maps the\n  rows with `RowModel.toRestoreRequest`.\n- Components, `utils/`, `state/actions.ts`, `state/selectors.ts` and the tests import `Row` /\n  `RowStatus` / `RowModel` from `@app/models/row`; `FormAction` and `reducer` still come from the\n  reducer.\n- `models/` joins the layout of A-27 as a role folder (\"what the data is\"); other schemas keep\n  their owners — the wire's in the contract package, OHIF's measurement object in\n  `ohif/metrics.ts`.\n\n## Why this way\n\nOne file answers \"what is a row\" and \"how does it become its neighbours\" for a reader coming from\nthe components, and the reducer file reads as transitions only; `RowModel.` in the editor lists the\nwhole API. Rejected: a `schemas/` folder (grouping by kind, which A-27 avoids; it would have had to\ntake `Row` out of the reducer anyway); leaving `Row` in the reducer with the stored form beside it\n(the persistence module would keep a schema it does not own); a `class RowModel` with static\nmethods (same call sites, but a lint exception and a convention amendment for a namespace).\n"},{"path":"docs/decisions/A-37-stored-rows-hook.md","title":"A-37 · stored rows hook","group":"Decisions","md":"# A-37 — the stored rows are a hook, and the model issues the row id\n\nStatus: approved 2026-09-23. Canon: S-5.6 (A-14), Q-3 (A-8). Related: [A-35](A-35-abstract-storage.md),\n[A-36](A-36-row-model-folder.md).\n\n## Context\n\nAfter A-35 and A-36 the rows' persistence sat in `services/storedRows.ts` as two functions, and the\nrow id was drawn in the action creator and passed into `RowModel.create`. The author asked for the\npersistence to be a hook that works with the storage service — without mixing the reducer into it\n— and for the model to issue the id of the row it creates.\n\n## Decision\n\n- **`hooks/useStoredRows(studyInstanceUid)` → `[storedRows, save]`**: the rows read from\n  `sessionStorage` once, at mount (`useState` with a lazy initializer over `loadRows`), and a\n  stable `save(rows)` that writes them back (`saveRows`). The envelope\n  `{ studyInstanceUid, rows: RowModel.jsonSchema[] }` and the key live in the same module; the\n  generic service (A-35) stays the only thing that touches `sessionStorage`.\n- **`useScoringForm` composes**: `useChannel`, then `useStoredRows`, then\n  `useReducer(reducer, storedRows)`; the effect that saves on every change is written in the form\n  hook, where the change happens (§0.2). The reducer is not the hook's business.\n- **`RowModel.create(toolName)` issues `rowId`** (`crypto.randomUUID()`); the local action is\n  `{ type: 'ADD_ROW', row }` and the reducer appends the row it is given. A-8 holds: the host\n  issues the row id before any drawing — now in the model, not in the action creator.\n- `loadRows` / `saveRows` stay exported from the hook's module for the existing envelope tests\n  (an export only a test imports — a known exception until the test slice rewrites them through\n  the hook).\n\n## Why this way\n\nA hook that returns what its name promises — the stored rows and the way to store them — and a\nform hook that reads as three lines of composition. Rejected: a `useStoredRows` that owns the\nreducer (persistence and transitions in one hook); leaving two functions in `services/` (the author\nwanted the instrument to be a hook); generating the id in the reducer (a reducer is pure).\n"},{"path":"docs/decisions/A-38-names-after-roles.md","title":"A-38 · names after roles","group":"Decisions","md":"# A-38 — the OHIF-side packages are named after their roles\n\nStatus: approved 2026-09-23. Canon: C-3.4, C-4.1, D-2. Related: [A-20](A-20-three-layers.md),\n[A-32](A-32-react-bridge.md), [A-34](A-34-two-applications-one-channel-hook.md).\n\n## Context\n\nA-34 made the OHIF-side package an application in its own right — the form's peer, with its own\nworld (OHIF) and the same way of speaking to the channel — while its name still said \"bridge\".\nThe other package, which registers it through OHIF's extension manager, was called an \"adapter\".\nThe author asked for names that say what the packages are.\n\n## Decision\n\n- **`packages/scoring-viewer`, `@bdiadiun/ohif-extension-scoring-viewer`** — the OHIF-side\n  scoring application, packaged as an OHIF extension. Inside it: `ScoringViewer.tsx`\n  (`getContextModule`, the provider, `ScoringViewerContext`), `hooks/useScoringViewer.ts`,\n  `session.ts` (`Session`, `createSession`: the application's data for one mount, formerly\n  `Bridge`), the log prefix `[scoring-viewer]`, the extension id\n  `@bdiadiun/ohif-extension-scoring-viewer`, the viewer configuration key\n  `window.config.scoringViewer.hostOrigin`.\n- **`packages/ohif-extension-loader`, `@bdiadiun/ohif-extension-loader`** — the one package the\n  fork lists; its `preRegistration` loads our extensions through OHIF's extension manager\n  (`extensionLoader`, `EXTENSION_LOADER_ID`, log prefix `[extension-loader]`).\n- Both start again at `0.1.0`: a new name is a new line on the registry. The contract and the\n  channel keep their names and versions.\n- The notes follow: `docs/notes/viewer-internals.md` (was `bridge-internals.md`) and\n  `docs/notes/ohif-api.md` (was `ohif-bridge-api.md`). Decision records before this one keep the\n  word \"bridge\" as the name of their time; this record is the translation.\n- The fork follows by one pull request after the publish: the dependency line in\n  `platform/app/package.json` and the `packageName` in `pluginConfig.json` switch to the loader,\n  then `viewer.json` pins the new fork commit (A-18, A-20).\n\n## Why this way\n\nA reader who opens `packages/` should see two applications and their contract and channel, not a\n\"bridge\" and an \"adapter\" whose roles need a paragraph. Rejected: keeping the npm names and\nrenaming only the folders (the names the fork and the registry show would still lie); a single\npackage for both roles (the loader is the fork's fixed entry and must not change when the\napplication does, A-20).\n"},{"path":"docs/decisions/A-39-channel-end-class.md","title":"A-39 · channel end class","group":"Decisions","md":"# A-39 — the end of the channel is a class\n\nStatus: approved 2026-09-23. Canon: Q-1, Q-2, Q-5, Q-7. Related: [A-34](A-34-two-applications-one-channel-hook.md),\n[A-36](A-36-row-model-folder.md).\n\n## Context\n\nSince A-34 the channel package holds one end of the channel per window, created when its module\nloads. The first version wrote that end as module-level variables and functions — a singleton by\nconvention. The author asked whether that procedural shape was right, and chose a class: the end\nhas state and behaviour and exists once, which is what a class instance is for.\n\n## Decision\n\n- **`class ChannelEnd`** in `packages/channel/src/channel.ts`: private fields for the state\n  (`queued`, `listeners`, `peer`, `target`, `state`, `handle`, `leases`, `stopListening`),\n  public arrow-function fields `send`, `on`, `getState`, `subscribe`, `listen`, private ones\n  `publish`, `open`, `receive`, `samePeer`. Methods are arrow fields, not prototype methods,\n  because they are passed by reference (`useSyncExternalStore(channel.subscribe, channel.getState)`,\n  the `listen` effect) and must keep their `this`.\n- **One instance per window**: `const channel = new ChannelEnd();` at module level; `useChannel`\n  returns it as `Channel<TIn>` (the public interface, the options and the state type are\n  unchanged; the one type assertion stays inside `on`).\n- **Where a class is right** (CONVENTIONS §2): state with behaviour in one instance. Not for a\n  model without instances (`RowModel` stays an object of functions, A-36) and not for a reducer\n  or a hook.\n- Released as channel 0.0.9; scoring-viewer 0.1.1 and ohif-extension-loader 0.1.1 take it; the\n  fork follows with its entry (A-20).\n\n## Why this way\n\n`private` says what the module-level `let` only implied, the fields read as the state of one\nthing, and the methods as its behaviour; nothing else changes — the same lines, the same one\nassertion, the same tests. Rejected: keeping the module variables (the author found the\nprocedural shape harder to read), a factory called once at module level (the same variables one\nlevel deeper), and static-only classes (a namespace, which the lint set refuses and A-36 already\nanswered).\n"},{"path":"docs/decisions/README.md","title":"Decisions index","group":"Decisions","md":"# Decision records\n\nOne file per decision, indexed in [CANON.md → \"Decisions on ambiguities\"](../CANON.md#decisions-on-ambiguities).\nFormat: Context, Decision, Rejected alternatives, Consequences, Status. Approved decisions are mirrored\ninto `ARCHITECTURE.md` → \"Decisions\" in the slice that implements them.\n"}];
  const ID_RE = /\b(C-\d+(?:\.\d+)+|Q-\d+|S-5\.\d|D-\d+|X-\d+|P-\d+|A-\d+|F-\d\d)\b/g;
  const CANON = 'docs/CANON.md',
    GRAPH = 'docs/FEATURE-GRAPH.md';
  const byPath = Object.fromEntries(DOCS.map((d) => [d.path, d]));
