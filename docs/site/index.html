line wrapper.\n\n- **A folder appears when its first file does.** This project has no images, no context provider and\n  no store, so `assets/`, `context/` and `redux/` do not exist on disk. The names above are the\n  convention: whoever adds the first image creates `assets/`, whoever needs a provider creates\n  `context/`, and so on. A folder kept alive by a placeholder file says nothing true about the code.\n\n- **Three folders the reference does not name, `models/`, `state/` and `services/`, are the conventional\n  names for what a Redux-less React app still has: the data model, a reducer with its selectors and\n  actions, and the module that talks to the outside (`sessionStorage`; the channel comes from its package's\n  `useChannel`, A-34). Nothing is invented: a reader\n  from any React project finds each thing where they would look for it (A-27).\n\n| Folder            | What is in it here                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         |\n| ----------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |\n| `src/assets/`     | Not created yet: the form uses native elements and no imagery (canon X-3).                                                                                                                                                                                                                                                                                                                                                                                                                                                                 |\n| `src/components/` | `ViewerFrame`, `ScoringPanel`, `MeasurementRow`, `TotalsFooter`, `BridgeStatus`, each with its `.props.ts`; `ScoringPanel` owns the form (it calls `useScoringForm`) and shows the bridge status; the others render what they are given.                                                                                                                                                                                                                                                                                                   |\n| `src/pages/`      | `ScoringPage` — the single page, layout only: the viewer iframe on the left, the panel on the right.                                                                                                                                                                                                                                                                                                                                                                                                                                       |\n| `src/context/`    | Not created yet: the form's state lives in one reducer and is passed as props.                                                                                                                                                                                                                                                                                                                                                                                                                                                             |\n| `src/redux/`      | Not created yet: there is no store; `useReducer` holds the rows.                                                                                                                                                                                                                                                                                                                                                                                                                                                                           |\n| `src/utils/`      | `format` (values, statuses, kinds) and `totals` (per-unit sums): pure helpers over the row model.                                                                                                                                                                                                                                                                                                                                                                                                                                          |\n| `src/hooks/`      | `useStoredRows(studyInstanceUid)` (`[storedRows, save]`: the rows of the study read from sessionStorage once, and the way to write them back — the envelope and the key live here, A-37) and `useScoringForm(studyInstanceUid)` (`[rows, dispatch, channel]`: the page's end of the channel from `useChannel(VIEWER_CHANNEL)`, the reducer started from the stored rows and saved on every change, a `dispatch` that sends every command of the contract and reduces everything, the rows on screen offered back on every `VIEWER_READY`). |\n| `src/models/`     | `row` (A-36): `RowStatus`, the `Row` type and `RowModel` — its JSON form, `create`, `toJSON` / `fromJSON`, `toRestoreRequest` — what a row is and how it becomes its neighbours, apart from how it changes and how it is stored.                                                                                                                                                                                                                                                                                                           |\n| `src/state/`      | `reducer` (`FormAction` = the two local actions + every command + every event, the pure reducer), `selectors` (`findRow`, `findRowByUid`), `actions` (what each button dispatches, and `restoreViewer`).                                                                                                                                                                                                                                                                                                                                   |\n| `src/services/`   | `storage` (`readStorage(key, schema)` / `writeStorage(key, value)`: sessionStorage, defensively, knowing nothing about studies or rows — A-35); the channel itself lives in the published package and is reached through its `useChannel` (A-34).                                                                                                                                                                                                                                                                                          |\n| `src/i18n.ts`     | Every user-visible string as `t.<key>`, Ukrainian per decision A-7.                                                                                                                                                                                                                                                                                                                                                                                                                                                                        |\n\nOutside `host-app`, the repository keeps the packages, each laid out by side or role (A-27):\n`packages/contract` (the wire contract, four flat files), `packages/channel` (two files: `channel.ts`,\n`peer.ts`), `packages/scoring-viewer` (`commands/`, `events/`, `ohif/`), `packages/ohif-extension-loader`;\nthen `viewer/` (the OHIF fork, a local checkout pinned by `viewer.json` and ignored by git),\n`scripts/` (checks and generators) and `docs/` (canon, graph, decisions, notes). `ARCHITECTURE.md`\nmaps every concern to the file that owns it.\n\n## 3. Rules that follow from this\n\n- A new component goes to `components/` with its `.props.ts`; a new page to `pages/`; a hook to\n  `hooks/`; a pure helper over the row model to `utils/`, anything else beside the module it\n  serves (A-27). A folder the layout names but the repository does not have yet is created when\n  its first file arrives, under that exact name.\n- Tests live in a `__tests__/` folder inside the folder of the code under test.\n- Instructions that apply only to one part of the repository belong in `.claude/rules/` with a\n  `paths` glob, not in `CLAUDE.md`, which stays short.\n- A repeated manual procedure becomes a command in `.claude/commands/`; a procedure with judgement\n  in it becomes a skill in `.claude/skills/`.\n"},{"path":"docs/CONVENTIONS.md","title":"Conventions","group":"Process","md":"# Coding conventions\n\nSingle source of truth for how code in this repository is written (decision A-13). ESLint and\nPrettier enforce what they can (`npm run lint`, `npm run format:check`); the rest is enforced in\nreview. Every agent brief points here; a slice does not reach gate 2 with lint or format errors.\n\nPrecedence: this file → `eslint.config.js` / `.prettierrc.json` → personal habit. If a rule here\nand the linter disagree, fix the linter config in the same PR and say so.\n\n## 0. How this code is written\n\nPlain React, no framework of our own: data instead of wrappers, effects instead of lifecycle\nmanagers, schemas instead of guards, and every file readable in one pass. The sections below are\nthe detail; these seven sentences are the shape, and a change that breaks one of them is wrong\neven when the linter is green.\n\n1. **A hook returns what its name promises, or it does not exist.** `useScoringForm(study)` →\n   `[rows, dispatch, channel]`; `useStoredRows(study)` → `[storedRows, save]`; `useChannel(options)` → the channel; `useScoringViewer(hostOrigin,\nohif)` → the channel it provides. A hook that returns\n   nothing is a hidden effect (the former `usePersistRows(rows)`, `useMessages(channel, handle)`):\n   write the effect where it happens instead.\n2. **An effect is written where it happens, and it has its pair.** Whatever the effect\n   subscribes, its cleanup unsubscribes, in the same effect — `channel.on(handler)` on both\n   sides, `ohif.on(handler)` in the OHIF-side application. No disposer lists, no \"latest value\"\n   refs, no `pagehide` standing in for unmount.\n3. **State is the data, not a wrapper around it.** The reducer runs over `Row[]`, not\n   `{ rows }`; the channel's state is two fields, `{ ready, queued }`. No `FormState`, no `FormContext`, no \"slot\"\n   objects made to carry one value.\n4. **A message of the contract is an action, in both directions.** The viewer's events go into\n   the reducer as they are, and what a button does is a command of the contract:\n   `FormAction = ADD_ROW | REMOVE_ROW | HostCommand | ViewerEvent`, and the form's `dispatch`\n   sends every command through the channel before it reduces (A-34). No translation layer between\n   the wire and the state. The one event that needs a reaction, `VIEWER_READY`, gets it where it\n   arrives: the handler dispatches the restore commands with the rows on screen, then the event\n   itself. The handler is re-registered whenever the rows change, so it never reads a stale value\n   through a ref or a re-read of storage (A-33). On the other side the same: `ohif.on` delivers\n   OHIF's events already in the contract's shape, and `handleOhif` sends them.\n5. **A function takes exactly what it needs and does one thing.** `activateRow(dispatch, row)`,\n   `restoreViewer(dispatch, study, rows)`, `loadRows(studyInstanceUid)`. At most three inputs, no\n   dependency bags, no factory that returns a function.\n6. **A boundary is a schema; a guarantee is a tool's.** Everything foreign — the wire, OHIF's\n   measurement object, `sessionStorage` — passes through one zod schema once. What the linter or\n   React already guarantees (an exhaustive `switch`, a cleanup) is not written again in code.\n7. **A component renders; a hook owns.** `ScoringPanel` calls one hook and renders;\n   `MeasurementRow` calls `activateRow(dispatch, row)` from its own button; the page is layout\n   only. On the viewer side the same: the provider renders its children around the channel\n   `useScoringViewer` returns, and the hook owns the channel, the commands and the OHIF events.\n\n## 1. Language and tooling\n\n- TypeScript `strict` everywhere. No `any`; when an external type is genuinely unknown, use\n  `unknown` and narrow, or write a one-line comment above a justified `// eslint-disable-next-line`.\n- ESLint 9 flat config with `typescript-eslint` strict + stylistic (type-aware), `react-hooks`,\n  `react-refresh`; Prettier for formatting (single quotes, semicolons, trailing commas, width 120 —\n  raised from 100 on 2026-09-23 so a hook signature with its return type fits on one line).\n- Dependencies: runtime dependencies of an app live in that workspace's `package.json`. Shared\n  tooling lives at the root: ESLint, Prettier, Vitest, jsdom, Testing Library and the React type\n  packages those tests rely on. npm hoists workspace packages unpredictably, and a test library\n  hoisted to the root cannot see types left inside a workspace; CI runs `npm ci` from scratch and\n  would catch the drift, a warm local `node_modules` does not.\n- Node 22; npm workspaces at the root; the viewer fork uses its own yarn toolchain but follows this\n  document for our extension.\n\n## 2. Functions\n\n- Arrow functions everywhere: components, hooks, utilities, event handlers, reducers.\n  ```ts\n  export const computeTotals = (rows: readonly Row[]): Total[] => { … };\n  export const ScoringPanel = ({ rows }: ScoringPanelProps): JSX.Element => { … };\n  ```\n- A `function` declaration is allowed only when hoisting is genuinely required (mutual recursion\n  in one module) and carries a comment saying so.\n- A `class` is for state with behaviour that exists as one instance — the end of the channel\n  (`ChannelEnd`, A-39) — with private fields and arrow-function methods so they can be passed by\n  reference. Not for a model without instances (`RowModel` is an object of functions, A-36), a\n  reducer or a hook; a class with only static members is a namespace and the lint set refuses it.\n- Exported functions declare their return type explicitly. Internal helpers may infer.\n- Prefer small named helpers over long inline lambdas; a callback longer than ~5 lines gets a name.\n- **At most three inputs.** A function, factory, hook or helper takes no more than three inputs,\n  counting positional parameters or, when it takes an options or dependencies object, that\n  object's properties. More than three means it works with everything in the world: let it own\n  what it was being handed, split it, or pass the one cohesive object that already exists (a\n  channel, a service) instead of its members one by one. Nesting the extras in a sub-object to\n  pass the count is not a fix, and an options bag of test-only seams does not escape the rule.\n  React component props are exempt, and so is a signature a third party dictates (OHIF's\n  extension parameters).\n- **No function inside a `return` object.** A factory declares every method above, with a name,\n  and returns a list of names: `return { services, commandsManager, on };`. The return then reads as\n  the file's table of contents and each method can be found by its name. (The same rule for\n  components is in §6.)\n- **A factory is never called inside another call's argument list.** Declare the function or the\n  value with a name above and pass it by name, so the call reads as a list of things that already\n  exist. No `createX` for what is one variable or one function.\n- Exhaustiveness over a discriminated union is the linter's job, not the code's:\n  `@typescript-eslint/switch-exhaustiveness-check` fails the build when a `switch` over a message,\n  action or status type misses a case, so a `switch` has no `default` branch and no\n  `const exhaustive: never = …` line (removed 2026-09-22: it duplicated the rule in three places).\n\n## 3. Enums, literals and constants\n\n- Application state uses **string enums** where a value is compared or stored: row status.\n  ```ts\n  export enum RowStatus {\n    Pending = 'pending',\n    Drawing = 'drawing',\n    Done = 'done',\n  }\n  ```\n  Reducer actions are string-literal `type`s, like the wire messages, because the viewer's events\n  are dispatched to the reducer as they are (`FormAction = UserAction | ViewerEvent`); an enum\n  would force a translation layer between the two.\n- Numeric enums are forbidden (lint rule). Do not use `const enum`.\n- The **wire contract** (`packages/contract`) keeps string-literal union types (`type: 'ACTIVATE_TOOL'`)\n  and `as const` tuples: it is the serialised format, copied into the OHIF fork, and stays free of\n  TypeScript-only constructs. App code may map contract literals to enums at the boundary, never the\n  other way round.\n- Module-level constants: `UPPER_SNAKE_CASE` for true constants (`VIEWER_ORIGIN`, `DEFAULT_TOOL`),\n  `camelCase` for everything else. No magic numbers: a timing or size value gets a named constant\n  with a comment stating the reason for the value.\n\n## 4. Naming\n\n| Thing                                | Style                                                                        | Example                                                                        |\n| ------------------------------------ | ---------------------------------------------------------------------------- | ------------------------------------------------------------------------------ |\n| Types, interfaces, enums, components | PascalCase                                                                   | `MeasurementRow`, `BridgeState`                                                |\n| Variables, functions, hooks          | camelCase; hooks start with `use`                                            | `createOhif`, `useChannel`                                                     |\n| Files: components                    | PascalCase `.tsx`                                                            | `TotalsFooter.tsx`                                                             |\n| Files: types and styles              | `.props.ts` next to a React component, and nowhere else (A-27)               | `TotalsFooter.props.ts`                                                        |\n| Files: everything else               | kebab-case or camelCase, one concept per file                                | `host-channel.ts` / `hostChannel.ts` (keep the existing style within a folder) |\n| Tests                                | `__tests__/` folder inside the folder of the code under test, `*.test.ts(x)` | `state/__tests__/reducer.test.ts`                                              |\n| Booleans                             | `is`/`has`/`can`/`should` prefix                                             | `isReady`, `hasMetrics`                                                        |\n| Event handlers                       | `on<Event>` for props, `handle<Event>` for implementations                   | `onRemove` / `handleRemove`                                                    |\n| Interfaces for props                 | `<Component>Props`                                                           | `ScoringPanelProps`                                                            |\n\nNo `I` prefix on interfaces, no Hungarian notation, no abbreviations except `id`, `uid`, `url`.\n\n## 5. Modules and imports\n\nWhere a file belongs is set by [`docs/PROJECT-STRUCTURE.md`](PROJECT-STRUCTURE.md): components,\npages, hooks and generic helpers follow the conventional React layout, while the message channel and\nthe row model keep their own feature folders. Instructions that apply to one part of the repository\nlive in `.claude/rules/` with a `paths` glob, not in `CLAUDE.md`.\n\n- One concern per module: a module exports one idea (a factory, a hook, a component, a pure\n  helper set) and is named after it. A file over ~150 lines of code or a function over ~50 lines is\n  a signal to split, and the lint reports it.\n- Split by role, not by size: the bridge is messaging, handshake and the measurement stream; a\n  hook is user actions or event synchronisation, not both. A factory that does more than three\n  things is two factories and a composition root that wires them.\n- A composition root (`ScoringViewer.tsx`, `main.tsx`, a top-level hook) only creates and connects; it holds\n  no branching logic of its own.\n- Repeated lookups become named selectors (`findRow`, `findRowByUid` in `state/selectors.ts`) instead of inline `find`\n  calls scattered through a module.\n- Never use a mutable placeholder to break a circular dependency\n  (`let forget = () => undefined` reassigned later). Pass the dependency explicitly, or move the\n  shared state into the module that owns it.\n- Named exports only; no default exports except where a framework requires one (OHIF extension\n  entry, Vite config).\n- Import order: node built-ins, external packages, our published packages\n  (`@bdiadiun/scoring-contract`), then `@app/…`, then `./` inside the same folder. The order is the\n  rule; no blank line is required between the groups, and none of this repository has ever had one.\n  Use `import type` for type-only imports (lint rule).\n- In the application, an import that crosses a folder uses the `@app/*` alias, which resolves to\n  `host-app/src/*`; `./` stays inside one folder, where it is the more precise statement. The alias\n  is the application's alone: `packages/*` keep relative imports, because they are published and an\n  alias would resolve here and fail in a consumer's build. Whatever resolves imports for a check,\n  the graph script included, has to learn the alias too, or it stops checking them and still\n  reports success.\n- No barrel `index.ts` re-exports inside the app; import from the module that owns the symbol.\n- **A `.props.ts` file belongs to a React component only.** In a package, a type lives beside the\n  code that implements it; the one exception is a file that only describes a third party's surface\n  (`ohif.ts`). A type used by one file is declared in that file without `export`; a package's\n  `index.ts` exports what another package or the application uses and nothing else.\n- **The channel is transport, the extension is what a message means** (A-29, A-31). The channel\n  knows origin, version, the guard, `send`, one `on` handler and the queue until `readyOn`;\n  it never reads a field of a message. The armed row, announcing once and everything OHIF live in\n  the extension; the form's state lives in the form.\n- Never reach into another package's internals; the contract package is consumed through its\n  public entry only.\n- **A shape is declared once, by the package that owns the idea.** Before writing an interface, a\n  schema or a constant, search the packages for one that already says it: `MessageHandlers` and\n  `ChannelState` belong to the channel, every message and vocabulary schema (`ToolName`, `Metrics`,\n  `MeasurementGeometry`) to the contract, the initial channel state to the channel. The application\n  extends or picks from those (`Row.omit(...)` and `Metrics.nullable()` in the stored-row schema)\n  instead of listing the members again.\n- **The contract is zod schemas (A-26).** A message is one `z.object`; the two directions are\n  `z.discriminatedUnion('type', …)`; a type is `z.infer` of the schema of the same name; a guard is\n  `safeParse(value).success`. No hand-written `isRecord` / `isNonEmptyString` guards anywhere: a\n  consumer that must check a shape builds a schema from the contract's.\n- **A folder names a side or a role (A-27).** Channel: two files, no folder; extension:\n  `commands/`, `events/`, `ohif/`; application: the conventional React layout — `components/`,\n  `pages/`, `hooks/`, `models/` (the row, A-36), `state/` (reducer, selectors, actions), `services/` (storage),\n  `utils/` (format, totals); `hooks/` holds `useScoringForm` and `useStoredRows` (A-37). No file under twenty lines (a constant, a type or a one-function module joins its owner), except a\n  package `index.ts`, `main.tsx`, a component's `.props.ts` and a file the standard layout names\n  (`state/selectors.ts`, a page; A-33, A-34). Tests move with the code they test.\n- **No code for a caller that does not exist.** A default every caller overrides, an export only a\n  test imports, a counter nothing displays and a branch a guard upstream makes unreachable are\n  removed, not kept \"for later\"; a one-line function that only renames an expression is inlined.\n\n## 6. React\n\n- Function components as arrows, props typed with an interface, explicit `JSX.Element` return type\n  on exported components.\n- State: `useReducer` for multi-field state with transitions (rows), `useState` for independent\n  scalars. Reducers are pure and return the same reference when nothing changes.\n- Effects: every subscription, listener or timer created in an effect is removed in its cleanup\n  (Q-5). Effect dependency arrays are complete (`react-hooks/exhaustive-deps` is an error, not a\n  warning). Helpers used inside an effect live inside it or are stable (`useCallback`, module scope).\n- No context providers until two unrelated subtrees need the same state; prop drilling two levels\n  is fine.\n- **A component always has a sibling `{Name}.props.ts`** holding its props, its other types and its\n  `styles`; the `.tsx` keeps only rendering. **No other module has one** (A-27): a module's types\n  live in the module, beside the code that uses them (`FormAction` is in `state/reducer.ts`; the row itself —\n  `Row`, `RowStatus` and `RowModel`, its API as one named object — is the model in `models/row.ts`, A-36). An `enum` is a value rather than a type and\n  stays with its code.\n\n  ```ts\n  // MeasurementRow.props.ts\n  import type { CSSProperties } from 'react';\n  import type { Row } from '@app/state/reducer';\n\n  export interface MeasurementRowProps {\n    row: Row;\n    index: number;\n    onActivate: (rowId: string) => void;\n  }\n\n  export const styles = {\n    row: { display: 'flex', gap: '8px' },\n    status: { color: '#666' },\n  } satisfies Record<string, CSSProperties>;\n  ```\n\n  ```tsx\n  // MeasurementRow.tsx\n  import { styles, type MeasurementRowProps } from './MeasurementRow.props';\n\n  export const MeasurementRow = ({ row, index, onActivate }: MeasurementRowProps): JSX.Element => (\n    <div style={styles.row}>…<\/div>\n  );\n  ```\n\n- No inline style object literals in JSX (`style={{ … }}`); reference `styles.<key>` from the\n  `.props.ts` file (lint rule). A style that depends on state is a small function in the same file,\n  e.g. `rowStyle(focusable)` returning `styles.row` merged with `styles.rowClickable`. A component without props or styles does not need the file.\n- Types shared by several modules live with the module that owns them (e.g. `Row` in\n  `models/row.ts`) and are imported from there rather than copied.\n- No function is created inside the `return` statement. Every function a component renders with is\n  declared in the component body with a name, above the `return`, and the returned JSX mentions it\n  by that name. The one exception is the callback of a list render, `rows.map(...)`, because\n  extracting it would mean inventing a component for every list.\n- No functions are created inside JSX event handler props. `onClick`, `onKeyDown`, `onChange` and\n  every other `on…` prop receives a named `handleX` arrow declared in the component body (or a\n  prop passed in), never an inline arrow, function expression or `.bind` call (lint rule). When a\n  handler needs a value the component already has, that value is read inside the handler; when a\n  list renders one component per item, the handler lives in that item component, which is why\n  `MeasurementRow` owns its own `handleActivate`, `handleCancel` and `handleRemove`.\n- User-visible strings come from `i18n.ts` (A-7); no literals in JSX.\n\n## 7. Errors, logging and defensive code\n\n- Validate every external input at the boundary (`postMessage` payloads through the contract\n  schemas; `sessionStorage` through the stored-row schema; OHIF measurement objects through\n  `toMetrics`). Inside the boundary, trust the types.\n- Ignored input is logged once with a reason at the level that matches its severity:\n  `console.debug` for expected noise (foreign origins, mid-drag frames), `console.info` for\n  intentional no-ops, `console.warn` for something a developer should look at, `console.error`\n  for broken invariants. `console.log` is not used (lint rule).\n- No silent `catch {}`; a swallowed error is logged with context.\n- No `!` non-null assertions; narrow explicitly.\n\n## 8. Comments\n\n- **No comments in the packages** (A-24, author's decision 2026-09-22). Names, small functions and\n  types carry the meaning; a comment loads the reader and gets in the way of remembering the code.\n  What the code cannot say — the reason for a call, the OHIF or cornerstone `file:line` that\n  justifies it, the decision behind it — lives in `docs/notes/viewer-internals.md` and\n  `docs/decisions/`, where it is read on purpose rather than skipped over. The one exception is\n  a directive the tooling needs (`eslint-disable`, `@ts-expect-error`, the DefinePlugin note above\n  `declare const process`), kept to one line.\n- In the application the same rule applies (since 2026-09-23 the form's code carries none either): what its\n  code cannot say lives in `docs/notes/form-internals.md`; a component's `.props.ts` needs no explanation of\n  its own props.\n- No commented-out code, no TODO without an owner and a follow-up entry in `docs/STATE.md`.\n- English only; no mention of AI tools anywhere in code (AI usage is documented in `AI-USAGE.md`).\n\n## 9. Tests\n\n- Test files live in a `__tests__/` folder inside the folder of the code they test:\n  `host-app/src/state/__tests__/reducer.test.ts` tests `host-app/src/state/reducer.ts` and imports it as\n  `@app/state/reducer`. One test file per module under test; shared test helpers go to\n  `__tests__/helpers.ts` in the same folder.\n\n- Vitest. Targeted tests only (X-4): pure logic (reducers, totals, throttle, contract schemas) and\n  the bridge client behaviour. No snapshot tests, no tests of styling.\n- Test names read as behaviour: `it('queues a command sent before VIEWER_READY and flushes it in order')`.\n- Arrange / act / assert with blank lines between; one behaviour per test; assert on state or on\n  calls (`vi.fn()`), not on implementation details.\n- Reference equality (`toBe`) is used to assert \"nothing changed\" in reducers.\n- A bug fix comes with the test that would have caught it.\n\n## 10. Verification\n\nEvery rule here was written after something in this repository broke in exactly the way it\ndescribes. The cause is kept in the text, because a rule whose reason is forgotten is the first one\nsomebody deletes.\n\n- **Green on a warm tree is not green.** Before a slice is presented, the verification runs from a\n  cold state: every package's build output and every `node_modules` deleted, then a clean install.\n  Two slices passed locally and failed on a fresh machine, once because test tooling sat where only\n  one workspace could see it, once because the packages built in whatever order the package manager\n  chose.\n- **Run on the version in `.nvmrc`, and say which version ran.** A suite that dies inside jsdom on a\n  different Node version has told you nothing about the change.\n- **Prove, do not assert.** A claim that a type check is exhaustive, that a lint rule fires, or that\n  a published surface is unchanged is shown with its artefact: the compiler error, a probe file and\n  its output, the compared list of exported names. The probe is deleted afterwards and the deletion\n  is stated.\n- **Nothing rides along.** A change in the working tree that the brief did not ask for is reported\n  and reverted, not committed with the slice.\n- **A rule lives only as long as its reason.** When the cause of a constraint disappears, the\n  constraint is revisited in the slice that removes the cause. The contract stayed one 345-line file\n  for three slices after the copy that required it was gone.\n- **A folder excluded from the build needs a project of its own.** A package's tests are kept out of\n  its build so they cannot reach `dist`, and that exclusion also takes them out of every type-aware\n  check: for a while the packages' tests were neither type-checked nor linted with types, and\n  nothing said so. Each package therefore carries a second TypeScript project that includes its\n  tests, and the lint configuration points at it.\n- **Under `set -e`, a non-zero status that means something is captured, not assumed.** A workflow\n  step runs with `bash -e`, so `value=$(fn)` aborts the whole script when `fn` returns non-zero as a\n  normal signal, and the line that reads `$?` never runs. Write `value=$(fn) || status=$?`. This\n  shipped: the publish run died the first time a package legitimately had nothing to release, and\n  the packages after it were never considered.\n- **A list of packages is a trap; use a pattern.** Wherever tooling enumerates the packages, a new\n  one is forgotten and nothing fails: three times in a row a package was merged with tests no\n  command collected. Where the tool allows a glob, it gets one.\n- **An instruction that names a command must name the one that works.** Ours told the agents to\n  start the viewer the way it was started before it needed configuration; that way it comes up with\n  no host origin, refuses to bridge and never shakes hands, and the run looks like a broken\n  application rather than a wrong command. When a script replaces a raw command, every instruction\n  that quoted the raw one changes in the same slice.\n- **A test that no command runs does not exist.** New tests are added to what `npm run test`\n  actually collects, and the case count is reported before and after, so the increase is visible\n  rather than assumed.\n- **Every fix leaves a rule behind.** The slice that fixes something also writes the general rule\n  here or in the matching file under `.claude/`, naming the failure in one clause. A fix that leaves\n  no rule behind gets made again.\n\n## 11. Publishing\n\n- **A published version is that content for ever, so a number is never reused.** Skipping a release\n  because the version already exists is right only when what is there is what we would publish. A\n  number left over from an earlier mechanism was reused for different content: the release was\n  skipped, and three packages shipped pinned to a contract that did not contain what they imported.\n  Before skipping, the run compares what it would publish against what the registry serves, and\n  fails loudly when they differ.\n- **A version lives in the manifest, not in the release run.** The slice that changes a package\n  raises that package's version, and the workflow publishes exactly that version and skips when it\n  already exists. A version computed at release time cannot be named by anything that depends on\n  it, which is how an adapter came to pin a version of its own dependency that predated the types\n  it imported.\n- **A workspace link hides version skew, so an internal pin is verified against the registry.** Here\n  a sibling package is symlinked and compiles against the working tree, no matter what version the\n  manifest names. Before pinning, fetch the published tarball of that exact version and check that\n  what the dependent imports is really in it.\n- **The browser scenario runs on the working tree before anything is published.** `npm run\nviewer:link` swaps the fork's installed copies of our packages for symlinks to `packages/*`; the\n  scenario passes there first, then the release is cut and pinned. A version is never published to\n  find out whether it works.\n- **The dependency is published before the dependent.** A package pinned at an exact version cannot\n  be released in the same step as the thing that pins it.\n- **A new package is added to the publish workflow in the slice that creates it.** The workflow\n  names its packages one by one; a package missing from that list is built, tested and merged while\n  never reaching the registry, and nothing says so until something tries to install it.\n- **Only a package that changed is released.** A run that bumps every package produces empty\n  versions and makes the version number stop meaning anything.\n- **The version is never committed back to `main`**, because direct commits there are forbidden; it\n  is derived in the workflow and used for the publish only.\n\n## 12. Git and review\n\n- Conventional Commits, English, no trailers, no AI mentions (CLAUDE.md §4).\n- Generated files are never edited by hand and are committed with their source in the same commit:\n  `docs/FEATURE-GRAPH.md` from `docs/feature-graph.json` (`npm run graph:build`),\n  `docs/site/index.html` (`npm run docs:build`). CI fails when either is stale.\n- A PR is one slice; its description follows the template in CLAUDE.md and cites canon IDs.\n- `npm run lint`, `npm run format:check`, `npm run typecheck`, `npm run test`, `npm run check:graph`\n  all pass before gate 2. A PR that changes docs also runs\n  `npm run docs:build` and commits the result.\n\n## 13. The OHIF fork\n\n- No code of ours lives there. The fork registers one package, the adapter\n  `@bdiadiun/ohif-extension-loader`, which registers our extensions itself; the bridge\n  arrives as its dependency. The fork carries that entry, the matching dependency and its workflow,\n  and nothing else (A-20). Adding a capability is a change to the adapter, not to the fork.\n- We never describe OHIF's types, we describe the members we call, in the package's own\n  `ohif.ts`. No `any` for an OHIF object: the narrowest structural type that covers what we\n  actually use. Because that model replaces the compiler's knowledge of OHIF, a drift from the real\n  API cannot be caught by a type check; building the viewer and running the browser scenario is how\n  it is caught, and both belong to any slice that touches this code.\n- Command names are prefixed per package. OHIF namespaces module ids by extension but not command\n  names, so an unprefixed name silently replaces another extension's command.\n"},{"path":"CLAUDE.md","title":"Working rules","group":"Process","md":"# CLAUDE.md — working rules for this repository\n\nTest assignment: a micro-frontend \"Viewer + Scoring Form\" — an OHIF Viewer (fork + our own bridge\nextension) and a host-app (React + TypeScript, Vite) that communicate via `window.postMessage`\nwhile served from different ports.\n\n## 0. Roles, models, and language\n\n- **Assistant role: architect.** The main session (Claude Fable) owns planning, the canon, the feature\n  graph, slice gates, and review of every line produced by subagents. It does not write production\n  code or tests itself unless a change is trivial (a few lines) and reviewed inline.\n- **Subagents do the implementation.** Development and test-writing are delegated to subagents.\n  Subagents that write code or tests **must not run on Fable**; use a lower tier (Opus, or Sonnet\n  for narrow, well-specified tasks). Each subagent gets a self-contained brief: canon IDs, graph\n  nodes, files in scope, constraints from this file, and the verification commands to run.\n- **Roles are defined in [`.claude/agents/`](.claude/agents/):** `architect` (planning, docs,\n  review), `developer` (implementation), `tester` (tests and verification), `researcher`\n  (read-only investigation with citations), `git-operator` (commit / PR / merge after approval).\n  Each file fixes the model, the tools and the prompt; briefs are written for one of these roles.\n- **Each role writes only its own kind of file.** The developer changes application code and never\n  a test; the tester changes tests and never application code; the architect writes documentation\n  and process files and neither of the other two; the researcher writes one note; the git operator writes\n  only the continuous-integration workflows. Every agent definition states its own boundary.\n- **Folder layout is defined in [`docs/PROJECT-STRUCTURE.md`](docs/PROJECT-STRUCTURE.md)**, which\n  also documents what the `.claude/` folder holds and which parts of the popular template are not\n  real features.\n- **Code style is defined in [`docs/CONVENTIONS.md`](docs/CONVENTIONS.md)** (decision A-13) and\n  enforced by `npm run lint` and `npm run format:check`; both must be green before gate 2.\n- **Architect verifies subagent output** before presenting a slice result: reads the diff, runs\n  lint / typecheck / tests, and checks traceability to the canon. Subagent output is never\n  forwarded to the user unreviewed.\n- **Language policy:**\n  - Chat replies to the user — **Ukrainian**.\n  - Everything that lives in the repository or on GitHub — **English**: this file, docs\n    (`CANON.md`, `FEATURE-GRAPH.md`, `README.md`, `ARCHITECTURE.md`, `AI-USAGE.md`), code,\n    comments, commit messages, branch names, PR titles and descriptions.\n  - The original assignment text is quoted in the canon verbatim in its source language; the\n    atomic requirements derived from it are written in English.\n\n## 1. Canon\n\n- **The canon** is the single source of truth for requirements: [docs/CANON.md](docs/CANON.md).\n- The canon contains the assignment text split into atomic requirements with immutable IDs:\n  - `C-<section>.<item>` — mandatory requirements (e.g. `C-4.3.5` — \"the viewer sends the area\n    together with an identifier\");\n  - `Q-<n>` — quality requirements from section 5 (handshake, origin, correlation, echo loop,\n    cleanup, units, types);\n  - `S-5.x` — bonus (\"star\") tasks;\n  - `D-<n>` — deliverables (README, ARCHITECTURE, AI-USAGE, PRs, video);\n  - `X-<n>` — explicit prohibitions from section 8 (\"what not to do\").\n- The canon is **never edited silently**. Any change (resolving an ambiguity, an own decision) is a\n  separate entry in the \"Decisions on ambiguities\" section, dated and justified, and only after\n  user approval.\n- Decisions made on top of the canon are duplicated in the \"Decisions\" section of `ARCHITECTURE.md`.\n- Code that does not trace to a canon requirement is not written. If something is needed and the\n  canon lacks it, propose a canon amendment first.\n\n## 2. Feature graph\n\n- The feature graph's source of truth: [docs/feature-graph.json](docs/feature-graph.json). It\n  **derives from the canon** and does not exist without it.\n- [docs/FEATURE-GRAPH.md](docs/FEATURE-GRAPH.md) (tables, per-node details, Mermaid diagram) is\n  generated from the JSON by `npm run graph:build` and is never edited by hand. Change nodes and\n  statuses in the JSON, then run `npm run graph:build` and commit both files.\n- Every node `F-<nn>` contains:\n  - `name` and `description`;\n  - `canon` — list of requirement IDs it closes (mandatory, non-empty);\n  - `dependsOn` — nodes it depends on;\n  - `slice` — the slice / PR in which it is implemented;\n  - `status` — `planned` → `approved` → `in-progress` → `review` → `done`;\n  - `verify` — how to verify (manual scenario and/or tests);\n  - `files` — the repository files that implement it; `imports` of those files is generated.\n- The generated Markdown includes the Mermaid diagram; `npm run check:graph` fails when it is stale.\n- Invariants checked before every slice:\n  - every mandatory requirement `C-*`, `Q-*`, `D-*` is covered by at least one node;\n  - the graph has no cycles;\n  - a node is not started until all of its `depends_on` are `done`;\n  - bonus `S-*` nodes are planned only after the mandatory part is `done`.\n- Statuses in the graph are updated in the same slice where the work changes.\n\n- **Documentation moves with the code.** A slice that changes behaviour updates, in the same commit,\n  every document that described the old behaviour: the canon when a requirement is affected,\n  `ARCHITECTURE.md`, `README.md`, `docs/CONVENTIONS.md`, `docs/DEFENCE.md`, the node's `files` array\n  and any decision record. Implementation agents do not write documentation; they report what their\n  change invalidated and the architect writes it. Gate 2 does not pass while a document still\n  describes the previous state.\n\n## 3. Working in slices (mandatory)\n\nThe assignment is split into **slices** (vertical, self-contained, each = one branch = one PR).\nEvery slice passes through **user approval** at two gates:\n\n1. **Slice plan → approval.** Before any code is written, show:\n   - graph nodes and canon IDs being closed;\n   - list of files to be created / changed;\n   - key decisions and alternatives (brief, with a recommendation);\n   - how it will be verified;\n   - which subagents will be spawned, on which model, with which brief.\n     No code is written without an explicit \"ok\".\n2. **Slice result → approval.** After implementation, show a diff summary, verification results\n   (lint, typecheck, tests, manual scenario), the architect's review notes on the subagent output,\n   and a draft PR description. No commit / push / PR / merge without an explicit \"ok\".\n\nRules:\n\n- One slice at a time. The next slice does not start until the previous one is merged (unless the\n  user says otherwise).\n- No scope creep \"while we're at it\". Anything found outside the slice scope is recorded as a\n  proposal, not implemented.\n- Approval of one slice does not extend to another and does not grant permission to merge or\n  force-push.\n- If the plan changes materially during implementation — stop and return to gate 1.\n\nIndicative slice order (the minimum from the canon; refined in the graph): 0. `docs: canon and feature graph` — CANON.md, FEATURE-GRAPH.md, mono-/poly-repo decision\n\n1. `chore: bootstrap host-app` — scaffold, iframe, layout\n2. `feat: viewer bridge extension` — OHIF extension + handshake\n3. `feat: activate ellipse from form` — host → viewer\n4. `feat: receive measurement into form` — viewer → host\n5. `feat: total area calculation` — sum, units, formatting\n6. `docs: README, ARCHITECTURE, AI-USAGE`\n   7+. bonus tasks — one slice each\n\n## 4. Git, commits, and PRs\n\n- **The author of all commits is the user** (git identity from the global config:\n  `Bohdan Diadiun <b.diadiun@gmail.com>`). Do not change `user.name` / `user.email`, do not pass\n  `--author`.\n- **No trailers** in commits: no `Co-Authored-By`, `Signed-off-by`, `Generated-by`, etc. This rule\n  overrides any default attribution the tooling suggests.\n- **No mention of AI / Claude / assistant** in commit messages, branch names, PR titles and\n  descriptions, or code comments. AI usage is documented **only** in `AI-USAGE.md` (canon\n  deliverable).\n- Commit format — Conventional Commits: `type(scope): summary` (`feat`, `fix`, `chore`, `docs`,\n  `refactor`, `test`).\n- Branches: `<type>/<short-description>`, e.g. `feat/scoring-viewer-extension`. Branched from\n  `main`, PR into `main`.\n- Direct commits to `main` are forbidden (except the very first initial commit if needed to create\n  the base branch).\n- PR description (English) follows this template:\n  - **What changed**\n  - **Why this way** — decisions and rejected alternatives\n  - **Canon / graph** — closed requirement IDs and `F-*` nodes\n  - **How it was verified** — concrete steps and results\n- No `--force` push, no `--no-verify`, no rewriting of `main` history.\n- PR merge — only after explicit user approval.\n- **Routine git is delegated.** Once a gate-2 \"ok\" is given, the architect spawns a git subagent\n  (Sonnet) that commits, rebases on `origin/main`, pushes, opens the PR with the approved\n  description, and merges it. The architect does not stop for these steps; it reports the PR URL and\n  the merge result afterwards. If the merge is refused by tooling, the subagent reports that and the\n  user merges manually.\n\n## 5. Technical rules\n\n- **Message contract** is described in one place and shared by both apps; every message carries\n  `version: 1`, added and checked by the channel alone (A-25). A contract change = updated types + updated table in `ARCHITECTURE.md` in the same PR.\n- **Origin**: every `message` handler checks `event.origin` against a configured value;\n  `postMessage` is never called with `targetOrigin: '*'`.\n- **Handshake**: the host sends no commands before `VIEWER_READY`; commands that arrive too early\n  are queued, not dropped.\n- **ID correlation**, **echo-loop protection**, **unit handling (mm² vs px²)** are deliberate\n  decisions, recorded in `ARCHITECTURE.md` before or together with the implementation.\n- **Cleanup**: every subscription / `addEventListener` has a paired unsubscribe in the same\n  effect; an armed tool state never outlives its owner (the page's channel, the bridge's effect —\n  A-31, A-32).\n- TypeScript in `strict` mode; no `any` without a justifying comment. Style, naming, enums and\n  function conventions: `docs/CONVENTIONS.md`.\n- Changes in the OHIF fork are minimal and concentrated in our extension; the OHIF UI is not reworked.\n- Tests are targeted: the sum logic and message serialisation / validation.\n- Every line of code must be explainable at the defence: no \"magic\" we cannot justify.\n\n## 6. Session start, context discipline, subagent briefs\n\n### Session start\n\n1. Read this file, then [docs/STATE.md](docs/STATE.md), then only the nodes of\n   [docs/feature-graph.json](docs/feature-graph.json) for the current slice.\n2. Run `npm run check:graph`.\n3. Continue from the gate recorded in `STATE.md`. Decisions already in `docs/decisions/` are not\n   re-derived.\n\n### Context discipline\n\n- One session = one slice. `STATE.md` is updated in the same commit as the work, so a fresh session\n  can resume after a context reset.\n- Never read the OHIF fork (`viewer/`) wholesale. Look things up with an Explore subagent and record\n  the answer (file, symbol, ~30 lines of conclusion) in `docs/notes/ohif-<topic>.md`; later sessions\n  read the note, not the source.\n- Subagent reports are capped at ~40 lines: what changed, verification output, open questions.\n  No transcripts, no file dumps.\n- Large command output goes to a file in the scratchpad and is summarised, not pasted.\n\n### Agent instances and handover\n\n- **One role, one instance at a time.** A slice runs at most one developer, one tester, one\n  researcher and one git operator. Two instances of the same role never write the same files.\n- **No agent spawns its own role.** Only the architect delegates, and never to another architect;\n  of the five definitions only `architect` has the `Agent` tool.\n- **Continue an instance instead of re-creating it.** More work for a role that is already running\n  is sent to that instance so its context stays intact; a fresh call starts from nothing.\n- **A full context is handed over, not lost.** An agent running out of room stops, writes a\n  handover note to the session scratchpad, and reports its path; the architect then starts a\n  successor of the same role from that note. The procedure for both sides is\n  [`.claude/skills/handover/SKILL.md`](.claude/skills/handover/SKILL.md).\n\n### Subagent brief template\n\nEvery implementation / test / git subagent receives a self-contained brief with these sections:\n\n```\nRole: <developer | test writer | git operator>   Model: <opus | sonnet>\nRepository: <path>; branch: <name>; do not run git unless you are the git operator.\nRead first: CLAUDE.md (follow it), docs/CONVENTIONS.md, then <exact files>.\nHandover note to continue from (if any): <path>.\nScope: closes <F-nn> / canon <IDs>. Files you may create or modify: <list>. Nothing else.\nConstraints: English only; no AI mentions; TypeScript strict; no new dependencies unless listed: <list>.\nDecisions already made (do not revisit): <A-n summaries or links>.\nVerification you must run and paste: <commands>.\nReport (max 40 lines): files changed, verification output, deviations from the brief, open questions.\n```\n"},{"path":"docs/decisions/A-1-mono-repo-with-submodule.md","title":"A-1 · mono repo with submodule","group":"Decisions","md":"# A-1 — Mono-repo with the OHIF fork as a git submodule\n\nStatus: approved 2026-09-16; the submodule part is superseded by\n[A-18](A-18-viewer-checked-out-not-vendored.md) on 2026-09-20, which makes `viewer/` a pinned\nlocal checkout instead. The mono-repo itself still holds. Canon: D-1, C-4.1.1.\n\n## Context\n\nThe assignment allows either two repositories or a mono-repo and asks for the choice to be explained.\nThe message contract (C-4.4) is shared by both sides; a change to it touches the host-app and the\nviewer extension at the same time.\n\n## Decision\n\nThis repository is the mono-repo: `host-app/` lives here, and the OHIF fork\n(https://github.com/bdiadiun/Viewers) is mounted as a git submodule at `viewer/`, pinned to a commit\non our fork branch. The bridge extension lives inside the fork under `extensions/`.\n\n## Rejected alternatives\n\n- Two independent repositories: every contract change needs two PRs and a manual version dance;\n  the \"history of thinking\" (D-4) is split.\n- Vendoring the OHIF source into this repo: hundreds of megabytes, loses the upstream link and the\n  ability to show the fork diff.\n\n## Consequences\n\n- `README.md` must document `git clone --recurse-submodules` (D-5).\n- A change in the extension is two commits: one in the fork (own PR there), one bumping the\n  submodule pointer here. A contract change is therefore never a single PR; the main-repo PR links\n  the fork PR; the shared contract is a published package, not a copy (A-15).\n- What the mono-repo buys, stated honestly (re-confirmed 2026-09-16): one clone with the viewer\n  pinned to the exact tested commit; the contract as a real package for host-app; canon, graph,\n  ARCHITECTURE and decisions in one place. It does not buy atomic cross-repo changes.\n"},{"path":"docs/decisions/A-2-ports.md","title":"A-2 · ports","group":"Decisions","md":"# A-2 — Fixed ports 5173 (host-app) and 3000 (viewer)\n\nStatus: approved 2026-09-16; amended 2026-09-21 by\n[A-20](A-20-three-layers.md): the viewer no longer carries the host origin in its own source. It is\na published package now, so the origin arrives from the deployment's configuration and the bridge\nrefuses to start without one rather than accepting any page. Canon: C-4.2.3, Q-2.\n\n## Context\n\nThe two apps must run on different ports (C-4.2.3) and each side must check `event.origin`\nagainst a configured value (Q-2).\n\n## Decision\n\nhost-app runs on `http://localhost:5173`, the viewer on `http://localhost:3000`. Both values are\nconstants in each app's config and are the only accepted origins.\n\n## Rejected alternatives\n\n- Reading the origin from the incoming message: defeats the purpose of the check.\n- Environment-driven ports: extra setup on the reviewer's machine for no benefit in this assignment.\n\n## Consequences\n\n- The README \"clean machine\" run uses exactly these ports; a port clash is documented as a known issue.\n"},{"path":"docs/decisions/A-3-defence-readiness-ids.md","title":"A-3 · defence readiness ids","group":"Decisions","md":"# A-3 — `P-*` ID class for defence-readiness items\n\nStatus: approved 2026-09-16. Canon: section 9.\n\n## Context\n\nSection 9 of the assignment lists questions and live changes for the defence call. They are not\nrequirements, but they constrain design: a tool swap (P-7) or a new row field (P-8) must be cheap.\n\n## Decision\n\nSection 9 items get IDs `P-1..P-9`. Graph nodes may reference them in addition to (never instead of)\na `C/Q/D` ID.\n\n## Rejected alternatives\n\n- Leaving them as prose: the design implications would not be traceable to code.\n\n## Consequences\n\n- `docs/DEFENCE.md` (slice 6) maps every `P-n` to a file and line.\n"},{"path":"docs/decisions/A-4-cancelled-activation.md","title":"A-4 · cancelled activation","group":"Decisions","md":"# A-4 — Cancelled activation keeps the row in `Pending`\n\nStatus: approved 2026-09-16. Canon: C-4.3.3, C-4.4.1, D-8 (d).\n\n## Context\n\nThe assignment defines `DEACTIVATE_TOOL` (\"cancel waiting for drawing\") and requires the demo to\nshow \"Activate clicked, then changed mind\", but does not say what happens to the row.\n\n## Decision\n\nCancelling sends `DEACTIVATE_TOOL` for that row; the viewer returns to the default tool; the row\nreturns from `Drawing…` to `Pending` and is kept, so it can be activated again or deleted.\n\n## Rejected alternatives\n\n- Deleting the row on cancel: surprising, and loses the row's identity.\n- Leaving the row in `Drawing…`: the form and the viewer would disagree on the armed state.\n\n## Consequences\n\n- Only one row can be in `Drawing…` at a time; activating another row cancels the previous one.\n"},{"path":"docs/decisions/A-5-deferred-bridge-decisions.md","title":"A-5 · deferred bridge decisions","group":"Decisions","md":"# A-5 — Bridge decisions are taken in the slice that implements them\n\nStatus: resolved 2026-09-16 by A-8..A-11 (grounded in docs/notes/ohif-bridge-api.md). Canon: Q-1, Q-3, Q-4, Q-6.\n\n## Context\n\nID issuance (Q-3), the early-command queue (Q-1), echo-loop protection (Q-4) and mixed-unit sums\n(Q-6) depend on the real `measurementService` API of the chosen OHIF version.\n\n## Decision\n\nEach is decided in its implementing slice, gets its own `A-n` record and a row in\n`ARCHITECTURE.md` → \"Decisions\" in the same PR. Until then the canon marks them open.\n\n## Consequences\n\n- Slice 2 planning starts with an OHIF research note (`docs/notes/ohif-*.md`) that grounds these decisions.\n"},{"path":"docs/decisions/A-6-ohif-base-version.md","title":"A-6 · ohif base version","group":"Decisions","md":"# A-6 — OHIF fork branch based on release tag `v3.12.17`\n\nStatus: approved 2026-09-16. Canon: C-4.1.1, D-5.\n\n## Context\n\nUpstream `master` (3.14.0-beta) requires Node >= 24 and pnpm 11. The latest stable release\n`v3.12.17` (2026-09-10) requires Node >= 18 and yarn 1.22. The development machine has Node 22.\n\n## Decision\n\nOur fork branch is created from tag `v3.12.17`. The bridge extension targets that API.\nNode is pinned via `.nvmrc` (22) at the repository root; yarn 1 is enabled through corepack.\n\n## Rejected alternatives\n\n- Tracking `master`: moving target, forces a Node/pnpm upgrade on every reviewer's machine.\n\n## Consequences\n\n- The README lists Node 22 and corepack as the only prerequisites.\n- Upgrading OHIF later is a deliberate decision, not a side effect of `git pull`.\n"},{"path":"docs/decisions/A-7-ui-language.md","title":"A-7 · ui language","group":"Decisions","md":"# A-7 — Form UI strings are Ukrainian, code stays English\n\nStatus: approved 2026-09-16. Canon: C-4.3.1–C-4.3.8, X-3.\n\n## Context\n\nThe assignment and its diagram show Ukrainian labels (\"Додати вимірювання\", \"Активувати\",\n\"Очікує / Малювання… / Готово\", \"Разом\"). Repository rules require English code and docs.\n\n## Decision\n\nAll user-visible strings live in `host-app/src/i18n.ts` in Ukrainian, with English\ncomments. Components reference keys, never literals. Everything else in the repository is English.\n\n## Rejected alternatives\n\n- English UI: the demo video and the screen would differ from what the reviewer expects.\n- A full i18n library: out of scope (X-3), one constants file is enough.\n\n## Consequences\n\n- Translating or renaming a label is a one-file change.\n"},{"path":"docs/decisions/A-8-id-correlation.md","title":"A-8 · id correlation","group":"Decisions","md":"# A-8 — ID correlation: host issues `rowId`, viewer issues `measurementUid`\n\n> Narrowed by [A-30](A-30-no-request-answer.md): the only correlation is `rowId` ↔ `measurementUid`, carried together by `MEASUREMENT_ADDED`; there is no `requestId`.\n\nStatus: approved 2026-09-16. Canon: Q-3, C-4.3.5, C-4.3.6, P-3.\n\n## Context\n\nEach form row and each annotation need an identifier, and the assignment asks who issues which.\nOHIF facts (see `docs/notes/ohif-bridge-api.md`): a measurement's `uid` is the cornerstone\n`annotationUID`, stable across ADDED / UPDATED / REMOVED; `_isValidMeasurement` rejects any\ncustom top-level field, so an external ID cannot be stored on the measurement; `label` is\nuser-editable in the OHIF panel.\n\n## Decision\n\n- The host creates a row with a UUID `rowId` before anything is drawn (needed for C-4.3.2).\n- `ACTIVATE_TOOL { rowId, toolName }` arms the bridge: `pendingRowId = rowId`.\n- On `MEASUREMENT_ADDED` from OHIF the bridge emits `{ rowId: pendingRowId, measurementUid: uid, ... }`,\n  stores `uid → rowId` in its own map, and clears `pendingRowId`.\n- `MEASUREMENT_UPDATED` / `MEASUREMENT_REMOVED` carry `measurementUid`. The viewer resolves the row\n  through its `uid → rowId` map (OHIF's `MEASUREMENT_REMOVED` delivers only the uid string). The\n  host needs no separate map: each `done` row stores its own `measurementUid`.\n- A measurement created while nothing is armed (drawn from the OHIF toolbar) is forwarded with\n  `rowId: null`; the host logs and ignores it.\n- Before activating a tool the bridge snapshots the active primary tool\n  (`toolGroupService.getActivePrimaryMouseButtonTool()`) and restores it after the measurement or\n  on `DEACTIVATE_TOOL`. In the longitudinal mode that tool is WindowLevel; the assignment's\n  \"Pan/default\" is read as \"whatever was active before\".\n\n## Rejected alternatives\n\n- Viewer issues the row ID: the form could not show an empty `Pending` row before drawing.\n- Host issues the measurement UID: requires reaching into the cornerstone annotation manager and\n  fighting `_isValidMeasurement`; brittle across OHIF upgrades.\n- Carrying `rowId` in `label`: survives validation but the user can edit it in the OHIF panel.\n\n## Consequences\n\n- Only one row can be armed at a time; arming another row cancels the previous one (A-4).\n- If the decision were flipped (P-3), C-4.3.2 breaks and the bridge would need write access to\n  cornerstone internals.\n"},{"path":"docs/decisions/A-9-handshake-and-queue.md","title":"A-9 · handshake and queue","group":"Decisions","md":"# A-9 — Handshake: `ready` flag and an uncoalesced FIFO command queue\n\nStatus: approved 2026-09-16. Canon: Q-1, C-4.4.1, P-1, P-9.\n\n## Context\n\nThe host must not send commands before `VIEWER_READY`, and a click during iframe load must not be lost.\n\n## Decision\n\n- The host bridge client keeps `ready: boolean` and `queue: HostCommand[]`.\n- `send(cmd)`: if not ready, push to the queue; else `postMessage` to the iframe's `contentWindow`\n  with `targetOrigin = VIEWER_ORIGIN`.\n- On `VIEWER_READY`: set `ready`, flush the queue in order. No coalescing (an ACTIVATE followed by a\n  DEACTIVATE for the same row are both sent; the viewer ends in the right state anyway).\n- A second `VIEWER_READY` (iframe reload) resets `ready`, then re-sends `ACTIVATE_TOOL` for the row\n  currently in `Drawing…`, if any.\n- Bridge state (`ready`, queue length, last message) is exposed for a small dev status line, so a\n  missing `VIEWER_READY` is diagnosable on screen (P-9).\n\n## Rejected alternatives\n\n- Dropping early commands: violates Q-1.\n- Polling the iframe until it answers: extra protocol for no gain.\n- Smart queue coalescing: more code paths to defend, no user-visible benefit.\n\n## Consequences\n\n- The queue is the answer to P-1; the dev status line is the answer to P-9.\n"},{"path":"docs/decisions/A-10-echo-guard.md","title":"A-10 · echo guard","group":"Decisions","md":"# A-10 — Echo-loop protection\n\n> Superseded by [A-30](A-30-no-request-answer.md): the echo guard is a rule on each side (the form never sends in reaction to an event; the extension never sends in reaction to a command), not `requestId` → `causedBy`.\n\nStatus: approved 2026-09-16. Canon: Q-4, P-6.\n\n## Context\n\n`measurementService.update(...)` and `remove(...)` re-broadcast `MEASUREMENT_UPDATED` / `REMOVED`.\nIf the host reacts to those by sending a command that triggers the same service call, the two apps\nping-pong forever.\n\n## Decision\n\n- Mandatory part: the host never sends a command in reaction to a `MEASUREMENT_*` event. No loop by\n  construction.\n- Bonus tasks (S-5.1, S-5.2): every host command carries a `requestId`; when the bridge executes a\n  command that provokes a service event, the outgoing event carries `causedBy: requestId`. The host\n  ignores events whose `causedBy` it issued. Additionally, commands are idempotent: the host does not\n  send a command when its state already matches (e.g. a row already cleared is not deleted again).\n- `MEASUREMENT_UPDATED` is throttled on the viewer side (it fires per drag frame).\n\n## Rejected alternatives\n\n- Suppressing events by a global \"muted\" flag: races with genuine user edits during the window.\n\n## Consequences\n\n- The loop point to show at the defence (P-6) is the bridge handler for `DEACTIVATE_TOOL`/delete\n  and the `MEASUREMENT_REMOVED` subscriber.\n"},{"path":"docs/decisions/A-11-units-and-metrics-payload.md","title":"A-11 · units and metrics payload","group":"Decisions","md":"# A-11 — Units copied from OHIF; extensible `metrics` payload; per-unit sums\n\nStatus: approved 2026-09-16. Canon: Q-6, C-4.3.8, C-4.4.2, P-8.\n\n## Context\n\nArea arrives in mm² when the image has pixel spacing and in px² otherwise. OHIF exposes it as\n`measurement.data[targetId].area` with `areaUnit` computed by cornerstone3D.\n\n## Decision\n\n- The bridge copies `area` and `areaUnit` as is into `metrics: { area: { value, unit } }` with\n  `unit: 'mm2' | 'px2'` (normalised spelling; the display layer renders `mm²` / `px²`).\n- `metrics` is a record keyed by metric name, so a new metric (perimeter, mean intensity — P-8) is a\n  new key, not a new message type.\n- The total is computed per unit: rows are grouped by `unit`, each group summed separately. The\n  footer shows the mm² total and, only if px² rows exist, a second line for px² with a hint that\n  those images have no pixel spacing. mm² and px² are never added together.\n- Unit tests cover: mixed units, empty list, rows without a value, rounding to one decimal.\n\n## Rejected alternatives\n\n- Flat `value` / `unit` fields: simpler, but P-8 would change the message type.\n- Converting px² to mm² with a guessed spacing: fabricates clinical numbers.\n\n## Consequences\n\n- The sum function is pure and lives in `host-app/src/form/totals.ts`, the natural test target (X-4).\n"},{"path":"docs/decisions/A-12-npm-workspaces.md","title":"A-12 · npm workspaces","group":"Decisions","md":"# A-12 — npm workspaces for host-app and the contract package; the viewer stays outside\n\nStatus: approved 2026-09-16; superseded in part by\n[A-15](A-15-publish-contract-package.md) on 2026-09-18, which publishes the contract to npm and\nends the duplication. The workspace layout below still holds. Canon: Q-7, D-1, A-1.\n\n## Context\n\nThe mono-repo holds `host-app/`, the shared message contract, and the OHIF fork as a git\nsubmodule. The fork is a yarn 1 monorepo with its own workspaces and must remain a\nself-contained repository.\n\n## Decision\n\n- Root `package.json` declares npm workspaces `host-app` and `packages/*`.\n- The contract is the package `@scoring/contract` in `packages/contract/`, consumed by\n  `host-app` as a regular dependency (symlinked by npm). TypeScript source is consumed directly;\n  no build step.\n- `viewer/` (the submodule) is not a workspace. The bridge extension holds a byte-identical copy\n  of `packages/contract/src/messages.ts`, verified by `npm run check:contract`.\n\n## Why the contract is duplicated, and why that is acceptable\n\nThe wire contract exists twice: `packages/contract/src/messages.ts` and a byte-identical copy at\n`viewer/extensions/scoring-bridge/src/contract/messages.ts`. Duplication is normally a defect, so\nthe reasoning is spelled out here.\n\n- The fork is a separate repository mounted as a submodule. Its yarn workspaces resolve only\n  inside the fork, so the extension cannot import a package that lives above the submodule root.\n- The fork must keep building from a standalone clone: it has its own pull requests and its own\n  history, and a reviewer may open it alone.\n- The assignment allows this explicitly (Q-7: a separate package, a shared folder, \"or at least a\n  copied file with an explanation why\").\n- Drift is caught mechanically rather than by discipline: `npm run check:contract` compares the two\n  files and the committed hash on every pull request here, and a workflow in the fork checks its\n  own copy against that hash, so a change made only inside the fork fails there too.\n  `npm run contract:sync` performs the copy, so updating the contract is one command.\n\n## Rejected alternatives for the duplication\n\n- **Publishing the contract to npm** and depending on it from the fork. This is the right\n  answer for a product: one source, an explicit version, no copying. It was rejected at the time because it adds a registry, a release step and a version bump to every contract\n  change, and it makes a reviewer's clean-machine run depend on a published artefact.\n- **A `file:` dependency from the fork to `packages/contract`.** It breaks the standalone clone:\n  the path escapes the fork's repository root.\n- **Moving the contract into the fork** and importing it from host-app through an alias. The\n  duplication disappears, but the viewer becomes the owner of a format both sides share, and\n  host-app stops building without the submodule.\n\n- Vite alias to a shared folder: works, but hides the dependency and does not scale to more packages.\n- Making the extension import from outside the submodule: breaks the fork as a standalone repo.\n- Publishing the contract to a registry: overkill for this assignment.\n\n## Consequences\n\n- One root `package-lock.json`; `npm install` at the root installs host-app and the package.\n- The fork is installed separately with yarn (`viewer/`), documented in README.\n"},{"path":"docs/decisions/A-13-coding-conventions.md","title":"A-13 · coding conventions","group":"Decisions","md":"# A-13 — Coding conventions, lint enforcement and agent roles\n\nStatus: approved 2026-09-16. Canon: Q-7, D-3, section 10 (\"code quality\": typing, effect cleanup, structure, readability).\n\n## Context\n\nSlices 1–11 were written by several assistant sessions from briefs that named the canon and the\nfiles in scope but no shared style. The result is consistent in structure but mixed in idiom:\n`function` declarations next to arrows, string-literal action types, oxlint from the Vite template\nthat cannot enforce naming or function style.\n\n## Decision\n\n- One style document, `docs/CONVENTIONS.md`, is the source of truth; every agent brief points to it.\n- Functions: arrow functions everywhere (components, hooks, utilities, handlers); `function`\n  declarations only where hoisting is genuinely required, with a comment.\n- Enums: string enums for application state (row status, reducer action types, UI modes); numeric\n  enums are forbidden. The wire contract in `packages/contract` keeps string-literal union types:\n  it is the serialised format, copied into the OHIF fork, and literal types are the\n  recommendation of typescript-eslint and the Google TypeScript style guide for such boundaries.\n- Tooling: ESLint 9 flat config with `typescript-eslint` `strict-type-checked` and\n  `stylistic-type-checked`, `eslint-plugin-react-hooks`, `eslint-plugin-react-refresh`,\n  Prettier for formatting; oxlint removed. `npm run lint` and `npm run format:check` must pass with\n  zero warnings before a slice reaches gate 2.\n- Agent roles live in `.claude/agents/` (architect, developer, tester, git-operator, researcher)\n  with model, tools and a prompt that embeds the brief template and the conventions.\n\n## Rejected alternatives\n\n- Google/Airbnb hybrid (`function` for top-level names): equally valid, but the author prefers a\n  single arrow style and it is simpler to enforce.\n- Enums in the contract too: consistent, but couples the wire format to a TypeScript-only\n  construct and diverges from the typescript-eslint recommendation.\n- `as const` objects instead of enums: the TypeScript team's advice, rejected by the author in\n  favour of enum readability for internal state.\n\n## Consequences\n\n- `erasableSyntaxOnly` (TypeScript 5.8, enabled by the Vite template) forbids enums, so it is\n  turned off in `host-app/tsconfig.app.json`. The trade-off is accepted: host-app is always built\n  by Vite/esbuild, never run through Node's type stripping, and the contract package, which must\n  stay erasable, contains no enums.\n\n- Slice 13 refactors existing code to the conventions; lint is allowed to be red only in the PR\n  that introduces the rules.\n- The fork extension follows the same document; its lint runs through OHIF's own ESLint config,\n  so the conventions there are checked by review plus Prettier.\n"},{"path":"docs/decisions/A-14-state-restore.md","title":"A-14 · state restore","group":"Decisions","md":"# A-14 — State restore: the form persists, the viewer rebuilds the annotations\n\nStatus: approved 2026-09-18. Canon: S-5.6, Q-3, Q-4, P-5.\n\n## Context\n\nAfter a reload the viewer starts empty: OHIF loads the study again and holds no annotation from the\nprevious page. The form, in contrast, can persist whatever it stores. Research\n(`docs/notes/ohif-annotation-restore.md`) established three facts that shape the design:\n\n- an annotation can be re-added with `annotation.state.addAnnotation(object)` and a supplied\n  `annotationUID` is preserved, so a restored measurement keeps the id the form already stores;\n- re-adding does not broadcast `MEASUREMENT_ADDED`; the value arrives later as\n  `MEASUREMENT_UPDATED` once cornerstone recomputes the statistics in its render pass;\n- the annotation mapper needs image metadata, which is ready at\n  `cornerstoneViewportService` `VIEWPORT_DATA_CHANGED`, later than our readiness handshake.\n\n## Decision\n\n- **The form owns the saved state.** Rows, their tool, status, value and the geometry needed to\n  rebuild the annotation are written to `sessionStorage` under a key that includes the\n  `StudyInstanceUID`. Nothing is written by the viewer.\n- **`sessionStorage`, not `localStorage`.** Each tab keeps its own state, which preserves the\n  answer to P-5: two tabs never overwrite each other. Closing the tab clears it, which is the\n  honest lifetime for an assignment without a backend (X-1).\n- **The viewer rebuilds, the form asks.** After the handshake the form sends\n  `RESTORE_MEASUREMENTS` with one entry per stored measurement. The bridge waits for\n  `VIEWPORT_DATA_CHANGED`, seeds its `uid → rowId` map first, adds each annotation with the stored\n  uid and `invalidated: true`, triggers an annotation render, and answers with\n  `MEASUREMENTS_RESTORED` listing what was restored and what failed.\n- **Values are confirmed by the viewer, not trusted from storage.** The restored row shows its\n  stored value immediately, and the `MEASUREMENT_UPDATED` that follows the recompute replaces it.\n  A row whose annotation could not be rebuilt is marked in the form instead of silently keeping a\n  number with nothing behind it.\n- **Only the same study.** A stored state for another `StudyInstanceUID` is ignored, because an\n  annotation restored onto a different study would land on an image it does not belong to and\n  disappear without an error.\n- **Additive contract.** `RESTORE_MEASUREMENTS` and `MEASUREMENTS_RESTORED` are new message types\n  and the measurement events carry the geometry the form has to persist; the shapes that exist stay\n  untouched and the contract stays at `version: 1`.\n\n## Rejected alternatives\n\n- **Restoring only the form.** Cheap, but the assignment asks for the annotations as well, and a\n  row with a value and no annotation behind it is worse than no restore at all.\n- **Letting the viewer persist the annotations.** OHIF has no such storage of its own, and putting\n  it there would make the viewer own state that belongs to the form.\n- **Re-deriving ids after restore.** Possible, but a round trip to renumber rows is pure cost when\n  the supplied uid is preserved.\n\n## Consequences\n\n- The form stores medical geometry in the browser; with a backend this belongs on the server\n  together with the audit trail, and the note in `AI-USAGE.md` about the missing backend applies\n  here too.\n- A restored annotation on a slice the viewer is not showing is invisible until the user scrolls to\n  it. That is OHIF's own filtering, not a defect of the restore.\n- The bridge now depends on one more OHIF event (`VIEWPORT_DATA_CHANGED`), which is recorded in\n  `docs/notes/ohif-annotation-restore.md`.\n"},{"path":"docs/decisions/A-15-publish-contract-package.md","title":"A-15 · publish contract package","group":"Decisions","md":"# A-15 — the contract is published to npm as `@bdiadiun/scoring-contract`\n\nStatus: approved 2026-09-18. Canon: Q-7, D-1, A-1. Supersedes part of\n[A-12](A-12-npm-workspaces.md).\n\n## Context\n\nA-12 kept the wire contract in two files: the package `packages/contract` and a byte-identical\ncopy inside the fork, with a hash check to catch drift. It listed publishing to a registry as the\nright answer for a product and rejected it for the assignment, on the grounds that it adds a\nrelease step and makes a clean-machine run depend on a published artefact.\n\nTwo things changed that reasoning. The duplication turned out to be wider than the one file: the\ncontract's own runtime guards were re-implemented in `host-app/src/form/storage.ts` and again in\nthe fork's `geometry.ts`, and they had already drifted — the contract accepted a point of any\nlength while the viewer would only restore a point of three coordinates. And the registry question\nhas a cheap answer: a public npm package is readable without authentication, so a reviewer's clean\nclone installs it like any other dependency and needs no token.\n\n## Decision\n\n- The package is renamed `@bdiadiun/scoring-contract` and published to the public npm registry. It\n  ships built JavaScript and declarations from `dist`, produced by the package's own `prepare`\n  script, so a plain `npm ci` at the repository root builds it before anything imports it.\n- The contract exports what both sides were re-implementing: the vocabulary and geometry shapes and\n  the map from a tool name to the metric key it produces. (Since A-26 those are zod schemas —\n  `ToolName`, `Metrics`, `MeasurementGeometry` — and the primitive guards this decision first\n  exported are gone; `host-app/src/form/storage.ts` builds its stored-row schema from them.)\n- A world point is exactly three finite coordinates, in the contract itself. This removes the\n  drift: what the contract accepts is now what the viewer can restore.\n- A workflow publishes a patch release when a merge into `main` changes the p
