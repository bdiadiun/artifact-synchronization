ost]         |\n| Early commands          | [`queue.push(command)`](../host-app/src/bridge/createBridge.ts#L137), [`flushQueue`](../host-app/src/bridge/createBridge.ts#L71)                            | —                                                                                                                                                      |\n| Row id / measurement id | [`crypto.randomUUID()` in `addRow`](../host-app/src/form/useScoringForm.ts#L33)                                                                             | [`uidToRowId.set`][fork-bridge-map]                                                                                                                    |\n| Tool armed and restored | [`DEFAULT_TOOL`](../host-app/src/config.ts#L8)                                                                                                              | [snapshot `getActivePrimaryMouseButtonTool`][fork-commands-snapshot], [`setToolActive`][fork-commands-active], [`disarm`][fork-commands-disarm]        |\n| Measurement delivered   | [`rowId === null` ignored](../host-app/src/form/useScoringForm.ts#L154)                                                                                     | [`MEASUREMENT_ADDED` subscription][fork-bridge-added], [posted][fork-bridge-added-post], [`toMetrics`][fork-metrics], [unit normalisation][fork-units] |\n| Live update (S-5.1)     | reducer `MeasurementUpdated` in [`rows.ts`](../host-app/src/form/rows.ts#L31)                                                                               | [throttled emitter][fork-bridge-throttle], [`UPDATE_INTERVAL_MS`][fork-bridge-interval]                                                                |\n| Deletion (S-5.2)        | [own `causedBy` ignored](../host-app/src/form/useScoringForm.ts#L213)                                                                                       | [`pendingRemovals`][fork-removals-map], [`measurementService.remove`][fork-removals-remove], [`MEASUREMENT_REMOVED` subscription][fork-bridge-removed] |\n| Focus (S-5.3)           | clickable Done row in `MeasurementRow.tsx`                                                                                                                  | [`jumpToMeasurement`][fork-focus]                                                                                                                      |\n| Version overlay (S-5.5) | —                                                                                                                                                           | [`viewportOverlay.bottomRight`][fork-overlay]                                                                                                          |\n| State and totals        | [`RowStatus`](../host-app/src/form/rows.ts#L9), [`FormActionType`](../host-app/src/form/rows.ts#L31), [`computeTotals`](../host-app/src/form/totals.ts#L31) | —                                                                                                                                                      |\n| Diagnostics (P-9)       | [`BridgeStatus`](../host-app/src/components/BridgeStatus.tsx#L12)                                                                                           | log prefix `[scoring-bridge]` in the viewer console                                                                                                    |\n| Entry point             | [`useBridge`](../host-app/src/bridge/useBridge.ts)                                                                                                          | [`preRegistration`][fork-index]                                                                                                                        |\n\n[fork-config]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/config.ts#L8\n[fork-index]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/index.tsx#L18\n[fork-bridge-origin]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/bridge.ts#L132\n[fork-bridge-post]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/bridge.ts#L121\n[fork-bridge-ready]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/bridge.ts#L450\n[fork-bridge-viewport]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/bridge.ts#L482\n[fork-bridge-map]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/bridge.ts#L299\n[fork-bridge-added]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/bridge.ts#L315\n[fork-bridge-added-post]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/bridge.ts#L291\n[fork-bridge-throttle]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/bridge.ts#L189\n[fork-bridge-interval]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/bridge.ts#L53\n[fork-bridge-removed]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/bridge.ts#L430\n[fork-commands-guard]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/commands.ts#L238\n[fork-commands-snapshot]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/commands.ts#L107\n[fork-commands-active]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/commands.ts#L141\n[fork-commands-disarm]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/commands.ts#L146\n[fork-commands-idempotent]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/commands.ts#L162\n[fork-removals-map]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/removals.ts#L56\n[fork-removals-cause]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/removals.ts#L83\n[fork-removals-remove]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/removals.ts#L93\n[fork-focus]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/focus.ts#L76\n[fork-metrics]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/measurements.ts#L216\n[fork-units]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/measurements.ts#L97\n[fork-overlay]: https://github.com/bdiadiun/Viewers/blob/ebd52ab26e7ac13cc9f1a3912f3de29ee4f73257/extensions/scoring-bridge/src/getCustomizationModule.tsx#L31\n\n## Questions (canon P-1..P-6)\n\n**P-1. The iframe loads slower than the user clicks.** \"Активувати\" calls `send`; while `ready` is\nfalse the command goes to [`queue.push(command)`](../host-app/src/bridge/createBridge.ts#L137) and\nthe status line shows `у черзі: N`. The viewer announces `VIEWER_READY` only after\n[the first viewport joins a tool group][fork-bridge-viewport], because `setToolActive` is a silent\nno-op before that. The host then [flushes the queue in order](../host-app/src/bridge/createBridge.ts#L120).\nDemo: stop the viewer, click \"Активувати\", start the viewer, watch the counter drain.\n\n**P-2. Why `postMessage`.** The two apps have different origins, and `postMessage` is the only\nbrowser channel between a window and a cross-origin iframe that carries a sender origin the\nreceiver can verify. On one origin we could call into `iframe.contentWindow` directly or use\n`BroadcastChannel`; the origin checks would go, but the typed contract would stay, because it is\nthe seam between two separately deployed apps.\n\n**P-3. Who issues which id.** The host issues `rowId`\n([`crypto.randomUUID()`](../host-app/src/form/useScoringForm.ts#L33)) before anything is drawn, so an\nempty `Очікує` row can exist. The viewer issues `measurementUid` (the cornerstone annotation UID)\nand keeps [`uidToRowId`][fork-bridge-map]. Flipping it breaks two things: the form could not show a\nrow before drawing, and OHIF's `_isValidMeasurement` rejects any foreign field, so a host id cannot\nbe stored on a measurement ([A-8](decisions/A-8-id-correlation.md)).\n\n**P-4. Where we subscribe in OHIF.** [`measurementService.subscribe(MEASUREMENT_ADDED)`][fork-bridge-added]\ninside `createBridge`, called from [`preRegistration`][fork-index], where OHIF hands an extension its\n`servicesManager`. The service merges cornerstone's `ANNOTATION_ADDED` and `ANNOTATION_COMPLETED`\ninto one event on completion and returns an unsubscribe handle; raw cornerstone events would fire\non the first click.\n\n**P-5. Two host-app tabs.** Each tab has its own iframe and its own `contentWindow`, and\n`postMessage` is point to point, so tabs never see each other's messages or measurements.\n\n**P-6. Where an infinite loop could arise.** OHIF re-broadcasts events when a measurement is\nchanged or removed through the service. The mandatory flow never sends a command in reaction to a\nmeasurement event (a hook test asserts `send` is not called). The only mutating command is\ndeletion: the viewer [parks the request id][fork-removals-cause] and returns it as `causedBy`; the\nhost [ignores its own echo](../host-app/src/form/useScoringForm.ts#L213). Commands are also\nidempotent ([same row already armed][fork-commands-idempotent]).\n\n## Live changes (P-7..P-9)\n\n**P-7. Ellipse → `RectangleROI`.** Change [`DEFAULT_TOOL`](../host-app/src/config.ts#L8). Nothing\nelse: the tool name travels in `ACTIVATE_TOOL`, the extension checks `toolGroup.hasTool`, and\n[`toMetrics`][fork-metrics] already maps `RectangleROI`, which has the same stats shape.\n\n**P-8. One more field through the whole chain (e.g. mean intensity).**\n\n1. Extension: in [`toMetrics`][fork-metrics] add `mean: { value: stats.mean, unit: … }`; if a new\n   unit is needed, extend `Unit` in [`packages/contract/src/messages.ts`](../packages/contract/src/messages.ts)\n   and copy the file into the extension (`npm run check:contract` says when they differ).\n2. Host: `MeasurementRow` already renders the first non-area metric; to show both, map over the\n   metrics object.\n3. Optional: `computeTotals(rows, 'mean')`.\n\n**P-9. A protocol element is disabled (e.g. `VIEWER_READY`).** Symptoms: the\n[status line](../host-app/src/components/BridgeStatus.tsx#L12) stays at `очікує VIEWER_READY`, the\nqueue count grows with each \"Активувати\", and the viewer console has no `VIEWER_READY sent`. Walk:\n[`postViewerReady`][fork-bridge-ready] → [VIEWPORT_ADDED subscription][fork-bridge-viewport] → host\n[READY branch](../host-app/src/bridge/createBridge.ts#L110). If `ACTIVATE_TOOL` is disabled instead,\nthe queue drains but the viewer logs no `armed row` and the tool stays WindowLevel.\n\n## Rehearsal checklist\n\n- [ ] Both apps start from a clean clone by README only.\n- [ ] Three measurements in a row, total updates.\n- [ ] Cancel: \"Активувати\", then \"Скасувати\" → row `Очікує`, tool back to WindowLevel.\n- [ ] Drag an ellipse handle: the row value and total change while dragging.\n- [ ] \"Видалити\" on a Done row removes the annotation; deleting it in OHIF returns the row to `Очікує`.\n- [ ] Click a Done row: the viewer jumps to and selects the annotation.\n- [ ] 2×2 layout: `OHIF 3.12.17` in every pane.\n- [ ] P-7 swap to `RectangleROI` in under 2 minutes.\n- [ ] P-9: comment out the `postToHost` call in `postViewerReady`, reload, diagnose aloud.\n\n## Video script (D-8, 2–4 min)\n\n| Time      | What to show                                                                                                                                        | What to say                                                                                  |\n| --------- | --------------------------------------------------------------------------------------------------------------------------------------------------- | -------------------------------------------------------------------------------------------- |\n| 0:00–0:25 | Terminal 1: `cd viewer && OHIF_OPEN=false yarn --cwd platform/app dev`. Terminal 2: `npm run dev --workspace host-app`. Open http://localhost:5173. | Two apps, two ports, one channel. The status line turns to `готовий` after `VIEWER_READY`.   |\n| 0:25–1:15 | \"Додати вимірювання\" three times. For each row: \"Активувати\", draw an ellipse. Point at the value, the unit and \"Разом\".                            | Row ids come from the form, measurement ids from OHIF; the tool returns to the previous one. |\n| 1:15–1:35 | Add a fourth row, \"Активувати\", then \"Скасувати\". Point at the OHIF toolbar.                                                                        | Cancel sends `DEACTIVATE_TOOL`; the row stays as `Очікує`.                                   |\n| 1:35–2:00 | Drag a handle of one ellipse.                                                                                                                       | Live update, throttled to one message per 100 ms; the form never writes back, so no loop.    |\n| 2:00–2:30 | \"Видалити\" on one row; then delete another annotation in OHIF's measurements panel.                                                                 | Deletion in both directions; the viewer tags our own echo with `causedBy`.                   |\n| 2:30–2:50 | Click a Done row after scrolling the viewer away.                                                                                                   | Focus: OHIF jumps to the image and selects the annotation.                                   |\n| 2:50–3:10 | Switch the layout to 2×2.                                                                                                                           | OHIF version from `version.txt`, injected at build time, in every viewport.                  |\n"},{"path":"AI-USAGE.md","title":"AI usage","group":"Delivery","md":"# AI usage\n\nThis project was built with an AI coding assistant driving the process. What follows is what it\ndid, what was kept, what was rewritten, and how the author stays able to defend every line.\n\n## How the work was organised\n\n- The assignment text was turned into a canon of atomic requirements with immutable IDs\n  (`docs/CANON.md`) and a feature graph (`docs/FEATURE-GRAPH.md`) before any code. Every later\n  change references those IDs; a script (`npm run check:graph`) keeps the graph consistent.\n- Work went slice by slice, one PR each, with two approval gates per slice (plan, then result).\n  Decisions on ambiguities were proposed by the assistant and approved by the author; each one is\n  a record under `docs/decisions/`.\n- An architect session planned, wrote the docs and decision records, reviewed every diff and ran\n  the end-to-end checks. Implementation and tests were written by separate, smaller assistant\n  sessions working from written briefs (canon IDs, files in scope, constraints, verification\n  commands). Routine git (commit, rebase, push, PR, merge after approval) was also delegated.\n- From slice 12 on, the roles are fixed in `.claude/agents/` (architect, developer, tester,\n  researcher, git-operator) and every brief points to `docs/CONVENTIONS.md`, so the style no longer\n  depends on which session wrote a file. Development and test agents run on smaller models than\n  the architect; the architect reviews every diff and runs the end-to-end checks itself.\n- Every slice was verified in a real browser with Playwright against both running apps, not only\n  with unit tests; screenshots were reviewed before each merge.\n\n## Where AI output was kept as is\n\n- The OHIF research note (`docs/notes/ohif-bridge-api.md`): the assistant cloned the release tag,\n  found the exact files and lines (measurement shape, event timing, `setToolActive`, validation\n  that rejects custom fields). The findings were verified at runtime (drawing an ellipse headlessly)\n  before they became decisions.\n- Most of the code as delivered by the implementation sessions: the contract guards, the bridge\n  client with its queue, the extension's command handling, the reducers and the totals function,\n  and the unit tests. They were reviewed against the briefs and the canon, not rewritten for style.\n- The Playwright end-to-end scripts used for verification (kept outside the repository).\n\n## What was corrected or rewritten, and why\n\n- The first version of the feature graph missed two mandatory IDs (C-3.1, D-4) in node rows; the\n  assistant's own invariant script caught it and the rows were fixed.\n- The canon initially said the tool returns to \"Pan/default\". The research showed the default\n  primary tool in the longitudinal mode is WindowLevel, so the decision became \"restore the tool\n  that was active before arming\" (A-8) rather than hardcoding a name.\n- The contract was first wired as a Vite alias to a shared folder; it was reworked into an npm\n  workspace package (`@scoring/contract`, A-12) so the dependency is explicit.\n- `VIEWER_READY` was planned to be sent from `preRegistration`; the implementation session found\n  that `setToolActive` is a silent no-op before a viewport exists and moved the announcement to the\n  first `VIEWPORT_ADDED`. The decision record was updated to match.\n- A Ukrainian plural form generated for the count footer was wrong (\"виміру\") and was corrected.\n- The claim that a mono-repo lets one PR change both sides of the contract was withdrawn once the\n  viewer became a submodule; the decision record (A-1) now states what the mono-repo actually buys.\n- Live update: the first version logged one warning per animation frame while a handle was dragged\n  (about 40 per drag), because cornerstone has no stats on intermediate frames; the mapping was\n  made quiet on that path. A one-shot correction after `MEASUREMENT_ADDED` was added when the\n  architect's review showed that stats can settle one frame after completion.\n- Deletion: the brief assumed a `remove(uid, source, details)` signature; the implementation\n  session checked the pinned OHIF source, found a one-argument method, and used the real one. The\n  deletion made in the viewer was first simulated through the service; it was redone through the\n  actual OHIF measurements panel so the check matches what a doctor does.\n- Focus: an end-to-end check clicked the wrong element (a row that was not clickable) and reported\n  a false failure; the architect traced it through the viewer console and fixed the test, not the\n  code.\n- Docs page: the generator initially pinned a Mermaid version that does not exist on cdnjs, so\n  diagrams silently did not render; the architect found the 404 and the missing first render.\n  Later, running Prettier over the repository changed the placeholder the generator replaces, and\n  the page shipped with no documents; the generator now tolerates the change and fails loudly.\n- Conventions: the lint rule meant to forbid numeric enums never fired because its AST selector\n  did not match typescript-eslint v8; the architect caught it with a probe file. Introducing enums\n  broke the build because the Vite template enables `erasableSyntaxOnly`; the developer session\n  stopped and reported instead of changing the TypeScript config on its own.\n- A pull request description in the OHIF fork was written in Ukrainian against the repository\n  rules and was rewritten in English.\n- CI: running the checks from a clean `npm ci` showed that tests and type-aware lint had only been\n  passing on a warm local install (npm had hoisted test libraries away from the types they need).\n  The dependency layout was fixed and the rule added to the conventions.\n\n## What the author verifies by hand\n\n- Every PR description's \"How it was verified\" section corresponds to commands and browser checks\n  that were actually run; screenshots of the end-to-end runs were reviewed.\n- The defence notes (`docs/DEFENCE.md`) map each expected question and live change to the exact\n  place in the code.\n- The author decides every gate: each slice plan and each result was approved in chat before any\n  commit, and design choices with trade-offs (repository layout, ID ownership, enum policy, which\n  bonus tasks to build) were presented as options with a recommendation and chosen by the author.\n\n## Where AI was not used\n\n- The demo video is recorded and narrated by the author.\n- The defence call: `docs/DEFENCE.md` is a map to the code, not a script to read.\n"},{"path":"docs/notes/ohif-bridge-api.md","title":"ohif-bridge-api","group":"Research","md":"# OHIF bridge API note (v3.12.17)\n\nGrounded reading of the OHIF source at tag `v3.12.17`. All paths are relative to the OHIF\nrepository root. Line numbers refer to that tag. Nothing in this note was executed; items marked\n\"runtime check\" still need to be confirmed with the app running.\n\n## 1. Extension anatomy and registration\n\nAn extension is a plain object; only `id` is required. Interface and hook params:\n\n- `platform/core/src/extensions/ExtensionManager.ts:28` — `ExtensionParams` = `{ extensionManager, servicesManager, serviceProvidersManager, configuration?, peerImport }` plus `ExtensionConstructor`.\n- `platform/core/src/extensions/ExtensionManager.ts:42-50` — `Extension { id; preRegistration?; getCommandsModule?; getViewportModule?; getUtilityModule?; ... }`.\n- `platform/core/src/extensions/ExtensionManager.ts:276-285` — what is actually passed at call time:\n  `servicesManager, serviceProvidersManager, commandsManager, hotkeysManager, extensionManager, appConfig, configuration`.\n\nTemplate to copy: `extensions/test-extension/src/index.tsx:17-54` (`const testExtension: Types.Extensions.Extension = { id, preRegistration: ({ servicesManager }) => {...}, ... }`),\nwith the id in a separate `src/id.js`. An even smaller one is `extensions/dicom-pdf/src/index.tsx:20-45`.\n\nRegistration into the app: add the package name to `platform/app/pluginConfig.json` (`\"extensions\": [...]`,\nlines 2-12; each entry `{ packageName, default?, version? }`), and the workspace glob `extensions/*`\nin `package.json:11` picks it up. The mode must also list it.\n\nDefault `/viewer` route: `modes/longitudinal/src/index.ts:60` (`routeName: 'viewer'`), extensions come from\n`modes/longitudinal/src/index.ts:20-24` (`extensionDependencies = { ...basicDependencies, '@ohif/extension-measurement-tracking': '^3.0.0' }`)\nand are attached at `modes/longitudinal/src/index.ts:65` (`extensions: extensionDependencies`).\nSo the bridge package name must be added both to `pluginConfig.json` and to that `extensionDependencies` map.\n\n## 2. measurementService\n\nFile: `platform/core/src/services/MeasurementService/MeasurementService.ts`.\n\n`EVENTS` at `:71-84`:\n`MEASUREMENT_UPDATED`, `INTERNAL_MEASUREMENT_UPDATED`, `MEASUREMENT_ADDED`, `RAW_MEASUREMENT_ADDED`,\n`MEASUREMENT_REMOVED`, `MEASUREMENTS_CLEARED`, `JUMP_TO_MEASUREMENT`. Exposed as static and instance\n`EVENTS` (`:128`, `super(EVENTS)` at `:139`).\n\n`subscribe` comes from the pub/sub mixin: `platform/core/src/services/_shared/pubSubServiceInterface.ts:23-40`\n— `subscribe(eventName, callback)` returns `{ unsubscribe: () => ... }`. That returned object is the only\ncleanup handle (Q-5).\n\nPayloads:\n\n- ADDED — `{ source, measurement }` (`MeasurementService.ts:567-570`).\n- UPDATED — `{ source, measurement, notYetUpdatedAtSource }` (`:559-564`, `:379-383`, `:872-876`).\n- REMOVED — `{ source, measurement }` where `measurement` is the **UID string**, not the object (`:686-689`).\n\n## 3. Measurement shape for EllipticalROI\n\n`extensions/cornerstone/src/utils/measurementServiceMappings/EllipticalROI.ts:61-81` returns:\n`uid` (= cornerstone `annotationUID`, line 62), `SOPInstanceUID`, `FrameOfReferenceUID`, `points`\n(`data.handles.points`, line 53), `textBox`, `metadata` (the cornerstone annotation metadata object,\ncontains `toolName`, `referencedImageId`, `FrameOfReferenceUID` — line 29), `referencedImageId`,\n`toolName`, `displaySetInstanceUID`, `label` (`data.label`), `displayText`, `data: data.cachedStats`,\n`type`, `getReport`.\n\nThere is **no top-level `area`/`unit` field on the ellipse measurement.** Area lives inside\n`measurement.data`, which is cornerstone's `cachedStats`, keyed per target (usually\n`imageId:<referencedImageId>`), each holding `{ mean, stdDev, max, area, Modality, areaUnit, modalityUnit }`\n— see the destructuring at `EllipticalROI.ts:110` and the display use at `:194,206-207`\n(`${roundedArea} ${getDisplayUnit(areaUnit)}`). `getDisplayUnit` is a pass-through:\n`extensions/cornerstone/src/utils/measurementServiceMappings/utils/getDisplayUnit.ts:1`.\n\nSo area is a **number** (`area`) plus a **unit string** (`areaUnit`). The unit string is produced by\ncornerstone3D's calibrated-units helper when it computes `cachedStats`; OHIF only forwards it. Whether it\nreads `mm²` or `px²` for a given series depends on pixel spacing and needs a runtime check (see §8).\n\n`Length.ts:118` — `const { length, unit = 'mm' } = targetStats;` (note the `mm` default), `:125-126`.\n`RectangleROI.ts:60-80` returns the same shape as the ellipse, also with `data: data.cachedStats`\ncarrying `area` / `areaUnit`.\n\n## 4. When ADDED vs UPDATED actually fire\n\nWiring: `extensions/cornerstone/src/initMeasurementService.ts:332-342`\n\n```\nconst addedEvt = csToolsEvents.ANNOTATION_ADDED;      // 332\nconst completedEvt = csToolsEvents.ANNOTATION_COMPLETED;\neventTarget.addEventListener(addedEvt, addMeasurement);      // 338\neventTarget.addEventListener(completedEvt, addMeasurement);  // 339\neventTarget.addEventListener(updatedEvt, updateMeasurement); // 340 (ANNOTATION_MODIFIED)\n```\n\nBoth ADDED and COMPLETED call the same `addMeasurement` (`:225-259`), which forces\n`annotationAddedEventDetail.uid = annotationUID` (`:253`) and calls `annotationToMeasurement(toolName, detail)`.\n\nThe de-duplication happens in the service, `MeasurementService.ts:545-576`: on the **first** call there is no\n`oldMeasurement`, so it only logs `'Measurement started.'` and stores it — **no event is broadcast** (`:572-574`).\nOn the **second** call (ANNOTATION_COMPLETED, i.e. drawing finished) `oldMeasurement` exists and `isUpdate`\nis false, so `MEASUREMENT_ADDED` is broadcast (`:567`). Net effect: the host sees `MEASUREMENT_ADDED` once,\non completion — exactly what C-4.3.5/C-4.3.6 need.\n\n`updateMeasurement` (`initMeasurementService.ts:262-284`) fires on every `ANNOTATION_MODIFIED`, i.e. on each\ndrag frame, and bails out early if the measurement is not yet in the service (`:271-275`). It passes\n`isUpdate = true`, so the service broadcasts `MEASUREMENT_UPDATED` with `notYetUpdatedAtSource: false`\n(`:559-564`). For S-5.1 this stream must be throttled/debounced on our side.\n\n## 5. Activating and deactivating a tool\n\nCommand `setToolActive`: `extensions/cornerstone/src/commandsModule.ts:1035-1068`, registered at `:2491-2493`.\nSignature `{ toolName, toolGroupId = null, bindings = [{ mouseButton: Enums.MouseBindings.Primary }] }`.\nIt resolves the tool group via `toolGroupService.getToolGroup(toolGroupId)` (null → active viewport's group),\nreturns silently if the group does not exist or `!toolGroup.hasTool(toolName)` (`:1050-1055`), sets the\npreviously active primary tool to passive/disabled (`:1057-1063`) and then `toolGroup.setToolActive(toolName, { bindings })`.\n\nThere is also `setToolActiveToolbar({ toolName, toolGroupIds = [], ... })` at `:1025-1033`, which loops over\nseveral tool groups — useful if we want all viewports armed.\n\nDefault primary tool in the longitudinal/basic mode: `modes/basic/src/initToolGroups.ts:21-35` puts\n`WindowLevel` (primary mouse), `Pan` (auxiliary), `Zoom` (secondary), `StackScroll` (wheel) in `active`.\n`EllipticalROI` is only `passive` (`:65`). So \"return to default\" for C-4.3.6 means\n`setToolActive({ toolName: 'WindowLevel' })` — not `Pan`, which is on the middle button.\n\ntoolGroupService: `extensions/cornerstone/src/services/ToolGroupService/ToolGroupService.ts` —\n`getToolGroup(toolGroupId?)` `:73`, `getToolGroupForViewport(viewportId)` `:108`,\n`getActiveToolForViewport(viewportId)` `:113`, `getActivePrimaryMouseButtonTool(toolGroupId?)` `:242`.\nThe last one lets the bridge remember the pre-activation tool and restore it.\n\n## 6. Correlating a measurement with an external ID\n\nA custom top-level field does **not** survive: `MeasurementService.ts:832-841` (`_isValidMeasurement`) rejects\nthe whole measurement if any key is outside `MEASUREMENT_SCHEMA_KEYS` (`:33-69`), and that list is fixed\n(`uid, color, data, getReport, displayText, ..., label, metadata, area, ..., isDirty`). The check runs on both\nadd and update paths (`:430`, `:526`).\n\nAvailable carriers, in order of preference:\n\n1. **`uid` = cornerstone `annotationUID`** (`EllipticalROI.ts:62`, forced in `initMeasurementService.ts:253`).\n   Stable across ADDED/UPDATED/REMOVED and unique — the natural correlation key. The bridge keeps its own\n   `rowId ↔ measurementUid` map in extension memory; the viewer issues the measurement UID, the host issues\n   the row ID, and the bridge owns the mapping (Q-3).\n2. **`label`** — a schema key, so it survives, but it is `data.label` from the cornerstone annotation and is\n   user-visible/user-editable in the OHIF panel, so it is a fragile place for a machine ID.\n3. **`metadata`** — passed through by reference from the cornerstone annotation (`EllipticalROI.ts:19,67`), so a\n   field written onto `annotation.metadata` before mapping would reach the measurement. It is a cornerstone\n   object, not ours; treat as a fallback only.\n\n`update(measurementUID, measurement, notYetUpdatedAtSource = false)` at `:365-386` replaces the stored object and\nre-broadcasts `MEASUREMENT_UPDATED` — this is the obvious echo-loop source (Q-4). `remove(measurementUID)` at\n`:674-690` (S-5.2). Focus (S-5.3): `measurementService.jumpToMeasurement(viewportId, measurementUID)` at `:740-755`,\nor the command `commandsManager.run('jumpToMeasurement', { uid })` — `commandsModule.ts:739-744`, registered `:2469`.\nRead-back helpers: `getMeasurement(uid)` `:198`, `getMeasurements(filter?)` `:185`.\n\n## 7. Existing postMessage / external hooks\n\nNone. A search over `platform/` and `extensions/` for `postMessage` returns no application code; the only\n`addEventListener('message', ...)` hits are vendored bundles (`platform/app/public/oidc-client.min.js:1141`,\n`platform/app/public/es6-shim.min.js:2039`) and the service worker (`platform/app/src/service-worker.js:49`).\nThere is no existing \"external integration\" extension — the bridge is greenfield, which also means no\nnaming collisions and no existing origin policy to respect.\n\n## 8. App config and the study link\n\nConfig file: `platform/app/public/config/default.js`. `defaultDataSourceName: 'ohif'` (`:91`); that source is\n`sourceName: 'ohif'` (`:105`) pointing at the public static WADO server\n`https://d14fa38qiwhyfd.cloudfront.net/dicomweb` (`:109-111`, qido/wado/wadoUri all the same). No PACS needed (C-4.1.2, X-2).\n\n`StudyInstanceUIDs` is read from the query string by the mode route:\n`platform/app/src/routes/Mode/Mode.tsx:124` — `setStudyInstanceUIDs(dataSource.getStudyInstanceUIDs({ params, query }))`,\nthen provided at `:358`. So `/viewer?StudyInstanceUIDs=<uid>` opens a study directly (C-4.1.3).\n\nCandidate study: `1.3.6.1.4.1.25403.345050719074.3824.20170125113417.1`, used against the default data source by\nseveral cypress specs — `platform/app/cypress/integration/MultiStudy.spec.js:4`,\n`platform/app/cypress/integration/customization/HangingProtocol.spec.js:4,32-33`,\n`platform/app/cypress/integration/study-list/OHIFStudyList.spec.js:46`. It is the standard OHIF demo study and is\nknown to render measurements in the e2e suite. **Whether its pixel spacing yields `mm²` is a runtime check** —\nopen the study, draw one ellipse and read `cachedStats[...].areaUnit`.\n\n## 9. Toolchain\n\n- Engines: `package.json:23-27` — `node >= 18`, `npm >= 6`, `yarn >= 1.20.0`. No `.nvmrc`, no `.yarnrc` in the repo.\n- Root dev: `package.json` `\"dev\": \"lerna run dev:viewer --stream\"` and `\"start\": \"yarn run dev\"`.\n- App dev: `platform/app/package.json:37` `\"dev:viewer\": \"yarn run dev\"` → `:31`\n  `\"dev\": \"cross-env NODE_ENV=development webpack serve --config .webpack/webpack.pwa.js\"`.\n- Port: `platform/app/.webpack/webpack.pwa.js:29` — `const OHIF_PORT = Number(process.env.OHIF_PORT || 3000);`,\n  applied at `:152` (`port: OHIF_PORT`). So the viewer is on `http://localhost:3000` by default and the port is\n  overridable via the `OHIF_PORT` env var — matching decision A-2.\n\n## Design implications\n\n- **The viewer issues the measurement ID, not the host.** `measurement.uid` is forced to the cornerstone\n  `annotationUID` (`initMeasurementService.ts:253`), and the schema whitelist (`MeasurementService.ts:832-841`)\n  blocks any custom field, so the host cannot stamp its own ID onto a measurement. The host issues the row ID,\n  the bridge holds a `rowId ↔ measurementUid` map and translates in both directions.\n- **Subscribe in `preRegistration`, on `measurementService`, not on cornerstone events.** The service already\n  de-duplicates the two cornerstone events into one `MEASUREMENT_ADDED`, and `subscribe` hands back an\n  `unsubscribe` closure that satisfies Q-5.\n- **Drawing completion is free.** `MEASUREMENT_ADDED` is broadcast only on `ANNOTATION_COMPLETED`, because the\n  `ANNOTATION_ADDED` pass stores the measurement without broadcasting (`MeasurementService.ts:572-574`). No\n  debouncing needed to distinguish \"started drawing\" from \"finished\".\n- **`MEASUREMENT_UPDATED` is a firehose** — one event per `ANNOTATION_MODIFIED`, i.e. per drag frame. S-5.1 needs\n  throttling on the viewer side, and the echo guard must compare values, not just track a \"we sent this\" flag.\n- **Area is `data[targetId].area` + `data[targetId].areaUnit`, never a top-level `area`.** The bridge must pick a\n  target key (normally `imageId:${referencedImageId}`) and ship `{ value, unit }` as one inseparable pair, so the\n  host can refuse to sum `mm²` with `px²` (Q-6). Length uses `length` + `unit` (defaulting to `'mm'`).\n- **Deactivation means re-activating `WindowLevel`**, the default primary-mouse tool in the basic/longitudinal\n  tool group (`modes/basic/src/initToolGroups.ts:21-24`) — \"Pan\" in the assignment text is loose wording. Better\n  still, snapshot `toolGroupService.getActivePrimaryMouseButtonTool()` before arming and restore that.\n- **Tool name is pure data.** `setToolActive({ toolName })` validates with `toolGroup.hasTool(toolName)` and\n  `EllipticalROI`, `RectangleROI` and `Length` are all registered as passive tools in the same group, so the\n  P-7 live change (ellipse → rectangle) is a payload change only.\n- **No existing postMessage surface in OHIF**, so the bridge defines the whole protocol and must add its own\n  origin check (Q-2); nothing in the app will compete for `window.message`.\n"},{"path":"docs/CONVENTIONS.md","title":"Conventions","group":"Process","md":"# Coding conventions\n\nSingle source of truth for how code in this repository is written (decision A-13). ESLint and\nPrettier enforce what they can (`npm run lint`, `npm run format:check`); the rest is enforced in\nreview. Every agent brief points here; a slice does not reach gate 2 with lint or format errors.\n\nPrecedence: this file → `eslint.config.js` / `.prettierrc.json` → personal habit. If a rule here\nand the linter disagree, fix the linter config in the same PR and say so.\n\n## 1. Language and tooling\n\n- TypeScript `strict` everywhere. No `any`; when an external type is genuinely unknown, use\n  `unknown` and narrow, or write a one-line comment above a justified `// eslint-disable-next-line`.\n- ESLint 9 flat config with `typescript-eslint` strict + stylistic (type-aware), `react-hooks`,\n  `react-refresh`; Prettier for formatting (single quotes, semicolons, trailing commas, width 100).\n- Dependencies: runtime dependencies of an app live in that workspace's `package.json`. Shared\n  tooling lives at the root: ESLint, Prettier, Vitest, jsdom, Testing Library and the React type\n  packages those tests rely on. npm hoists workspace packages unpredictably, and a test library\n  hoisted to the root cannot see types left inside a workspace; CI runs `npm ci` from scratch and\n  would catch the drift, a warm local `node_modules` does not.\n- Node 22; npm workspaces at the root; the viewer fork uses its own yarn toolchain but follows this\n  document for our extension.\n\n## 2. Functions\n\n- Arrow functions everywhere: components, hooks, utilities, event handlers, reducers.\n  ```ts\n  export const computeTotals = (rows: readonly Row[]): Total[] => { … };\n  export const ScoringPanel = ({ rows }: ScoringPanelProps): JSX.Element => { … };\n  ```\n- A `function` declaration is allowed only when hoisting is genuinely required (mutual recursion\n  in one module) and carries a comment saying so.\n- Exported functions declare their return type explicitly. Internal helpers may infer.\n- Prefer small named helpers over long inline lambdas; a callback longer than ~5 lines gets a name.\n\n## 3. Enums, literals and constants\n\n- Application state uses **string enums**: row status, reducer action types, bridge states, UI\n  modes. Members are PascalCase, values are the lowercase or SCREAMING_CASE string they represent.\n  ```ts\n  export enum RowStatus { Pending = 'pending', Drawing = 'drawing', Done = 'done' }\n  export enum FormActionType { AddRow = 'ADD_ROW', ArmRow = 'ARM_ROW', … }\n  ```\n- Numeric enums are forbidden (lint rule). Do not use `const enum`.\n- The **wire contract** (`packages/contract`) keeps string-literal union types (`type: 'ACTIVATE_TOOL'`)\n  and `as const` tuples: it is the serialised format, copied into the OHIF fork, and stays free of\n  TypeScript-only constructs. App code may map contract literals to enums at the boundary, never the\n  other way round.\n- Module-level constants: `UPPER_SNAKE_CASE` for true constants (`VIEWER_ORIGIN`, `DEFAULT_TOOL`),\n  `camelCase` for everything else. No magic numbers: a timing or size value gets a named constant\n  with a comment stating the reason for the value.\n\n## 4. Naming\n\n| Thing                                | Style                                                      | Example                                                                          |\n| ------------------------------------ | ---------------------------------------------------------- | -------------------------------------------------------------------------------- |\n| Types, interfaces, enums, components | PascalCase                                                 | `MeasurementRow`, `BridgeState`                                                  |\n| Variables, functions, hooks          | camelCase; hooks start with `use`                          | `createBridge`, `useScoringForm`                                                 |\n| Files: components                    | PascalCase `.tsx`                                          | `TotalsFooter.tsx`                                                               |\n| Files: everything else               | kebab-case or camelCase, one concept per file              | `create-bridge.ts` / `createBridge.ts` (keep the existing style within a folder) |\n| Tests                                | next to the source, `*.test.ts(x)`                         | `rows.test.ts`                                                                   |\n| Booleans                             | `is`/`has`/`can`/`should` prefix                           | `isReady`, `hasMetrics`                                                          |\n| Event handlers                       | `on<Event>` for props, `handle<Event>` for implementations | `onRemove` / `handleRemove`                                                      |\n| Interfaces for props                 | `<Component>Props`                                         | `ScoringPanelProps`                                                              |\n\nNo `I` prefix on interfaces, no Hungarian notation, no abbreviations except `id`, `uid`, `url`.\n\n## 5. Modules and imports\n\n- One concern per module; a file over ~200 lines is a hint to split.\n- Named exports only; no default exports except where a framework requires one (OHIF extension\n  entry, Vite config).\n- Import order: node built-ins, external packages, workspace packages (`@scoring/contract`),\n  relative imports; blank line between groups. Use `import type` for type-only imports (lint rule).\n- No barrel `index.ts` re-exports inside the app; import from the module that owns the symbol.\n- Never reach into another package's internals; the contract package is consumed through its\n  public entry only.\n\n## 6. React\n\n- Function components as arrows, props typed with an interface, explicit `JSX.Element` return type\n  on exported components.\n- State: `useReducer` for multi-field state with transitions (rows), `useState` for independent\n  scalars. Reducers are pure and return the same reference when nothing changes.\n- Effects: every subscription, listener or timer created in an effect is removed in its cleanup\n  (Q-5). Effect dependency arrays are complete (`react-hooks/exhaustive-deps` is an error, not a\n  warning). Helpers used inside an effect live inside it or are stable (`useCallback`, module scope).\n- No context providers until two unrelated subtrees need the same state; prop drilling two levels\n  is fine.\n- Inline styles are acceptable for this assignment's grey form (X-3); keep them small and local.\n  A component with more than ~6 style properties gets a CSS class in `App.css`.\n- User-visible strings come from `ui-strings.ts` (A-7); no literals in JSX.\n\n## 7. Errors, logging and defensive code\n\n- Validate every external input at the boundary (`postMessage` payloads through the contract\n  guards; OHIF measurement objects through `toMetrics`). Inside the boundary, trust the types.\n- Ignored input is logged once with a reason at the level that matches its severity:\n  `console.debug` for expected noise (foreign origins, mid-drag frames), `console.info` for\n  intentional no-ops, `console.warn` for something a developer should look at, `console.error`\n  for broken invariants. `console.log` is not used (lint rule).\n- No silent `catch {}`; a swallowed error is logged with context.\n- No `!` non-null assertions; narrow explicitly.\n\n## 8. Comments\n\n- Comments explain _why_, not _what_. A branch that exists because of a requirement, a decision\n  or an OHIF quirk cites it: `// Q-1: commands before VIEWER_READY are queued, never dropped.`\n- OHIF behaviour that we depend on is cited with `file:line` in the fork at the version we pin.\n- No commented-out code, no TODO without an owner and a graph node or follow-up entry in\n  `docs/STATE.md`.\n- English only; no mention of AI tools anywhere in code or comments (AI usage is documented in\n  `AI-USAGE.md`).\n\n## 9. Tests\n\n- Vitest. Targeted tests only (X-4): pure logic (reducers, totals, throttle, contract guards) and\n  the bridge client behaviour. No snapshot tests, no tests of styling.\n- Test names read as behaviour: `it('queues a command sent before VIEWER_READY and flushes it in order')`.\n- Arrange / act / assert with blank lines between; one behaviour per test; assert on state or on\n  calls (`vi.fn()`), not on implementation details.\n- Reference equality (`toBe`) is used to assert \"nothing changed\" in reducers.\n- A bug fix comes with the test that would have caught it.\n\n## 10. Git and review\n\n- Conventional Commits, English, no trailers, no AI mentions (CLAUDE.md §4).\n- A PR is one slice; its description follows the template in CLAUDE.md and cites canon IDs.\n- `npm run lint`, `npm run format:check`, `npm run typecheck`, `npm run test`, `npm run check:graph`,\n  `npm run check:contract` all pass before gate 2. A PR that changes docs also runs\n  `npm run docs:build` and commits the result.\n\n## 11. The OHIF fork\n\n- Only `extensions/scoring-bridge/` and the one registration line in `pluginConfig.json` change.\n- The extension follows this document. The fork's own ESLint does not run at v3.12.17 (ESLint 9\n  with a legacy `.eslintrc.json` and `@typescript-eslint` 5 crashes while loading rules), and we do\n  not replace OHIF's tooling. `npm run lint:fork` applies the rules from this document that need no\n  type information (`scripts/eslint-fork-style.config.js`); the fork's Prettier formats the\n  extension, except the contract copy, which keeps this repository's formatting to stay\n  byte-identical. Type-aware rules are checked in review.\n- `AppTypes` and other OHIF globals are used as typed; no `any` for OHIF objects, use the narrowest\n  structural type that covers what we read.\n"},{"path":"CLAUDE.md","title":"Working rules","group":"Process","md":"# CLAUDE.md — working rules for this repository\n\nTest assignment: a micro-frontend \"Viewer + Scoring Form\" — an OHIF Viewer (fork + our own bridge\nextension) and a host-app (React + TypeScript, Vite) that communicate via `window.postMessage`\nwhile served from different ports.\n\n## 0. Roles, models, and language\n\n- **Assistant role: architect.** The main session (Claude Fable) owns planning, the canon, the feature\n  graph, slice gates, and review of every line produced by subagents. It does not write production\n  code or tests itself unless a change is trivial (a few lines) and reviewed inline.\n- **Subagents do the implementation.** Development and test-writing are delegated to subagents.\n  Subagents that write code or tests **must not run on Fable**; use a lower tier (Opus, or Sonnet\n  for narrow, well-specified tasks). Each subagent gets a self-contained brief: canon IDs, graph\n  nodes, files in scope, constraints from this file, and the verification commands to run.\n- **Roles are defined in [`.claude/agents/`](.claude/agents/):** `architect` (planning, docs,\n  review), `developer` (implementation), `tester` (tests and verification), `researcher`\n  (read-only investigation with citations), `git-operator` (commit / PR / merge after approval).\n  Each file fixes the model, the tools and the prompt; briefs are written for one of these roles.\n- **Code style is defined in [`docs/CONVENTIONS.md`](docs/CONVENTIONS.md)** (decision A-13) and\n  enforced by `npm run lint` and `npm run format:check`; both must be green before gate 2.\n- **Architect verifies subagent output** before presenting a slice result: reads the diff, runs\n  lint / typecheck / tests, and checks traceability to the canon. Subagent output is never\n  forwarded to the user unreviewed.\n- **Language policy:**\n  - Chat replies to the user — **Ukrainian**.\n  - Everything that lives in the repository or on GitHub — **English**: this file, docs\n    (`CANON.md`, `FEATURE-GRAPH.md`, `README.md`, `ARCHITECTURE.md`, `AI-USAGE.md`), code,\n    comments, commit messages, branch names, PR titles and descriptions.\n  - The original assignment text is quoted in the canon verbatim in its source language; the\n    atomic requirements derived from it are written in English.\n\n## 1. Canon\n\n- **The canon** is the single source of truth for requirements: [docs/CANON.md](docs/CANON.md).\n- The canon contains the assignment text split into atomic requirements with immutable IDs:\n  - `C-<section>.<item>` — mandatory requirements (e.g. `C-4.3.5` — \"the viewer sends the area\n    together with an identifier\");\n  - `Q-<n>` — quality requirements from section 5 (handshake, origin, correlation, echo loop,\n    cleanup, units, types);\n  - `S-5.x` — bonus (\"star\") tasks;\n  - `D-<n>` — deliverables (README, ARCHITECTURE, AI-USAGE, PRs, video);\n  - `X-<n>` — explicit prohibitions from section 8 (\"what not to do\").\n- The canon is **never edited silently**. Any change (resolving an ambiguity, an own decision) is a\n  separate entry in the \"Decisions on ambiguities\" section, dated and justified, and only after\n  user approval.\n- Decisions made on top of the canon are duplicated in the \"Decisions\" section of `ARCHITECTURE.md`.\n- Code that does not trace to a canon requirement is not written. If something is needed and the\n  canon lacks it, propose a canon amendment first.\n\n## 2. Feature graph\n\n- The feature graph: [docs/FEATURE-GRAPH.md](docs/FEATURE-GRAPH.md). It **derives from the canon**\n  and does not exist without it.\n- Every node `F-<nn>` contains:\n  - name and short description;\n  - `canon:` — list of requirement IDs it closes (mandatory, non-empty);\n  - `depends_on:` — nodes it depends on;\n  - `slice:` — the slice / PR in which it is implemented;\n  - `status:` — `planned` → `approved` → `in-progress` → `review` → `done`;\n  - `verify:` — how to verify (manual scenario and/or tests).\n- The graph is visualised as a Mermaid diagram in the same file; table and diagram must match.\n- Invariants checked before every slice:\n  - every mandatory requirement `C-*`, `Q-*`, `D-*` is covered by at least one node;\n  - the graph has no cycles;\n  - a node is not started until all of its `depends_on` are `done`;\n  - bonus `S-*` nodes are planned only after the mandatory part is `done`.\n- Statuses in the graph are updated in the same slice where the work changes.\n\n## 3. Working in slices (mandatory)\n\nThe assignment is split into **slices** (vertical, self-contained, each = one branch = one PR).\nEvery slice passes through **user approval** at two gates:\n\n1. **Slice plan → approval.** Before any code is written, show:\n   - graph nodes and canon IDs being closed;\n   - list of files to be created / changed;\n   - key decisions and alternatives (brief, with a recommendation);\n   - how it will be verified;\n   - which subagents will be spawned, on which model, with which brief.\n     No code is written without an explicit \"ok\".\n2. **Slice result → approval.** After implementation, show a diff summary, verification results\n   (lint, typecheck, tests, manual scenario), the architect's review notes on the subagent output,\n   and a draft PR description. No commit / push / PR / merge without an explicit \"ok\".\n\nRules:\n\n- One slice at a time. The next slice does not start until the previous one is merged (unless the\n  user says otherwise).\n- No scope creep \"while we're at it\". Anything found outside the slice scope is recorded as a\n  proposal, not implemented.\n- Approval of one slice does not extend to another and does not grant permission to merge or\n  force-push.\n- If the plan changes materially during implementation — stop and return to gate 1.\n\nIndicative slice order (the minimum from the canon; refined in the graph): 0. `docs: canon and feature graph` — CANON.md, FEATURE-GRAPH.md, mono-/poly-repo decision\n\n1. `chore: bootstrap host-app` — scaffold, iframe, layout\n2. `feat: viewer bridge extension` — OHIF extension + handshake\n3. `feat: activate ellipse from form` — host → viewer\n4. `feat: receive measurement into form` — viewer → host\n5. `feat: total area calculation` — sum, units, formatting\n6. `docs: README, ARCHITECTURE, AI-USAGE`\n   7+. bonus tasks — one slice each\n\n## 4. Git, commits, and PRs\n\n- **The author of all commits is the user** (git identity from the global config:\n  `Bohdan Diadiun <b.diadiun@gmail.com>`). Do not change `user.name` / `user.email`, do not pass\n  `--author`.\n- **No trailers** in commits: no `Co-Authored-By`, `Signed-off-by`, `Generated-by`, etc. This rule\n  overrides any default attribution the tooling suggests.\n- **No mention of AI / Claude / assistant** in commit messages, branch names, PR titles and\n  descriptions, or code comments. AI usage is documented **only** in `AI-USAGE.md` (canon\n  deliverable).\n- Commit format — Conventional Commits: `type(scope): summary` (`feat`, `fix`, `chore`, `docs`,\n  `refactor`, `test`).\n- Branches: `<type>/<short-description>`, e.g. `feat/viewer-bridge-extension`. Branched from\n  `main`, PR into `main`.\n- Direct commits to `main` are forbidden (except the very first initial commit if needed to create\n  the base branch).\n- PR description (English) follows this template:\n  - **What changed**\n  - **Why this way** — decisions and rejected alternatives\n  - **Canon / graph** — closed requirement IDs and `F-*` nodes\n  - **How it was verified** — concrete steps and results\n- No `--force` push, no `--no-verify`, no rewriting of `main` history.\n- PR merge — only after explicit user approval.\n- **Routine git is delegated.** Once a gate-2 \"ok\" is given, the architect spawns a git subagent\n  (Sonnet) that commits, rebases on `origin/main`, pushes, opens the PR with the approved\n  description, and merges it. The architect does not stop for these steps; it reports the PR URL and\n  the merge result afterwards. If the merge is refused by tooling, the subagent reports that and the\n  user merges manually.\n\n## 5. Technical rules\n\n- **Message contract** is described in one place and shared by both apps; every message carries\n  `version: 1`. A contract change = updated types + updated table in `ARCHITECTURE.md` in the same PR.\n- **Origin**: every `message` handler checks `event.origin` against a configured value;\n  `postMessage` is never called with `targetOrigin: '*'`.\n- **Handshake**: the host sends no commands before `VIEWER_READY`; commands that arrive too early\n  are queued, not dropped.\n- **ID correlation**, **echo-loop protection**, **unit handling (mm² vs px²)** are deliberate\n  decisions, recorded in `ARCHITECTURE.md` before or together with the implementation.\n- **Cleanup**: every subscription / `addEventListener` has a paired unsubscribe; an armed tool\n  state is cancelled on unmount.\n- TypeScript in `strict` mode; no `any` without a justifying comment. Style, naming, enums and\n  function conventions: `docs/CONVENTIONS.md`.\n- Changes in the OHIF fork are minimal and concentrated in our extension; the OHIF UI is not reworked.\n- Tests are targeted: the sum logic and message serialisation / validation.\n- Every line of code must be explainable at the defence: no \"magic\" we cannot justify.\n\n## 6. Session start, context discipline, subagent briefs\n\n### Session start\n\n1. Read this file, then [docs/STATE.md](docs/STATE.md), then only the rows of\n   [docs/FEATURE-GRAPH.md](docs/FEATURE-GRAPH.md) for the current slice.\n2. Run `npm run check:graph`.\n3. Continue from the gate recorded in `STATE.md`. Decisions already in `docs/decisions/` are not\n   re-derived.\n\n### Context discipline\n\n- One session = one slice. `STATE.md` is updated in the same commit as the work, so a fresh session\n  can resume after a context reset.\n- Never read the OHIF fork (`viewer/`) wholesale. Look things up with an Explore subagent and record\n  the answer (file, symbol, ~30 lines of conclusion) in `docs/notes/ohif-<topic>.md`; later sessions\n  read the note, not the source.\n- Subagent reports are capped at ~40 lines: what changed, verification output, open questions.\n  No transcripts, no file dumps.\n- Large command output goes to a file in the scratchpad and is summarised, not pasted.\n\n### Subagent brief template\n\nEvery implementation / test / git subagent receives a self-contained brief with these sections:\n\n```\nRole: <developer | test writer | git operator>   Model: <opus | sonnet>\nRepository: <path>; branch: <name>; do not run git unless you are the git operator.\nRead first: CLAUDE.md (follow it), docs/CONVENTIONS.md, then <exact files>.\nScope: closes <F-nn> / canon <IDs>. Files you may create or modify: <list>. Nothing else.\nConstraints: English only; no AI mentions; TypeScript strict; no new dependencies unless listed: <list>.\nDecisions already made (do not revisit): <A-n summaries or links>.\nVerification you must run and paste: <commands>.\nReport (max 40 lines): files changed, verification output, deviations from the brief, open questions.\n```\n"},{"path":"docs/decisions/A-1-mono-repo-with-submodule.md","title":"A-1 · mono repo with submodule","group":"Decisions","md":"# A-1 — Mono-repo with the OHIF fork as a git submodule\n\nStatus: approved 2026-09-16. Canon: D-1, C-4.1.1.\n\n## Context\n\nThe assignment allows either two repositories or a mono-repo and asks for the choice to be explained.\nThe message contract (C-4.4) is shared by both sides; a change to it touches the host-app and the\nviewer extension at the same time.\n\n## Decision\n\nThis repository is the mono-repo: `host-app/` lives here, and the OHIF fork\n(https://github.com/bdiadiun/Viewers) is mounted as a git submodule at `viewer/`, pinned to a commit\non our fork branch. The bridge extension lives inside the fork under `extensions/`.\n\n## Rejected alternatives\n\n- Two independent repositories: every contract change needs two PRs and a manual version dance;\n  the \"history of thinking\" (D-4) is split.\n- Vendoring the OHIF source into this repo: hundreds of megabytes, loses the upstream link and the\n  ability to show the fork diff.\n\n## Consequences\n\n- `README.md` must document `git clone --recurse-submodules` (D-5).\n- A change in the extension is two commits: one in the fork (own PR there), one bumping the\n  submodule pointer here. A contract change is therefore never a single PR; the main-repo PR links\n  the fork PR and `npm run check:contract` guards the copy (A-12).\n- What the mono-repo buys, stated honestly (re-confirmed 2026-09-16): one clone with the viewer\n  pinned to the exact tested commit; the contract as a real package for host-app; canon, graph,\n  ARCHITECTURE and decisions in one place. It does not buy atomic cross-repo changes.\n"},{"path":"docs/decisions/A-2-ports.md","title":"A-2 · ports","group":"Decisions","md":"# A-2 — Fixed ports 5173 (host-app) and 3000 (viewer)\n\nStatus: approved 2026-09-16. Canon: C-4.2.3, Q-2.\n\n## Context\n\nThe two apps must run on different ports (C-4.2.3) and each side must check `event.origin`\nagainst a configured value (Q-2).\n\n## Decision\n\nhost-app runs on `http://localhost:5173`, the viewer on `http://localhost:3000`. Both values are\nconstants in each app's config and are the only accepted origins.\n\n## Rejected alternatives\n\n- Reading the origin from the incoming message: defeats the purpose of the check.\n- Environment-driven ports: extra setup on the reviewer's machine for no benefit in this assignment.\n\n## Consequences\n\n- The README \"clean machine\" run uses exactly these ports; a port clash is documented as a known issue.\n"},{"path":"docs/decisions/A-3-defence-readiness-ids.md","title":"A-3 · defence readiness ids","group":"Decisions","md":"# A-3 — `P-*` ID class for defence-readiness items\n\nStatus: approved 2026-09-16. Canon: section 9.\n\n## Context\n\nSection 9 of the assignment lists questions and live changes for the defence call. They are not\nrequirements, but they constrain design: a tool swap (P-7) or a new row field (P-8) must be cheap.\n\n## Decision\n\nSection 9 items get IDs `P-1..P-9`. Graph nodes may reference them in addition to (never instead of)\na `C/Q/D` ID.\n\n## Rejected alternatives\n\n- Leaving them as prose: the design implications would not be traceable to code.\n\n## Consequences\n\n- `docs/DEFENCE.md` (slice 6) maps every `P-n` to a file and line.\n"},{"path":"docs/decisions/A-4-cancelled-activation.md","title":"A-4 · cancelled activation","group":"Decisions","md":"# A-4 — Cancelled activation keeps the row in `Pending`\n\nStatus: approved 2026-09-16. Canon: C-4.3.3, C-4.4.1, D-8 (d).\n\n## Context\n\nThe assignment defines `DEACTIVATE_TOOL` (\"cancel waiting for drawing\") and requires the demo to\nshow \"Activate clicked, then changed mind\", but does not say what happens to the row.\n\n## Decision\n\nCancelling sends `DEACTIVATE_TOOL` for that row; the viewer returns to the default tool; the row\nreturns from `Drawing…` to `Pending` and is kept, so it can be activated again or deleted.\n\n## Rejected alternatives\n\n- Deleting the row on cancel: surprising, and loses the row's identity.\n- Leaving the row in `Drawing…`: the form and the viewer would disagree on the armed state.\n\n## Consequences\n\n- Only one row can be in `Drawing…` at a time; activating another row cancels the previous one.\n"},{"path":"docs/decisions/A-5-deferred-bridge-decisions.md","title":"A-5 · deferred bridge decisions","group":"Decisions","md":"# A-5 — Bridge decisions are taken in the slice that implements them\n\nStatus: resolved 2026-09-16 by A-8..A-11 (grounded in docs/notes/ohif-bridge-api.md). Canon: Q-1, Q-3, Q-4, Q-6.\n\n## Context\n\nID issuance (Q-3), the early-command queue (Q-1), echo-loop protection (Q-4) and mixed-unit sums\n(Q-6) depend on the real `measurementService` API of the chosen OHIF version.\n\n## Decision\n\nEach is decided in its implementing slice, gets its own `A-n` record and a row in\n`ARCHITECTURE.md` → \"Decisions\" in the same PR. Until then the canon marks them open.\n\n## Consequences\n\n- Slice 2 planning starts with an OHIF research note (`docs/notes/ohif-*.md`) that grounds these decisions.\n"},{"path":"docs/decisions/A-6-ohif-base-version.md","title":"A-6 · ohif base version","group":"Decisions","md":"# A-6 — OHIF fork branch based on release tag `v3.12.17`\n\nStatus: approved 2026-09-16. Canon: C-4.1.1, D-5.\n\n## Context\n\nUpstream `master` (3.14.0-beta) requires Node >= 24 and pnpm 11. The latest stable release\n`v3.12.17` (2026-09-10) requires Node >= 18 and yarn 1.22. The development machine has Node 22.\n\n## Decision\n\nOur fork branch is created from tag `v3.12.17`. The bridge extension targets that API.\nNode is pinned via `.nvmrc` (22) at the repository root; yarn 1 is enabled through corepack.\n\n## Rejected alternatives\n\n- Tracking `master`: moving target, forces a Node/pnpm upgrade on every reviewer's machine.\n\n## Consequences\n\n- The README lists Node 22 and corepack as the only prerequisites.\n- Upgrading OHIF later is a deliberate decision, not a side effect of `git pull`.\n"},{"path":"docs/decisions/A-7-ui-language.md","title":"A-7 · ui language","group":"Decisions","md":"# A-7 — Form UI strings are Ukrainian, code stays English\n\nStatus: approved 2026-09-16. Canon: C-4.3.1–C-4.3.8, X-3.\n\n## Context\n\nThe assignment and its diagram show Ukrainian labels (\"Додати вимірювання\", \"Активувати\",\n\"Очікує / Малювання… / Готово\", \"Разом\"). Repository rules require English code and docs.\n\n## Decision\n\nAll user-visible strings live in `host-app/src/ui-strings.ts` in Ukrainian, with English\ncomments. Components reference keys, never literals. Everything else in the repository is English.\n\n## Rejected alternatives\n\n- English UI: the demo video and the screen would differ from what the reviewer expects.\n- A full i18n library: out of scope (X-3), one constants file is enough.\n\n## Consequences\n\n- Translating or renaming a label is a one-file change.\n"},{"path":"docs/decisions/A-8-id-correlation.md","title":"A-8 · id correlation","group":"Decisions","md":"# A-8 — ID correlation: host issues `rowId`, viewer issues `measurementUid`\n\nStatus: approved 2026-09-16. Canon: Q-3, C-4.3.5, C-4.3.6, P-3.\n\n## Context\n\nEach form row and each annotation need an identifier, and the assignment asks who issues which.\nOHIF facts (see `docs/notes/ohif-bridge-api.md`): a measurement's `uid` is the cornerstone\n`annotationUID`, stable across ADDED / UPDATED / REMOVED; `_isValidMeasurement` rejects any\ncustom top-level field, so an external ID cannot be stored on the measurement; `label` is\nuser-editable in the OHIF panel.\n\n## Decision\n\n- The host creates a row with a UUID `rowId` before anything is drawn (needed for C-4.3.2).\n- `ACTIVATE_TOOL { rowId, toolName }` arms the bridge: `pendingRowId = rowId`.\n- On `MEASUREMENT_ADDED` from OHIF the bridge emits `{ rowId: pendingRowId, measurementUid: uid, ... }`,\n  stores `uid → rowId` in its own map, and clears `pendingRowId`.\n- `MEASUREMENT_UPDATED` / `MEASUREMENT_REMOVED` carry `measurementUid`; both sides resolve the row\n  through their map (the viewer must keep one too, because REMOVED delivers only the uid string).\n- A measurement created while nothing is armed (drawn from the OHIF toolbar) is forwarded with\n  `rowId: null`; the host logs and ignores it.\n- Before activating a tool the bridge snapshots the active primary tool\n  (`toolGroupService.getActivePrimaryMouseButtonTool()`) and restores it after the measurement or\n  on `DEACTIVATE_TOOL`. In the longitudinal mode that tool is WindowLevel; the assignment's\n  \"Pan/default\" is read as \"whatever was active before\".\n\n## Rejected alternatives\n\n- Viewer issues the row ID: the form could not show an empty `Pending` row before drawing.\n- Host issues the measurement UID: requires reaching into the cornerstone annotation manager and\n  fighting `_isValidMeasurement`; brittle across OHIF upgrades.\n- Carrying `rowId` in `label`: survives validation but the user can edit it in the OHIF panel.\n\n## Consequences\n\n- Only one row can be armed at a time; arming another row cancels the previous one (A-4).\n- If the decision were flipped (P-3), C-4.3.2 breaks and the bridge would need write access to\n  cornerstone internals.\n"},{"path":"docs/decisions/A-9-handshake-and-queue.md","title":"A-9 · handshake and queue","group":"Decisions","md":"# A-9 — Handshake: `ready` flag and an uncoalesced FIFO command queue\n\nStatus: approved 2026-09-16. Canon: Q-1, C-4.4.1, P-1, P-9.\n\n## Context\n\nThe host must not send commands before `VIEWER_READY`, and a click during iframe load must not be lost.\n\n## Decision\n\n- The host bridge client keeps `ready: boolean` and `queue: HostCommand[]`.\n- `send(cmd)`: if not ready, push to the queue; else `postMessage` to the iframe's `contentWindow`\n  with `targetOrigin = VIEWER_ORIGIN`.\n- On `VIEWER_READY`: set `ready`, flush the queue in order. No coalescing (an ACTIVATE followed by a\n  DEACTIVATE for the same row are both sent; the viewer ends in the right state anyway).\n- A second `VIEWER_READY` (iframe reload) resets `ready`, then re-sends `ACTIVATE_TOOL` for the row\n  currently in `Drawing…`, if any.\n- Bridge state (`ready`, queue length, last message) is exposed for a small dev status line, so a\n  missing `VIEWER_READY` is diagnosable on screen (P-9).\n\n## Rejected alternatives\n\n- Dropping early commands: violates Q-1.\n- Polling the iframe until it answers: extra protocol for no gain.\n- Smart queue coalescing: more code paths to defend, no user-visible benefit.\n\n## Consequences\n\n- The queue is the answer to P-1; the dev status line is the answer to P-9.\n"},{"path":"docs/decisions/A-10-echo-guard.md","title":"A-10 · echo guard","group":"Decisions","md":"# A-10 — Echo-loop protection\n\nStatus: approved 2026-09-16. Canon: Q-4, P-6.\n\n## Context\n\n`measurementService.update(...)` and `remove(...)` re-broadcast `MEASUREMENT_UPDATED` / `REMOVED`.\nIf the host reacts to those by sending a command that triggers the same service call, the two apps\nping-pong forever.\n\n## Decision\n\n- Mandatory part: the host never sends a command in reaction to a `MEASUREMENT_*` event. No loop by\n  construction.\n- Bonus tasks (S-5.1, S-5.2): every host command carries a `requestId`; when the bridge executes a\n  command that provokes a service event, the outgoing event carries `causedBy: requestId`. The host\n  ignores events whose `causedBy` it issued. Additionally, commands are idempotent: the host does not\n  send a command when its state already matches (e.g. a row already cleared is not deleted again).\n- `MEASUREMENT_UPDATED` is throttled on the viewer side (it fires per drag frame).\n\n## Rejected alternatives\n\n- Suppressing events by a global \"muted\" flag: races with genuine user edits during the window.\n\n## Consequences\n\n- The loop point to show at the defence (P-6) is the bridge handler for `DEACTIVATE_TOOL`/delete\n  and the `MEASUREMENT_REMOVED` subscriber.\n"},{"path":"docs/decisions/A-11-units-and-metrics-payload.md","title":"A-11 · units and metrics payload","group":"Decisions","md":"# A-11 — Units copied from OHIF; extensible `metrics` payload; per-unit sums\n\nStatus: approved 2026-09-16. Canon: Q-6, C-4.3.8, C-4.4.2, P-8.\n\n## Context\n\nArea arrives in mm² when the image has pixel spacing and in px² otherwise. OHIF exposes it as\n`measurement.data[targetId].area` with `areaUnit` computed by cornerstone3D.\n\n## Decision\n\n- The bridge copies `area` and `areaUnit` as is into `metrics: { area: { value, unit } }` with\n  `unit: 'mm2' | 'px2'` (normalised spelling; the display layer renders `mm²` / `px²`).\n- `metrics` is a record keyed by metric name, so a new metric (perimeter, mean intensity — P-8) is a\n  new key, not a new message type.\n- The total is computed per unit: rows are grouped by `unit`, each group summed separately. The\n  footer shows the mm² total and, only if px² rows exist, a second line for px² with a hint that\n  those images have no pixel spacing. mm² and px² are never added together.\n- Unit tests cover: mixed units, empty list, rows without a value, rounding to one decimal.\n\n## Rejected alternatives\n\n- Flat `value` / `unit` fields: simpler, but P-8 would change the message type.\n- Converting px² to mm² with a guessed spacing: fabricates clinical numbers.\n\n## Consequences\n\n- The sum function is pure and lives in `host-app/src/form/totals.ts`, the natural test target (X-4).\n"},{"path":"docs/decisions/A-12-npm-workspaces.md","title":"A-12 · npm workspaces","group":"Decisions","md":"# A-12 — npm workspaces for host-app and the contract package; the viewer stays outside\n\nStatus: approved 2026-09-16. Canon: Q-7, D-1, A-1.\n\n## Context\n\nThe mono-repo holds `host-app/`, the shared message contract, and the OHIF fork as a git\nsubmodule. The fork is a yarn 1 monorepo with its own workspaces and must remain a\nself-contained repository.\n\n## Decision\n\n- Root `package.json` declares npm workspaces `host-app` and `packages/*`.\n- The contract is the package `@scoring/contract` in `packages/contract/`, consumed by\n  `host-app` as a regular dependency (symlinked by npm). TypeScript source is consumed directly;\n  no build step.\n- `viewer/` (the submodule) is not a workspace. The bridge extension holds a byte-identical copy\n  of `packages/contract/src/messages.ts`, verified by `npm run check:contract`.\n\n## Rejected alternatives\n\n- Vite alias to a shared folder: works, but hides the dependency and does not scale to more packages.\n- Making the extension import from outside the submodule: breaks the fork as a standalone repo.\n- Publishing the contract to a registry: overkill for this assignment.\n\n## Consequences\n\n- One root `package-lock.json`; `npm install` at the root installs host-app and the package.\n- The fork is installed separately with yarn (`viewer/`), documented in README.\n"},{"path":"docs/decisions/A-13-coding-conventions.md","title":"A-13 · coding conventions","group":"Decisions","md":"# A-13 — Coding conventions, lint enforcement and agent roles\n\nStatus: approved 2026-09-16. Canon: Q-7, D-3, section 10 (\"code quality\": typing, effect cleanup, structure, readability).\n\n## Context\n\nSlices 1–11 were written by several assistant sessions from briefs that named the canon and the\nfiles in scope but no shared style. The result is consistent in structure but mixed in idiom:\n`function` declarations next to arrows, string-literal action types, oxlint from the Vite template\nthat cannot enforce naming or function style.\n\n## Decision\n\n- One style document, `docs/CONVENTIONS.md`, is the source of truth; every agent brief points to it.\n- Functions: arrow functions everywhere (components, hooks, utilities, handlers); `function`\n  declarations only where hoisting is genuinely required, with a comment.\n- Enums: string enums for application state (row status, reducer action types, UI modes); numeric\n  enums are forbidden. The wire contract in `packages/contract` keeps string-literal union types:\n  it is the serialised format, copied into the OHIF fork, and literal types are the\n  recommendation of typescript-eslint and the Google TypeScript style guide for such boundaries.\n- Tooling: ESLint 9 flat config with `typescript-eslint` `strict-type-checked` and\n  `stylistic-type-checked`, `eslint-plugin-react-hooks`, `eslint-plugin-react-refresh`,\n  Prettier for formatting; oxlint removed. `npm run lint` and `npm run format:check` must pass with\n  zero warnings before a slice reaches gate 2.\n- Agent roles live in `.claude/agents/` (architect, developer, tester, git-operator, researcher)\n  with model, tools and a prompt that embeds the brief template and the conventions.\n\n## Rejected alternatives\n\n- Google/Airbnb hybrid (`function` for top-level names): equally valid, but the author prefers a\n  single arrow style and it is simpler to enforce.\n- Enums in the contract too: consistent, but couples the wire format to a TypeScript-only\n  construct and diverges from the typescript-eslint recommendation.\n- `as const` objects instead of enums: the TypeScript team's advice, rejected by the author in\n  favour of enum readability for internal state.\n\n## Consequences\n\n- `erasableSyntaxOnly` (TypeScript 5.8, enabled by the Vite template) forbids enums, so it is\n  turned off in `host-app/tsconfig.app.json`. The trade-off is accepted: host-app is always built\n  by Vite/esbuild, never run through Node's type stripping, and the contract package, which must\n  stay erasable, contains no enums.\n\n- Slice 13 refactors existing code to the conventions; lint is allowed to be red only in the PR\n  that introduces the rules.\n- The fork extension follows the same document; its lint runs through OHIF's own ESLint config,\n  so the conventions there are checked by review plus Prettier.\n"},{"path":"docs/decisions/README.md","title":"Decisions index","group":"Decisions","md":"# Decision records\n\nOne file per decision, indexed in [CANON.md → \"Decisions on ambiguities\"](../CANON.md#decisions-on-ambiguities).\nFormat: Context, Decision, Rejected alternatives, Consequences, Status. Approved decisions are mirrored\ninto `ARCHITECTURE.md` → \"Decisions\" in the slice that implements them.\n"}];
  const ID_RE = /\b(C-\d+(?:\.\d+)+|Q-\d+|S-5\.\d|D-\d+|X-\d+|P-\d+|A-\d+|F-\d\d)\b/g;
  const CANON = 'docs/CANON.md',
    GRAPH = 'docs/FEATURE-GRAPH.md';
  const byPath = Object.fromEntries(DOCS.map((d) => [d.path, d]));
  const decisionDoc = (id) => DOCS.find((d) => d.path.startsWith('docs/decisions/' + id + '-'));

  // Home of each ID: canon rows for C/Q/S/D/X/P, graph rows for F, decision file for A.
  const homeOf = (id) => {
    if (id.startsWith('F-')) return { path: GRAPH, anchor: id };
    if (id.startsWith('A-')) {
      const d = decisionDoc(id);
      return d ? { path: d.path, anchor: null } : { path: CANON, anchor: id };
    }
    return { path: CANON, anchor: id };
  };
  // One-line description of an ID, read from the canon / graph table row text.
  const descCache = {};
  const describe = (id) => {
    if (descCache[id] !== undefined) return descCache[id];
    const home = homeOf(id);
    const src = byPath[home.path].md;
    let text = '';
    for (const line of src.split('\n')) {
      const cells = line.split('|').map((s) => s.trim());
      if (cells.length > 2 && (cells[1] === id || cells[1].startsWith('[' + id + ']'))) {
        text = cells.slice(2).filter(Boolean).join(' · ').replace(/[`*]/g, '');
        break;
      }
    }
    if (!text && id.startsWith('A-')) text = (src.match(/^# .*$/m) || [''])[0].replace(/^# /, '');
    descCache[id] = text;
    return text;
  };

  marked.use({ gfm: true });
  const renderDoc = (path) => {
    const d = byPath[path];
    if (!d) return;
    let md = d.md.replace(
      /```mermaid\n([\s\S]*?)```/g,
      (m, body) => '<pre class="mermaid">' + body.replace(/</g, '&lt;') + '</pre>',
    );
    let html = marked.parse(md);
    const el = document.getElementById('article');
    el.innerHTML = '<div class="path">' + path + '</div>' + html;
    // wrap tables for horizontal scroll
    el.querySelectorAll('table').forEach((t) => {
      const w = document.createElement('div');
      w.className = 'tablewrap';
      t.parentNode.insertBefore(w, t);
      w.appendChild(t);
    });
    // relative links between docs → in-page routes
    el.querySelectorAll('a[href]').forEach((a) => {
      const href = a.getAttribute('href');
      if (/^(https?:|#|mailto:)/.test(href)) return;
      const target = resolve(path, href.split('#')[0]);
      if (byPath[target]) {
        a.setAttribute('href', '#doc=' + encodeURIComponent(target));
      } else {
        a.classList.add('missing');
        a.title = 'Not part of this bundle: ' + target;
      }
    });
    // anchors on table rows whose first cell is an ID
    el.querySelectorAll('tr').forEach((tr) => {
      const c = tr.querySelector('td');
      if (!c) return;
      const m = c.textContent
        .trim()
        .match(/^(C-\d+(?:\.\d+)+|Q-\d+|S-5\.\d|D-\d+|X-\d+|P-\d+|A-\d+|F-\d\d)$/);
      if (m) tr.id = m[1];
    });
    linkIds(el);
    window.renderMermaid && window.renderMermaid(el);
    document
      .querySelectorAll('nav a')
      .forEach((a) => a.classList.toggle('active', a.dataset.path === path));
    document.title = d.title + ' · Scoring Bridge Docs';
  };
  const resolve = (from, rel) => {
    const base = from.split('/').slice(0, -1);
    const parts = rel.split('/');
    for (const p of parts) {
      if (p === '..') base.pop();
      else if (p !== '.' && p !== '') base.push(p);
    }
    return base.join('/');
  };
  // Turn bare IDs in text nodes into links; skip code, pre and existing links.
  const linkIds = (root) => {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) =>
        n.parentElement.closest('code, pre, a, h1')
          ? NodeFilter.FILTER_REJECT
          : NodeFilter.FILTER_ACCEPT,
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const n of nodes) {
      if (!ID_RE.test(n.nodeValue)) {
        ID_RE.lastIndex = 0;
        continue;
      }
      ID_RE.lastIndex = 0;
      const frag = document.createDocumentFragment();
      let last = 0,
        m;
      while ((m = ID_RE.exec(n.nodeValue))) {
        frag.appendChild(document.createTextNode(n.nodeValue.slice(last, m.index)));
        const a = document.createElement('a');
        a.className = 'id';
        a.textContent = m[1];
        const home = homeOf(m[1]);
        a.href =
          '#doc=' + encodeURIComponent(home.path) + (home.anchor ? '&id=' + home.anchor : '');
        a.title = describe(m[1]) || m[1];
        a.addEventListener('mouseenter', () => showPanel(m[1]));
        frag.appendChild(a);
        last = m.index + m[0].length;
      }
      frag.appendChild(document.createTextNode(n.nodeValue.slice(last)));
      n.parentNode.replaceChild(frag, n);
    }
  };
  const showPanel = (id) => {
    const t = describe(id);
    if (!t) return;
    document.getElementById('idbody').innerHTML =
      '<b>' + id + '</b> — ' + escapeHtml(t).slice(0, 400);
    document.getElementById('idpanel').hidden = false;
  };
  const escapeHtml = (s) => {
    return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  };
  document.getElementById('idclose').onclick = () => {
    document.getElementById('idpanel').hidden = true;
  };

  // Navigation
  const groups = [...new Set(DOCS.map((d) => d.group))];
  document.getElementById('navlist').innerHTML = groups
    .map(
      (g) =>
        '<div class="group"><h2>' +
        g +
        '</h2>' +
        DOCS.filter((d) => d.group === g)
          .map(
            (d) =>
              '<a href="#doc=' +
              encodeURIComponent(d.path) +
              '" data-path="' +
              d.path +
              '">' +
              d.title +
              '</a>',
          )
          .join('') +
        '</div>',
    )
    .join('');
  const route = () => {
    const params = new URLSearchParams(location.hash.slice(1));
    const path = params.get('doc') || 'README.md';
    const id = params.get('id');
    renderDoc(path);
    if (id) {
      const tr = document.getElementById(id);
      if (tr) {
        tr.scrollIntoView({ block: 'center' });
        tr.classList.add('flash');
        setTimeout(() => tr.classList.remove('flash'), 2500);
      }
    } else window.scrollTo(0, 0);
    if (innerWidth <= 860) document.getElementById('nav').hidden = true;
  };
  addEventListener('hashchange', route);
  route();

  // Search: filter nav by title or by full-text / ID match
  document.getElementById('search').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('nav a').forEach((a) => {
      const d = byPath[a.dataset.path];
      a.hidden = q !== '' && !(d.title.toLowerCase().includes(q) || d.md.toLowerCase().includes(q));
    });
  });
  addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      document.getElementById('search').focus();
    }
  });
  document.getElementById('navToggle').onclick = () => {
    const n = document.getElementById('nav');
    n.hidden = !n.hidden;
    document.getElementById('navToggle').setAttribute('aria-expanded', String(!n.hidden));
  };
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>
try {
  mermaid.initialize({ startOnLoad: false, theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default' });
} catch (e) {}
window.renderMermaid = function (el) {
  try { mermaid.run({ nodes: el.querySelectorAll('pre.mermaid') }); } catch (e) {}
};
// The first document was rendered by the inline script above before this hook existed.
window.renderMermaid(document.getElementById('article'));
</script>
</body>
</html>
