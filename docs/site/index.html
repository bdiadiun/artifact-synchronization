e stored number without an annotation behind it would be dishonest.                                                                        | approved 2026-09-18   |\n| [A-15](decisions/A-15-publish-contract-package.md)          | 2026-09-18 | The contract is published to the public npm registry as `@bdiadiun/scoring-contract`, exports the guards and the tool-to-metric map both sides were re-implementing, and requires a world point to be exactly three coordinates; the fork's copy is removed once the first version is published.                                                                                                                                                                                                                                                                                                                                                                        | Public npm reads without a token, so the reviewer's clone stays token-free while the format gains one owner and an explicit version; the re-implemented guards had already drifted.                                                                           | approved 2026-09-18   |\n| [A-16](decisions/A-16-adapter-and-viewer-delivery.md)       | 2026-09-20 | The bridge extension is an adapter: a registry maps a command type to its handler, completeness is enforced against the contract's union at compile time, and the fork's diff stays frozen at the registration entry, the dependency line and the workflow. The viewer is delivered by deployment, not as an npm package.                                                                                                                                                                                                                                                                                                                                               | OHIF resolves commands and customizations at call time, so the adapter can grow without touching the fork; the built viewer is a 199 MB application bundle whose manifest points at a file the build never produces, so it is not consumable as a dependency. | approved 2026-09-20   |\n| [A-17](decisions/A-17-orchestrator-package.md)              | 2026-09-20 | The client half of the channel becomes the published package `@bdiadiun/scoring-orchestrator`: handshake, queue, origin checks, listeners and command builders. The React binding stays in the form, and a viewer is addressed by configuration.                                                                                                                                                                                                                                                                                                                                                                                                                        | The viewer is a deployed application and there may be several at different versions, while the piece that talks to them is one; the channel's safety rules then live in one tested place instead of being copied by the next host.                            | approved 2026-09-20   |\n| [A-18](decisions/A-18-viewer-checked-out-not-vendored.md)   | 2026-09-20 | The OHIF fork stops being a submodule. `viewer/` becomes a local checkout, ignored by git, cloned at an exact pinned commit by `npm run viewer:setup`. The fork itself stays on GitHub and remains the answer to C-3.2.                                                                                                                                                                                                                                                                                                                                                                                                                                                 | The reasons for vendoring expired once the contract and the channel became published packages and the fork's diff froze; a pinned clone reproduces just as exactly without putting a hundred thousand foreign files in the way of everyday work.              | approved 2026-09-20   |\n| [A-19](decisions/A-19-study-from-the-page-url.md)           | 2026-09-21 | Our own addition, not a requirement: the form reads a `study` parameter from its own URL, accepts it only if it looks like a DICOM identifier, encodes it into the viewer's URL and falls back to the previous constant.                                                                                                                                                                                                                                                                                                                                                                                                                                                | The value is the one piece of outside input the form puts into a URL, so it gets both defences, validation and encoding; and the per-study storage key finally means something.                                                                               | approved 2026-09-21   |\n| [A-20](decisions/A-20-three-layers.md)                      | 2026-09-21 | Three layers: the fork holds one registration entry and changes only when OHIF does; a published adapter registers our extensions through the extension manager in `preRegistration`; the extensions are packages the adapter depends on. Command names are prefixed per package, and we describe only the twelve OHIF members we call.                                                                                                                                                                                                                                                                                                                                 | An extension may register other extensions at v3.12.17, which separates OHIF's release schedule from ours; the alternative of supplying the adapter by deployment configuration was rejected because it duplicates React and moves failures into the browser. | approved 2026-09-21   |\n| [A-21](decisions/A-21-channel-and-exchange.md)              | 2026-09-21 | One package holds the channel both sides use: the origin check, the guard and the explicit target origin, with a generic `send`, `on` and `exchange` whose payload types follow from the message type. The contract gains the table of which event answers which command, and an answer that never arrives becomes an error rather than an unbounded wait.                                                                                                                                                                                                                                                                                                              | The security rules are implemented and tested once instead of twice; a method per message would be ceremony and a place to forget a field, while the typed pair cannot drift from the contract.                                                               | approved 2026-09-21   |\n| [A-22](decisions/A-22-one-channel-api.md)                   | 2026-09-22 | One channel API for both ends: the channel owns the post, the queue until the peer's ready message and the observable state; both applications register one handler map with `onEach`; an event goes channel → handler → reducer and `lastEvent` is gone; `@bdiadiun/scoring-orchestrator` is no longer released (supersedes A-17 and the registry part of A-16). The form keeps its reducer.                                                                                                                                                                                                                                                                           | approved 2026-09-22                                                                                                                                                                                                                                           |\n| [A-23](decisions/A-23-minimal-bridge.md)                    | 2026-09-22 | A minimal bridge: the viewer extension keeps only what is about OHIF (tool activation, `cachedStats` → metrics, annotation restore); announcing readiness, the armed row and `reply(command, …)` move into the channel's viewer end; the previous-tool snapshot, the ADDED correction timer, the `uid → rowId` gating and the de-duplication sets are removed; after a measurement the viewer returns to the fixed default tool. `ArmedRow` joins the contract (moved to the viewer channel in A-27).                                                                                                                                                                   | approved 2026-09-22                                                                                                                                                                                                                                           |\n| [A-24](decisions/A-24-plain-code.md)                        | 2026-09-22 | Plain code: each channel end is written on its own with concrete types and three shared helpers; no type exists only to make a signature type-check; guards are named functions with an exhaustive `switch`; a comment says only what the code cannot, under 10% of a package's lines. Readability outranks reuse at the seam between the two ends.                                                                                                                                                                                                                                                                                                                     | approved 2026-09-22                                                                                                                                                                                                                                           |\n| [A-25](decisions/A-25-version-in-the-channel.md)            | 2026-09-22 | The contract version belongs to the channel: it adds `version` to every posted message and refuses a foreign version before the guard runs; the contract describes message bodies only and neither application knows the version exists. Wire unchanged.                                                                                                                                                                                                                                                                                                                                                                                                                | approved 2026-09-22                                                                                                                                                                                                                                           |\n| [A-26](decisions/A-26-zod-contract.md)                      | 2026-09-22 | The contract is declared once as zod schemas: one `z.object` per message, discriminated unions for the two directions, types by `z.infer`, guards by `safeParse`; the `.props.ts` files and the primitive guards are gone. `zod` is the first library in the project. Wire unchanged.                                                                                                                                                                                                                                                                                                                                                                                   | approved 2026-09-22                                                                                                                                                                                                                                           |\n| [A-27](decisions/A-27-folder-layout.md)                     | 2026-09-22 | A folder names a side or a role (channel `host/ viewer/ shared/`, extension `commands/ events/ ohif/`, host-app `channel/ form/ components/ pages/`); no file under twenty lines; `index.ts` only as a package entry; `.props.ts` only beside a React component.                                                                                                                                                                                                                                                                                                                                                                                                        | approved 2026-09-22                                                                                                                                                                                                                                           |\n| [A-28](decisions/A-28-boundaries-as-schemas.md)             | 2026-09-22 | A foreign object is checked by one schema where it enters (wire, OHIF measurement, stored row); a shape is declared once and derived from (`StoredRow`, `MetricKey` enum, tool → metric map); an API without a caller is removed (`on`, viewer state, disposer set, `hostOrigin` option, optional OHIF services). One wire change: an unknown metric key is refused.                                                                                                                                                                                                                                                                                                    | approved 2026-09-22                                                                                                                                                                                                                                           |\n| [A-29](decisions/A-29-channel-is-transport.md)              | 2026-09-22 | The channel is transport only (origin, version, guard, typed `send`, one handler map, queue and `exchange` on the host end); the bridge keeps the armed row, announces once by unsubscribing, answers with a plain `send` carrying `causedBy`. Three approved behaviour changes: OHIF's own `MEASUREMENT_REMOVED` is no longer suppressed on a form-driven removal; `activate` sends no `DEACTIVATE_TOOL` for the previous row; every `VIEWER_READY` restores the current rows. Supersedes part of A-23.                                                                                                                                                                | approved 2026-09-22                                                                                                                                                                                                                                           |\n| [A-30](decisions/A-30-no-request-answer.md)                 | 2026-09-22 | Commands carry no `requestId`, events no `causedBy`; the one correlation is `rowId` (host) ↔ `measurementUid` (viewer), carried together by `MEASUREMENT_ADDED`. No echo loop by one rule per side: the form never sends in reaction to an event, the extension never sends in reaction to a command. `exchange`, pending answers, the answer table and the timeout are removed; `MEASUREMENTS_RESTORED` is an ordinary event. Supersedes A-10 and A-21, narrows A-8.                                                                                                                                                                                                   | approved 2026-09-22                                            |\n| [A-33](decisions/A-33-review-of-the-boundaries-refactor.md) | 2026-09-23 | Review of the boundaries refactor: `VIEWER_READY` is handled in the form's message handler with the rows on screen (no `announcements` counter); `MEASUREMENT_UPDATED` keeps its geometry; a restore mark is cleared when the row is restored, cleared or redrawn; one effect owns the viewer bridge and a standalone viewer has no peer; the channel package is React-free; C-3.4 is met through `getContextModule`; `invalid-geometry` leaves the contract; the stored field is `studyInstanceUid`; lint covers the packages' `.tsx`; A-27's size rule reads the same everywhere.                                                                                     | approved 2026-09-23                                                                                                                                                                                                                                           |\n| [A-34](decisions/A-34-two-applications-one-channel-hook.md) | 2026-09-23 | Two applications, one channel binding: the channel package holds one end per window, created when its module loads, and offers `useChannel(options)` to both sides (names the peer on the first mount, leases the window listener per mount, subscribes the component to `{ ready, queued }`; interface `{ send, on, getState }`, no `dispose`). Each application hook registers `channel.on(handler)` and returns the channel. The form's actions are the contract's commands (`dispatch` sends and reduces); the OHIF-side application subscribes to OHIF with `ohif.on(handler)`, whose events arrive in the contract's shape, parsed and throttled at the boundary. | approved 2026-09-23                                                                                                                                                                                                                                           |\n| [A-35](decisions/A-35-abstract-storage.md)                  | 2026-09-23 | The storage service is abstract: `readStorage(key, schema)` / `writeStorage(key, value)` over sessionStorage, defensively; the form's envelope, key and `loadRows` / `saveRows` live with the form (`hooks/useStoredRows.ts` since A-37).                                                                                                                                                                                                                                                                                                                                                                                                                               | approved 2026-09-23                                                                                                                                                                                                                                           |\n| [A-36](decisions/A-36-row-model-folder.md)                  | 2026-09-23 | The row model has its own folder: `models/row.ts` holds `RowStatus`, the `Row` type and `RowModel` (JSON form, `create`, `toJSON` / `fromJSON`, `toRestoreRequest`) as one named object; the reducer keeps `FormAction` and the transitions, the rows' persistence its own hook (A-37).                                                                                                                                                                                                                                                                                                                                                                                 | approved 2026-09-23                                                                                                                                                                                                                                           |\n| [A-37](decisions/A-37-stored-rows-hook.md)                  | 2026-09-23 | The stored rows are a hook: `useStoredRows(study)` → `[storedRows, save]` over the storage service, composed with `useReducer` in `useScoringForm`, which saves on every change; `RowModel.create(toolName)` issues the row id (A-8 stays with the host).                                                                                                                                                                                                                                                                                                                                                                                                               | approved 2026-09-23                                                                                                                                                                                                                                           |\n| [A-38](decisions/A-38-names-after-roles.md)                 | 2026-09-23 | The OHIF-side packages are named after their roles: `packages/scoring-viewer` (`@bdiadiun/ohif-extension-scoring-viewer` — the OHIF-side scoring application; `ScoringViewer`, `useScoringViewer`, `session.ts`) and `packages/ohif-extension-loader` (`@bdiadiun/ohif-extension-loader` — the one entry the fork lists), both from 0.1.0; the notes follow (`viewer-internals.md`, `ohif-api.md`); the fork switches its entry and dependency in one pull request after the publish.                                                                                                                                                                                   | approved 2026-09-23                                                                                                                                                                                                                                           |\n| [A-39](decisions/A-39-channel-end-class.md)                 | 2026-09-23 | The end of the channel is a class: `ChannelEnd` with private state and arrow-function methods, one instance per window returned by `useChannel`; the public interface is unchanged. A class is for state with behaviour in one instance, not for a model, a reducer or a hook. Channel 0.0.9.                                                                                                                                                                                                                                                                                                                                                                           | approved 2026-09-23                                                                                                                                                                                                                                           |\n\n## Appendix A — original assignment text (verbatim, Ukrainian)\n\n```text\nТестове завдання: мікрофронтенд «Viewer + Scoring Form»\nРоль: Frontend Developer (React / TypeScript)\nТермін: 5 робочих днів\nФормат здачі: відкритий репозиторій + відео-демо + захист роботи на дзвінку (30–45 хв)\n\n1. Мета завдання\nЦе завдання відтворює у спрощеному вигляді те, чим ви будете займатися щодня: два окремих застосунки, які живуть на різних портах і спілкуються між собою.\nЗ одного боку — медичний переглядач зображень (OHIF Viewer), з іншого — форма, у яку лікар вносить результати вимірювань. Форма не малює анотації сама: вона просить переглядач увімкнути інструмент, а потім отримує назад результат.\nМи перевіряємо не вміння написати форму на React. Ми перевіряємо, чи розумієте ви:\n- як два незалежні застосунки домовляються про контракт обміну повідомленнями;\n- як не зламатися на асинхронності (хто завантажився першим, що робити з повідомленнями, які прийшли «зарано»);\n- як зв'язати сутність у формі з анотацією у переглядачі та тримати їх синхронними;\n- як не влаштувати нескінченний цикл, коли зміна з одного боку викликає зміну з іншого, а та — знову першу.\nПро AI. Використовувати AI-асистентів дозволено і навіть очікувано — ми самі ними користуємось. Але код, який ви здаєте, ви захищаєте самі: на дзвінку ми попросимо пояснити рішення й внести кілька живих змін (див. розділ 9). Код, який ви не можете пояснити, зараховано не буде.\n\n2. Як це виглядає в реальному продукті (контекст)\nУ нашому продукті лікар відкриває дослідження пацієнта. Праворуч від зображення — скоринг-форма клінічного дослідження. Щоб додати вимірювання пухлини, лікар натискає кнопку в формі, а не в тулбарі переглядача: форма знає, який саме інструмент потрібен для цього поля (еліпс, лінійка, сегментація) і які обмеження діють.\nДалі: переглядач вмикає потрібний інструмент → лікар малює анотацію → переглядач віддає у форму площу/довжину → форма зберігає значення й перераховує похідні показники (сума площ, відповідь на терапію тощо).\nВаше завдання — зробити найпростіший робочий скелет цієї схеми.\n\n3. Архітектура, яку треба побудувати\nДва застосунки, два порти, обмін через window.postMessage.\n- viewer — форк офіційного https://github.com/OHIF/Viewers, запущений локально. Ви додаєте до нього власне OHIF-розширення (extension), яке виступає мостом: приймає команди ззовні й публікує події назовні.\n- host-app — новий React-застосунок з нуля на будь-якому бойлерплейті (Vite рекомендовано). Містить <iframe> з переглядачем і форму.\nПідказка щодо OHIF. Не намагайтесь дістати внутрішні сервіси через window ззовні — це не спрацює через iframe. Правильний шлях: власне розширення отримує servicesManager і commandsManager у хуку preRegistration. Саме там живе ваш міст: підписки на measurementService і виклики commandsManager.runCommand(...).\n\n4. Обов'язкова частина\n4.1. Запуск переглядача\n- Форкнути https://github.com/OHIF/Viewers, запустити локально.\n- Джерело даних — публічний DICOMweb за замовчуванням з коробки OHIF (свій PACS піднімати не потрібно).\n- Переглядач має відкриватись за прямим посиланням на конкретне дослідження (/viewer?StudyInstanceUIDs=...), бо саме таке посилання піде в iframe.\n4.2. Host-app і сторінка\n- React + TypeScript.\n- Одна сторінка: ліворуч iframe з переглядачем (гумовий, на всю висоту), праворуч — панель форми.\n- Порти застосунків різні — це навмисно, щоб ви зіткнулися з реальними обмеженнями cross-origin.\n4.3. Сценарій «додати вимірювання» (ядро завдання)\n1. У формі є кнопка «Додати вимірювання».\n2. Натискання створює у формі новий порожній рядок зі статусом Очікує і кнопкою «Активувати».\n3. Натискання «Активувати» надсилає в iframe команду увімкнути інструмент Ellipse (EllipticalROI). Рядок переходить у статус Малювання….\n4. Користувач малює еліпс у переглядачі.\n5. Переглядач надсилає назад площу анотації разом з ідентифікатором, за яким host розуміє, до якого саме рядка це значення належить.\n6. Рядок отримує значення (наприклад 124.5 mm²), статус Готово, інструмент у переглядачі вимикається сам (повертається Pan/дефолт).\n7. Кроки 1–6 повторювані: рядків може бути скільки завгодно.\n8. Унизу форми — сума площ усіх рядків, яка перераховується автоматично.\n4.4. Мінімальний контракт повідомлень\nНазви подій зафіксовані нижче, структуру payload проєктуєте ви самі — і описуєте в ARCHITECTURE.md.\n| Напрямок | Тип події | Призначення |\n| viewer → host | VIEWER_READY | Переглядач завантажився й готовий приймати команди |\n| host → viewer | ACTIVATE_TOOL | Увімкнути інструмент для конкретного рядка форми |\n| host → viewer | DEACTIVATE_TOOL | Скасувати очікування малювання |\n| viewer → host | MEASUREMENT_ADDED | Анотацію створено; значення + одиниці + прив'язка |\n| viewer → host | MEASUREMENT_UPDATED | Анотацію змінили (див. зіркове завдання 5.1) |\nДомовтеся про версію контракту (version: 1) і закладіть її в повідомлення — поясните на захисті, навіщо.\n\n5. Вимоги до якості (оцінюються окремо)\nЦе те, що відрізняє «працює на демо» від «працює в продукті». Кожен пункт — окремий рядок в оцінюванні.\n- Handshake. Host не має права надсилати команди до того, як переглядач повідомив VIEWER_READY. Якщо користувач натиснув «Активувати», поки iframe ще вантажиться, команда не має загубитись — подумайте, що з нею зробити.\n- Перевірка origin. Обробники message з обох боків мають перевіряти event.origin і не реагувати на чуже. Захардкоджений origin у конфізі — нормально; його відсутність — ні.\n- Кореляція. Кожен рядок форми має свій ідентифікатор; кожна анотація — свій. Ви маєте свідомо вирішити, хто кому видає ID і як тримається відповідність між ними. Це головне архітектурне рішення завдання.\n- Відсутність echo-циклу. Якщо ви реалізуєте зіркове завдання 5.1 — переконайтесь, що оновлення host → viewer → host не породжує нескінченний пінг-понг. Ми це перевіримо.\n- Прибирання за собою. removeEventListener, відписки від measurementService, скасування «озброєного» стану при unmount.\n- Одиниці вимірювання. Площа може приходити в mm² або в px² — залежно від того, чи є в DICOM пікселний spacing. Не втрачайте одиниці й не додавайте mm² до px² у сумі. Опишіть, що робите в цьому випадку.\n- TypeScript. Типи повідомлень описані в одному місці й спільні для обох застосунків (окремий пакет, спільна тека або хоч би скопійований файл із поясненням, чому так).\n\n6. Зіркові завдання (*) — за бажанням\nРобіть у порядку інтересу, жодне не є обов'язковим. Одне-два виконаних зіркових завдання суттєво впливають на оцінку — але тільки якщо обов'язкова частина зроблена якісно.\n- 5.1. Живе оновлення. Користувач тягне вершину еліпса — значення в формі оновлюється в реальному часі, сума перераховується.\n- 5.2. Видалення. Кнопка «Видалити» в рядку форми прибирає анотацію в переглядачі. І навпаки: видалення анотації в переглядачі очищає рядок.\n- 5.3. Фокус. Клік по рядку форми підсвічує/скролить до відповідної анотації в переглядачі.\n- 5.4. Другий інструмент. Додайте тип рядка «Довжина» (Length) — сума довжин рахується окремо від суми площ.\n- 5.5. Версія на вьюпорті. Вивести версію OHIF (з package.json, підставлену на етапі збірки через конфіг бандлера) у кутку кожного вьюпорта — якщо обрано сітку 2×2, версія має бути на всіх чотирьох.\n- 5.6. Відновлення стану. Після перезавантаження сторінки форма й анотації відновлюються.\n\n7. Формат здачі\n7.1. Репозиторії та pull request'и\n- Код у відкритому репозиторії (GitHub / GitLab). Форк OHIF + host-app можуть бути двома репозиторіями або монорепо — на ваш вибір, поясніть чому.\n- Обов'язково: робота розбита на pull request'и по фічах. Мінімум п'ять, орієнтовно: 1. chore: bootstrap host-app — каркас, iframe, layout 2. feat: viewer bridge extension — OHIF-розширення + handshake 3. feat: activate ellipse from form — напрямок host → viewer 4. feat: receive measurement into form — напрямок viewer → host 5. feat: total area calculation — сума й форматування\n- Кожен PR має осмислений опис: що змінено, чому саме так, що перевірено. PR з описом «changes» не зараховується.\n- PR можуть бути змержені вами ж — код-рев'ю від нас на цьому етапі немає. Нам важлива історія мислення, а не одна купа коду.\n7.2. Документація в репозиторії\n- README.md — як запустити обидва застосунки з нуля (git clone → робочий екран). Ми буквально виконаємо ці кроки на чистій машині.\n- ARCHITECTURE.md — схема обміну, повна таблиця повідомлень з payload, і окремий розділ «Прийняті рішення»: хто видає ID, як влаштований handshake, що робиться з командами, які прийшли зарано, як уникається echo-цикл. Достатньо 1–2 сторінок, але по суті.\n- AI-USAGE.md — чесно: де використовували AI, що з його виводу залишили без змін, а що переписали й чому. Це не мінус в оцінюванні — навпаки, вміння працювати з AI критично оцінюється. Мінус — приховати це.\n7.3. Відео-демо (обов'язково)\nЗапис екрана 2–4 хвилини, голос за кадром бажаний, де показано:\n- запуск обох застосунків;\n- додавання щонайменше трьох вимірювань поспіль;\n- як оновлюється сума;\n- поведінку при скасуванні активації (натиснули «Активувати» й передумали);\n- будь-які реалізовані зіркові завдання.\n\n8. Чого робити не треба\nЩоб ви не витрачали час не на те:\n- Не потрібна авторизація, бекенд, база даних, збереження на сервер.\n- Не потрібен власний PACS / DICOMweb-сервер.\n- Не потрібен дизайн — сірої форми з нативними інпутами повністю достатньо.\n- Не потрібні тести на весь проєкт. Якщо хочете показати вміння — достатньо кількох юніт-тестів на логіку суми та на серіалізацію повідомлень.\n- Не потрібно перероблювати UI самого OHIF (панелі, тулбар) — окрім того, що вимагає ваш міст.\n\n9. Захист роботи\nПісля здачі — дзвінок на 30–45 хвилин. Це основна частина оцінювання.\nПитання, до яких варто бути готовим:\n- Що станеться, якщо iframe завантажиться повільніше, ніж користувач натисне кнопку? Покажіть у коді, де це оброблено.\n- Чому ви обрали postMessage, а не інший спосіб? Що б змінилось, якби обидва застосунки були на одному домені?\n- Хто видає ідентифікатор вимірювання й чому саме він? Що зламається, якщо переклацнути це рішення на протилежне?\n- Де саме в OHIF ви підписались на створення анотації і чому саме там?\n- Що буде, якщо відкрити дві вкладки host-app одночасно?\n- Покажіть місце, де міг би виникнути нескінченний цикл повідомлень.\nЖиві зміни (виконуються під час дзвінка, ~10 хв кожна):\n- Замінити інструмент з еліпса на прямокутник (RectangleROI).\n- Додати до рядка форми ще одне поле — наприклад, периметр або середню інтенсивність — і провести його через увесь ланцюжок.\n- Ми вимкнемо один елемент вашого протоколу (наприклад, VIEWER_READY) — ви маєте продіагностувати поломку вголос.\n\n10. Критерії оцінювання\n| Блок | Що дивимось | Вага |\n| Робочий сценарій | Обов'язкова частина відтворюється з README без підказок | 25% |\n| Архітектура мосту | Контракт, кореляція ID, handshake, розділення відповідальності | 25% |\n| Захист роботи | Пояснення рішень і живі зміни на дзвінку | 25% |\n| Якість коду | Типізація, прибирання ефектів, структура, читабельність | 15% |\n| Комунікація | PR'и, ARCHITECTURE.md, відео-демо | 10% |\nЗіркові завдання додають до +15% зверху, але не компенсують провалений блок «Захист роботи».\n\n11. Корисні орієнтири\n- OHIF Viewer: https://github.com/OHIF/Viewers\n- Документація OHIF (extensions, services): https://docs.ohif.org\n- window.postMessage: https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage\n- Ключові речі в OHIF, які вам знадобляться: хук preRegistration у розширенні, commandsManager.runCommand('setToolActive', ...), measurementService.subscribe(measurementService.EVENTS.MEASUREMENT_ADDED, ...).\nЯкщо щось у завданні здається неоднозначним — прийміть рішення самі й задокументуйте його в ARCHITECTURE.md. Уміння закрити невизначеність самостійно теж оцінюється.\nПитання по завданню: @acestudiooleg Telegram\n```\n"},{"path":"docs/FEATURE-GRAPH.md","title":"Feature graph","group":"Requirements","md":"# Feature graph\n\nGenerated from docs/feature-graph.json by `npm run graph:build`. Do not edit by hand.\n\nDerived from [CANON.md](CANON.md). Every node closes at least one canon ID. A node is started only when all of its dependencies are `done`. Bonus nodes (`S-*`) are planned only after the mandatory part is `done`.\n\nStatuses: `planned` → `approved` → `in-progress` → `review` → `done`.\n\n## Nodes\n\n| Node | Name                                                                                                                                              | Canon                                                           | Depends on       | Slice | Status  | Verify cript workspace in strict mode. The dev server is pinned to port 5173 and the viewer origin to port 3000 in a single config module (A-2), so the two apps are cross-origin by construction. User-visible strings are collected in one Ukrainian strings file (A-7).\n\nCanon: A-2, C-3.3, C-4.2.1, C-4.2.3. Depends on: F-20. Slice 1, status `done`.\n\nFiles:\n\n- `docs/decisions/A-2-ports.md`\n- `docs/decisions/A-7-ui-language.md`\n- `host-app/.gitignore`\n- `host-app/index.html`\n- `host-app/package.json`\n- `host-app/public/favicon.svg`\n- `host-app/src/config.ts` — internal: `packages/contract/src/index.ts`; external: `@bdiadiun/scoring-channel`\n- `host-app/src/i18n.ts` — internal: `packages/contract/src/index.ts`\n- `host-app/src/index.css`\n- `host-app/src/main.tsx` — internal: `host-app/src/index.css`, `host-app/src/pages/ScoringPage.tsx`; external: `react`, `react-dom`\n- `host-app/src/setup-tests.ts` — external: `@testing-library/jest-dom`, `@testing-library/react`, `vitest`\n- `host-app/tsconfig.app.json`\n- `host-app/tsconfig.json`\n- `host-app/tsconfig.node.json`\n- `host-app/vite.config.ts` — external: `@vitejs/plugin-react`, `node:url`, `vite`\n\n### F-02 Page layout: iframe + form panel\n\nRenders the single page: a flexible full-height iframe on the left and the scoring form panel on the right. The iframe source is the direct study link built from config, which is how OHIF is opened on a specific study.\n\nCanon: C-4.1.3, C-4.2.2. Depends on: F-01. Slice 1, status `done`.\n\nFiles:\n\n- `host-app/src/components/ScoringPanel.props.ts` — external: `react`\n- `host-app/src/components/ScoringPanel.tsx` — internal: `host-app/src/components/BridgeStatus.tsx`, `host-app/src/components/MeasurementRow.tsx`, `host-app/src/components/ScoringPanel.props.ts`, `host-app/src/components/TotalsFooter.tsx`, `host-app/src/config.ts`, `host-app/src/hooks/useScoringForm.ts`, `host-app/src/i18n.ts`, `host-app/src/state/actions.ts`, `host-app/src/utils/totals.ts`; external: `react` ettier`, `eslint-plugin-react-hooks`, `eslint-plugin-react-refresh`, `globals`, `typescript-eslint`\n- `packages/contract/src/hostCommands.ts` — internal: `packages/contract/src/vocabulary.ts`; external: `zod`\n- `packages/contract/src/index.ts` — internal: `packages/contract/src/hostCommands.ts`, `packages/contract/src/viewerEvents.ts`, `packages/contract/src/vocabulary.ts`\n- `packages/contract/src/viewerEvents.ts` — internal: `packages/contract/src/hostCommands.ts`, `packages/contract/src/vocabulary.ts`; external: `zod`\n- `packages/contract/src/vocabulary.ts` — external: `zod`\n\n### F-67 Boundaries as schemas, one channel\n\nThe two remaining boundaries follow the contract's pattern (A-28): OHIF's measurement object is checked by one zod schema, the form's Row is a schema the stored row derives from, metric keys are an enum. The channel is transport only and one factory serves both ends (A-29, A-31): send, onMessage, getState, subscribe, dispose, with readyOn opening the queue. Commands carry no requestId and events no causedBy (A-30): the one correlation is rowId ↔ measurementUid, the echo guard is a rule per side, exchange and pending answers are gone. Every VIEWER_READY restores the current rows; activate sends one command; removal is fire-and-forget. API without a caller (on, disposer set, hostOrigin option, optional OHIF services) is removed. The review of the working tree (A-33) then fixed what the shape had promised but not kept: `VIEWER_READY` is answered in the message handler with the rows on screen, `MEASUREMENT_UPDATED` keeps its geometry, a restore mark is cleared once it stops being true, one effect owns the viewer bridge, a standalone viewer has no peer, and the channel package is React-free (A-33). The author's design then made the two ends mirror each other (A-34): one `useChannel` in the channel package for both applications, `channel.on` and `ohif.on` as the one way to subscribe, the form's actions as the contract's commands, OHIF's events parsed and throttled at the boundary. The storage service became abstract (A-35): sessionStorage for any key and schema, the form's stored rows in `services/storedRows.ts`. The row model got its own folder (A-36): `models/row.ts` with `RowModel` — JSON form, `create`, `toJSON` / `fromJSON`, `toRestoreRequest`. The stored rows became a hook, `useStoredRows(study)` → `[storedRows, save]`, composed with `useReducer` in `useScoringForm`; `RowModel.create(toolName)` issues the row id (A-37). Slice 62 then named the two OHIF-side packages after their roles: `packages/scoring-viewer` (`@bdiadiun/ohif-extension-scoring-viewer`, `ScoringViewer`, `useScoringViewer`, `session.ts`) and `packages/ohif-extension-loader` (`@bdiadiun/ohif-extension-loader`), both at 0.1.0 (A-38). Slice 63 made the end of the channel a class, `ChannelEnd`, with private state and arrow-function methods (A-39; channel 0.0.9).\n\nCanon: A-13, D-2, Q-7. Depends on: F-66. Slice 61, status `review`.\n\nFiles:\n\n- `docs/decisions/A-28-boundaries-as-schemas.md`\n- `docs/decisions/A-29-channel-is-transport.md`\n- `docs/decisions/A-30-no-request-answer.md`\n- `docs/decisions/A-31-one-channel.md`\n- `docs/decisions/A-32-react-bridge.md`\n- `docs/decisions/A-33-review-of-the-boundaries-refactor.md`\n- `docs/decisions/A-34-two-applications-one-channel-hook.md`\n- `docs/decisions/A-35-abstract-storage.md`\n- `docs/decisions/A-36-row-model-folder.md`\n- `docs/decisions/A-37-stored-rows-hook.md`\n- `docs/decisions/A-38-names-after-roles.md`\n- `docs/decisions/A-39-channel-end-class.md`\n- `docs/notes/form-internals.md`\n- `docs/notes/ohif-service-availability.md`\n- `eslint.config.js` — external: `@eslint/js`, `eslint-config-prettier`, `eslint-plugin-react-hooks`, `eslint-plugin-react-refresh`, `globals`, `typescript-eslint`\n- `host-app/src/components/MeasurementRow.tsx` — internal: `host-app/src/components/MeasurementRow.props.ts`, `host-app/src/i18n.ts`, `host-app/src/models/row.ts`, `host-app/src/state/actions.ts`, `host-app/src/utils/format.ts`; external: `react`\n- `host-app/src/config.ts` — internal: `packages/contract/src/index.ts`; external: `@bdiadiun/scoring-channel`\n- `host-app/src/hooks/useScoringForm.ts` — internal: `host-app/src/config.ts`, `host-app/src/hooks/useStoredRows.ts`, `host-app/src/models/row.ts`, `host-app/src/state/actions.ts`, `host-app/src/state/reducer.ts`, `packages/contract/src/index.ts`; external: `@bdiadiun/scoring-channel`, `react`\n- `host-app/src/hooks/useStoredRows.ts` — internal: `host-app/src/models/row.ts`, `host-app/src/services/storage.ts`; external: `react`, `zod`\n- `host-app/src/models/row.ts` — internal: `packages/contract/src/index.ts`; external: `zod`\n- `host-app/src/pages/ScoringPage.tsx` — internal: `host-app/src/components/ScoringPanel.tsx`, `host-app/src/components/ViewerFrame.tsx`; external: `react`\n- `host-app/src/services/storage.ts` — external: `zod`\n- `host-app/src/state/actions.ts` — internal: `host-app/src/config.ts`, `host-app/src/models/row.ts`, `host-app/src/state/reducer.ts`, `packages/contract/src/index.ts`; external: `react`\n- `host-app/src/state/reducer.ts` — internal: `host-app/src/models/row.ts`, `host-app/src/state/selectors.ts`, `packages/contract/src/index.ts`\n- `host-app/src/state/selectors.ts` — internal: `host-app/src/models/row.ts`\n- `host-app/src/utils/format.ts` — internal: `host-app/src/i18n.ts`, `host-app/src/models/row.ts`, `packages/contract/src/index.ts`\n- `host-app/src/utils/totals.ts` — internal: `host-app/src/models/row.ts`, `packages/contract/src/index.ts`\n- `host-app/vite.config.ts` — external: `@vitejs/plugin-react`, `node:url`, `vite`\n- `packages/channel/src/channel.ts` — internal: `packages/channel/src/peer.ts`, `packages/contract/src/index.ts`; external: `react`\n- `packages/channel/src/peer.ts` — internal: `packages/contract/src/index.ts`\n- `packages/contract/src/vocabulary.ts` — external: `zod`\n- `packages/ohif-extension-loader/src/extension.ts` — external: `@bdiadiun/ohif-extension-scoring-viewer`\n- `packages/scoring-viewer/src/ScoringViewer.tsx` — internal: `packages/scoring-viewer/src/hooks/useScoringViewer.ts`, `packages/scoring-viewer/src/ohif/facade.ts`, `packages/scoring-viewer/src/ohif/surface.ts`; external: `react`\n- `packages/scoring-viewer/src/commands/handlers.ts` — internal: `packages/contract/src/index.ts`, `packages/scoring-viewer/src/commands/restore.ts`, `packages/scoring-viewer/src/ohif/facade.ts`, `packages/scoring-viewer/src/ohif/surface.ts`, `packages/scoring-viewer/src/session.ts`\n- `packages/scoring-viewer/src/commands/restore.ts` — internal: `packages/contract/src/index.ts`, `packages/scoring-viewer/src/ohif/facade.ts`, `packages/scoring-viewer/src/ohif/surface.ts`, `packages/scoring-viewer/src/session.ts`; external: `@cornerstonejs/core`, `@cornerstonejs/tools`\n- `packages/scoring-viewer/src/events/handlers.ts` — internal: `packages/scoring-viewer/src/commands/handlers.ts`, `packages/scoring-viewer/src/commands/restore.ts`, `packages/scoring-viewer/src/ohif/facade.ts`, `packages/scoring-viewer/src/session.ts`\n- `packages/scoring-viewer/src/hooks/useScoringViewer.ts` — internal: `packages/contract/src/index.ts`, `packages/scoring-viewer/src/commands/handlers.ts`, `packages/scoring-viewer/src/events/handlers.ts`, `packages/scoring-viewer/src/ohif/facade.ts`, `packages/scoring-viewer/src/ohif/surface.ts`, `packages/scoring-viewer/src/session.ts`; external: `@bdiadiun/scoring-channel`, `react`\n- `packages/scoring-viewer/src/ohif/facade.ts` — internal: `packages/contract/src/index.ts`, `packages/scoring-viewer/src/ohif/metrics.ts`, `packages/scoring-viewer/src/ohif/surface.ts`, `packages/scoring-viewer/src/ohif/throttle.ts`, `packages/scoring-viewer/src/ohif/version.ts`\n- `packages/scoring-viewer/src/ohif/metrics.ts` — internal: `packages/contract/src/index.ts`; external: `zod`\n- `packages/scoring-viewer/src/ohif/surface.ts` — internal: `packages/contract/src/index.ts`; external: `@bdiadiun/scoring-channel`, `react`\n- `packages/scoring-viewer/src/ohif/throttle.ts` — internal: `packages/contract/src/index.ts`\n- `packages/scoring-viewer/src/ohif/version.ts` — internal: `packages/scoring-viewer/src/ohif/surface.ts`\n- `packages/scoring-viewer/src/session.ts` — internal: `packages/contract/src/index.ts`, `packages/scoring-viewer/src/ohif/surface.ts`\n- `scripts/viewer.mjs` — external: `node:child_process`, `node:fs`, `node:path`, `node:url`\n"},{"path":"docs/STATE.md","title":"State journal","group":"Requirements","md":"# Project state journal\n\nRead this first in every new session, after `CLAUDE.md`. Keep it short: it is a resume point,\nnot a log. Update it in every PR (same commit as the work it describes).\n\n## Where we are\n\n| Field          | Value                                                                                                                                                                                                                                                                                                         |\n| -------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| Current slice  | none open — slice 63 `refactor(channel): the end of the channel is a class` (#84, decision A-39) is merged, published (channel 0.0.9, scoring-viewer 0.1.1, ohif-extension-loader 0.1.1) and pinned in the fork; the README was verified by a clone run by its steps alone (#85); the video (D-8) is recorded |\n| Gate           | — (next slice starts at gate 1)                                                                                                                                                                                                                                                                               |\n| Last merged PR | `chore: pin the fork at the loader release 0.1.1` (slice 63 closed; fork at ecbcef22; before it #85 `docs: the README follows the repository` and #84)                                                                                                                                                        |\n| Next slice     | 64 `test: only the tests the assignment asks for` (sum, serialisation, reducer; the coverage that left with the old harnesses — channel, facade, hooks — decided there); the study-change decision (Follow-ups)                                                                                               |\n\n## Open decisions (see CANON.md → Decisions)\n\n- None. A-1..A-11 are approved (2026-09-16); see `docs/decisions/`. Fork: https://github.com/bdiadiun/Viewers.\n\n## Facts worth not rediscovering\n\n- OHIF `master` needs Node >= 24 + pnpm 11; release `v3.12.17` needs Node >= 18 + yarn 1 → A-6, we base on `v3.12.17`.\n- Local toolchain: Node 22.13.1, npm 10.9.2; yarn/pnpm not installed (use corepack for yarn 1 in the fork).\n- `gh pr merge` was refused by the permission classifier (\"Merge Without Review\") on 2026-09-22 in both repositories, and allowed again on 2026-09-23 (PR #79). The git operator tries it once after the author's approval; on a refusal it stops and the author merges. Never work around a refusal.\n- `npm ci` runs the workspaces' `prepare` scripts concurrently, and each package's `tsc -b --force` rebuilt the whole reference chain — two processes writing `packages/channel/dist` at once made the publish workflow fail on 2026-09-23 (`index.d.ts is not a module`). Since then the root `package.json` has the one `prepare`, `tsc -b packages/ohif-extension-loader`, which builds contract → channel → bridge → adapter once, in order; the packages keep `build` for `viewer:link`.\n- The `gh` token has the `workflow` scope since 2026-09-17 (needed to push `.github/workflows`).\n- Git pushes over HTTPS use `gh auth setup-git` as the credential helper.\n- GitHub default branch was the first pushed branch (`docs/canon-and-feature-graph`) until 2026-09-16; now `main`. A plain `git clone` therefore works.\n- OHIF facts (measurement shape, events, tool activation) are in `docs/notes/ohif-api.md`; do not re-research.\n- corepack 0.30 is available; yarn 1 for the fork comes from corepack, no global install.\n- Browser runs use `npm run viewer:link` (symlinks the four packages into the fork under their current names; `viewer:unlink` restores). It links nothing else: the fork's webpack resolves `react` from its own `node_modules` for a symlinked package (A-32, amended), and a `react` symlink under `packages/*/node_modules` would make the host application load two Reacts. Publish and pin only after the scenario passed on the linked tree.\n- Viewer dev server: `OHIF_OPEN=false yarn --cwd platform/app dev` inside `viewer/` (root `yarn dev` picks up `bun.lock` and fails; without `OHIF_OPEN=false` webpack opens a browser tab on the user's machine on every start).\n- Fork branches: `scoring` (base, from v3.12.17), feature branches PR into it; fork PR #1 = bridge extension.\n- Study `1.3.6.1.4.1.25403.345050719074.3824.20170125113417.1` has pixel spacing → areas arrive in mm² (verified with a headless ellipse).\n- Raw OHIF `areaUnit` on the demo study is `mm²` (U+00B2); the bridge normalises the first token to `mm2`/`px2`. The default display set is a CT topogram with large pixel spacing, so areas are in the hundreds of thousands of mm² (real, not a bug).\n- `cachedStats` is filled in cornerstone's render pass; with an instantaneous synthetic release the area in `MEASUREMENT_ADDED` can lag one frame. Human drags are fine, and the S-5.1 UPDATED stream delivers the settled value (A-23 removed the separate correction timer).\n- `VIEWER_READY` is sent at once when a tool group exists and otherwise on the first `toolGroupService` VIEWPORT_ADDED (setToolActive is a silent no-op before a viewport exists); the bridge has no preRegistration since A-32.\n\n## Contract duplication\n\n- The contract is one published package, `@bdiadiun/scoring-contract` (A-15). The host and the fork both depend on it at an exact version; the fork no longer carries a copy. A merge into `main` that touches the package publishes a patch release.\n\n## Facts added in slice 14\n\n- A warm `node_modules` hid a broken dependency layout: after `npm ci`, Vitest could not find jsdom and ESLint could not resolve React types for Testing Library. Shared test tooling and React types now live in the root `package.json` (CONVENTIONS §1). Always verify with `npm ci` before gate 2.\n\n## Follow-ups (out of current scope)\n\n- Decision deferred to the end of the refactor (author, 2026-09-23): a study change inside the OHIF iframe. The form reads its study once per page load (A-19); OHIF's own worklist can still open another study in the iframe, after which every restore answers `unknown-study` and new measurements land in the old study's rows. Options on the table: hide the worklist in the fork (`showStudyList: false` / header customization) or let `VIEWER_READY` carry the study and the form follow it (contract change, canon entry). Until then: one page = one study, to be noted in DEFENCE.\n- Optional, not scheduled: unit tests for the extension's `throttle.ts` and `toMetrics`; bonus S-5.4 Length (F-17); bonus S-5.6 state restore (F-19).\n\n- The fork's own ESLint crashes at v3.12.17 (legacy config + `@typescript-eslint` 5 under ESLint 9); we lint the extension with `npm run lint:fork` instead.\n\n- OHIF \"clear all measurements\" emits `MEASUREMENTS_CLEARED`, not per-uid `MEASUREMENT_REMOVED`; rows would keep stale values. Small follow-up in the bridge if needed.\n\n- Fork `tsc --noEmit` has two pre-existing type errors unrelated to runtime (`ToolGroupService` type lacks pubsub members used by `subscribe`; generated `pluginImports.js` cannot resolve the extension). Webpack/babel build is unaffected. Candidate for a small fork PR.\n\n## Docs page\n\n- `npm run docs:build` regenerates `docs/site/index.html` (commit it with the docs it bundles). The same page is published as a private artifact for the author; republish it after each merge.\n\n## Comment ratio\n\n- After slice 16: 227 comment lines vs 3 499 code lines (6%); rules in CONVENTIONS §8. Since slice 61 (2026-09-23) the\n  packages and the form carry no comments except one DefinePlugin directive; the reasons are in `docs/notes/viewer-internals.md`\n  and `docs/notes/form-internals.md`.\n\n## Comment baseline before slice 16\n\n- 937 comment lines vs 3 499 code lines (21%); worst: `focus.ts` 57%, `getCustomizationModule.tsx` 52%, `removals.ts` 48%, `ui-strings.ts` 45%, `session.ts` 41%.\n\n## Lint status\n\n- Slice 13 brought the baseline of 204 ESLint findings and 43 unformatted files to zero. `npm run lint`, `npm run lint:fork` and `npm run format:check` are green on `main` from here on.\n\n## Session checklist\n\n1. Read `CLAUDE.md`, this file, then the nodes of `docs/feature-graph.json` for the current slice.\n2. Run `npm run check:graph`.\n3. Continue from \"Gate\" above. Do not re-derive decisions already in `docs/decisions/`.\n4. Before gate 2 of any slice that touches `packages/*`: every changed package has its version\n   raised in its own `package.json`, and every internal pin (channel → contract, bridge → contract\n   and channel, adapter → bridge, host-app → contract and channel) names the new numbers. Slice 60\n   forgot this and its PR #78 was superseded by the slice-61 PR, which carries both slices and one\n   bump.\n"},{"path":"docs/DEFENCE.md","title":"Defence notes","group":"Delivery","md":"# Defence notes\n\nWhere to point during the call. Host-app links are relative to this repository; extension links\nread the viewer side in `packages/scoring-viewer/`, which is where it now lives\n(`94108f3dfd`). If a line drifts after a later change, search for the quoted symbol.\n\n## The protocol in one screen\n\n| Concern                 | Host-app                                                                                                                                                                                             | Viewer extension                                                                                                                                             |\n| ----------------------- | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------ |\n| Origin configured       | [`VIEWER_ORIGIN`](../host-app/src/config.ts#L5)                                                                                                                                                      | [`HOST_ORIGIN`][fork-config]                                                                                                                                 |\n| Origin checked          | [`event.origin !== peerOrigin`](../packages/channel/src/peer.ts#L37)                                                                                                                                 | [the same check, the viewer end of the channel][fork-bridge-origin]                                                                                          |\n| URL input validated     | [`study` parameter checked against a DICOM identifier, then `encodeURIComponent`](../host-app/src/config.ts)                                                                                         | —                                                                                                                                                            |\n| Payload validated       | [`accept: isViewerEvent`](../host-app/src/config.ts#L9)                                                                                                                                              | [`isHostCommand`][fork-commands-guard]                                                                                                                       |\n| Handshake               | [`readyOn` flushes the queue](../packages/channel/src/channel.ts#L50)                                                                                                                                | [VIEWPORT_ADDED subscription][fork-bridge-viewport] → [`VIEWER_READY` sent once][fork-bridge-ready] → [`postMessage` with the host origin][fork-bridge-post] |\n| Early commands          | [`queued.push(message)`](../packages/channel/src/channel.ts#L45), [`open`](../packages/channel/src/channel.ts#L50)                                                                                   | —                                                                                                                                                            |\n| Row id / measurement id | [`crypto.randomUUID()` in `RowModel.create`](../host-app/src/models/row.ts#L35)                                                                                                                      | [`session.armedRowId = rowId`][fork-bridge-map], [taken by the next measurement][fork-bridge-take]                                                           |\n| Tool armed and restored | [`DEFAULT_TOOL`](../host-app/src/config.ts#L18)                                                                                                                                                      | [fixed `DEFAULT_TOOL` after a measurement][fork-commands-snapshot], [`setToolActive`][fork-commands-active], [`disarm`][fork-commands-disarm]                |\n| Measurement delivered   | [`rowId === null` changes nothing](../host-app/src/state/reducer.ts#L91)                                                                                                                             | [`MEASUREMENT_ADDED` subscription][fork-bridge-added], [posted][fork-bridge-added-post], [`toMetrics`][fork-metrics], [unit normalisation][fork-units]       |\n| Live update (S-5.1)     | reducer `MEASUREMENT_UPDATED` in [`reducer.ts`](../host-app/src/state/reducer.ts#L105)                                                                                                               | [throttled emitter][fork-bridge-throttle], [`UPDATE_INTERVAL_MS`][fork-bridge-interval]                                                                      |\n| Deletion (S-5.2)        | [fire-and-forget `REMOVE_MEASUREMENT`](../host-app/src/state/actions.ts#L31), reducer ignores an unknown uid ([`clearMeasurement`](../host-app/src/state/reducer.ts#L118))                           | [`measurementService.remove`][fork-removals-remove], [`MEASUREMENT_REMOVED` subscription][fork-bridge-removed]                                               |\n| Second tool (S-5.4)     | [`LENGTH_TOOL`](../host-app/src/config.ts), row's own `toolName` in `ACTIVATE_TOOL`, separate totals per metric                                                                                      | reuses `toMetrics` `Length` mapping                                                                                                                          |\n| State restore (S-5.6)   | [`useStoredRows.ts`](../host-app/src/hooks/useStoredRows.ts) over [`storage.ts`](../host-app/src/services/storage.ts), [`restoreViewer`](../host-app/src/state/actions.ts#L64) on every announcement | `restore.ts` (readiness gate, re-add with the original uid), `ohif/metrics.ts` (`toGeometry`)                                                                |\n| Focus (S-5.3)           | clickable Done row in `MeasurementRow.tsx`                                                                                                                                                           | [`jumpToMeasurement`][fork-focus]                                                                                                                            |\n| Version overlay (S-5.5) | —                                                                                                                                                                                                    | [`viewportOverlay.bottomRight`][fork-overlay]                                                                                                                |\n| State and totals        | [`RowStatus`](../host-app/src/state/reducer.ts#L18), [`FormAction`](../host-app/src/state/reducer.ts#L41), [`computeTotals`](../host-app/src/utils/totals.ts#L17)                                    | —                                                                                                                                                            |\n| Diagnostics (P-9)       | [`BridgeStatus`](../host-app/src/components/BridgeStatus.tsx#L6)                                                                                                                                     | log prefix `[scoring-viewer]` in the viewer console                                                                                                          |\n| Entry point             | [`useScoringForm.ts`](../host-app/src/hooks/useScoringForm.ts) (`useChannel`, `channel.on` in an effect whose cleanup detaches it, Q-5)                                                              | [`getContextModule` → provider → `useScoringViewer`][fork-index]                                                                                             |\n\n[fork-config]: ../packages/scoring-viewer/src/ScoringViewer.tsx#L22\n[fork-index]: ../packages/scoring-viewer/src/hooks/useScoringViewer.ts\n[fork-bridge-origin]: ../packages/channel/src/peer.ts#L37\n[fork-bridge-post]: ../packages/channel/src/peer.ts#L17\n[fork-bridge-ready]: ../packages/scoring-viewer/src/events/handlers.ts#L22\n[fork-bridge-viewport]: ../packages/scoring-viewer/src/ohif/facade.ts#L84\n[fork-bridge-map]: ../packages/scoring-viewer/src/commands/handlers.ts#L41\n[fork-bridge-take]: ../packages/scoring-viewer/src/events/handlers.ts#L9\n[fork-bridge-added]: ../packages/scoring-viewer/src/ohif/facade.ts#L81\n[fork-bridge-added-post]: ../packages/scoring-viewer/src/events/handlers.ts#L11\n[fork-bridge-throttle]: ../packages/scoring-viewer/src/ohif/throttle.ts\n[fork-bridge-interval]: ../packages/scoring-viewer/src/ohif/facade.ts#L17\n[fork-bridge-removed]: ../packages/scoring-viewer/src/ohif/facade.ts#L83\n[fork-commands-guard]: ../packages/scoring-viewer/src/hooks/useScoringViewer.ts#L13\n[fork-commands-snapshot]: ../packages/scoring-viewer/src/commands/handlers.ts#L7\n[fork-commands-active]: ../packages/scoring-viewer/src/commands/handlers.ts\n[fork-commands-disarm]: ../packages/scoring-viewer/src/commands/handlers.ts#L44\n[fork-removals-remove]: ../packages/scoring-viewer/src/commands/handlers.ts#L52\n[fork-focus]: ../packages/scoring-viewer/src/commands/handlers.ts#L35\n[fork-metrics]: ../packages/scoring-viewer/src/ohif/metrics.ts\n[fork-units]: ../packages/scoring-viewer/src/ohif/metrics.ts#L25\n[fork-overlay]: ../packages/scoring-viewer/src/ohif/version.ts#L18\n\n## Questions (canon P-1..P-6)\n\n**P-1. The iframe loads slower than the user clicks.** \"Активувати\" calls `send`; while `ready` is\nfalse the command goes to [`queued.push(message)`](../packages/channel/src/channel.ts#L45) and\nthe status line shows `у черзі: N`. The viewer announces `VIEWER_READY` only after\n[the first viewport joins a tool group][fork-bridge-viewport], because `setToolActive` is a silent\nno-op before that. The host then [flushes the queue in order](../packages/channel/src/channel.ts#L50).\nDemo: stop the viewer, click \"Активувати\", start the viewer, watch the counter drain.\n\n**P-2. Why `postMessage`.** The two apps have different origins, and `postMessage` is the only\nbrowser channel between a window and a cross-origin iframe that carries a sender origin the\nreceiver can verify. On one origin we could call into `iframe.contentWindow` directly or use\n`BroadcastChannel`; the origin checks would go, but the typed contract would stay, because it is\nthe seam between two separately deployed apps.\n\n**P-2a. If the origins do not match** (the form opened as `127.0.0.1`, the viewer on another\nport): the receiver drops the message before the version and the guard and logs\n`[channel] ignoring message from foreign origin …` once per origin; the sender's `postMessage`\nwith its explicit `targetOrigin` is not delivered and Chrome logs \"target origin provided … does\nnot match\" there. The status line stays at `очікує VIEWER_READY` and the queue grows. Demo: open\nthe form as http://127.0.0.1:5173 — the viewer's `VIEWER_READY` is ignored; open it as\nhttp://localhost:5173 — it is accepted.\n\n**P-3. Who issues which id.** The host issues `rowId`\n([`crypto.randomUUID()`](../host-app/src/state/actions.ts#L12)) before anything is drawn, so an\nempty `Очікує` row can exist. The viewer issues `measurementUid` (the cornerstone annotation UID)\nand the extension [remembers the armed row][fork-bridge-map] until the next measurement [takes it][fork-bridge-take]; the rows array on the host is the only `uid → row` map. Flipping it breaks two things: the form could not show a\nrow before drawing, and OHIF's `_isValidMeasurement` rejects any foreign field, so a host id cannot\nbe stored on a measurement ([A-8](decisions/A-8-id-correlation.md)).\n\n**P-4. Where we subscribe in OHIF.** [`measurementService.subscribe(MEASUREMENT_ADDED)`][fork-bridge-added]\ninside `ohif.on`, run by an effect of [`useScoringViewer`][fork-index] with the\n`servicesManager` OHIF hands the extension at registration. The service merges cornerstone's `ANNOTATION_ADDED` and `ANNOTATION_COMPLETED`\ninto one event on completion and returns an unsubscribe handle; raw cornerstone events would fire\non the first click.\n\n**P-5. Two host-app tabs.** Each tab has its own iframe and its own `contentWindow`, and\n`postMessage` is point to point, so tabs never see each other's messages or measurements.\n\n**P-6. Where an infinite loop could arise.** OHIF re-broadcasts events when a measurement is\nchanged or removed through the service. The mandatory flow never sends a command in reaction to a\nmeasurement event: every viewer event is [dispatched to the reducer as it is](../host-app/src/hooks/useScoringForm.ts#L19),\nand a reducer cannot send (A-30); the one command sent in reaction to an event is the restore on\n`VIEWER_READY`, which is a handshake, not a measurement. The only mutating command is deletion: the\nform drops the row and sends `REMOVE_MEASUREMENT`; OHIF's own `MEASUREMENT_REMOVED` comes back for\na uid no row holds and the reducer [returns the same state](../host-app/src/state/reducer.ts#L114).\nNothing is sent, so nothing can bounce.\n\n## Live changes (P-7..P-9)\n\n**P-7. Ellipse → `RectangleROI`.** Change [`DEFAULT_TOOL`](../host-app/src/config.ts#L18). Nothing\nelse: the tool name travels in `ACTIVATE_TOOL`, the extension checks `toolGroup.hasTool`, and\n[`toMetrics`][fork-metrics] already maps `RectangleROI`, which has the same stats shape.\n\n**P-8. One more field through the whole chain (e.g. mean intensity).**\n\n1. Contract: add `'mean'` to the `MetricKey` enum in\n   [`packages/contract/src/vocabulary.ts`](../packages/contract/src/vocabulary.ts) (and a unit to\n   `Unit` if a new one is needed) — one line each, since A-28 the vocabulary is the only place a\n   metric is named; then publish the package and raise its pinned version in the extension.\n2. Extension: one more row in `METRIC_SPECS` of [`ohif/metrics.ts`][fork-metrics] (the stats field and its unit table), the way `area` is read.\n3. Host: `MeasurementRow` already renders the first non-area metric; to show both, map over the\n   metrics object; `computeTotals(rows, 'mean')` gives the total.\n\n**P-9. A protocol element is disabled (e.g. `VIEWER_READY`).** Symptoms: the\n[status line](../host-app/src/components/BridgeStatus.tsx#L6) stays at `очікує VIEWER_READY`, the\nqueue count grows with each \"Активувати\", and the viewer console has no `[channel] sent VIEWER_READY`. Walk:\n[VIEWPORT_ADDED subscription][fork-bridge-viewport] → [`VIEWER_READY` sent once][fork-bridge-ready] → host\n[`readyOn` branch](../packages/channel/src/channel.ts#L88). If `ACTIVATE_TOOL` is disabled instead,\nthe queue drains but the viewer console has no `[channel] received ACTIVATE_TOOL` and the tool stays WindowLevel.\n\n## Rehearsal checklist\n\n- [ ] Both apps start from a clean clone by README only (`npm run viewer:link` first until the release is pinned in the fork).\n- [ ] Three measurements in a row, total updates.\n- [ ] Cancel: \"Активувати\", then \"Скасувати\" → row `Очікує`, tool back to WindowLevel.\n- [ ] Drag an ellipse handle: the row value and total change while dragging.\n- [ ] Add a length row, draw a line: it lands in that row in mm and the length total is separate.\n- [ ] \"Видалити\" on a Done row removes the annotation; deleting it in OHIF returns the row to `Очікує`.\n- [ ] Click a Done row: the viewer jumps to and selects the annotation.\n- [ ] Reload the page with two measurements: rows, values, totals and both annotations come back.\n- [ ] 2×2 layout: `OHIF 3.12.17` in every pane.\n- [ ] P-7 swap to `RectangleROI` in under 2 minutes.\n- [ ] P-9: comment out the `session.channel.send(event)` of the `VIEWER_READY` case in `events/handlers.ts`, reload, diagnose aloud.\n\n## Video script (D-8, 2–4 min)\n\nRead while recording. Steps and labels are as on screen; the narration is in the video's language,\nUkrainian, the way the form's strings are (A-7) — everything else here stays English.\n\n**Before recording (off camera).** `npm run viewer:link` (until the release is pinned in the fork the\nviewer must run the working-tree packages, or the published contract rejects every command);\n`npm run viewer:dev` and wait for \"compiled successfully\"; `npm run dev --workspace host-app`. Open\nthe host's and the viewer's consoles in separate windows. Clear the host's sessionStorage\n(DevTools → Application) so the form starts empty. Dismiss OHIF's \"investigational use\" banner and\nanswer \"No\" to \"Track measurements?\" once, before the take.\n\n| Time      | What to show                                                                                                                    | Narration                                                                                                                                                                                                                                                                                                                             |\n| --------- | ------------------------------------------------------------------------------------------------------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| 0:00–0:20 | Two terminals with the running servers; open http://localhost:5173. Point at the status line before and after the viewer loads. | «Два застосунки на різних портах: форма на 5173, OHIF на 3000 в iframe. Спілкуються лише через postMessage з явним origin. Статус зверху — \"очікує VIEWER_READY\": форма нічого не шле, поки viewer не оголосить готовність. Ось він завантажився — \"готовий, у черзі: 0\".»                                                            |\n| 0:20–1:20 | \"Додати вимірювання\" → \"Активувати\" → draw an ellipse; three times. Point at the value, the unit and \"Разом (3 вимірювання)\".   | «Кожен рядок отримує свій rowId ще до малювання. \"Активувати\" шле ACTIVATE_TOOL з іменем інструмента, viewer вмикає еліпс, а після вимірювання повертається до WindowLevel. Площа приходить у MEASUREMENT_ADDED разом із uid анотації — це єдина кореляція між сторонами. \"Разом\" — сума лише в mm²; px² до mm² ніколи не додається.» |\n| 1:20–1:40 | \"Додати вимірювання\" → \"Активувати\" → \"Скасувати\". Point at the OHIF toolbar.                                                   | «Передумав: DEACTIVATE_TOOL, рядок повертається в \"Очікує\", інструмент — до WindowLevel. Рядок лишається, його можна активувати знову.»                                                                                                                                                                                               |\n| 1:40–2:00 | Hover an ellipse, grab a handle, drag it slowly.                                                                                | «Живе оновлення: значення і сума міняються під час руху. Viewer проріджує MEASUREMENT_UPDATED до десяти на секунду; форма у відповідь нічого не шле, тому петлі немає.»                                                                                                                                                               |\n| 2:00–2:20 | \"Додати довжину\" → \"Активувати\" → draw a line. Point at \"Разом довжина\".                                                        | «Другий інструмент їде тим самим полем toolName. Довжини сумуються окремо від площ.»                                                                                                                                                                                                                                                  |\n| 2:20–2:35 | Pan the image away, then click a \"Готово\" row.                                                                                  | «Клік по рядку — FOCUS_MEASUREMENT: viewer стрибає до анотації і виділяє її.»                                                                                                                                                                                                                                                         |\n| 2:35–3:00 | \"Видалити\" on one row; then right-click another ellipse in the viewer → \"Delete measurement\".                                   | «Видалення в обидва боки: з форми — анотація зникає у viewer-і; з viewer-а — рядок повертається в \"Очікує\", як сказано в завданні.»                                                                                                                                                                                                   |\n| 3:00–3:15 | Switch the layout to 2×2 (toolbar grid button).                                                                                 | «OHIF 3.12.17 у кожній панелі — версія з package.json, підставлена webpack-ом під час збірки.»                                                                                                                                                                                                                                        |\n| 3:15–3:35 | Press F5; wait for the viewer; point at the rows, the totals and the redrawn annotations.                                       | «Після перезавантаження рядки й суми на місці, а viewer отримує RESTORE_MEASUREMENTS і перемальовує анотації з тими самими uid. Значення підтверджує сам viewer, сховищу не довіряємо.»                                                                                                                                               |\n| 3:35–3:50 | The host console: `[channel] received …` / `sent …` lines.                                                                      | «Весь протокол видно в консолі: перевірка origin, версія контракту, черга до VIEWER_READY. Контракт — zod-схеми в окремому пакеті, спільному для обох сторін.»                                                                                                                                                                        |\n\nTips: draw small ellipses right after \"Активувати\" and narrate over the actions, not between them.\nIf a step goes wrong, stop, press F5 and retake only that step — the state survives a reload.\n\n## Known console noise (not ours)\n\nTwo warnings appear in the viewer's console in the development build of OHIF 3.12.17 and are\nunrelated to the extension; a message of ours always starts with `[channel]` or `[scoring-viewer]`.\n\n- `Warning: Failed prop type: Invalid prop `config`supplied to`App`, expected one of type [function]` — OHIF's\n  own `App.propTypes` (`platform/app/src/App.tsx`), once per viewer load.\n- `Warning: React does not recognize the `evaluateProps` prop on a DOM element` — OHIF's toolbar\n  (`ToolbarService` adds the field to every button, `extensions/default` spreads it onto a `div`).\n  `ScoringViewer` shows in that component stack only because our provider wraps the mode (A-32),\n  like every other context-module provider.\n"},{"path":"AI-USAGE.md","title":"AI usage","group":"Delivery","md":"# AI usage\n\nThis project was built with an AI coding assistant driving the process. What follows is what it\ndid, what was kept, what was rewritten, and how the author stays able to defend every line.\n\n## How the work was organised\n\n- The assignment text was turned into a canon of atomic requirements with immutable IDs\n  (`docs/CANON.md`) and a feature graph (`docs/FEATURE-GRAPH.md`) before any code. Every later\n  change references those IDs; a script (`npm run check:graph`) keeps the graph consistent.\n- Work went slice by slice, one PR each, with two approval gates per slice (plan, then result).\n  Decisions on ambiguities were proposed by the assistant and approved by the author; each one is\n  a record under `doc
