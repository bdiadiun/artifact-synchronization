s/decisions/`.\n- An architect session planned, wrote the docs and decision records, reviewed every diff and ran\n  the end-to-end checks. Implementation and tests were written by separate, smaller assistant\n  sessions working from written briefs (canon IDs, files in scope, constraints, verification\n  commands). Routine git (commit, rebase, push, PR, merge after approval) was also delegated.\n- From slice 12 on, the roles are fixed in `.claude/agents/` (architect, developer, tester,\n  researcher, git-operator) and every brief points to `docs/CONVENTIONS.md`, so the style no longer\n  depends on which session wrote a file. Development and test agents run on smaller models than\n  the architect; the architect reviews every diff and runs the end-to-end checks itself.\n- Every slice was verified in a real browser with Playwright against both running apps, not only\n  with unit tests; screenshots were reviewed before each merge.\n\n## Where AI output was kept as is\n\n- The OHIF research note (`docs/notes/ohif-api.md`): the assistant cloned the release tag,\n  found the exact files and lines (measurement shape, event timing, `setToolActive`, validation\n  that rejects custom fields). The findings were verified at runtime (drawing an ellipse headlessly)\n  before they became decisions.\n- Most of the code as delivered by the implementation sessions: the contract guards, the bridge\n  client with its queue, the extension's command handling, the reducers and the totals function,\n  and the unit tests. They were reviewed against the briefs and the canon, not rewritten for style.\n- The Playwright end-to-end scripts used for verification (kept outside the repository).\n\n## What was corrected or rewritten, and why\n\n- The first version of the feature graph missed two mandatory IDs (C-3.1, D-4) in node rows; the\n  assistant's own invariant script caught it and the rows were fixed.\n- The canon initially said the tool returns to \"Pan/default\". The research showed the default\n  primary tool in the longitudinal mode is WindowLevel, so the decision became \"restore the tool\n  that was active before arming\" (A-8) rather than hardcoding a name. The minimal-bridge slice\n  (A-23) later replaced the snapshot with the fixed default, `WindowLevel`, once it was clear the\n  snapshot was the only reason the extension had to remember anything about the tool.\n- The contract was first wired as a Vite alias to a shared folder; it was reworked into an npm\n  published package (`@bdiadiun/scoring-contract`, A-12 and A-15) so the dependency is explicit.\n- `VIEWER_READY` was planned to be sent from `preRegistration`; the implementation session found\n  that `setToolActive` is a silent no-op before a viewport exists and moved the announcement to the\n  first `VIEWPORT_ADDED`. The decision record was updated to match.\n- A Ukrainian plural form generated for the count footer was wrong (\"виміру\") and was corrected.\n- The claim that a mono-repo lets one PR change both sides of the contract was withdrawn once the\n  viewer became a submodule; the decision record (A-1) now states what the mono-repo actually buys.\n- Live update: the first version logged one warning per animation frame while a handle was dragged\n  (about 40 per drag), because cornerstone has no stats on intermediate frames; the mapping was\n  made quiet on that path. A one-shot correction after `MEASUREMENT_ADDED` was added when the\n  architect's review showed that stats can settle one frame after completion; A-23 removed it\n  again, because the live-update stream delivers that same settled value.\n- Deletion: the brief assumed a `remove(uid, source, details)` signature; the implementation\n  session checked the pinned OHIF source, found a one-argument method, and used the real one. The\n  deletion made in the viewer was first simulated through the service; it was redone through the\n  actual OHIF measurements panel so the check matches what a doctor does.\n- Focus: an end-to-end check clicked the wrong element (a row that was not clickable) and reported\n  a false failure; the architect traced it through the viewer console and fixed the test, not the\n  code.\n- Docs page: the generator initially pinned a Mermaid version that does not exist on cdnjs, so\n  diagrams silently did not render; the architect found the 404 and the missing first render.\n  Later, running Prettier over the repository changed the placeholder the generator replaces, and\n  the page shipped with no documents; the generator now tolerates the change and fails loudly.\n- Conventions: the lint rule meant to forbid numeric enums never fired because its AST selector\n  did not match typescript-eslint v8; the architect caught it with a probe file. Introducing enums\n  broke the build because the Vite template enables `erasableSyntaxOnly`; the developer session\n  stopped and reported instead of changing the TypeScript config on its own.\n- A pull request description in the OHIF fork was written in Ukrainian against the repository\n  rules and was rewritten in English.\n- CI: running the checks from a clean `npm ci` showed that tests and type-aware lint had only been\n  passing on a warm local install (npm had hoisted test libraries away from the types they need).\n  The dependency layout was fixed and the rule added to the conventions.\n\n## What the tests are for\n\nThe test suite in this repository is not a person's hand-written safety net for their own code. No\ntest here was typed by the author. The code is generated, and the tests exist to answer one\nquestion about it: does the generated code do what it was briefed to do.\n\nThat difference shapes how they are written and where they sit.\n\n- The author's contribution is the checking system, not the assertions: roles that cannot review\n  their own work, a brief that states what must be proved, and a rule that a claim counts only when\n  an artefact backs it. The agent that writes application code is forbidden to touch a test, and\n  the agent that writes tests is forbidden to touch application code, so a failing test is never\n  quietly adjusted by whoever caused it to fail.\n- A test is expected to fail on purpose at least once. Coverage of a rule counts when the rule was\n  broken deliberately, the failure was seen, and the break was reverted; several rules in this\n  repository are recorded exactly that way, and one place where that proof could not be produced is\n  named as a gap rather than glossed over.\n- The suite is deliberately narrow, as the assignment asks: the sum logic, the message guards, the\n  channel's handshake and cleanup, and the rules that protect a URL or an origin. It is not an\n  attempt at broad coverage, which would measure the generator rather than the behaviour.\n\nThe author reads the diffs, runs the verification, and decides the gates. The tests are the part of\nthat process which does not depend on anybody reading carefully on a given day.\n\n## What the author verifies by hand\n\n- Every PR description's \"How it was verified\" section corresponds to commands and browser checks\n  that were actually run; screenshots of the end-to-end runs were reviewed.\n- The defence notes (`docs/DEFENCE.md`) map each expected question and live change to the exact\n  place in the code.\n- The author decides every gate: each slice plan and each result was approved in chat before any\n  commit, and design choices with trade-offs (repository layout, ID ownership, enum policy, which\n  bonus tasks to build) were presented as options with a recommendation and chosen by the author.\n\n## Where AI was not used\n\n- The demo video is recorded and narrated by the author.\n- The defence call: `docs/DEFENCE.md` is a map to the code, not a script to read.\n"},{"path":"docs/notes/form-internals.md","title":"form-internals","group":"Research","md":"# Form internals\n\nWhat the form's code does on purpose but cannot say by itself, module by module. The code carries\nno comments (CONVENTIONS §8, A-24; the same rule as the packages since 2026-09-23); the reasons\nlive here and in [`docs/decisions/`](../decisions/). File names refer to `host-app/src/`.\n\n## `config.ts`\n\n- `VIEWER_ORIGIN` is the only origin accepted for incoming viewer messages (A-2); `VIEWER_CHANNEL`\n  names the viewer as the page's one peer for every `useChannel` call, and `readyOn: 'VIEWER_READY'`\n  holds commands back until the viewer's own announcement names its window (A-9, A-34).\n- `DEFAULT_TOOL` is the single edit point for the ellipse → RectangleROI live change (P-7);\n  `LENGTH_TOOL` is the bonus second tool (S-5.4).\n- The study comes from the form's own `study` query parameter, read once per page load (the page\n  has no routing, so the study cannot change while it is open), and falls back to\n  `FALLBACK_STUDY_INSTANCE_UID` when the parameter is missing or invalid (A-19). A value is\n  accepted only if it matches the DICOM UID grammar — dot-separated numeric components, at most\n  64 characters (PS3.5 §9.1) — because it ends up inside the viewer iframe `src`: a free-form\n  value could append its own query parameters or repoint the path, so it is rejected, not escaped.\n  A rejected parameter is reported once, not on every render.\n\n## `models/row.ts`\n\n- `geometry` is kept on a row so a restored row can be re-sent to the viewer, and\n  `restoreFailureReason` marks a row the viewer refused, which `MeasurementRow` shows next to a\n  value that has no annotation behind it (A-14).\n- The JSON form (`RowModel.jsonSchema`, `toJSON`, `fromJSON`) drops `restoreFailureReason`, so a\n  reload always starts with a clean restore attempt rather than replaying a stale failure.\n- `RowModel.create(toolName)` issues the row id (A-8, A-37). `toRestoreRequest` is `null` for a row\n  without both a stored uid and its geometry: only such a row can be re-added in the viewer (A-14).\n\n## `state/reducer.ts`\n\n- The reducer is pure and side-effect-free; `hooks/useScoringForm.ts` wires it to the channel.\n  Its actions are the two local ones, every command the form sends and every event the viewer\n  sends — they go through as they are, so the reducer is the one place that says what each of them\n  means for the form (A-30, A-34).\n- Only one row is armed at a time (A-4): `ACTIVATE_TOOL` starts the target drawing and returns any\n  other drawing row to pending; arming the row that already draws changes nothing.\n- A measurement drawn while nothing was armed arrives with `rowId: null` and changes nothing (A-8).\n- A deletion in the viewer \"clears\" the row back to pending rather than removing it (the\n  assignment's wording); the viewer names the uid and the row is looked up by it (A-8). The echo of\n  a removal the form asked for finds no row and changes nothing (A-30).\n- `MEASUREMENTS_RESTORED` is applied row by row: a row the viewer rebuilt loses its mark, a row it\n  refused keeps one, so the form can say the value has no annotation behind it (A-14, A-33).\n\n## `state/actions.ts`\n\n- What each button does to its row is one dispatch of a contract command or a local action; the\n  form's `dispatch` sends the command and reduces it (A-34).\n- `activateRow`: one row is armed at a time, and `ACTIVATE_TOOL` replaces the armed row on both\n  sides, so no deactivation of the previous one is sent (A-4).\n- `removeRow`: a drawing row is cancelled in the viewer first; a done row has its annotation\n  removed there; the viewer's `MEASUREMENT_REMOVED` then comes back for a row that is already\n  gone, and the reducer ignores a uid no row holds (A-30).\n- `focusRow`: only a done row has a real annotation to scroll to; no reply is expected (S-5.3).\n- `restoreViewer`: every `VIEWER_READY` is a viewer that has none of our annotations yet, so the\n  rows it can rebuild are offered again (A-14, S-5.6) and the row that was drawing is armed again;\n  at most one row is drawing at a time (A-4), so the armed row is read off the rows rather than\n  mirrored anywhere.\n\n## `state/selectors.ts`\n\n- The viewer owns measurement ids, so an incoming event is matched by uid, not by row id (A-8).\n\n## `hooks/useScoringForm.ts`, `hooks/useStoredRows.ts`\n\n- The form for one study and the page's end of the channel. The rows come from `useStoredRows`\n  once, as the reducer's initial state, and are written back through it on every change (A-14);\n  `dispatch` sends every action that is a command of the contract and reduces all of them, so\n  nothing else in the form talks to the viewer (A-30); the handler is re-registered whenever the\n  rows change, so a viewer that announces itself is offered the rows on screen — a page reload and\n  a viewer reload restore the same way (S-5.6, A-33).\n- `useStoredRows` reads the rows of the study from `sessionStorage` once, at mount, and returns\n  the way to write them back (A-37). `loadRows` accepts only a validated envelope under this exact\n  study; anything else is \"nothing to restore\".\n\n## `services/storage.ts`\n\n- Every `sessionStorage` access is defensive: private mode, a full quota or a cleared store throw\n  or return nothing, and the caller still has to render. What is stored and under which key is\n  the caller's; the value read back passes through the caller's schema once (A-14, A-35).\n\n## `components/`\n\n- `ViewerFrame`: no `sandbox` attribute — the viewer needs its own scripts and must be able to\n  `postMessage` out.\n- `BridgeStatus`: a diagnostic surface for the handshake and the queue (P-9), not a product\n  feature.\n- `MeasurementRow`: native elements and minimal grey styling (X-3: no design work required). The\n  row div becomes a button only while the row is focusable — a done row with an annotation to\n  focus (S-5.3) — so neither handler re-checks the status; `stopPropagation` on the buttons keeps\n  a click from also triggering the row's focus click. The restore-failure marker stands out from\n  the grey status text so a failed restore is not missed (A-14).\n- `TotalsFooter`: totals are grouped strictly by unit (A-11, Q-6); the primary unit takes the\n  labelled line and any other unit (px²/px, an image without pixel spacing) gets its own line\n  with a hint, rather than being dropped or added into a sum it does not belong to.\n\n## `utils/`\n\n- `format.ts`: a row shows the metric matching its own tool (S-5.4); if that key is absent, the\n  first metric in the payload is shown with its key (P-8), so a metric type added later is visible\n  instead of silently dropped.\n- `totals.ts`: per-unit sums for the footer (A-11); mm² and px² are never added together, and mm²\n  comes first because it is the clinically meaningful unit when the study carries pixel spacing.\n\n## `i18n.ts`\n\n- User-visible strings are Ukrainian (A-7) and live in one place; a real i18n library is out of\n  scope (X-3). The \"вимірювання\" count follows Ukrainian noun agreement: 1 and 2–4 keep that form,\n  5+ and 11–14 take \"вимірювань\". The restore-failure string is shown on a row whose annotation\n  could not be rebuilt after a reload (A-14).\n\n## `setup-tests.ts`\n\n- Global DOM teardown so component test files do not each need their own `afterEach(cleanup)`;\n  `sessionStorage` persists across `it` blocks within one file's jsdom instance, so it is cleared\n  here so one test's persisted rows never leak into the next.\n"},{"path":"docs/notes/ohif-annotation-restore.md","title":"ohif-annotation-restore","group":"Research","md":"# Restoring an annotation after a page reload (S-5.6)\n\nRead from the pinned fork (`viewer/`, OHIF v3.12.17) and its installed `@cornerstonejs/tools`\n**4.15.29** / `@cornerstonejs/core` (both present under `viewer/node_modules/`). Paths are relative to\n`viewer/`; `cst/` abbreviates `node_modules/@cornerstonejs/tools/dist/esm/`. Extends\n[`ohif-api.md`](ohif-api.md) and [`viewer-internals.md`](viewer-internals.md).\n\n## 1. Adding an annotation programmatically\n\n`addAnnotation(annotation, annotationGroupSelector)` lives at\n`cst/stateManagement/annotation/annotationState.js:54-69`: it fills a missing uid (`:55-57`), then\neither resolves a group key from the selector and calls `triggerAnnotationAddedForElement` (`:59-63`)\nor calls `manager.addAnnotation(annotation, undefined)` + `triggerAnnotationAddedForFOR` (`:66-67`),\nreturning the uid. The second argument is `AnnotationGroupSelector = HTMLDivElement | string`\n(`cst/types/AnnotationGroupSelector.d.ts:1`) — a string is the group key verbatim, a div resolves to\nits viewport's `FrameOfReferenceUID` (`cst/…/FrameOfReferenceSpecificAnnotationManager.js:4-14`).\n**Omitting it is legal**: the manager falls back to `annotation.metadata.FrameOfReferenceUID`\n(`ibid.:76-79`), so no viewport is needed.\n\nOHIF's call sites: `extensions/cornerstone-dicom-sr/src/utils/addSRAnnotation.ts:142` —\n`annotation.state.addAnnotation(SRAnnotation);` with **no selector**, the comment at `:137-138` noting\nthat `annotationManager.addAnnotation()` \"was not triggering annotation_added events properly\";\n`extensions/cornerstone/src/initMeasurementService.ts:492` — `annotationManager.addAnnotation(newAnnotation)`\non `RAW_MEASUREMENT_ADDED` (deliberately event-less, the measurement already exists);\n`extensions/cornerstone/src/commandsModule.ts:414` — `cornerstoneTools.SegmentBidirectionalTool.hydrate(...)`.\n\nPer-tool helper `EllipticalROITool.hydrate(viewportId, points, options)`\n(`cst/tools/annotation/EllipticalROITool.js:625-656`; `LengthTool.js:331`) builds the object and calls\n`addAnnotation` + `triggerAnnotationRenderForViewportIds`, deriving metadata from the live camera\n(`cst/tools/base/AnnotationTool.js:238-277`). It needs an enabled element, drops the label (`:639`) and\n**returns nothing** for the ellipse — the uid goes in via `options.annotationUID` (`:638`).\n\n## 2. Required annotation shape\n\nTemplates: `addSRAnnotation.ts:105-133`, `EllipticalROITool.js:637-655`.\n\n| field                                 | needed?                                                                                                                                                                                                                                                                                                    |\n| ------------------------------------- | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| `annotationUID`                       | optional; generated if falsy (`annotationState.js:55-57`) — we supply it                                                                                                                                                                                                                                   |\n| `metadata.toolName`                   | **mandatory** — the manager buckets by it (`FrameOfReference…:78,86-89`), the mapper reads it (`EllipticalROI.ts:29-34`)                                                                                                                                                                                   |\n| `metadata.FrameOfReferenceUID`        | **mandatory** with no selector — it _is_ the group key (`ibid.:79`)                                                                                                                                                                                                                                        |\n| `metadata.referencedImageId`          | **mandatory in practice** — stack display filtering (`cst/utilities/planar/filterAnnotationsForDisplay.js:9-24`) and `getSOPInstanceAttributes` key off it                                                                                                                                                 |\n| `data.handles.points`                 | **mandatory** — world `Point3[]`, mapped to canvas at `EllipticalROITool.js:400`                                                                                                                                                                                                                           |\n| `data.cachedStats`                    | omit / `{}` — recomputed on render (§4)                                                                                                                                                                                                                                                                    |\n| `data.label`                          | optional; persist if the host displays it                                                                                                                                                                                                                                                                  |\n| `isLocked` / `isVisible` / `textBox`  | leave out — the manager's `preprocessingFn` defines them on insert (`cst/stateManagement/annotation/resetAnnotationManager.js:7-17`); `highlighted` is cosmetic                                                                                                                                            |\n| `invalidated`                         | set **`true`** on purpose (§4)                                                                                                                                                                                                                                                                             |\n| `metadata.viewPlaneNormal` / `viewUp` | **not needed for a stack viewport**; only volume viewports filter by normal and back-fill it from image orientation when absent (`cst/utilities/planar/filterAnnotationsWithinSlice.js:37-44`). `hydrateBase` itself sets both `undefined` when `referencedImageId` is given (`AnnotationTool.js:251-255`) |\n\n`Length` needs the same set; only the stats key differs (`length` + `unit`, `Length.ts:118`).\n\n## 3. Can we choose the `annotationUID`?\n\nYes — it is overwritten **only** when falsy (`annotationState.js:55-57`), then the manager pushes the\nobject as-is (`FrameOfReferenceSpecificAnnotationManager.js:91-94`). OHIF depends on this:\n`annotationUID: TrackingUniqueIdentifier` (`addSRAnnotation.ts:106`), `annotationUID: measurement.uid`\n(`initMeasurementService.ts:463`). Since OHIF forces `measurement.uid = annotationUID`\n(`initMeasurementService.ts:253`, `EllipticalROI.ts:62`), a restored annotation keeps the uid the host\nstored and the bridge's `uid → rowId` map survives the reload.\n\n## 4. What the measurement service does on restore\n\n`addAnnotation` fires `ANNOTATION_ADDED` (`cst/stateManagement/annotation/helpers/state.js:4-13`\nelement form; `:15-41` FOR form, emitting once per matching viewport or once without a `viewportId` if\nnone match). OHIF listens at `initMeasurementService.ts:338` → `addMeasurement` → `annotationToMeasurement`.\nBut **`MEASUREMENT_ADDED` is not broadcast**: with no `oldMeasurement` the service only stores it\n(`platform/core/src/services/MeasurementService/MeasurementService.ts:572-575`, \"Measurement started.\"),\nso our `MEASUREMENT_ADDED` subscriber will not see a restored annotation.\n\n`cachedStats` are recomputed **in the render pass**: an empty `cachedStats[targetId]` (or null\n`areaUnit`) triggers a synchronous `_calculateCachedStats` (`EllipticalROITool.js:403-414`); existing\nstats plus `invalidated` use the 100 ms throttled variant (`:415-416`, `:623`). At the end it clears\n`invalidated` and fires `ANNOTATION_MODIFIED` **only if it was true** (`:612-615`). That reaches\n`updateMeasurement` (`initMeasurementService.ts:340`), the measurement is present by then, and\n`MEASUREMENT_UPDATED` is broadcast with the real area.\n\n## 5. What we already receive vs. what must be persisted\n\n`measurementService` gives us (`EllipticalROI.ts:61-81`) `uid`, `points`, `metadata` (the cornerstone\nobject by reference: `toolName`, `FrameOfReferenceUID`, `referencedImageId`), `referencedImageId`,\n`toolName`, `label`, `displaySetInstanceUID`, `data` (= `cachedStats`) — a superset of §2. Nothing is\nmissing: `{ uid, toolName, FrameOfReferenceUID, referencedImageId, points, label }` rebuilds the\nannotation and is already in the `MEASUREMENT_ADDED` payload the bridge posts. Also persist the\n**`StudyInstanceUIDs`** — a restored annotation is meaningless against another study.\n\n## 6. Timing\n\nThe hard constraint is metadata, not rendering: the mapper calls\n`cornerstone.metaData.get('instance', imageId)` and dereferences it unguarded\n(`extensions/cornerstone/src/utils/measurementServiceMappings/utils/getSOPInstanceAttributes.js:57-65`).\nToo early → throws, `addMeasurement` swallows it (`initMeasurementService.ts:257-259`), and the\nannotation exists in cornerstone but never becomes a measurement.\n\nSignals, earliest to safest: `toolGroupService.EVENTS.VIEWPORT_ADDED`, already used by the handshake\n(`packages/scoring-viewer/src/extension.ts`, the `VIEWPORT_ADDED` subscription) — means \"a tool group exists\", enough for\n`setToolActive` but **not** for restore; `cornerstoneViewportService.EVENTS.VIEWPORT_DATA_CHANGED`\n(`extensions/cornerstone/src/services/ViewportService/CornerstoneViewportService.ts:44`, broadcast\n`:492`, `:1229`) — the viewport now has its display set data, the right hook; `VIEWPORT_NEW_IMAGE_SET`\non the element (`CornerstoneViewportService.ts:834`) or `IMAGE_RENDERED`\n(`extensions/cornerstone/src/utils/initViewTiming.ts:36`) — latest and safest.\n\n## 7. Rendering\n\n`addAnnotation` does not render. Call `triggerAnnotationRenderForViewportIds([viewportId])` — what\ncornerstone's `hydrate` does (`EllipticalROITool.js:656`) and what OHIF does after label/visibility\nedits (`initMeasurementService.ts:423-428`). It also drives the `cachedStats` recompute of §4. No\n`renderingEngine.render()` needed.\n\n## 8. Risks\n\n- **Wrong slice / wrong display set** — silently filtered out of rendering:\n  `filterAnnotationsForDisplay` defers to `viewport.isReferenceViewable(metadata, { imageURI })`\n  (`cst/utilities/planar/filterAnnotationsForDisplay.js:9-24`), `false` unless `referencedImageId` is\n  the current image or `withNavigation` is set\n  (`node_modules/@cornerstonejs/core/dist/esm/RenderingEngine/StackViewport.js:1816-1845`). The\n  annotation stays in state, invisible, until the user scrolls to that slice.\n- **Unknown `referencedImageId`** — `metaData.get('instance', …)` returns `undefined` and\n  `getSOPInstanceAttributes.js:58-63` throws; annotation added, no measurement, no area ever posted.\n- **Unknown `FrameOfReferenceUID`** — nothing throws: an orphan group is created\n  (`FrameOfReferenceSpecificAnnotationManager.js:79-85`) that no viewport queries, and\n  `triggerAnnotationAddedForFOR` emits with no `viewportId` (`helpers/state.js:33-36`). Silent no-op.\n- **Double restore** — no de-duplication by uid: `addAnnotation` pushes unconditionally, `getAnnotation`\n  returns the first match (manager `:48-61`), `removeAnnotation` deletes one per call.\n- **Not verified at runtime** — all of the above is read from source. Two claims deserve one console\n  session before the slice closes: that restore yields **no** `MEASUREMENT_ADDED` but does yield\n  `MEASUREMENT_UPDATED` after render (§4), and the `VIEWPORT_DATA_CHANGED` → metadata-ready ordering (§6).\n\n## Design implications\n\n- **Full annotation restore is feasible in this version, with caveats.** The API is public, and OHIF\n  itself uses it for DICOM SR — no private back door.\n- **The uid is ours to keep.** A supplied `annotationUID` is preserved, so the host's stored\n  `measurementUid` stays valid and the `uid → rowId` map can be rebuilt from the persisted rows.\n- **Simplest reliable approach: persist six fields and re-add the raw object.** Store\n  `{ uid, toolName, FrameOfReferenceUID, referencedImageId, points, label }` per row plus the study\n  UID, then `annotation.state.addAnnotation(obj)` **without a selector** — metadata carries the group\n  key, so no viewport lookup is needed and the code matches `addSRAnnotation.ts:142`.\n- **Prefer the hand-built object over `EllipticalROITool.hydrate`** — it re-derives metadata from the\n  live camera, needs an enabled element, drops the label and returns nothing.\n- **Set `invalidated: true`, leave `cachedStats` empty.** Stats are recomputed on render, and\n  `invalidated` is what makes cornerstone emit `ANNOTATION_MODIFIED` afterwards; a persisted area could\n  also be stale against different calibration.\n- **Observe restore through `MEASUREMENT_UPDATED`, not `MEASUREMENT_ADDED`.** The bridge's rule\n  \"stream updates only for measurements bound to a row\" means the uid → row map must be seeded\n  _before_ the annotations are added.\n- **Gate restore on `VIEWPORT_DATA_CHANGED`, not on the existing `VIEWPORT_ADDED` handshake** — adding\n  too early fails inside a `try/catch` and leaves an annotation with no measurement.\n- **Refuse restore when the study does not match.** Mismatched `referencedImageId` /\n  `FrameOfReferenceUID` fail silently, so persist the study UID with the rows and drop saved state on\n  a different study.\n"},{"path":"docs/notes/ohif-api.md","title":"ohif-api","group":"Research","md":"# OHIF bridge API note (v3.12.17)\n\nGrounded reading of the OHIF source at tag `v3.12.17`. All paths are relative to the OHIF\nrepository root. Line numbers refer to that tag. Nothing in this note was executed; items marked\n\"runtime check\" still need to be confirmed with the app running.\n\n## 1. Extension anatomy and registration\n\nAn extension is a plain object; only `id` is required. Interface and hook params:\n\n- `platform/core/src/extensions/ExtensionManager.ts:28` — `ExtensionParams` = `{ extensionManager, servicesManager, serviceProvidersManager, configuration?, peerImport }` plus `ExtensionConstructor`.\n- `platform/core/src/extensions/ExtensionManager.ts:42-50` — `Extension { id; preRegistration?; getCommandsModule?; getViewportModule?; getUtilityModule?; ... }`.\n- `platform/core/src/extensions/ExtensionManager.ts:276-285` — what is actually passed at call time:\n  `servicesManager, serviceProvidersManager, commandsManager, hotkeysManager, extensionManager, appConfig, configuration`.\n\nTemplate to copy: `extensions/test-extension/src/index.tsx:17-54` (`const testExtension: Types.Extensions.Extension = { id, preRegistration: ({ servicesManager }) => {...}, ... }`),\nwith the id in a separate `src/id.js`. An even smaller one is `extensions/dicom-pdf/src/index.tsx:20-45`.\n\nRegistration into the app: add the package name to `platform/app/pluginConfig.json` (`\"extensions\": [...]`,\nlines 2-12; each entry `{ packageName, default?, version? }`), and the workspace glob `extensions/*`\nin `package.json:11` picks it up. The mode must also list it.\n\nDefault `/viewer` route: `modes/longitudinal/src/index.ts:60` (`routeName: 'viewer'`), extensions come from\n`modes/longitudinal/src/index.ts:20-24` (`extensionDependencies = { ...basicDependencies, '@ohif/extension-measurement-tracking': '^3.0.0' }`)\nand are attached at `modes/longitudinal/src/index.ts:65` (`extensions: extensionDependencies`).\nSo the bridge package name must be added both to `pluginConfig.json` and to that `extensionDependencies` map.\n\n## 2. measurementService\n\nFile: `platform/core/src/services/MeasurementService/MeasurementService.ts`.\n\n`EVENTS` at `:71-84`:\n`MEASUREMENT_UPDATED`, `INTERNAL_MEASUREMENT_UPDATED`, `MEASUREMENT_ADDED`, `RAW_MEASUREMENT_ADDED`,\n`MEASUREMENT_REMOVED`, `MEASUREMENTS_CLEARED`, `JUMP_TO_MEASUREMENT`. Exposed as static and instance\n`EVENTS` (`:128`, `super(EVENTS)` at `:139`).\n\n`subscribe` comes from the pub/sub mixin: `platform/core/src/services/_shared/pubSubServiceInterface.ts:23-40`\n— `subscribe(eventName, callback)` returns `{ unsubscribe: () => ... }`. That returned object is the only\ncleanup handle (Q-5).\n\nPayloads:\n\n- ADDED — `{ source, measurement }` (`MeasurementService.ts:567-570`).\n- UPDATED — `{ source, measurement, notYetUpdatedAtSource }` (`:559-564`, `:379-383`, `:872-876`).\n- REMOVED — `{ source, measurement }` where `measurement` is the **UID string**, not the object (`:686-689`).\n\n## 3. Measurement shape for EllipticalROI\n\n`extensions/cornerstone/src/utils/measurementServiceMappings/EllipticalROI.ts:61-81` returns:\n`uid` (= cornerstone `annotationUID`, line 62), `SOPInstanceUID`, `FrameOfReferenceUID`, `points`\n(`data.handles.points`, line 53), `textBox`, `metadata` (the cornerstone annotation metadata object,\ncontains `toolName`, `referencedImageId`, `FrameOfReferenceUID` — line 29), `referencedImageId`,\n`toolName`, `displaySetInstanceUID`, `label` (`data.label`), `displayText`, `data: data.cachedStats`,\n`type`, `getReport`.\n\nThere is **no top-level `area`/`unit` field on the ellipse measurement.** Area lives inside\n`measurement.data`, which is cornerstone's `cachedStats`, keyed per target (usually\n`imageId:<referencedImageId>`), each holding `{ mean, stdDev, max, area, Modality, areaUnit, modalityUnit }`\n— see the destructuring at `EllipticalROI.ts:110` and the display use at `:194,206-207`\n(`${roundedArea} ${getDisplayUnit(areaUnit)}`). `getDisplayUnit` is a pass-through:\n`extensions/cornerstone/src/utils/measurementServiceMappings/utils/getDisplayUnit.ts:1`.\n\nSo area is a **number** (`area`) plus a **unit string** (`areaUnit`). The unit string is produced by\ncornerstone3D's calibrated-units helper when it computes `cachedStats`; OHIF only forwards it. Whether it\nreads `mm²` or `px²` for a given series depends on pixel spacing and needs a runtime check (see §8).\n\n`Length.ts:118` — `const { length, unit = 'mm' } = targetStats;` (note the `mm` default), `:125-126`.\n`RectangleROI.ts:60-80` returns the same shape as the ellipse, also with `data: data.cachedStats`\ncarrying `area` / `areaUnit`.\n\n## 4. When ADDED vs UPDATED actually fire\n\nWiring: `extensions/cornerstone/src/initMeasurementService.ts:332-342`\n\n```\nconst addedEvt = csToolsEvents.ANNOTATION_ADDED;      // 332\nconst completedEvt = csToolsEvents.ANNOTATION_COMPLETED;\neventTarget.addEventListener(addedEvt, addMeasurement);      // 338\neventTarget.addEventListener(completedEvt, addMeasurement);  // 339\neventTarget.addEventListener(updatedEvt, updateMeasurement); // 340 (ANNOTATION_MODIFIED)\n```\n\nBoth ADDED and COMPLETED call the same `addMeasurement` (`:225-259`), which forces\n`annotationAddedEventDetail.uid = annotationUID` (`:253`) and calls `annotationToMeasurement(toolName, detail)`.\n\nThe de-duplication happens in the service, `MeasurementService.ts:545-576`: on the **first** call there is no\n`oldMeasurement`, so it only logs `'Measurement started.'` and stores it — **no event is broadcast** (`:572-574`).\nOn the **second** call (ANNOTATION_COMPLETED, i.e. drawing finished) `oldMeasurement` exists and `isUpdate`\nis false, so `MEASUREMENT_ADDED` is broadcast (`:567`). Net effect: the host sees `MEASUREMENT_ADDED` once,\non completion — exactly what C-4.3.5/C-4.3.6 need.\n\n`updateMeasurement` (`initMeasurementService.ts:262-284`) fires on every `ANNOTATION_MODIFIED`, i.e. on each\ndrag frame, and bails out early if the measurement is not yet in the service (`:271-275`). It passes\n`isUpdate = true`, so the service broadcasts `MEASUREMENT_UPDATED` with `notYetUpdatedAtSource: false`\n(`:559-564`). For S-5.1 this stream must be throttled/debounced on our side.\n\n## 5. Activating and deactivating a tool\n\nCommand `setToolActive`: `extensions/cornerstone/src/commandsModule.ts:1035-1068`, registered at `:2491-2493`.\nSignature `{ toolName, toolGroupId = null, bindings = [{ mouseButton: Enums.MouseBindings.Primary }] }`.\nIt resolves the tool group via `toolGroupService.getToolGroup(toolGroupId)` (null → active viewport's group),\nreturns silently if the group does not exist or `!toolGroup.hasTool(toolName)` (`:1050-1055`), sets the\npreviously active primary tool to passive/disabled (`:1057-1063`) and then `toolGroup.setToolActive(toolName, { bindings })`.\n\nThere is also `setToolActiveToolbar({ toolName, toolGroupIds = [], ... })` at `:1025-1033`, which loops over\nseveral tool groups — useful if we want all viewports armed.\n\nDefault primary tool in the longitudinal/basic mode: `modes/basic/src/initToolGroups.ts:21-35` puts\n`WindowLevel` (primary mouse), `Pan` (auxiliary), `Zoom` (secondary), `StackScroll` (wheel) in `active`.\n`EllipticalROI` is only `passive` (`:65`). So \"return to default\" for C-4.3.6 means\n`setToolActive({ toolName: 'WindowLevel' })` — not `Pan`, which is on the middle button.\n\ntoolGroupService: `extensions/cornerstone/src/services/ToolGroupService/ToolGroupService.ts` —\n`getToolGroup(toolGroupId?)` `:73`, `getToolGroupForViewport(viewportId)` `:108`,\n`getActiveToolForViewport(viewportId)` `:113`, `getActivePrimaryMouseButtonTool(toolGroupId?)` `:242`.\nThe last one lets the bridge remember the pre-activation tool and restore it.\n\n## 6. Correlating a measurement with an external ID\n\nA custom top-level field does **not** survive: `MeasurementService.ts:832-841` (`_isValidMeasurement`) rejects\nthe whole measurement if any key is outside `MEASUREMENT_SCHEMA_KEYS` (`:33-69`), and that list is fixed\n(`uid, color, data, getReport, displayText, ..., label, metadata, area, ..., isDirty`). The check runs on both\nadd and update paths (`:430`, `:526`).\n\nAvailable carriers, in order of preference:\n\n1. **`uid` = cornerstone `annotationUID`** (`EllipticalROI.ts:62`, forced in `initMeasurementService.ts:253`).\n   Stable across ADDED/UPDATED/REMOVED and unique — the natural correlation key. The bridge keeps its own\n   `rowId ↔ measurementUid` map in extension memory; the viewer issues the measurement UID, the host issues\n   the row ID, and the bridge owns the mapping (Q-3).\n2. **`label`** — a schema key, so it survives, but it is `data.label` from the cornerstone annotation and is\n   user-visible/user-editable in the OHIF panel, so it is a fragile place for a machine ID.\n3. **`metadata`** — passed through by reference from the cornerstone annotation (`EllipticalROI.ts:19,67`), so a\n   field written onto `annotation.metadata` before mapping would reach the measurement. It is a cornerstone\n   object, not ours; treat as a fallback only.\n\n`update(measurementUID, measurement, notYetUpdatedAtSource = false)` at `:365-386` replaces the stored object and\nre-broadcasts `MEASUREMENT_UPDATED` — this is the obvious echo-loop source (Q-4). `remove(measurementUID)` at\n`:674-690` (S-5.2). Focus (S-5.3): `measurementService.jumpToMeasurement(viewportId, measurementUID)` at `:740-755`,\nor the command `commandsManager.run('jumpToMeasurement', { uid })` — `commandsModule.ts:739-744`, registered `:2469`.\nRead-back helpers: `getMeasurement(uid)` `:198`, `getMeasurements(filter?)` `:185`.\n\n## 7. Existing postMessage / external hooks\n\nNone. A search over `platform/` and `extensions/` for `postMessage` returns no application code; the only\n`addEventListener('message', ...)` hits are vendored bundles (`platform/app/public/oidc-client.min.js:1141`,\n`platform/app/public/es6-shim.min.js:2039`) and the service worker (`platform/app/src/service-worker.js:49`).\nThere is no existing \"external integration\" extension — the bridge is greenfield, which also means no\nnaming collisions and no existing origin policy to respect.\n\n## 8. App config and the study link\n\nConfig file: `platform/app/public/config/default.js`. `defaultDataSourceName: 'ohif'` (`:91`); that source is\n`sourceName: 'ohif'` (`:105`) pointing at the public static WADO server\n`https://d14fa38qiwhyfd.cloudfront.net/dicomweb` (`:109-111`, qido/wado/wadoUri all the same). No PACS needed (C-4.1.2, X-2).\n\n`StudyInstanceUIDs` is read from the query string by the mode route:\n`platform/app/src/routes/Mode/Mode.tsx:124` — `setStudyInstanceUIDs(dataSource.getStudyInstanceUIDs({ params, query }))`,\nthen provided at `:358`. So `/viewer?StudyInstanceUIDs=<uid>` opens a study directly (C-4.1.3).\n\nCandidate study: `1.3.6.1.4.1.25403.345050719074.3824.20170125113417.1`, used against the default data source by\nseveral cypress specs — `platform/app/cypress/integration/MultiStudy.spec.js:4`,\n`platform/app/cypress/integration/customization/HangingProtocol.spec.js:4,32-33`,\n`platform/app/cypress/integration/study-list/OHIFStudyList.spec.js:46`. It is the standard OHIF demo study and is\nknown to render measurements in the e2e suite. **Whether its pixel spacing yields `mm²` is a runtime check** —\nopen the study, draw one ellipse and read `cachedStats[...].areaUnit`.\n\n## 9. Toolchain\n\n- Engines: `package.json:23-27` — `node >= 18`, `npm >= 6`, `yarn >= 1.20.0`. No `.nvmrc`, no `.yarnrc` in the repo.\n- Root dev: `package.json` `\"dev\": \"lerna run dev:viewer --stream\"` and `\"start\": \"yarn run dev\"`.\n- App dev: `platform/app/package.json:37` `\"dev:viewer\": \"yarn run dev\"` → `:31`\n  `\"dev\": \"cross-env NODE_ENV=development webpack serve --config .webpack/webpack.pwa.js\"`.\n- Port: `platform/app/.webpack/webpack.pwa.js:29` — `const OHIF_PORT = Number(process.env.OHIF_PORT || 3000);`,\n  applied at `:152` (`port: OHIF_PORT`). So the viewer is on `http://localhost:3000` by default and the port is\n  overridable via the `OHIF_PORT` env var — matching decision A-2.\n\n## Design implications\n\n- **The viewer issues the measurement ID, not the host.** `measurement.uid` is forced to the cornerstone\n  `annotationUID` (`initMeasurementService.ts:253`), and the schema whitelist (`MeasurementService.ts:832-841`)\n  blocks any custom field, so the host cannot stamp its own ID onto a measurement. The host issues the row ID,\n  the bridge holds a `rowId ↔ measurementUid` map and translates in both directions.\n- **Subscribe in `preRegistration`, on `measurementService`, not on cornerstone events.** The service already\n  de-duplicates the two cornerstone events into one `MEASUREMENT_ADDED`, and `subscribe` hands back an\n  `unsubscribe` closure that satisfies Q-5.\n- **Drawing completion is free.** `MEASUREMENT_ADDED` is broadcast only on `ANNOTATION_COMPLETED`, because the\n  `ANNOTATION_ADDED` pass stores the measurement without broadcasting (`MeasurementService.ts:572-574`). No\n  debouncing needed to distinguish \"started drawing\" from \"finished\".\n- **`MEASUREMENT_UPDATED` is a firehose** — one event per `ANNOTATION_MODIFIED`, i.e. per drag frame. S-5.1 needs\n  throttling on the viewer side, and the echo guard must compare values, not just track a \"we sent this\" flag.\n- **Area is `data[targetId].area` + `data[targetId].areaUnit`, never a top-level `area`.** The bridge must pick a\n  target key (normally `imageId:${referencedImageId}`) and ship `{ value, unit }` as one inseparable pair, so the\n  host can refuse to sum `mm²` with `px²` (Q-6). Length uses `length` + `unit` (defaulting to `'mm'`).\n- **Deactivation means re-activating `WindowLevel`**, the default primary-mouse tool in the basic/longitudinal\n  tool group (`modes/basic/src/initToolGroups.ts:21-24`) — \"Pan\" in the assignment text is loose wording. Better\n  still, snapshot `toolGroupService.getActivePrimaryMouseButtonTool()` before arming and restore that.\n- **Tool name is pure data.** `setToolActive({ toolName })` validates with `toolGroup.hasTool(toolName)` and\n  `EllipticalROI`, `RectangleROI` and `Length` are all registered as passive tools in the same group, so the\n  P-7 live change (ellipse → rectangle) is a payload change only.\n- **No existing postMessage surface in OHIF**, so the bridge defines the whole protocol and must add its own\n  origin check (Q-2); nothing in the app will compete for `window.message`.\n"},{"path":"docs/notes/ohif-extension-composition.md","title":"ohif-extension-composition","group":"Research","md":"# Can one extension host others? (fork at `v3.12.17`)\n\nRead-only research in `viewer/`, branch `scoring`; paths relative to `viewer/`. Extends `ohif-packaging.md` (build-time extension list), not repeated here. `EM` = `platform/core/src/extensions/ExtensionManager.ts`; `Mode` = `platform/app/src/routes/Mode/Mode.tsx`; `CS` = `platform/core/src/services/CustomizationService/CustomizationService.ts`.\n\n## 1. What does `preRegistration` receive?\n\n**The five managers plus its own configuration, and `extensionManager` itself is among them; `peerImport` is declared but never passed.** `EM:276-286` passes `servicesManager`, `serviceProvidersManager`, `commandsManager`, `hotkeysManager`, `extensionManager: this`, `appConfig`, `configuration`, and is `await`ed (`:277`), so async setup is allowed. `ExtensionParams` also declares `peerImport` (`:33`), absent from that literal, so a host extension cannot load a package by name through the hook. Module getters get a smaller set that also includes `extensionManager` (`EM:454-461`).\n\n## 2. Can `registerExtension` be called from inside `preRegistration`, or later?\n\n**Supported, not merely tolerated: public (`EM:251`), re-entrant, idempotent per id, and OHIF itself calls it after the initial pass.** The outer loop iterates the _argument array_ (`EM:225-241`), never `registeredExtensionIds`, so a nested call cannot disturb it. Each call is self-contained: throw on null (`:256-258`), throw on a missing `id` (`:262-267`), `log.warn` + early `return` on a duplicate id (`:269-274`), hooks captured (`:288-294`), module loop (`:297-341`), `registeredExtensionIds.push` last (`:344`). A nested child lands in that list before its parent, which only shifts `onModeEnter` / `onModeExit` order (`EM:168-180`, `:183-199`). Precedent: `Mode:89-95` registers a mode's extensions after `appInit` (`platform/app/src/appInit.js:94`).\n\n## 3. Which module types still take effect when registration happens late?\n\nLate = during another extension's `preRegistration` inside `appInit`, before any mode is entered.\n\n- **Commands** — yes, applied at once (`EM:307-309`, `:618-655`).\n- **Customizations** — yes: `modulesMap` filled (`EM:519-528`), and `init` re-reads `getRegisteredExtensionIds()` on every mode enter (`CS:112-132`, `:141-144`).\n- **Hanging protocols** — yes: auto-added at registration (`EM:486-495`); `reset()` / `onModeEnter()` keep `protocols` (`.../HangingProtocolService/HangingProtocolService.ts:156-168`).\n- **Utilities, contexts, state sync, layout templates** — yes, resolved by string at call time (`EM:359-361`; `modes/basic/src/initToolGroups.ts:14`, `Mode:344-347`, `:378-392`).\n- **Data sources** — the module registers (`EM:597-615`), but `addDataSource` fires only for definitions in the `dataSources` argument, i.e. `appConfig.dataSources` (`appInit.js:94`); a nested call passes none, so call `addDataSource` explicitly (`EM:531-540`).\n- **Panels / viewports / SOP class handlers** — lookup is late (`PanelService.tsx:49`, `extensions/default/src/ViewerLayout/index.tsx:92,121`, `DisplaySetService.ts:357`), but the names come from the mode (`modes/longitudinal/src/index.ts:14-18,31-39`; `Mode:180`) — earlier note confirmed.\n- **Toolbar** — split: `evaluate` handlers land at registration (`EM:501-509`, `ToolbarService.ts:145-146`) and are read when a section is built (`:706-718`, `:748-751`); buttons come from the mode.\n\n## 4. What identifies an extension, and what breaks with related ids?\n\n**`extension.id` namespaces modules but not commands.** Module ids are `${extensionId}.${moduleType}.${element.name}` (`EM:519-524`, `:600`); a nameless element throws (`:521-523`); a repeated id is skipped with a warning (`:269-274`). Commands are flat `context[commandName]` (`platform/core/src/classes/CommandsManager.ts:110-119`) — a second extension using the same command name silently overwrites the first. Customization keys are global too; only the `.customizationModule.default|global` entry is scoped (`CS:120,126`).\n\n## 5. Ordering and dependencies\n\n**No resolver.** A sequential loop, with a comment that no `postInit` hook exists (`EM:219-241`); order is the array order from `pluginConfig.json` → generated `platform/app/src/pluginImports.js:11-14` → `appInit.js:93`. A mode's `extensionDependencies` (`modes/longitudinal/src/index.ts:20-24`) is registered if absent (`Mode:67,89-95`), but its versions are checked nowhere. A host extension registering its own children does get a deterministic order: its slot, children first.\n\n## Verdict\n\nOne adapter extension, registered once in the fork, importing our packages statically and calling `extensionManager.registerExtension(child)` per child inside `preRegistration`, works at `v3.12.17`. Each child keeps its own id, commands, customizations, hanging protocols, utilities and toolbar evaluators, so a new capability becomes a change in our packages only. Still needs the fork: the single `pluginConfig.json` entry and workspace dependency for the adapter (`loadModule` is generated from literals — `ohif-packaging.md` §1); any panel, viewport or toolbar button, which a mode must name; and a data source, which needs an explicit `addDataSource`.\n\n## Design implications\n\n- Make the fork's one extension entry an adapter; ship features as its child extensions.\n- Register children in `preRegistration`: `extensionManager` is in scope, registration is re-entrant.\n- Distinct id per child, and prefix command names — ids do not namespace commands.\n- Import children statically; `peerImport` is not available in `preRegistration`.\n- Anything a mode names (panel, viewport, SOP handler, toolbar button) stays a fork edit; prefer commands, customizations and service subscriptions.\n"},{"path":"docs/notes/ohif-packaging.md","title":"ohif-packaging","group":"Research","md":"# OHIF packaging and extension registration (fork at `v3.12.17`)\n\nRead-only research in the submodule `viewer/`, branch `scoring`. Paths are relative to `viewer/`.\n\n## 1. How are extensions registered, and when?\n\n**Verdict: the list is fixed when the webpack config is evaluated (build start); nothing can be added to an already-built bundle this way.**\n\n- `platform/app/pluginConfig.json:70` (our entry) is read by `platform/app/.webpack/writePluginImportsFile.js:1` (`require('../pluginConfig.json')`), invoked at the top level of the config file — `platform/app/.webpack/webpack.pwa.js:36`, and `rsbuild.config.ts:102`.\n- It writes the git-ignored `platform/app/src/pluginImports.js` (`writePluginImportsFile.js:171`; `.gitignore:46`) with name pushes (`:50-62`) and one literal `await import(\"<packageName>\")` per package (`:89-94`); webpack resolves each statically, so the chunk set is compile-time.\n- Consumed at `platform/app/src/index.js:18`, registered at `platform/app/src/appInit.js:93-94` (`loadModules([...defaultExtensions, ...appConfig.extensions])` → `registerExtensions`), awaited before modes load (`:104`).\n\n## 2. Is there runtime extension loading?\n\n**Verdict: yes, one escape hatch — `window.config.extensions`, resolved by a native dynamic `import()`, usable with a URL or a global.**\n\n- `appConfig.extensions` is merged into the build-time list (`appInit.js:93`); `appConfig` is `window.config` (`platform/app/src/index.js:23-37`), set by the runtime script `app-config.js` (copied at `webpack.pwa.js:118`; `dist/index.html` loads `src=\"/app-config.js\"`); default empty at `platform/app/public/config/default.js:7`.\n- A config file can be fetched after load: `platform/app/src/loadDynamicConfig.js:1-22` (`dangerouslyUseDynamicConfig.enabled` + a `configUrl` query parameter matching a regex).\n- String entries fall through to `writePluginImportsFile.js:98` (`window.browserImportFunction(module)`) = plain `import(moduleId)` at `platform/app/public/html-templates/index.html:202-204`; the global variant is documented at `:210-215`. No module federation and no `window.extensionManager`, so a remote module brings its own `@ohif/core`/React and must register before `appInit` finishes.\n\n## 3. Can `platform/app` be packaged and consumed by another application?\n\n**Verdict: only as static files served at a domain root, not as an importable npm dependency.**\n\n- Not private: `platform/app/package.json:11-13` (`publishConfig.access: \"public\"`), `:46-49` (`files: [\"dist\",\"README.md\"]`); but `:9` `\"main\": \"dist/index.umd.js\"` names a file the build never produces. Production build: `:21`,`:27` webpack → `webpack.pwa.js:64-67` (`path: DIST_DIR`, `[name].bundle.[chunkhash].js`) plus `index.html` (`:125`).\n- Built locally, `platform/app/dist` is **199 MB**: `ort/` 136 MB, `dicom-microscopy-viewer/` 20 MB, `app.bundle.<hash>.js` 15 MB, 102 top-level entries. URLs are absolute — `publicPath: PUBLIC_URL` default `'/'` (`webpack.pwa.js:19,67`), `dist/index.html` → `src=\"/app.bundle.<hash>.js\"`, `platform/app/src/utils/publicUrl.ts:1`.\n- Workable: serve `dist` at the root of its own port, configured by replacing `app-config.js` after install. Breaks: `import` of the package (dead `main`); sub-path hosting without a rebuild with `PUBLIC_URL`; npm size at 199 MB; the root-scoped service worker (`init-service-worker.js`).\n\n## 4. Smallest permanent fork change\n\n**Verdict: the two registration lines can stay frozen for behaviour routed through commands, customizations and service subscriptions; they reopen for a new module getter, a new id, or anything a mode names by string.**\n\n- Free: `preRegistration` receives `servicesManager`, `commandsManager`, `extensionManager`, `appConfig` (`platform/core/src/extensions/ExtensionManager.ts:276-286`), so an internal handler registry, subscriptions, later `commandsManager.registerCommand` (`platform/core/src/classes/CommandsManager.ts:96`) and `setCustomizations` (`platform/core/src/services/CustomizationService/CustomizationService.ts:203`) need no fork edit.\n- Reopens the diff: `onModeEnter`/`onModeExit`, captured once (`ExtensionManager.ts:288-294`); the `id` (`:260-273`); a `get*Module` property absent at registration (`:454-460`); anything a mode names statically, e.g. `modes/longitudinal/src/index.ts:15-16,32` (a `panelModule` string in `rightPanels`) — shipping a panel means editing a mode. A version bump still touches `platform/app/package.json:67` unless the range is loose (then only `yarn.lock`).\n\n## 5. What the interface requires statically\n\n**Verdict: only the `id`, the lifecycle hooks and the presence of the `get*Module` functions; everything they return is computed when they are called.**\n\n- Interface `ExtensionManager.ts:44-53` (`preRegistration`, `getCommandsModule`, `getCustomizationModule`, `onModeEnter`, …); a missing `id` throws (`:262-266`). Module types are the fixed list `platform/core/src/extensions/MODULE_TYPES.js:1-14`; the manager iterates all of them and skips absent getters (`:297-341`, `:454-460`).\n- Runtime-decidable: command definitions, panel components, customization values — each getter runs with the live managers (`:454-471`). A customization entry named `default` is applied at registration (`extensions/scoring-bridge/src/getCustomizationModule.tsx:27-38`); later changes go through `setCustomizations`.\n\n## Design implications\n\n- Treat the viewer as a deployed static site, not a library; embed it by URL, as the host does today.\n- If it must be \"installed\", ship only `dist` served at a port root; never `import` `@ohif/app`.\n- The fork diff stays at two lines while new behaviour arrives as commands, customizations and service subscriptions inside the adapter's own registry.\n- A panel, viewport or toolbar slot pulls a mode file into the diff — prefer customizations.\n- `window.config.extensions` works but duplicates `@ohif/core`/React; experiments only.\n"},{"path":"docs/notes/ohif-service-availability.md","title":"ohif-service-availability","group":"Research","md":"# OHIF 3.12.x: service availability at extension `preRegistration`\n\nQuestion: at the moment our bridge extension's `preRegistration` runs, are\n`measurementService`, `toolGroupService`, `cornerstoneViewportService`,\n`viewportGridService`, `displaySetService` guaranteed present on\n`servicesManager.services`?\n\n## Mechanics\n\n`ServicesManager.registerService` writes `this.services[service.name]`\nsynchronously: `viewer/platform/core/src/services/ServicesManager.ts:46`\n(`this.services[service.name] = service.create(...)`); the service is live\nas soon as the call returns.\n\n`ExtensionManager.registerExtensions` runs a sequential `for` loop, awaiting\neach `registerExtension` in turn (`viewer/platform/core/src/extensions/ExtensionManager.ts:215-240`);\ninside it, `preRegistration` is awaited before module registration continues\n(`ExtensionManager.ts:276-283`). Extension N+1's `preRegistration` cannot\nstart before extension N's has fully resolved.\n\n`appInit.js` registers `MeasurementService`, `DisplaySetService`, and\n`ViewportGridService` directly via `servicesManager.registerServices([...])`\n(`viewer/platform/app/src/appInit.js:64-79`, entries at lines 69, 71, 74).\nThat call finishes before `extensionManager.registerExtensions(...)` is even\ncalled, at line 94 — no extension's `preRegistration` can run earlier.\n\n`toolGroupService` and `cornerstoneViewportService` are not in that core\nlist; `@ohif/extension-cornerstone` registers them itself, inside its own\n`preRegistration` (`viewer/extensions/cornerstone/src/index.tsx:193-194`),\nsynchronously, before that call returns.\n\n`viewer/platform/app/pluginConfig.json` lists `@ohif/extension-cornerstone`\nat index 1 and `@bdiadiun/ohif-extension-loader` last (index 14).\nSince `registerExtensions` is sequential, cornerstone's `preRegistration`\nhas already completed by the time the adapter's starts.\n\nThe adapter registers our bridge extension from inside its own\n`preRegistration`, via `registerChildren`, which `await`s\n`extensionManager.registerExtension(child)` per child in a `for` loop\n(`packages/ohif-extension-loader/src/registerChildren.ts:5-14`). This nests our\nbridge's `preRegistration` one level deeper but does not change the\nordering: it still runs after the adapter's slot in the top-level list,\ni.e. after cornerstone.\n\n## Table\n\n| service                      | registered by                                | guaranteed           | why                                                     |\n| ---------------------------- | -------------------------------------------- | -------------------- | ------------------------------------------------------- |\n| `measurementService`         | `@ohif/core`, `appInit.js:70`                | yes                  | core list resolves before any extension loads           |\n| `displaySetService`          | `@ohif/core`, `appInit.js:71`                | yes                  | same                                                    |\n| `viewportGridService`        | `@ohif/core`, `appInit.js:74`                | yes                  | same                                                    |\n| `toolGroupService`           | cornerstone preRegistration, `index.tsx:194` | yes, order-dependent | sequential loop; adapter is last in `pluginConfig.json` |\n| `cornerstoneViewportService` | cornerstone preRegistration, `index.tsx:193` | yes, order-dependent | same                                                    |\n\n## Conclusion\n\nAll five services exist on `servicesManager.services` by the time our\nbridge extension's `preRegistration` runs, under the current\n`pluginConfig.json` order. The three core services are unconditionally\nguaranteed — registered before any extension runs at all. `toolGroupService`\nand `cornerstoneViewportService` are conditionally guaranteed: the guarantee\nrests on extension order in `pluginConfig.json`, not a language contract, so\nit is a config invariant worth protecting (a comment in `pluginConfig.json`,\nor one runtime guard at bridge startup) rather than a type-system fact. The\narchitect can type all five as required in `OhifServices`; keep one narrow\nruntime check for the two order-dependent services, and drop the \"service\nunavailable\" branches for the other three.\n"},{"path":"docs/notes/viewer-internals.md","title":"viewer-internals","group":"Research","md":"# Bridge internals\n\nImplementation details of the bridge that are deliberate but not visible from the code alone.\nDecisions live in [`docs/decisions/`](../decisions/); OHIF behaviour we rely on is in\n[`ohif-api.md`](ohif-api.md). File names below refer to\n`packages/scoring-viewer/src/` unless a path is given. The package is the OHIF-side application,\nthe form's peer, written as a React layer (A-32, A-34): `ScoringViewer.tsx` (`getContextModule`:\nthe provider OHIF mounts around the mode, which runs the hook and offers the channel through the\ncontext), `session.ts` (the per-mount data: channel, armed row, pending restore, announced),\n`hooks/useScoringViewer.ts` (`useChannel`, then two effects: `channel.on` → `handleCommand`,\n`ohif.on` → `handleOhif`), `commands/handlers.ts` (`handleCommand`: one `switch` over the\ncommands), `commands/restore.ts`, `events/handlers.ts` (`handleOhif`: one `switch` over OHIF's\nevents), `ohif/facade.ts` (`createOhif`: OHIF's events in the contract's shape, throttled),\n`ohif/metrics.ts` (the measurement object parsed), `ohif/surface.ts` (the OHIF types),\n`ohif/throttle.ts` and `ohif/version.ts`. The channel is transport only (A-29, A-31).\n\n## Lifecycle\n\n- **Mounted and unmounted by OHIF** (`ScoringViewer.tsx`, A-32). `Mode.tsx` composes every\n  extension's context-module provider around the mode (`createCombinedContextProvider`), so the\n  application lives as long as the mode: a study change remounts it, which creates new per-mount\n  data and announces `VIEWER_READY` again — the host then offers its rows back (A-29). The channel\n  is the window's, not the mount's (A-34): `useChannel` names the peer on the first mount and\n  leases the window `message` listener for each mount (attached with the first lease, released\n  with the last), so a StrictMode double run or a Fast Refresh only re-leases the listener and\n  never leaves a mounted application with a dead channel; the queue and `{ ready, queued }` live\n  on. Leaving the mode tears the viewports and their tool group down, so no tool is left to\n  restore.\n- **A viewer opened outside the iframe has no peer** (`session.ts`): `window.parent` is passed to\n  the channel only when it differs from `window`; otherwise `postTo` finds no window, logs once and\n  queues, instead of posting to the viewer's own window with a target origin the browser refuses.\n- **The announcement does not depend on effect order** (`ohif/facade.ts`, `events/handlers.ts`).\n  A provider's effects run after its children's, so the first viewport can exist before the\n  application subscribes: `ohif.on` delivers `VIEWER_READY` at once when a tool group already\n  exists and on every `VIEWPORT_ADDED`; `handleOhif` sends it once per mount (`session.announced`),\n  so a layout with several viewports announces once.\n- **The OHIF services are required, not optional** (A-28, `ohif-service-availability.md`). The\n  three core services exist before any extension runs; `toolGroupService` and\n  `cornerstoneViewportService` are registered by `@ohif/extension-cornerstone`, which\n  `pluginConfig.json` lists before our adapter. `getContextModule` checks the two cornerstone\n  services once, at registration, and returns no provider without them; no other \"service\n  unavailable\" branch exists.\n- **OHIF's measurement object is parsed once** by the `OhifMeasurement` schema in `ohif/metrics.ts`\n  when a measurement event arrives in `ohif/facade.ts`; `toMetrics` and `toGeometry` work on the\n  parsed value, and what leaves the facade is already a contract event. An event whose payload is\n  not a measurement (a bare uid string, no uid) is ignored with one warning.\n\n## Measurements\n\n- **Stats lookup** (`ohif/metrics.ts`). `measurement.data` is keyed by target; the entry\n  `imageId:<referencedImageId>` is preferred, otherwise the first entry with a finite value.\n- **No metrics on `MEASUREMENT_ADDED` means nothing is posted** (`ohif/facade.ts`). A half-formed event\n  would move the row to `Готово` without a value; staying silent leaves it in `Малювання…` where\n  the doctor can cancel or redraw.\n- **`MEASUREMENT_UPDATED` goes out for every annotation** (`ohif/facade.ts`), throttled per uid;\n  the form ignores a uid no row holds, so the extension keeps no `uid → rowId` map (A-23).\n- **Silent mapping during drags** (`ohif/facade.ts`). On the update path a measurement without\n  stats is skipped without a log: cornerstone fills `cachedStats` in its render pass, so\n  intermediate drag frames without stats are normal.\n\n## Commands\n\n- **Every command goes through one `switch`** (`commands/handlers.ts`, registered with\n  `channel.on`; exhaustiveness is the linter's): a command added to the contract without a\n  case fails the type check, and an unknown type never reaches the switch because the contract\n  guard rejects it on arrival.\n- **A removal is fire-and-forget** (A-30): the handler calls `measurementService.remove` when the\n  uid is present and sends nothing itself; OHIF's `MEASUREMENT_REMOVED` reaches the host through\n  the subscription, for a row that is already gone.\n\n## Host side\n\n- **No separate `uid → rowId` map on the host** (`host-app/src/hooks/useScoringForm.ts`). A `done`\n  row stores its own `measurementUid`, and `MEASUREMENT_ADDED` carries `rowId`, so the rows array\n  is the map. The viewer keeps no map either: `session.armedRowId` (A-29) is set by\n  `ACTIVATE_TOOL` and taken by the next `MEASUREMENT_ADDED`.\n\n## Details moved out of the code (A-24)\n\n- **Announce once** (`events/handlers.ts`): `ohif.on` delivers `VIEWER_READY` for every viewport\n  and once at subscription when a tool group already exists; `handleOhif` sends the first per\n  mount (`session.announced`); a mode remount mounts new per-mount data, which announces again.\n- **Every measurement OHIF announces goes to the host** (`events/handlers.ts`); the one drawn\n  while a row was armed carries that row's id and hands the viewer back to the default tool\n  (A-8, A-23). Updates are throttled per measurement in the facade (`ohif/facade.ts`,\n  `UPDATE_INTERVAL_MS`), so a dragged handle reaches the form live but not on every frame\n  (S-5.1); a removal drops the update still pending for that uid, and the facade's unsubscribe\n  clears every timer.\n- **What OHIF's measurement object means for the host** (`ohif/metrics.ts`): the metric the\n  row's tool produces, read from `cachedStats` with its unit normalised to the contract's\n  vocabulary, and the geometry the form persists to rebuild the annotation later (A-14).\n  `measure` is `null` when the event carries no measurement object or a measurement whose tool\n  the form has no metric for.\n- **A restore waits for viewport data** (`commands/restore.ts`, `holdsViewportData`): annotations\n  can only be added once the active viewport holds image data; a `RESTORE_MEASUREMENTS` that\n  arrives earlier waits in `session.pendingRestore` for the next `VIEWPORT_DATA_CHANGED`.\n- **The version overlay item** (`ohif/version.ts`) is S-5.5: the viewer version in the corner of\n  every viewport, appended to OHIF's own overlay items.\n- **The adapter is the one package the fork lists** (`packages/ohif-extension-loader/src/extension.ts`,\n  A-20); its `preRegistration` registers the bridge extension itself.\n- **Removal goes through OHIF** (`commands/handlers.ts`): `measurementService.remove` (the\n  `removeMeasurement` command only wraps that call, `commandsModule.ts:746-751`) fires OHIF's\n  `MEASUREMENT_REMOVED`, which `ohif.on` delivers and `handleOhif` forwards.\n- **Focus** (`commands/handlers.ts`): cornerstone's `JUMP_TO_MEASUREMENT` handler selects the annotation and\n  moves the camera (`commandsModule.ts:208-241`); an unknown uid is an ordinary race, not an error.\n- **Restore is hand-built** (`commands/restore.ts`): `EllipticalROITool.hydrate` re-derives metadata from the\n  live camera, needs an enabled element and drops the label; `activeHandleIndex` must be `null`,\n  not absent, or the renderer indexes canvas coordinates with `undefined`\n  (`EllipticalROITool.js:445`); the group key for `addAnnotation` comes from\n  `metadata.FrameOfReferenceUID` for any string selector (`annotationState.js:59-68`); the viewport\n  holds data only after `VIEWPORT_DATA_CHANGED` (`CornerstoneViewportService.ts:492, 1229`).\n- **Mid-drag frames without stats are ordinary** (`ohif/facade.ts`): cornerstone recomputes\n  `cachedStats` in the render pass, so the update path skips a measurement without stats silently.\n- **Only the form knows which uid belongs to a row**: the viewer sends every update and the reducer\n  ignores unknown uids (A-23).\n- **OHIF types** (`ohif/surface.ts`): no OHIF package publishes declarations and the global `AppTypes` only\n  resolves inside the OHIF monorepo, so the extension declares the members it calls.\n- **Version overlay** (`ohif/version.ts`): customizations merge in registration order after cornerstone, so\n  `$push` appends to its list (`CustomizationService.ts:381-397`).\n- **Throttle per key** (`ohif/throttle.ts`): one annotation's drag cannot swallow another's final value.\n\n## OHIF facts behind specific lines (the code carries no comments, A-24)\n\n`commands/handlers.ts`\n\n- A released row returns to `WindowLevel`, OHIF's default primary-mouse tool (`modes/longitudinal … initToolGroups.ts:21-24`, A-23).\n- `setToolActive`, not `setToolActiveToolbar`, which arms every tool group (`commandsModule.ts:1025-1068`); the tool group and `hasTool` are checked first because `setToolActive` fails silently without them.\n- REMOVE for a uid the service no longer holds is answered at once (`MeasurementService.ts:675-680` returns silently; A-10); for a present uid the command is parked before `remove()` because the service broadcasts `MEASUREMENT_REMOVED` synchronously (`:674-689`), and cornerstone erases the drawing on that event (`initMeasurementService.ts:501-522`).\n- FOCUS: an unknown uid is an ordinary race, not the error `jumpToMeasurement` would warn about (`MeasurementService.ts:741-745`); the measurement panel makes the same call (`commandsModule.ts:739-744`).\n\n`ScoringViewer.tsx`, `ohif/facade.ts`\n\n- `setToolActive` is a silent no-op until a viewport has a tool group (`commandsModule.ts:1050-1055`), so `VIEWER_READY` is announced on `toolGroupService` `VIEWPORT_ADDED` (A-9).\n- OHIF's generated loader imports the default export of the package named in `pluginConfig.json` (`writePluginImportsFile.js:89-94`), so the configured extension is the default export.\n- `getContextModule` is called once at registration with `{ appConfig, servicesManager, commandsManager }` (`ExtensionManager.ts:463-469`); `getModulesByType('contextModule')` returns every registered extension's entries and `Mode.tsx:377-393` composes their `provider`s.\n\n`ohif/facade.ts`, `ohif/metrics.ts`\n\n- `MEASUREMENT_ADDED` merges cornerstone's `ANNOTATION_ADDED` and `ANNOTATION_COMPLETED` into one event (`MeasurementService.ts:545-576`, P-4); `MEASUREMENT_REMOVED` carries only the uid (`:686-689`).\n- `measurement.data` is `cachedStats` keyed per render target, normally `imageId:<referencedImageId>` (`measurementServiceMappings/EllipticalROI.ts:110`); the `RectangleROI` mapping has the same shape (`RectangleROI.ts:60-80`).\n- No `'mm'` default as in OHIF's `Length.ts:118`: mm on an uncalibrated image would break Q-6.\n- Geometry for restore comes from the measurement itself (`EllipticalROI.ts:61-81`, A-14); points are copied so the event does not carry cornerstone's live handle arrays.\n\n`ohif/surface.ts`\n\n- `window.config` reaches every extension as `appConfig`, both in `preRegistration` (`ExtensionManager.ts:276-286`) and in every module getter (`:463-469`); the manager reads `id`, `preRegistration` and the module getters it finds (`:260-273`, `:297-341`), awaits the hook (`:277`), and `registerExtension` is public and re-entrant (`:251-286`), which is how the adapter registers its children.\n- `getToolGroup()` without an id resolves the active viewport's group (`ToolGroupService.ts:73-104`).\n- The version overlay uses `contentF`, not `label`, because the overlay renders one text node (`CustomizableViewportOverlay.tsx:380-397`); `$push` appends to cornerstone's list because customizations merge in registration order (`CustomizationService.ts:118-131, 381-397`).\n- `process.env.VERSION_NUMBER` is replaced by OHIF's webpack at build time (`.webpack/webpack.base.js:32,46`); `process` never exists in the browser, so the expression is written exactly as DefinePlugin matches it.\n\n`commands/restore.ts`\n\n- `activeHandleIndex` must be `null`, not absent (`EllipticalROITool.js:445`); the group key for a string selector is `metadata.FrameOfReferenceUID` (`annotationState.js:59-68`, `addSRAnnotation.ts:142`); the study shown is the one the active display sets belong to (`DisplaySetService.ts:114`); a cornerstone viewport exists once `VIEWPORT_DATA_CHANGED` reported (`CornerstoneViewportService.ts:492, 509`).\n- `invalidated: true` makes cornerstone recompute the stats and emit `ANNOTATION_MODIFIED`, which is how the restored value reaches the form through the update stream.\n\n`packages/channel/src/peer.ts`, `channel.ts`\n\n- One end of the channel per window, created when the module loads (A-34) — since A-39 the instance of `class ChannelEnd`, whose private fields are the state and whose arrow-function fields are the methods: `useChannel(options)` names the peer on the first mount and checks every later mount against it by value (`samePeer`; a mismatch is a `console.error`, the first peer stays), leases the window `message` listener per mount (`leases`: attached at one, removed at zero) and subscribes the calling component to `{ ready, queued }` with `useSyncExternalStore`. `on` is typed to take `(message: never) => void` and holds the package's one type assertion, so the instance is assignable to every `Channel<TIn>` without a cast on the way out; the listener only ever passes messages the `accept` guard admitted, which is what the assertion relies on.\n- The `version` is the channel's (A-25); a foreign version is logged once and dropped before the guard. The `readyOn` message flushes the queue before the application's handler runs (A-9); a post that finds no window keeps the remainder queued (Q-1). Neither end cancels an armed row when it goes away: the host's channel lives as long as the page and the viewer dies with it; the extension's armed row lives in the bridge effect and dies with its mount (Q-5, A-31, A-32).\n"},{"path":"docs/PROJECT-STRUCTURE.md","title":"Project structure","group":"Process","md":"# Project structure\n\nTwo reference layouts and how this repository applies them: the anatomy of a `.claude/` folder, and\nthe conventional folder structure of a React (Vite) application. Where the reference and this\nrepository differ, the reason is stated; where the reference lists something that is not a real\nfeature, that is stated too.\n\n## 1. The `.claude/` folder\n\nReference layout, with what each entry does:\n\n```\nyour-project/\n├── CLAUDE.md               the rules for this repository, kept short\n├── CLAUDE.local.md         personal overrides, never committed\n├── .gitignore              blocks *.local.* and secrets\n├── .mcp.json               MCP servers, project root only, no nesting\n└── .claude/\n    ├── skills/             model-invokable procedures; Claude picks them up itself\n    ├── agents/             subagents, each with its own context window\n    ├── commands/           slash commands, legacy but working\n    ├── rules/              instructions scoped to a path glob, loaded on match\n    ├── output-styles/      the shape of the answer, swappable\n    ├── settings.json       permissions, model, hook registry\n    └── settings.local.json this machine only, gitignored\n```\n\nTwo entries from the reference are **not** real features and are deliberately absent here:\n\n| Reference entry                               | Reality                                                                                                                                                             |\n| --------------------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| `.claude/hooks/` as a folder of shell scripts | Hooks are a `hooks` key in `settings.json` with an event, a matcher and a command. The script itself can live anywhere; ours is `scripts/hooks/format-touched.mjs`. |\n| `.claude/plugins/`                            | A plugin is a standalone directory with its own manifest, or something installed from a marketplace. A project folder of that name means nothing.                   |\n\n`commands/` still works but is the older form of `skills/`; both are used here, see below.\n\n### What this repository has\n\n| Path                               | Purpose                                                                                                                       |\n| ---------------------------------- | ----------------------------------------------------------------------------------------------------------------------------- |\n| `CLAUDE.md`                        | How the work is run: roles, canon, feature graph, slices and gates, git rules, technical rules.                               |\n| `.claude/agents/`                  | `architect`, `developer`, `tester`, `researcher`, `git-operator` — model, tools and prompt per role.                          |\n| `.claude/skills/slice/SKILL.md`    | The slice procedure: the two gates, delegation, verification, closing a node.                                                 |\n| `.claude/skills/handover/SKILL.md` | How a role hands its work to a fresh instance of itself when its context fills up.                                            |\n| `.claude/commands/`                | `/verify` (the CI set in order), `/e2e` (both apps plus a browser scenario), `/close-node` (graph bookkeeping after a merge). |\n| `.claude/rules/`                   | Path-scoped rules: `host-app.md`, `fork.md`, `contract.md`, each loaded when a file under its globs is touched.               |\n| `.claude/settings.json`            | Permission allow and deny lists, and the hook that formats a file right after it is written.                                  |\n| `.gitignore`                       | Ignores `.claude/settings.local.json` and `CLAUDE.local.md`, which are personal.                                              |\n\n## 2. The React (Vite) application\n\nReference layout:\n\n```\nmy-react-app/\n├── node_modules/     dependencies\n├── public/           static files copied as is\n├── src/\n│   ├── assets/       images, fonts, icons\n│   ├── components/   reusable UI components\n│   ├── pages/        page-level components\n│   ├── hooks/        custom React hooks\n│   ├── context/      React context providers\n│   ├── redux/        store and slices\n│   ├── utils/        helper functions\n│   ├── App.tsx       the root component\n│   ├── main.tsx      the entry point\n│   └── index.css     global styles\n├── .gitignore\n├── package.json\n├── README.md\n└── vite.config.ts\n```\n\n`host-app` follows it; the folders it does not need yet do not exist (A-27).\n\n- **`App.tsx` is not there**: with one page there is nothing to compose, so `main.tsx` renders\n  `ScoringPage` directly; an `App` would be a one-
