<script>
  const DOCS = [{"path":"README.md","title":"README","group":"Start","md":"# artifact-synchronization\n\nA micro-frontend pair: an OHIF Viewer fork with a scoring extension, and a host app with a scoring\nform. They run on separate ports and talk only over `window.postMessage`.\n\n- Requirements: [docs/CANON.md](docs/CANON.md); work breakdown: [docs/FEATURE-GRAPH.md](docs/FEATURE-GRAPH.md).\n- Message contract and decisions: [ARCHITECTURE.md](ARCHITECTURE.md); AI usage: [AI-USAGE.md](AI-USAGE.md); defence notes: [docs/DEFENCE.md](docs/DEFENCE.md).\n- Layout: `host-app/` (React + Vite, port 5173) and four published packages: `packages/contract/`\n  (the message schemas, zod), `packages/channel/` (one `useChannel` for both sides: origin check, version,\n  schema guard, `send`, `on`, and the queue until `VIEWER_READY`),\n  `packages/scoring-viewer/` (the OHIF-side scoring application, an OHIF extension) and\n  `packages/ohif-extension-loader/` (the one entry the fork lists; it loads our extensions); `viewer/` (a local checkout of\n  [bdiadiun/Viewers](https://github.com/bdiadiun/Viewers), branch `scoring`, based on OHIF\n  `v3.12.17`, port 3000; cloned on demand and not part of this repository, see A-18).\n\n## Prerequisites\n\n- Node.js 22 (`.nvmrc`; `nvm use` if you use nvm).\n- Git. Yarn 1 is provided by corepack (bundled with Node), no global install.\n- Ports 3000 (viewer) and 5173 (host app) free. Both are fixed: the apps check each other's origin.\n- Time: the first run takes about 5–10 minutes (cloning the viewer, `yarn install`, first webpack\n  build); later starts take seconds.\n\n## Run from a clean machine\n\n```sh\ngit clone https://github.com/bdiadiun/artifact-synchronization.git\ncd artifact-synchronization\nnpm ci                  # installs every workspace and builds the four packages (root `prepare`)\n```\n\n### 1. Viewer (port 3000)\n\n```sh\ncorepack enable\nnpm run viewer:setup    # clones the fork at the commit pinned in viewer.json and installs it\nnpm run viewer:dev\n```\n\n`viewer:setup` is needed once. It clones [bdiadiun/Viewers](https://github.com/bdiadiun/Viewers)\ninto `viewer/` at the exact commit recorded in `viewer.json`, so the viewer you run is the one this\nrepository was tested against. The folder is ignored by git and is not part of this repository.\n\nWait for \"compiled successfully\", then check http://localhost:3000/viewer?StudyInstanceUIDs=1.3.6.1.4.1.25403.345050719074.3824.20170125113417.1\nopens a study. Notes:\n\n- The fork installs the released packages from npm, so a plain run needs no linking. `viewer:link`\n  makes the viewer run the packages of this working tree instead (symlinks into the fork's\n  `node_modules`); `viewer:unlink` restores the installed copies.\n- `viewer:dev` runs the server from `platform/app` with the browser tab suppressed. Running\n  `yarn dev` at the viewer root instead does not work: that script picks up a `bun.lock` and\n  requires bun.\n- `yarn install` prints many `unmet peer dependency` warnings and two\n  `Workspaces can only be enabled in private projects` warnings; the webpack build ends with one\n  `InjectManifest ... --watch mode` warning. All of these are expected and harmless.\n\n### 2. Host app (port 5173), in a second terminal\n\n```sh\nnpm run dev --workspace host-app\n```\n\nOpen http://localhost:5173. To work on another study, add its identifier to the form's own URL,\n`http://localhost:5173/?study=<StudyInstanceUID>`; anything that is not a DICOM identifier is\nrefused and the default study is used (A-19). The left pane embeds the viewer; the status line in the right panel\nturns to \"готовий\" once the viewer has sent `VIEWER_READY`.\n\n### 3. Use it\n\n1. \"Додати вимірювання\" creates a row with status \"Очікує\".\n2. \"Активувати\" arms the ellipse tool in the viewer (row → \"Малювання…\"). \"Скасувати\" returns it to \"Очікує\".\n3. Draw an ellipse on the image. The row shows the area (e.g. `124.5 mm²`), status \"Готово\", and the\n   viewer returns to WindowLevel, its default tool. On the first ellipse OHIF asks \"Track\n   measurements for this series?\"; either answer works.\n4. \"Разом\" at the bottom sums the areas per unit (mm² and px² are never added together).\n\n### 4. Bonus features\n\n- **Live update.** Drag a handle of a drawn ellipse: the row value and the total follow while you drag.\n- **Deletion in both directions.** \"Видалити\" on a row removes its annotation in the viewer.\n  Deleting an annotation in OHIF (measurements panel → row menu → Delete) returns the row to\n  \"Очікує\".\n- **Focus.** Click a \"Готово\" row (or press Enter on it): the viewer jumps to that image and\n  selects the annotation.\n- **Second tool.** \"Додати довжину\" adds a row for the Length tool; draw a line and it lands in that\n  row in mm. \"Разом довжина\" sums lengths separately from areas.\n- **Version on every viewport.** Bottom-right corner of each viewport shows `OHIF 3.12.17`, injected\n  at build time; switch to a 2×2 layout to see it in every pane.\n- **State restore.** Reload the page: the rows, the values and the totals come back from the tab's\n  sessionStorage, and the viewer rebuilds the annotations with their original ids; a row whose\n  annotation could not be rebuilt says so. Reloading only the viewer restores the same way.\n\n## Known behaviour\n\n- OHIF shows \"Track measurements for this series?\" on the first annotation; answer or ignore it,\n  the measurement is delivered either way.\n- The demo study's first series is a CT topogram with large pixel spacing, so areas are large but\n  correct. Pick another series in the left panel for smaller numbers.\n- If the viewer fails to load a study, no `VIEWER_READY` is sent and commands stay queued (the\n  status line shows the count).\n- First run of `yarn install` in `viewer/` can take several minutes; the webpack dev build a minute more.\n- Open both apps through `localhost`, not `127.0.0.1` or another port: each side accepts messages\n  only from the other's configured origin, and a mismatch leaves the status line at\n  \"очікує VIEWER_READY\" (see ARCHITECTURE \"Known behaviour\").\n\n## Scripts (repository root)\n\n- `npm run lint`, `npm run typecheck`, `npm run test` — the form and the four packages.\n- `npm run format:check` — Prettier check across the repository.\n- `npm run check:graph` — feature-graph invariants.\n- `npm run docs:build` — builds `docs/site/index.html`, a single-page reader of all project documents with clickable requirement IDs.\n\nCI runs all of the above (plus a host-app build) on every pull request.\n"},{"path":"ARCHITECTURE.md","title":"Architecture","group":"Start","md":"# Architecture\n\nTwo applications on different origins, one channel: `window.postMessage`.\n\n```\nhost-app  http://localhost:5173                   viewer  http://localhost:3000 (OHIF fork)\n┌──────────────────────────────┐                  ┌────────────────────────────────────┐\n│ ScoringForm  rows[rowId]     │  ACTIVATE_TOOL   │ extension scoring-viewer           │\n│ channel (host end)           │ ───────────────► │  context-module provider (React):  │\n│  - origin check (viewer)     │  DEACTIVATE_TOOL │   window 'message' + origin check  │\n│  - ready flag + FIFO queue   │ ◄─────────────── │   measurementService.subscribe     │\n│  - rowId ↔ measurementUid    │  VIEWER_READY    │   commandsManager.run(setToolActive)│\n│                              │  MEASUREMENT_*   │   uid ↔ rowId map                  │\n└──────────────────────────────┘                  └────────────────────────────────────┘\n        @bdiadiun/scoring-contract  (message schemas, zod), published to npm\n              and depended on by both the host app and the viewer extension\n```\n\n## Message contract (version 1)\n\nSource of truth: the published package `@bdiadiun/scoring-contract`, whose entry is\n[`packages/contract/src/index.ts`](packages/contract/src/index.ts); the vocabulary, the host\ncommands and the viewer events each have their own module behind it. Every message is one zod\nschema, and its TypeScript type is `z.infer` of the schema under the same name (A-26); the two\ndirections are discriminated unions on `type`. Every message carries `version: 1`, added by the\nchannel when it posts and checked by the channel before the contract guard runs (A-25); the guards\n(`isHostCommand`, `isViewerEvent`, `safeParse` on the union) then reject unknown types and\nmalformed bodies. Unknown extra fields are ignored so a `version`\nbump is needed only for breaking changes. Adding a message type (as the deletion bonus did) is\nadditive and stays in version 1: both sides are updated in the same slice, and an older peer would\nsimply reject the new type as unknown.\n\n| Direction     | `type`                  | Payload (besides `version`, `type`)                                                                      | When                                                                                                                                                                                                                                                                                                                                                                                                                                                          |\n| ------------- | ----------------------- | -------------------------------------------------------------------------------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| viewer → host | `VIEWER_READY`          | `viewerVersion: string`                                                                                  | First viewport added to a tool group, i.e. the earliest moment `setToolActive` works. Re-sent on iframe reload.                                                                                                                                                                                                                                                                                                                                               |\n| host → viewer | `ACTIVATE_TOOL`         | `rowId`, `toolName: 'EllipticalROI' \\| 'RectangleROI' \\| 'Length'`                                       | \"Activate\" clicked in a row. Arms the bridge with `rowId`; a second one replaces the armed row.                                                                                                                                                                                                                                                                                                                                                               |\n| host → viewer | `DEACTIVATE_TOOL`       | `rowId`                                                                                                  | Cancel clicked, or a drawing row removed. The viewer returns to its default tool if that row was armed (A-29).                                                                                                                                                                                                                                                                                                                                                |\n| viewer → host | `MEASUREMENT_ADDED`     | `rowId: string \\| null`, `measurementUid`, `toolName`, `metrics: { area: { value, unit } }`, `geometry?` | Annotation completed. `rowId` is the armed row, `null` if nothing was armed; this is the one correlation (A-30).                                                                                                                                                                                                                                                                                                                                              |\n| viewer → host | `MEASUREMENT_UPDATED`   | `measurementUid`, `toolName`, `metrics`                                                                  | Annotation modified. Throttled per uid to one event per 100 ms with a trailing emit, so the value at release always goes out; sent for every annotation, and the form ignores a uid it does not hold (A-23); a done row takes the new metrics and the new geometry, so a later restore rebuilds the dragged shape (A-33). It is also how a value that settled one render after `MEASUREMENT_ADDED` reaches the form despite the render-pass lag. Bonus S-5.1. |\n| host → viewer | `REMOVE_MEASUREMENT`    | `measurementUid`                                                                                         | \"Видалити\" on a row that has a measurement; the row is already gone from the form. Fire-and-forget: OHIF's own `MEASUREMENT_REMOVED` follows and the form ignores it (A-30). Bonus S-5.2.                                                                                                                                                                                                                                                                     |\n| host → viewer | `FOCUS_MEASUREMENT`     | `measurementUid`                                                                                         | Click on a Done row. The viewer jumps to the annotation's image and selects it; unknown uid is ignored; nothing is sent back. Bonus S-5.3.                                                                                                                                                                                                                                                                                                                    |\n| viewer → host | `MEASUREMENT_REMOVED`   | `measurementUid`                                                                                         | Annotation removed in OHIF, for any reason: a click in the viewer clears the matching row; the removal the form asked for reaches a row that is already gone and the reducer ignores it (A-30). Bonus S-5.2.                                                                                                                                                                                                                                                  |\n| host → viewer | `RESTORE_MEASUREMENTS`  | `studyInstanceUid`, `measurements[]` (`rowId`, `measurementUid`, `toolName`, `geometry`)                 | On every `VIEWER_READY`, for the rows that hold a uid and a geometry (a page reload and a viewer reload alike). The viewer waits for viewport data and re-adds each annotation with its original uid. Bonus S-5.6.                                                                                                                                                                                                                                            |\n| viewer → host | `MEASUREMENTS_RESTORED` | `restored[]` (row ids), `failed[]` (`rowId`, `reason`)                                                   | After a restore: the form marks each failed row. Reasons: `already-present`, `unknown-study`, `viewer-error`. Bonus S-5.6.                                                                                                                                                                                                                                                                                                                                    |\n\n`metrics` is a partial record over the metric keys `'area' | 'length'` (A-28: a key outside the\nvocabulary is refused); `unit` is `'mm2' | 'px2' | 'mm' | 'px'` and is copied from OHIF's\n`cachedStats`, never inferred.\nThe measurement events also carry an optional `geometry` (frame of reference, referenced image and\nhandle points): the form persists it so the viewer can rebuild the annotation after a reload (A-14).\n\n`ACTIVATE_TOOL.toolName` now carries the row's own tool (area rows: `EllipticalROI`; length rows:\n`Length`) rather than always the configured default, so a length row arms the length tool on\nactivate and on re-arm after a viewer reload. Totals in the host-app footer are computed per\nmetric key (`area`, `length`) and per unit within that metric, never mixed across either axis\n(S-5.4).\n\n## Sequence: one measurement\n\n```mermaid\nsequenceDiagram\n  participant U as Doctor\n  participant H as host-app (5173)\n  participant B as channel (host end)\n  participant X as scoring-viewer extension (3000)\n  participant O as OHIF services\n\n  X->>O: provider mounts: subscribe MEASUREMENT_ADDED, VIEWPORT_ADDED\n  O-->>X: VIEWPORT_ADDED (first viewport)\n  X->>B: VIEWER_READY {viewerVersion}\n  B->>B: ready = true, flush queue\n  U->>H: \"Додати вимірювання\"\n  H->>H: row {rowId: uuid, status: pending}\n  U->>H: \"Активувати\"\n  H->>B: ACTIVATE_TOOL {rowId, toolName}\n  B->>X: postMessage(targetOrigin = viewer)\n  X->>O: setToolActive(toolName)\n  U->>O: draws ellipse\n  O-->>X: MEASUREMENT_ADDED {uid, data.cachedStats}\n  X->>X: metrics = toMetrics(); rowId = session.armedRowId (then cleared)\n  X->>B: MEASUREMENT_ADDED {rowId, measurementUid, metrics, geometry}\n  X->>O: setToolActive(WindowLevel)\n  B->>H: MEASUREMENT_ADDED handler (channel.on)\n  H->>H: row → done; totals recomputed\n```\n\n## Answers to the defence questions\n\nSee [`docs/DEFENCE.md`](docs/DEFENCE.md) for file and line pointers. In short: early commands are\nqueued in the host's end of the channel and flushed on `VIEWER_READY`; `postMessage` is the only channel\nthat crosses two origins with a verifiable sender; the viewer issues the measurement id and the\nhost the row id because OHIF rejects foreign fields on measurements; the subscription lives on\n`measurementService` inside the scoring viewer's effect, with the service OHIF hands the extension at\nregistration, because that is where the event is already de-duplicated; two tabs never interfere because each has its own\niframe window; the only place a loop could start is a host reaction to `MEASUREMENT_*`, and the form never\nsends in reaction to an event: it only changes state (A-30).\n\n## Decisions\n\nFull records live in [`docs/decisions/`](docs/decisions/); the canon index is in\n[`docs/CANON.md`](docs/CANON.md#decisions-on-ambiguities).\n\n| Topic            | Decision                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  | Record          |\n| ---------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | --------------- |\n| Who issues IDs   | Host issues `rowId` (UUID, before drawing); viewer issues `measurementUid` (cornerstone `annotationUID`). `MEASUREMENT_ADDED` carries both and the form stores the pair; every later event names the uid (A-30). No `requestId`.                                                                                                                                                                                                                                                                                          | A-8             |\n| Handshake        | The channel's `readyOn: 'VIEWER_READY'` (A-31): commands before it are queued and flushed in order, never dropped. Every `VIEWER_READY` (a viewer reload too) restores the rows that hold a geometry and re-arms the row in `Drawing…`.                                                                                                                                                                                                                                                                                   | A-9             |\n| Early commands   | Queued (see above). Diagnosable on screen: the panel shows ready / queued count.                                                                                                                                                                                                                                                                                                                                                                                                                                          | A-9             |\n| Echo loop        | One rule per side (A-30): the form reacts to an event only by changing state, never by sending; the extension reacts to a command only by acting on OHIF, never by sending an event itself. The one reflection, `REMOVE_MEASUREMENT` → OHIF → `MEASUREMENT_REMOVED`, reaches a row that is already gone.                                                                                                                                                                                                                  | A-30            |\n| Units            | Copied as is; totals computed per unit, mm² and px² never added.                                                                                                                                                                                                                                                                                                                                                                                                                                                          | A-11            |\n| Default tool     | After a measurement or a cancel the viewer returns to `WindowLevel`, OHIF's default primary tool in this mode (A-23; the canon asks only that the tool deactivates); a mode change tears the tool group down with the bridge (A-32).                                                                                                                                                                                                                                                                                      | A-8             |\n| Ports / origins  | 5173 and 3000, hardcoded in each app's config; `postMessage` always with an explicit `targetOrigin`.                                                                                                                                                                                                                                                                                                                                                                                                                      | A-2             |\n| Repository       | Mono-repo with npm workspaces holding the form and the two published packages; the viewer is a separate application, cloned on demand at a pinned commit and not part of this repository.                                                                                                                                                                                                                                                                                                                                 | A-1, A-12, A-18 |\n| OHIF base        | Fork branch `scoring` from release `v3.12.17`.                                                                                                                                                                                                                                                                                                                                                                                                                                                                            | A-6             |\n| Layers           | Contract (schemas) → channel (transport: origin, version, guard, `send`, one `on` handler, the queue until `readyOn`; one end per window, reached through `useChannel`) → the two applications: the OHIF-side one with one `switch` over the commands and one over OHIF's events, the form with a reducer whose actions are the contract's messages themselves. An event goes channel → `dispatch` → reducer; a button goes `dispatch` → channel and reducer (A-22, A-29, A-31, A-34).                                    |\n| Minimal bridge   | The viewer extension holds what is about OHIF and its own state: activating a tool, the armed row, reading `cachedStats`, rebuilding an annotation, announcing readiness once (A-23, A-29).                                                                                                                                                                                                                                                                                                                               |\n| Contract form    | Every message is one zod schema; its type is `z.infer` under the same name; the two directions are discriminated unions and the guards are `safeParse` (A-26). `zod` is the project's one library, used by the contract, the extension (OHIF's measurement object, A-28) and the form (stored rows).                                                                                                                                                                                                                      |\n| Folder layout    | A folder names a side or a role: extension `commands/ events/ ohif/`, app the conventional `components/ pages/ hooks/ state/ services/ utils/`; no file under twenty lines except a package entry, `main.tsx`, a `.props.ts` and a file the layout names; `.props.ts` only beside a React component (A-27).                                                                                                                                                                                                               |\n| Review fixes     | `MEASUREMENT_UPDATED` keeps its geometry; a restore mark is cleared once it stops being true; a standalone viewer has no peer; C-3.4 is met through `getContextModule`; lint covers the packages' `.tsx`.                                                                                                                                                                                                                                                                                                                 | A-33            |\n| Two applications | One `useChannel(options)` in the channel package for both sides (the end of the channel is created when the module loads, the hook names the peer, leases the window listener and subscribes the component to `{ ready, queued }`); each application hook registers `channel.on(handler)` and returns the channel; the form's actions are the contract's commands (`dispatch` sends and reduces); the OHIF-side application subscribes to OHIF with `ohif.on(handler)`, whose events are already in the contract's shape. | A-34            |\n| Abstract storage | `services/storage.ts` reads and writes `sessionStorage` for any key and any zod schema; what the form stores and under which key is the form's (`hooks/useStoredRows.ts`).                                                                                                                                                                                                                                                                                                                                                | A-35            |\n| Row model        | `models/row.ts` is what a row is and how it converts (`RowModel`: JSON form, `create`, `toJSON` / `fromJSON`, `toRestoreRequest`); the reducer is how it changes, `hooks/useStoredRows.ts` how it is stored.                                                                                                                                                                                                                                                                                                              | A-36            |\n| Stored rows      | `hooks/useStoredRows(study)` → `[storedRows, save]` over the storage service; `useScoringForm` composes it with `useReducer` and saves on every change; `RowModel.create(toolName)` issues the row id (A-8 stays with the host).                                                                                                                                                                                                                                                                                          | A-37            |\n| Names            | `packages/scoring-viewer` is the OHIF-side scoring application (`@bdiadiun/ohif-extension-scoring-viewer`), `packages/ohif-extension-loader` the fork's one entry (`@bdiadiun/ohif-extension-loader`); the contract and the channel keep their names.                                                                                                                                                                                                                                                                     | A-38            |\n| Channel end      | `class ChannelEnd` — private fields for the queue, the peer, the state, the handler and the listener lease; arrow-function methods `send`, `on`, `getState`, `subscribe`, `listen`; one instance per window.                                                                                                                                                                                                                                                                                                              | A-39            |\n\n## Where things are\n\n| Concern                   | File                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         |\n| ------------------------- | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| OHIF-side application     | `packages/scoring-viewer/src/ScoringViewer.tsx` (`getContextModule`: reads the host origin, checks the cornerstone services, builds `createOhif(services, commandsManager)` and returns the provider OHIF mounts around the mode — it runs `useScoringViewer(hostOrigin, ohif)` and offers the channel through the context), `session.ts` (the per-mount data: the channel, the armed row, a restore waiting for viewport data, whether `VIEWER_READY` went out), `hooks/useScoringViewer.ts` (`useChannel`, then two effects: `channel.on` → `handleCommand`, `ohif.on` → `handleOhif`, A-34), `commands/handlers.ts` (`handleCommand(ohif, session, command)`: one `switch` over the five commands), `commands/restore.ts` (S-5.6: re-adding annotations once the viewport holds data, `restorePending`), `events/handlers.ts` (`handleOhif(ohif, session, event)`: one `switch` over OHIF's events — the armed row on `MEASUREMENT_ADDED`, `VIEWER_READY` once per mount, the pending restore), `ohif/facade.ts` (`createOhif`: `ohif.on(handler)` over the five OHIF events, delivered in the contract's shape, updates throttled per uid), `ohif/metrics.ts` (OHIF's measurement object → `metrics` and `geometry`), `ohif/surface.ts` (the OHIF types we call), `ohif/throttle.ts`, `ohif/version.ts` (the overlay). The channel is transport only (A-29)                                                              |\n| Extension registration    | `viewer/platform/app/pluginConfig.json` names one package, the loader `@bdiadiun/ohif-extension-loader`, which registers our extension itself through the extension manager (A-20); the bridge's provider is then mounted by every mode (A-32)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               |\n| The channel, used by both | The published package `@bdiadiun/scoring-channel` (A-31, A-34): one end of the channel per window — the instance of `ChannelEnd` (A-39), created when the module loads — reached through `useChannel({ peerOrigin, accept, readyOn?, peerWindow? })` — the origin check, the version, the contract guard (`accept`), `send` with an explicit target origin, one `on` handler, and the queue that holds messages until `readyOn` arrives, flushed in order, observable as `{ ready, queued }` through `getState()` (the hook re-renders its caller on change). The first mount names the peer, every later mount is checked against it, and each mount leases the window `message` listener. The viewer names its peer window (`window.parent`, only when embedded); the host learns it from the source of the first accepted message, its `VIEWER_READY`. Two files: `channel.ts` and `peer.ts`                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              |\n| Host side of the channel  | `host-app/src/config.ts`: `VIEWER_CHANNEL` — the form's end of the channel (`peerOrigin: VIEWER_ORIGIN`, `accept: isViewerEvent`, `readyOn: 'VIEWER_READY'`); `hooks/useScoringForm.ts` takes the channel with `useChannel(VIEWER_CHANNEL)`, alive as long as the page (Q-5: what the hook subscribes, the hook unsubscribes; the viewer is this page's iframe, so there is nothing left to deactivate), and returns it as the third element for the panel's status line (`channel.getState()`)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              |\n| Form state and actions    | `host-app/src/models/row.ts` (`Row`, `RowStatus` and `RowModel` — JSON form, `create(toolName)` with its own `rowId`, `toJSON` / `fromJSON`, `toRestoreRequest`, A-36, A-37), `state/reducer.ts` (the pure reducer whose actions are the two local ones, `ADD_ROW` and `REMOVE_ROW`, every command of the contract — `ACTIVATE_TOOL` arms, `DEACTIVATE_TOOL` disarms, the rest change nothing — and the viewer's events themselves), `state/selectors.ts` (the row lookups), `state/actions.ts` (what each button dispatches, and `restoreViewer(dispatch, study, rows)` — the rows and the drawing row offered to a viewer that has just announced itself), `hooks/useStoredRows.ts` (A-37: the study's rows read from sessionStorage once and the way to write them back; the envelope and the key), `hooks/useScoringForm.ts` (the form for one study: the reducer started from the stored rows and saved on every change, `dispatch` that sends every command and reduces everything, and one `channel.on` handler, re-registered whenever the rows change, that answers `VIEWER_READY` and dispatches every event), `hooks/useStoredRows.ts` (A-14: the stored-row schema, one key per study, `loadRows` / `saveRows`), `services/storage.ts` (A-35: `readStorage(key, schema)` / `writeStorage(key, value)` — sessionStorage, defensively, knowing nothing about rows), `utils/format.ts` (row status, kind and value) |\n| Totals                    | `host-app/src/utils/totals.ts` (per-unit sums), `components/TotalsFooter.tsx`                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                |\n| Tool to arm               | `host-app/src/config.ts` `DEFAULT_TOOL` (the one constant for the RectangleROI live change)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  |\n| Origins and study link    | `host-app/src/config.ts`: the origins, and the study resolved once per page load from the form's own `study` parameter with the previous constant as fallback (A-19); `packages/scoring-viewer/src/ScoringViewer.tsx` reads the host origin from the OHIF app config                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         |\n| Contract release          | `.github/workflows/publish-contract.yml`                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     |\n\n## Known behaviour\n\n- Deliberate implementation details of the scoring viewer (lifecycle, measurement filtering, command\n  dispatch) are listed in [`docs/notes/viewer-internals.md`](docs/notes/viewer-internals.md); those of\n  the form (study selection, the row model, the reducer's cases, restore, storage, the components) in\n  [`docs/notes/form-internals.md`](docs/notes/form-internals.md). Neither application's code carries\n  comments (CONVENTIONS §8).\n\n- The area in `MEASUREMENT_ADDED` is read from cornerstone `cachedStats` at completion time. Those stats are filled in the render pass, so a release in the very same frame as the last mouse move (only reproducible with synthetic input) can carry a one-frame-old value; a human drag always dwells long enough. `MEASUREMENT_UPDATED` (bonus S-5.1) carries the settled value.\n- Units: OHIF reports `mm²` when the image has pixel spacing and `px²` otherwise; a calibration suffix such as `mm² ERMF` is provenance and maps to `mm2`.\n\n- Nothing is disarmed on teardown, on either side (A-31, A-32). The form's channel lives as long as\n  the page and the viewer is that page's iframe, so a page unload takes the armed tool with it; the\n  scoring viewer's armed row lives in the session of the effect that owns it and dies with the mode, whose tool\n  group OHIF tears down. A viewer opened outside the iframe has no peer window and queues its\n  events instead of posting to itself.\n\n- If the origins do not match — the form opened as `127.0.0.1` while `VIEWER_ORIGIN` says `localhost`,\n  the viewer on another port, or `window.config.scoringViewer.hostOrigin` naming another form —\n  nothing crosses in either direction: an incoming message from a foreign origin is dropped before\n  the version and the guard, logged once per origin as `[channel] ignoring message from foreign\norigin …`; an outgoing `postMessage` with the explicit `targetOrigin` is not delivered by the\n  browser (Chrome logs \"target origin provided … does not match\" on the sender), while the channel\n  still logs `sent`, because it has no delivery receipt (A-30). The visible symptom is a status\n  line stuck at \"очікує VIEWER_READY\" with a growing queue. Both apps must be opened through the\n  origins their configs name (`host-app/src/config.ts`, `scripts/viewer.mjs`).\n- If a study never loads, no viewport is created and `VIEWER_READY` is never sent; queued commands\n  stay queued and the status line keeps showing \"очікує VIEWER_READY\". A viewer without a viewport\n  cannot accept tool commands, so this is the honest state.\n- OHIF's measurement-tracking extension shows a \"Track measurements for this series?\" prompt on\n  the first annotation. `MEASUREMENT_ADDED` is emitted regardless of the answer; the prompt is left\n  as is (X-5).\n"},{"path":"docs/CANON.md","title":"Canon","group":"Requirements","md":"# Canon — requirements of the test assignment\n\nThis file is the single source of truth for requirements. IDs are immutable. The original\nassignment text (Ukrainian) is quoted verbatim in Appendix A; the atomic requirements below are\nderived from it. Any deviation or resolved ambiguity is recorded in section \"Decisions on\nambiguities\" only, and only after approval.\n\nID classes:\n\n| Prefix      | Meaning                                                                     | Source section                 |\n| ----------- | --------------------------------------------------------------------------- | ------------------------------ |\n| `C-<s>.<i>` | Mandatory functional / architectural requirement                            | 3, 4                           |\n| `Q-<n>`     | Quality requirement, graded separately                                      | 5                              |\n| `S-5.<n>`   | Bonus (\"star\") task, optional                                               | 6 (numbered 5.x in the source) |\n| `D-<n>`     | Deliverable / submission artifact                                           | 7                              |\n| `X-<n>`     | Explicit prohibition (\"do not do\")                                          | 8                              |\n| `P-<n>`     | Defence-readiness item: a question or live change we must be able to handle | 9                              |\n\n## 1. Purpose (informative)\n\nThe assignment reproduces a daily situation: two independent apps on different ports talk to each\nother. A medical image viewer (OHIF) on one side, a scoring form on the other. The form does not\ndraw annotations; it asks the viewer to enable a tool and receives the result back. What is\nevaluated: message contract design, asynchrony (who loads first, early messages), entity-to-\nannotation correlation and sync, and infinite-loop avoidance. AI use is allowed and expected, but\nthe code must be defended by the author.\n\n## 3. Architecture (mandatory)\n\n| ID    | Requirement                                                                                                                                                                                                                                                                                 |\n| ----- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| C-3.1 | Two applications on two different ports communicate exclusively through `window.postMessage`.                                                                                                                                                                                               |\n| C-3.2 | `viewer` is a fork of https://github.com/OHIF/Viewers, run locally, extended with our own OHIF extension that acts as a bridge: accepts commands from outside and publishes events to the outside.                                                                                          |\n| C-3.3 | `host-app` is a new React application built from scratch on any boilerplate (Vite recommended). It contains an `<iframe>` with the viewer and the form.                                                                                                                                     |\n| C-3.4 | The bridge lives inside our extension: it obtains `servicesManager` and `commandsManager` in the `preRegistration` hook, subscribes to `measurementService` there and calls `commandsManager.runCommand(...)`. Do not try to reach OHIF internals through `window` from outside the iframe. |\n\n## 4. Mandatory part\n\n### 4.1 Running the viewer\n\n| ID      | Requirement                                                                                                                                  |\n| ------- | -------------------------------------------------------------------------------------------------------------------------------------------- |\n| C-4.1.1 | Fork https://github.com/OHIF/Viewers and run it locally.                                                                                     |\n| C-4.1.2 | Data source is the public DICOMweb that OHIF ships with by default; no own PACS.                                                             |\n| C-4.1.3 | The viewer must open by a direct link to a specific study (`/viewer?StudyInstanceUIDs=...`), because exactly that link goes into the iframe. |\n\n### 4.2 Host-app and page\n\n| ID      | Requirement                                                                                      |\n| ------- | ------------------------------------------------------------------------------------------------ |\n| C-4.2.1 | Host-app is React + TypeScript.                                                                  |\n| C-4.2.2 | Single page: on the left the viewer iframe (flexible, full height), on the right the form panel. |\n| C-4.2.3 | The two apps run on different ports, deliberately, so that real cross-origin constraints apply.  |\n\n### 4.3 Scenario \"add measurement\" (core)\n\n| ID      | Requirement                                                                                                                              |\n| ------- | ---------------------------------------------------------------------------------------------------------------------------------------- |\n| C-4.3.1 | The form has an \"Add measurement\" button.                                                                                                |\n| C-4.3.2 | Clicking it creates a new empty row in the form with status `Pending` and an \"Activate\" button.                                          |\n| C-4.3.3 | Clicking \"Activate\" sends a command into the iframe to enable the Ellipse tool (`EllipticalROI`). The row switches to status `Drawing…`. |\n| C-4.3.4 | The user draws an ellipse in the viewer.                                                                                                 |\n| C-4.3.5 | The viewer sends back the annotation area together with an identifier by which the host understands which row the value belongs to.      |\n| C-4.3.6 | The row receives the value (e.g. `124.5 mm²`), status `Done`; the tool in the viewer deactivates by itself (returns to Pan / default).   |\n| C-4.3.7 | Steps C-4.3.1–C-4.3.6 are repeatable; there may be any number of rows.                                                                   |\n| C-4.3.8 | At the bottom of the form there is the sum of the areas of all rows, recalculated automatically.                                         |\n\n### 4.4 Minimal message contract\n\n| ID      | Requirement                                                                                                                                                                                                                                                                                                                                                                                 |\n| ------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| C-4.4.1 | Event names are fixed: `VIEWER_READY` (viewer → host, viewer loaded and ready for commands); `ACTIVATE_TOOL` (host → viewer, enable a tool for a specific form row); `DEACTIVATE_TOOL` (host → viewer, cancel waiting for drawing); `MEASUREMENT_ADDED` (viewer → host, annotation created: value + units + binding); `MEASUREMENT_UPDATED` (viewer → host, annotation changed; see S-5.1). |\n| C-4.4.2 | Payload structure is designed by us and described in `ARCHITECTURE.md`.                                                                                                                                                                                                                                                                                                                     |\n| C-4.4.3 | Every message carries a contract version (`version: 1`); the reason is explained at the defence.                                                                                                                                                                                                                                                                                            |\n\n## 5. Quality requirements (graded separately, one line each)\n\n| ID  | Requirement                                                                                                                                                                                                                        |\n| --- | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| Q-1 | **Handshake.** The host must not send commands before the viewer has reported `VIEWER_READY`. If the user clicks \"Activate\" while the iframe is still loading, the command must not be lost.                                       |\n| Q-2 | **Origin check.** `message` handlers on both sides check `event.origin` and ignore foreign origins. A hardcoded origin in config is fine; its absence is not.                                                                      |\n| Q-3 | **Correlation.** Every form row has its own identifier, every annotation has its own. We must consciously decide who issues which ID and how the mapping is maintained. This is the main architectural decision of the assignment. |\n| Q-4 | **No echo loop.** If S-5.1 is implemented, an update host → viewer → host must not produce an infinite ping-pong. This will be tested.                                                                                             |\n| Q-5 | **Cleanup.** `removeEventListener`, unsubscribing from `measurementService`, cancelling the \"armed\" state on unmount.                                                                                                              |\n| Q-6 | **Units.** Area may arrive in mm² or px² depending on whether the DICOM has pixel spacing. Units must not be lost and mm² must not be added to px² in the sum. The handling must be described.                                     |\n| Q-7 | **TypeScript.** Message types are declared in one place and shared by both apps (separate package, shared folder, or at least a copied file with an explanation why).                                                              |\n\n## 6. Bonus tasks (optional; source numbers them 5.x)\n\n| ID    | Requirement                                                                                                                                                                                  |\n| ----- | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| S-5.1 | **Live update.** Dragging an ellipse handle updates the value in the form in real time; the sum is recalculated.                                                                             |\n| S-5.2 | **Deletion.** A \"Delete\" button in a form row removes the annotation in the viewer, and deleting the annotation in the viewer clears the row.                                                |\n| S-5.3 | **Focus.** Clicking a form row highlights / scrolls to the matching annotation in the viewer.                                                                                                |\n| S-5.4 | **Second tool.** Add a row type \"Length\" (`Length` tool); the sum of lengths is computed separately from the sum of areas.                                                                   |\n| S-5.5 | **Version on the viewport.** Show the OHIF version (from `package.json`, injected at build time through bundler config) in a corner of every viewport; in a 2×2 grid it appears on all four. |\n| S-5.6 | **State restore.** After a page reload the form and the annotations are restored.                                                                                                            |\n\n## 7. Submission format\n\n| ID  | Requirement                                                                                                                                                                                                                                                           |\n| --- | --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| D-1 | Code in a public repository (GitHub / GitLab). OHIF fork + host-app may be two repositories or a mono-repo; the choice must be explained.                                                                                                                             |\n| D-2 | Work is split into feature pull requests, at least five, indicatively: `chore: bootstrap host-app`, `feat: viewer bridge extension`, `feat: activate ellipse from form`, `feat: receive measurement into form`, `feat: total area calculation`.                       |\n| D-3 | Every PR has a meaningful description: what changed, why this way, what was verified. A PR described as \"changes\" does not count.                                                                                                                                     |\n| D-4 | PRs may be merged by the author; no external code review at this stage. The history of thinking matters.                                                                                                                                                              |\n| D-5 | `README.md`: how to run both apps from scratch (git clone → working screen). It will be executed literally on a clean machine.                                                                                                                                        |\n| D-6 | `ARCHITECTURE.md`: exchange diagram, full message table with payloads, and a separate \"Decisions\" section: who issues IDs, how the handshake works, what happens to early commands, how the echo loop is avoided. 1–2 pages, to the point.                            |\n| D-7 | `AI-USAGE.md`: honestly, where AI was used, what output was kept as is, what was rewritten and why.                                                                                                                                                                   |\n| D-8 | Video demo, 2–4 minutes, voice-over preferred, showing: (a) both apps starting; (b) at least three measurements added in a row; (c) the sum updating; (d) behaviour on cancelled activation (\"Activate\" clicked, then changed mind); (e) any implemented bonus tasks. |\n\n## 8. What not to do\n\n| ID  | Prohibition                                                                                     |\n| --- | ----------------------------------------------------------------------------------------------- |\n| X-1 | No auth, backend, database, or server-side persistence.                                         |\n| X-2 | No own PACS / DICOMweb server.                                                                  |\n| X-3 | No design work; a grey form with native inputs is enough.                                       |\n| X-4 | No project-wide tests. A few unit tests for the sum logic and message serialisation are enough. |\n| X-5 | No rework of the OHIF UI itself (panels, toolbar) beyond what the bridge requires.              |\n\n## 9. Defence readiness\n\nQuestions we must be able to answer with a pointer into the code:\n\n| ID  | Item                                                                                               |\n| --- | -------------------------------------------------------------------------------------------------- |\n| P-1 | What happens if the iframe loads slower than the user clicks the button? Show where it is handled. |\n| P-2 | Why `postMessage` and not another mechanism? What would change if both apps shared one origin?     |\n| P-3 | Who issues the measurement identifier and why? What breaks if the decision is flipped?             |\n| P-4 | Where exactly in OHIF do we subscribe to annotation creation and why there?                        |\n| P-5 | What happens if two host-app tabs are open at the same time?                                       |\n| P-6 | Show the place where an infinite message loop could arise.                                         |\n\nLive changes (~10 min each) the design must make cheap:\n\n| ID  | Item                                                                                                  | Design implication                                                                                             |\n| --- | ----------------------------------------------------------------------------------------------------- | -------------------------------------------------------------------------------------------------------------- |\n| P-7 | Replace the tool: ellipse → `RectangleROI`.                                                           | Tool name is a single configurable constant carried in the `ACTIVATE_TOOL` payload, not scattered.             |\n| P-8 | Add one more field to the row (e.g. perimeter or mean intensity) and pass it through the whole chain. | Measurement payload and row model are extensible; the mapping viewer-measurement → payload is in one function. |\n| P-9 | One protocol element is disabled (e.g. `VIEWER_READY`); diagnose the breakage aloud.                  | Bridge logs / dev-visible state make the handshake and queue observable.                                       |\n\n## 10. Grading (informative)\n\nWorking scenario 25 %, bridge architecture 25 %, defence 25 %, code quality 15 %, communication\n10 %. Bonus tasks add up to +15 % but do not compensate a failed defence.\n\n## Decisions on ambiguities\n\nThis table is the index. Each decision has a full record (context, decision, rejected alternatives, consequences) in [`docs/decisions/`](decisions/). Approved decisions are also mirrored in `ARCHITECTURE.md` → \"Decisions\".\n\n| #                                                           | Date       | Decision                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                | Rationale                                                                                                                                                                                                                                                     | Status                |\n| ----------------------------------------------------------- | ---------- | ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | --------------------- |\n| [A-1](decisions/A-1-mono-repo-with-submodule.md)            | 2026-09-16 | Mono-repo: `host-app/` in this repository, the OHIF fork as a git submodule under `viewer/` pointing to our fork.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       | One PR can change both sides of the contract; the fork keeps its own history and stays a real fork (C-4.1.1, D-1). Vendoring OHIF would bloat the repo.                                                                                                       | approved 2026-09-16   |\n| [A-2](decisions/A-2-ports.md)                               | 2026-09-16 | Ports: host-app `5173`, viewer `3000`. Both are fixed in config and used for origin checks (Q-2).                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       | Vite and OHIF defaults; distinct ports satisfy C-4.2.3.                                                                                                                                                                                                       | approved 2026-09-16   |\n| [A-3](decisions/A-3-defence-readiness-ids.md)               | 2026-09-16 | Added the `P-*` ID class for section 9 (defence readiness). These items are not requirements but constrain design; graph nodes may reference them in addition to a `C/Q/D` ID.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          | Live changes (P-7..P-9) affect how the contract and row model are shaped; tracking them avoids a costly refactor at the defence.                                                                                                                              | approved 2026-09-16   |\n| [A-4](decisions/A-4-cancelled-activation.md)                | 2026-09-16 | \"Cancelled activation\" (D-8 d) maps to `DEACTIVATE_TOOL`: the row returns from `Drawing…` to `Pending`, the viewer returns to the default tool, and the row is kept.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    | The assignment names the event but not the row behaviour; keeping the row is the least surprising outcome.                                                                                                                                                    | approved 2026-09-16   |\n| [A-5](decisions/A-5-deferred-bridge-decisions.md)           | 2026-09-16 | Decisions on ID issuance (Q-3), early-command queue (Q-1), echo-loop protection (Q-4) and mixed-unit sums (Q-6) are taken in the slice that implements them and recorded here plus in `ARCHITECTURE.md` in the same PR.                                                                                                                                                                                                                                                                                                                                                                                                                                                 | They need contact with the real OHIF `measurementService` API to be made responsibly.                                                                                                                                                                         | resolved by A-8..A-11 |\n| [A-6](decisions/A-6-ohif-base-version.md)                   | 2026-09-16 | The OHIF fork branch is based on the release tag `v3.12.17`, not on `master`.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           | `master` requires Node >= 24 and pnpm 11; `v3.12.17` requires Node >= 18 and yarn 1, matching the local toolchain and giving a stable base for the README \"clean machine\" run (D-5). ool in longitudinal mode is WindowLevel, not Pan.                                        | approved 2026-09-16   |\n| [A-9](decisions/A-9-handshake-and-queue.md)                 | 2026-09-16 | Host keeps `ready` + a FIFO command queue; commands before `VIEWER_READY` are queued and flushed in order without coalescing. A repeated `VIEWER_READY` (iframe reload) resets `ready` and re-arms the row currently in `Drawing…`.                                                                                                                                                                                                                                                                                                                                                                                                                                     | Simple, observable, and answers P-1 / P-9 directly.                                                                                                                                                                                                           | approved 2026-09-16   |\n| [A-10](decisions/A-10-echo-guard.md)                        | 2026-09-16 | Mandatory part: host never writes back to the viewer in reaction to `MEASUREMENT_*`, so no loop by construction. Bonus tasks: every host command carries `requestId`; viewer events caused by a command carry `causedBy`; host ignores its own `causedBy` and applies commands idempotently (no command when state already matches).                                                                                                                                                                                                                                                                                                                                    | `measurementService.update/remove` re-broadcast events; this is the loop point (P-6).
